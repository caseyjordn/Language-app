  {id:'全',char:'全',onyomi:'ぜん',kunyomi:null,altMeanings:['Whole', 'Complete'],otherReadings:['まったく'],meaning:'All',level:6,meaningMnemonic:`"**ZEN**" (ぜん) master says "**ALL** is one."`,examples:[{level:'easy',jp:'全て分かりました。',romaji:'Subete wakarimashita.',en:'I understood everything.'}, {level:'advanced',jp:'彼は全力を尽くして、そのプロジェクトを成功させた。',romaji:'Kare wa zenryoku o tsukushite, sono purojekuto o seikou saseta.',en:'He gave it his all and made the project a success.'}]},
  {id:'後',char:'後',onyomi:'ご',kunyomi:null,altMeanings:['After', 'Later'],otherReadings:['あと', 'うしろ'],meaning:'Behind',level:6,meaningMnemonic:`"**GO** (ご) stand **BEHIND** me," she says.`,examples:[{level:'easy',jp:'後で行きます。',romaji:'Atode ikimasu.',en:'I\'ll go later.'}, {level:'advanced',jp:'彼は最後まで諦めず、努力を続けた。',romaji:'Kare wa saigo made akiramezu, doryoku o tsuzuketa.',en:'He never gave up until the very end and kept making an effort.'}]},
  {id:'血',char:'血',onyomi:'けつ',kunyomi:null,altMeanings:['Bloodline'],otherReadings:['ち'],meaning:'Blood',level:6,meaningMnemonic:`"**KETCH**-up (けつ) looks like **BLOOD**."`,examples:[{level:'easy',jp:'血が出ています。',romaji:'Chi ga dete imasu.',en:'Blood is coming out.'}, {level:'advanced',jp:'事故現場では、出血がひどく、すぐに救急車が呼ばれた。',romaji:'Jikogenba dewa, shukketsu ga hidoku, sugu ni kyuukyuusha ga yobareta.',en:'At the accident scene, the bleeding was severe, and an ambulance was called immediately.'}]},
  {id:'両',char:'両',onyomi:'りょう',kunyomi:null,altMeanings:['Pair', 'Two'],otherReadings:[],meaning:'Both',level:6,meaningMnemonic:`"**RYO** (りょう), use **BOTH** hands."`,examples:[{level:'easy',jp:'両方好きです。',romaji:'Ryouhou suki desu.',en:'I like both.'}, {level:'advanced',jp:'交渉は、両者にとって満足のいく結果に終わった。',romaji:'Koushou wa, ryousha ni totte manzoku no iku kekka ni owatta.',en:'The negotiation ended with a result satisfactory to both parties.'}]},
  {id:'化',char:'化',onyomi:'か',kunyomi:null,altMeanings:['Transform', '-ify (suffix)'],otherReadings:[],meaning:'Change',level:6,meaningMnemonic:`"**KAH**! (か) It **CHANGE**d shape!"`,examples:[{level:'easy',jp:'天気が変わります。',romaji:'Tenki ga kawarimasu.',en:'The weather will change. (uses 変わる, but 化 relates conceptually)'}, {level:'advanced',jp:'この地域の文化は、長い歴史の中で独自に進化してきた。',romaji:'Kono chiiki no bunka wa, nagai rekishi no naka de dokuji ni shinka shite kita.',en:'This region\'s culture has uniquely evolved over a long history.'}]},
  {id:'国',char:'国',onyomi:'こく',kunyomi:null,altMeanings:['Nation', 'State'],otherReadings:['くに'],meaning:'Country',level:6,meaningMnemonic:`"**KOKU**-la-cola (こく), the drink of every **COUNTRY**."`,examples:[{level:'easy',jp:'この国が好きです。',romaji:'Kono kuni ga suki desu.',en:'I like this country.'}, {level:'advanced',jp:'二つの国王は、長年の対立を乗り越え、平和条約を結んだ。',romaji:'Futatsu no kokuou wa, naganen no tairitsu o norikoe, heiwa jouyaku o musunda.',en:'The two nations\' rulers overcame years of conflict and signed a peace treaty.'}]},
  {id:'亡',char:'亡',onyomi:'ぼう',kunyomi:null,altMeanings:['Deceased', 'Lost'],otherReadings:[],meaning:'Death',level:6,meaningMnemonic:`"**BOW** (ぼう) your head" — a sign of **DEATH**.`,examples:[{level:'easy',jp:'亡くなりました。',romaji:'Nakunarimashita.',en:'He/she passed away.'}, {level:'advanced',jp:'その事故による死亡者の数は、まだ確定していない。',romaji:'Sono jiko ni yoru shibousha no kazu wa, mada kakutei shite inai.',en:'The number of fatalities from that accident hasn\'t been confirmed yet.'}]},
  {id:'死',char:'死',onyomi:'し',kunyomi:null,altMeanings:['Die', 'Dead'],otherReadings:[],meaning:'Death',level:6,meaningMnemonic:`"**SHE** (し) faces **DEATH**," calm and still.`,examples:[{level:'easy',jp:'死は誰にでも訪れます。',romaji:'Shi wa dare ni demo otozuremasu.',en:'Death comes to everyone.'}, {level:'advanced',jp:'彼は必死になって、締め切りまでにその作業を終わらせた。',romaji:'Kare wa hisshi ni natte, shimekiri made ni sono sagyou o owaraseta.',en:'He worked desperately and finished the task by the deadline.'}]},
  {id:'地',char:'地',onyomi:'ち',kunyomi:null,altMeanings:['Ground', 'Land', 'Region'],otherReadings:[],meaning:'Earth',level:6,meaningMnemonic:`"**CHEE**! (ち) Dig into the **EARTH**."`,examples:[{level:'easy',jp:'地図を見ます。',romaji:'Chizu o mimasu.',en:'I\'ll look at the map.'}, {level:'advanced',jp:'この地域の地下には、豊富な資源が眠っていると言われている。',romaji:'Kono chiiki no chika ni wa, houfu na shigen ga nemutte iru to iwarete iru.',en:'It\'s said that abundant resources lie dormant underground in this region.'}]},
  {id:'東',char:'東',onyomi:'ひがし',kunyomi:null,altMeanings:[],otherReadings:['とう'],meaning:'East',level:6,meaningMnemonic:`The sun rises in the **EAST** — "**HEE-GAH-SHEE**" (ひがし).`,examples:[{level:'easy',jp:'東に行きます。',romaji:'Higashi ni ikimasu.',en:'I\'ll go east.'}, {level:'advanced',jp:'東京は、世界でも有数の巨大都市として知られている。',romaji:'Toukyou wa, sekai demo yuusuu no kyodai toshi toshite shirarete iru.',en:'Tokyo is known as one of the world\'s greatest megacities.'}]},
  {id:'食',char:'食',onyomi:'しょく',kunyomi:null,altMeanings:['Food', 'Meal'],otherReadings:['たべる'],meaning:'Eat',level:6,meaningMnemonic:`"**SHOW-KU** (しょく), watch me **EAT**!"`,examples:[{level:'easy',jp:'食べます。',romaji:'Tabemasu.',en:'I\'ll eat.'}, {level:'advanced',jp:'彼女は、和食の作り方を本格的に学び始めた。',romaji:'Kanojo wa, washoku no tsukurikata o honkakuteki ni manabihajimeta.',en:'She began seriously learning how to make Japanese-style food.'}]},
  {id:'前',char:'前',onyomi:'ぜん',kunyomi:null,altMeanings:['Before', 'Previous'],otherReadings:['まえ'],meaning:'Front',level:6,meaningMnemonic:`"**ZEN** (ぜん) garden out **FRONT**."`,examples:[{level:'easy',jp:'前に立ちます。',romaji:'Mae ni tachimasu.',en:'I\'ll stand in front.'}, {level:'advanced',jp:'前回の会議で決まったことを、もう一度確認しましょう。',romaji:'Zenkai no kaigi de kimatta koto o, mou ichido kakunin shimashou.',en:'Let\'s confirm once more what was decided at the previous meeting.'}]},
  {id:'有',char:'有',onyomi:'ゆう',kunyomi:null,altMeanings:['Exist', 'Possess'],otherReadings:[],meaning:'Have',level:6,meaningMnemonic:`"**YOU** (ゆう) **HAVE** it," she says.`,examples:[{level:'easy',jp:'有ります。',romaji:'Arimasu.',en:'There is/I have.'}, {level:'advanced',jp:'彼は、その分野で有名な研究者として知られている。',romaji:'Kare wa, sono bun\'ya de yuumei na kenkyuusha toshite shirarete iru.',en:'He\'s known as a famous researcher in that field.'}]},
  {id:'家',char:'家',onyomi:'いえ',kunyomi:null,altMeanings:['Home', 'Family', 'Household'],otherReadings:['か', 'け'],meaning:'House',level:6,meaningMnemonic:`"**EE-EH** (いえ), welcome to my **HOUSE**!"`,examples:[{level:'easy',jp:'家に帰ります。',romaji:'Ie ni kaerimasu.',en:'I\'ll go home.'}, {level:'advanced',jp:'彼女は、家事と仕事を両立させるのに苦労している。',romaji:'Kanojo wa, kaji to shigoto o ryouritsu saseru no ni kurou shite iru.',en:'She\'s struggling to balance housework and work.'}]},
  {id:'私',char:'私',onyomi:'し',kunyomi:null,altMeanings:['Private', 'Personal (in compounds)'],otherReadings:['わたし'],meaning:'I',level:6,meaningMnemonic:`"**WAH-TAH-SHEE**" — the WK reading is し, in words like 私立 (しりつ).`,examples:[{level:'easy',jp:'私は学生です。',romaji:'Watashi wa gakusei desu.',en:'I am a student.'}, {level:'advanced',jp:'これは、私立大学の学費に関する調査結果だ。',romaji:'Kore wa, shiritsu daigaku no gakuhi ni kansuru chousa kekka da.',en:'This is a survey result concerning private university tuition fees.'}]},
  {id:'知',char:'知',onyomi:'し',kunyomi:null,altMeanings:['Knowledge', 'Wisdom (in compounds)'],otherReadings:['しる'],meaning:'Know',level:6,meaningMnemonic:`"**CHEE** (し), do you **KNOW** this?"`,examples:[{level:'easy',jp:'知りません。',romaji:'Shirimasen.',en:'I don\'t know.'}, {level:'advanced',jp:'彼女は、その分野の知識をとても深く持っている。',romaji:'Kanojo wa, sono bun\'ya no chishiki o totemo fukaku motte iru.',en:'She has very deep knowledge in that field.'}]},
  {id:'活',char:'活',onyomi:'かつ',kunyomi:null,altMeanings:['Active', 'Vigorous'],otherReadings:[],meaning:'Lively',level:6,meaningMnemonic:`"**KAH-TSU** (かつ), so **LIVELY**!"`,examples:[{level:'easy',jp:'元気に生活しています。',romaji:'Genki ni seikatsu shite imasu.',en:'I\'m living life energetically.'}, {level:'advanced',jp:'彼は、退職後も社会との関わりを持ち続け、活気ある毎日を送っている。',romaji:'Kare wa, taishokugo mo shakai to no kakawari o mochitsuzuke, kakki aru mainichi o okutte iru.',en:'Even after retirement, he stays engaged with society and leads a lively daily life.'}]},
  {id:'長',char:'長',onyomi:'ちょう',kunyomi:null,altMeanings:['Chief', 'Head', 'Senior'],otherReadings:['ながい'],meaning:'Long',level:6,meaningMnemonic:`"**CHO** (ちょう), that's a **LONG** wait."`,examples:[{level:'easy',jp:'長い列です。',romaji:'Nagai retsu desu.',en:'It\'s a long line.'}, {level:'advanced',jp:'彼は、この会社の社長として二十年以上務めてきた。',romaji:'Kare wa, kono kaisha no shachou to shite nijuunen ijou tsutomete kita.',en:'He\'s served as this company\'s president for more than twenty years.'}]},
  {id:'曲',char:'曲',onyomi:'きょく',kunyomi:null,altMeanings:['Tune', 'Melody', 'Bend'],otherReadings:[],meaning:'Music',level:6,meaningMnemonic:`"**KYO-KU** (きょく), that **MUSIC** bends the room."`,examples:[{level:'easy',jp:'この曲が好きです。',romaji:'Kono kyoku ga suki desu.',en:'I like this song.'}, {level:'advanced',jp:'彼女は、感情の高まりに耐えかねて、思わず顔を曲げた。',romaji:'Kanojo wa, kanjou no takamari ni taekanete, omowazu kao o mageta.',en:'Unable to bear her rising emotions, she unconsciously twisted her face.'}]},
  {id:'首',char:'首',onyomi:'くび',kunyomi:null,altMeanings:['Head (in some idioms)', 'Dismissal (as in 首になる)'],otherReadings:[],meaning:'Neck',level:6,meaningMnemonic:`"**KOO-BEE**," (くび) craning her **NECK**.`,examples:[{level:'easy',jp:'首が痛いです。',romaji:'Kubi ga itai desu.',en:'My neck hurts.'}, {level:'advanced',jp:'彼は、業績不振を理由に会社を首になってしまった。',romaji:'Kare wa, gyouseki fushin o riyuu ni kaisha o kubi ni natte shimatta.',en:'He ended up getting fired from the company due to poor performance.'}]},
  {id:'姉',char:'姉',onyomi:'し',kunyomi:null,altMeanings:[],otherReadings:['あね'],meaning:'Older Sister',level:6,meaningMnemonic:`"**SHE** (し), my **OLDER SISTER**."`,examples:[{level:'easy',jp:'姉がいます。',romaji:'Ane ga imasu.',en:'I have an older sister.'}, {level:'advanced',jp:'彼女とお姉さんは、双子と間違えられるほどよく似ている。',romaji:'Kanojo to oneesan wa, futago to machigaerareru hodo yoku nite iru.',en:'She and her older sister resemble each other so much they\'re mistaken for twins.'}]},
  {id:'点',char:'点',onyomi:'てん',kunyomi:null,altMeanings:['Dot', 'Mark', 'Score'],otherReadings:[],meaning:'Point',level:6,meaningMnemonic:`"**TEN** (てん) **POINT**s!" she scores.`,examples:[{level:'easy',jp:'いい点を取りました。',romaji:'Ii ten o torimashita.',en:'I got a good score.'}, {level:'advanced',jp:'この提案には、いくつか検討すべき点数があるように思う。',romaji:'Kono teian ni wa, ikutsuka kentou subeki tensuu ga aru you ni omou.',en:'I think there are several points in this proposal that need to be reconsidered.'}]},
  {id:'安',char:'安',onyomi:'あん',kunyomi:null,altMeanings:['Cheap', 'Safe', 'Peace (in compounds)'],otherReadings:['やすい'],meaning:'Relax',level:6,meaningMnemonic:`"**AHN** (あん), so **RELAX**ed."`,examples:[{level:'easy',jp:'安い店です。',romaji:'Yasui mise desu.',en:'It\'s a cheap shop.'}, {level:'advanced',jp:'彼女は、その知らせを聞いて心から安心した様子だった。',romaji:'Kanojo wa, sono shirase o kiite kokoro kara anshin shita yousu datta.',en:'She seemed truly relieved from the bottom of her heart upon hearing that news.'}]},
  {id:'室',char:'室',onyomi:'しつ',kunyomi:null,altMeanings:['Chamber', 'Cell (biology, in compounds)'],otherReadings:[],meaning:'Room',level:6,meaningMnemonic:`"**SHEE-TSU** (しつ), this **ROOM** is cozy."`,examples:[{level:'easy',jp:'会議室にいます。',romaji:'Kaigishitsu ni imasu.',en:'I\'m in the meeting room.'}, {level:'advanced',jp:'彼女は、大学の研究室で長年、新しい素材の開発に取り組んでいる。',romaji:'Kanojo wa, daigaku no kenkyuushitsu de naganen, atarashii sozai no kaihatsu ni torikunde iru.',en:'She has spent years at the university lab working on developing new materials.'}]},
  {id:'科',char:'科',onyomi:'か',kunyomi:null,altMeanings:['Department', 'Subject (academic)'],otherReadings:[],meaning:'Science',level:6,meaningMnemonic:`"**KAH** (か), the **SCIENCE** lab."`,examples:[{level:'easy',jp:'科学が好きです。',romaji:'Kagaku ga suki desu.',en:'I like science.'}, {level:'advanced',jp:'彼は、内科の医者として、地域の人々に長年信頼されてきた。',romaji:'Kare wa, naika no isha toshite, chiiki no hitobito ni naganen shinrai sarete kita.',en:'As an internal medicine doctor, he\'s been trusted by the local community for years.'}]},
  {id:'海',char:'海',onyomi:'かい',kunyomi:null,altMeanings:['Ocean'],otherReadings:['うみ'],meaning:'Sea',level:6,meaningMnemonic:`"**KAI** (かい), look at the **SEA**!"`,examples:[{level:'easy',jp:'海が好きです。',romaji:'Umi ga suki desu.',en:'I like the sea.'}, {level:'advanced',jp:'彼らは、海外での長い生活を経て、母国に帰ることを決めた。',romaji:'Karera wa, kaigai de no nagai seikatsu o hete, bokoku ni kaeru koto o kimeta.',en:'After a long life abroad, they decided to return to their home country.'}]},
  {id:'羊',char:'羊',onyomi:'よう',kunyomi:null,altMeanings:['Lamb', 'Wool (in compounds)'],otherReadings:['ひつじ'],meaning:'Sheep',level:6,meaningMnemonic:`"**YOU** (よう)," bleats the **SHEEP**.`,examples:[{level:'easy',jp:'羊がいます。',romaji:'Hitsuji ga imasu.',en:'There are sheep.'}, {level:'advanced',jp:'このセーターは、上質な羊毛から丁寧に作られている。',romaji:'Kono seetaa wa, joushitsu na youmou kara teinei ni tsukurarete iru.',en:'This sweater is carefully made from high-quality wool.'}]},
  {id:'店',char:'店',onyomi:'てん',kunyomi:null,altMeanings:['Store'],otherReadings:['みせ'],meaning:'Shop',level:6,meaningMnemonic:`"**TEN** (てん), welcome to the **SHOP**."`,examples:[{level:'easy',jp:'店に行きます。',romaji:'Mise ni ikimasu.',en:'I\'ll go to the shop.'}, {level:'advanced',jp:'この喫茶店は、地元の人々に長年愛されてきた。',romaji:'Kono kissaten wa, jimoto no hitobito ni naganen aisarete kita.',en:'This café has been loved by locals for years.'}]},
  {id:'星',char:'星',onyomi:'せい',kunyomi:null,altMeanings:['Planet (in compounds like 火星)', 'Fortune'],otherReadings:['ほし'],meaning:'Star',level:6,meaningMnemonic:`"**SAY** (せい)," twinkles the **STAR**.`,examples:[{level:'easy',jp:'星がきれいです。',romaji:'Hoshi ga kirei desu.',en:'The stars are beautiful.'}, {level:'advanced',jp:'火星への有人探査は、今も多くの科学者の夢だ。',romaji:'Kasei e no yuujin tansa wa, ima mo ooku no kagakusha no yume da.',en:'A manned mission to Mars is still the dream of many scientists.'}]},
  {id:'州',char:'州',onyomi:'しゅう',kunyomi:null,altMeanings:['Province', 'Continent (in compounds)'],otherReadings:[],meaning:'State',level:6,meaningMnemonic:`"**SHOO** (しゅう), welcome to the **STATE**."`,examples:[{level:'easy',jp:'この州が好きです。',romaji:'Kono shuu ga suki desu.',en:'I like this state.'}, {level:'advanced',jp:'彼は、九州出身であることを、いつも誇らしげに話す。',romaji:'Kare wa, Kyuushuu shusshin de aru koto o, itsumo hokorashige ni hanasu.',en:'He always speaks proudly of being from Kyushu.'}]},
  {id:'取',char:'取',onyomi:'と',kunyomi:null,altMeanings:['Obtain', 'Fetch'],otherReadings:[],meaning:'Take',level:6,meaningMnemonic:`"**TOH** (と), I'll **TAKE** that."`,examples:[{level:'easy',jp:'これを取ります。',romaji:'Kore o torimasu.',en:'I\'ll take this.'}, {level:'advanced',jp:'彼女は、取り扱いの難しい案件を、いつも冷静に処理している。',romaji:'Kanojo wa, toriatsukai no muzukashii anken o, itsumo reisei ni shori shite iru.',en:'She always calmly handles difficult cases.'}]},
  {id:'茶',char:'茶',onyomi:'ちゃ',kunyomi:null,altMeanings:['Brown (as in 茶色)', 'Tea ceremony (in compounds)'],otherReadings:[],meaning:'Tea',level:6,meaningMnemonic:`"**CHAH** (ちゃ), a cup of **TEA**."`,examples:[{level:'easy',jp:'お茶を飲みます。',romaji:'Ocha o nomimasu.',en:'I\'ll drink tea.'}, {level:'advanced',jp:'この店では、様々な種類の茶葉を取り揃えている。',romaji:'Kono mise dewa, samazama na shurui no chaba o toriso roete iru.',en:'This shop stocks a wide variety of tea leaves.'}]},
  {id:'思',char:'思',onyomi:'し',kunyomi:null,altMeanings:['Thought', 'Consider'],otherReadings:['おもう'],meaning:'Think',level:6,meaningMnemonic:`"**SHE** (し), let me **THINK**."`,examples:[{level:'easy',jp:'そう思います。',romaji:'Sou omoimasu.',en:'I think so.'}, {level:'advanced',jp:'彼の考え方には、深い思慮が感じられる。',romaji:'Kare no kangaekata ni wa, fukai shiryo ga kanjirareru.',en:'A deep thoughtfulness can be felt in his way of thinking.'}]},
  {id:'歩',char:'歩',onyomi:'ほ',kunyomi:null,altMeanings:['Step', 'Pace'],otherReadings:[],meaning:'Walk',level:6,meaningMnemonic:`"**HO!**" (ほ) she calls, taking a **WALK**.`,examples:[{level:'easy',jp:'歩きます。',romaji:'Arukimasu.',en:'I\'ll walk.'}, {level:'advanced',jp:'このプロジェクトは、着実に一歩ずつ前進している。',romaji:'Kono purojekuto wa, chakujitsu ni ippo zutsu zenshin shite iru.',en:'This project is steadily progressing one step at a time.'}]},
  {id:'向',char:'向',onyomi:'こう',kunyomi:null,altMeanings:['Toward', 'Facing', 'Opposite'],otherReadings:[],meaning:'Yonder',level:6,meaningMnemonic:`"**CO**-me (こう), look **YONDER**."`,examples:[{level:'easy',jp:'あちらの方を見てください。',romaji:'Achira no hou o mite kudasai.',en:'Please look over that way.'}, {level:'advanced',jp:'彼は、困難な状況にも前向きに向き合っている。',romaji:'Kare wa, konnan na joukyou ni mo maemuki ni mukiatte iru.',en:'He faces even difficult situations with a positive attitude.'}]},
  {id:'妹',char:'妹',onyomi:'まい',kunyomi:null,altMeanings:[],otherReadings:['いもうと'],meaning:'Younger Sister',level:6,meaningMnemonic:`"**MY** (まい) **YOUNGER SISTER**," she says fondly.`,examples:[{level:'easy',jp:'妹がいます。',romaji:'Imouto ga imasu.',en:'I have a younger sister.'}, {level:'advanced',jp:'彼女と妹は、いつも一緒に買い物に出かけている。',romaji:'Kanojo to imouto wa, itsumo issho ni kaimono ni dekakete iru.',en:'She and her younger sister always go shopping together.'}]},

  // ---- Level 7 ----
  {id:'辺',char:'辺',onyomi:'へん',kunyomi:null,altMeanings:['Vicinity', 'Side (of a shape)'],otherReadings:[],meaning:'Area',level:7,meaningMnemonic:`"**HEN** (へん), wandering this **AREA**."`,examples:[{level:'easy',jp:'この辺に住んでいます。',romaji:'Kono hen ni sunde imasu.',en:'I live around this area.'}, {level:'advanced',jp:'彼の家は、この辺りでは知らない人がいないほど有名だ。',romaji:'Kare no ie wa, kono atari dewa shiranai hito ga inai hodo yuumei da.',en:'His house is so famous that there\'s no one around here who doesn\'t know it.'}]},
  {id:'付',char:'付',onyomi:'つ',kunyomi:null,altMeanings:['Adhere', 'Add on'],otherReadings:['ふ'],meaning:'Attach',level:7,meaningMnemonic:`"**TSU** (つ), **ATTACH** it there."`,examples:[{level:'easy',jp:'名前を付けます。',romaji:'Namae o tsukemasu.',en:'I\'ll attach a name (give a name).'}, {level:'advanced',jp:'彼は、この件について助言を求めてきた。',romaji:'Kare wa, kono ken ni tsuite jogen o motomete kita.',en:'He came asking for advice on this matter.'}]},
  {id:'札',char:'札',onyomi:'さつ',kunyomi:null,altMeanings:['Paper money', 'Tag', 'Card'],otherReadings:[],meaning:'Bill',level:7,meaningMnemonic:`"**SAH-TSU** (さつ), a crisp **BILL**."`,examples:[{level:'easy',jp:'千円札です。',romaji:'Sen\'ensatsu desu.',en:'It\'s a thousand-yen bill.'}, {level:'advanced',jp:'会場の入り口には、番号札を受け取る長い列ができていた。',romaji:'Kaijou no iriguchi ni wa, bangoufuda o uketoru nagai retsu ga dekite ita.',en:'A long line had formed at the venue\'s entrance to receive numbered tags.'}]},
  {id:'鳥',char:'鳥',onyomi:'ちょう',kunyomi:null,altMeanings:[],otherReadings:['とり'],meaning:'Bird',level:7,meaningMnemonic:`"**CHO** (ちょう)," chirps the **BIRD**.`,examples:[{level:'easy',jp:'鳥がいます。',romaji:'Tori ga imasu.',en:'There is a bird.'}, {level:'advanced',jp:'白鳥が湖の上を優雅に泳いでいた。',romaji:'Hakuchou ga mizuumi no ue o yuuga ni oyoide ita.',en:'Swans were swimming gracefully across the lake.'}]},
  {id:'黒',char:'黒',onyomi:'こく',kunyomi:null,altMeanings:['Darkness'],otherReadings:['くろい'],meaning:'Black',level:7,meaningMnemonic:`"**KOH-KOO** (こく), dressed in **BLACK**."`,examples:[{level:'easy',jp:'黒い服です。',romaji:'Kuroi fuku desu.',en:'It\'s black clothing.'}, {level:'advanced',jp:'その主張が正しいかどうか、白黒はっきりさせる必要がある。',romaji:'Sono shuchou ga tadashii ka dou ka, shirokuro hakkiri saseru hitsuyou ga aru.',en:'We need to make clear, black and white, whether that claim is correct.'}]},
  {id:'船',char:'船',onyomi:'せん',kunyomi:null,altMeanings:['Ship', 'Vessel'],otherReadings:[],meaning:'Boat',level:7,meaningMnemonic:`"**SEN** (せん)," sails the **BOAT**.`,examples:[{level:'easy',jp:'船に乗ります。',romaji:'Fune ni norimasu.',en:'I\'ll get on a boat.'}, {level:'advanced',jp:'あの豪華な船体は、遠くからでもすぐに分かった。',romaji:'Ano gouka na sentai wa, tooku kara demo sugu ni wakatta.',en:'That luxurious ship\'s hull was recognizable even from a distance.'}]},
  {id:'必',char:'必',onyomi:'ひつ',kunyomi:null,altMeanings:['Inevitably', 'Sure'],otherReadings:['かならず'],meaning:'Certain',level:7,meaningMnemonic:`"**HEE-TSU** (ひつ), **CERTAIN**ly so."`,examples:[{level:'easy',jp:'必ず来ます。',romaji:'Kanarazu kimasu.',en:'I\'ll definitely come.'}, {level:'advanced',jp:'彼は必死になって、その締め切りに間に合わせようとしていた。',romaji:'Kare wa hisshi ni natte, sono shimekiri ni maniawaseyou to shite ita.',en:'He was desperately trying to make it in time for that deadline.'}]},

  {id:'助',char:'助',onyomi:'じょ',kunyomi:null,altMeanings:['Assist', 'Save'],otherReadings:['たすける'],meaning:'Help',level:8,meaningMnemonic:`"**JOH** (じょ), **HELP** me!"`,examples:[{level:'easy',jp:'助けてください。',romaji:'Tasukete kudasai.',en:'Please help me.'}, {level:'advanced',jp:'彼の助言のおかげで、私はその難しい決断を下すことができた。',romaji:'Kare no jogen no okage de, watashi wa sono muzukashii ketsudan o kudasu koto ga dekita.',en:'Thanks to his advice, I was able to make that difficult decision.'}]},

const GRAMMAR = [
  // ---- Level 1 — The Copula and the First Particles ----
  {
    id: 'g-da', title: 'だ', subtitle: 'Plain copula — "is/am/are" (casual)',
    explanation: 'The plain, casual version of です. Marks a noun or な-adjective as true/present, but skips the politeness — used with friends/family or in casual writing. Often dropped entirely when the meaning is already clear from context.',
    example: { jp: 'これは本だ。', romaji: 'Kore wa hon da.', en: 'This is a book. (casual)' },
    blankAnswer: 'だ', blankAnswerAccepted: ['da'], level: 1
  },
  {
    id: 'g-desu', title: 'です', subtitle: 'Polite copula — "is/am/are"',
    explanation: 'The polite version of だ. Attaches to nouns and な-adjectives to politely state that something is the case — the baseline politeness you use with strangers, teachers, and in most everyday polite speech.',
    example: { jp: 'これは本です。', romaji: 'Kore wa hon desu.', en: 'This is a book.' },
    blankAnswer: 'です', blankAnswerAccepted: ['desu'], level: 1
  },
  {
    id: 'g-wa', title: 'は', subtitle: 'Topic particle',
    explanation: 'Marks the topic of the sentence — what you\'re about to say something about. Often carries a nuance of focus or contrast ("as for X..."). Pronounced "wa" even though it\'s written with the hiragana は.',
    example: { jp: '私は学生です。', romaji: 'Watashi wa gakusei desu.', en: 'I am a student.' },
    blankAnswer: 'は', blankAnswerAccepted: ['wa', 'ha'], level: 1
  },
  {
    id: 'g-mo', title: 'も', subtitle: 'Particle: also, too, even',
    explanation: 'Replaces は or が when saying something applies "too" or "also" — or emphasizes an extreme case ("even"). Attaches directly to the noun.',
    example: { jp: '私も学生です。', romaji: 'Watashi mo gakusei desu.', en: 'I am also a student.' },
    blankAnswer: 'も', blankAnswerAccepted: ['mo'], level: 1
  },
  {
    id: 'g-no', title: 'の', subtitle: "Particle: possessive ('s), or links nouns",
    explanation: 'Works like an apostrophe-s in English — "A の B" means "A\'s B" or "B of A." Also links two nouns together so one describes/possesses the other.',
    example: { jp: 'これは私の本です。', romaji: 'Kore wa watashi no hon desu.', en: 'This is my book.' },
    blankAnswer: 'の', blankAnswerAccepted: ['no'], level: 1
  },
  {
    id: 'g-ka', title: 'か', subtitle: 'Turns a statement into a question',
    explanation: 'Added to the end of a sentence to make it a yes/no (or open) question — no need to change word order like in English, just add か.',
    example: { jp: 'これは本ですか。', romaji: 'Kore wa hon desu ka?', en: 'Is this a book?' },
    blankAnswer: 'か', blankAnswerAccepted: ['ka'], level: 1
  },

  {

    example: { jp: '公園に猫がいます。', romaji: 'Kouen ni neko ga imasu.', en: 'There is a cat in the park.' },

  {
    id: 'g-kosoredo', title: 'これ・それ・あれ・どれ', subtitle: '"This one / that one / that one over there / which one"',
    explanation: 'A four-way system of demonstrative pronouns: これ (near the speaker), それ (near the listener), あれ (far from both), どれ (which one — a question). Used to point at a specific thing without naming it.',

    blankAnswer: 'これ', blankAnswerAccepted: ['kore'], level: 2
  },
  {

/* ======================================================================
   SRS ENGINE — exact math from your WaniKani writeup.
   ====================================================================== */

// hours to wait after REACHING that stage before the item is due again.
// index = stage (1-8). Stage 9 = Burned, never reviewed again.
const SRS_HOURS = [null, 4, 8, 23, 47, 167, 335, 719, 2879];
const STAGE_NAMES = ['', 'Apprentice I', 'Apprentice II', 'Apprentice III', 'Apprentice IV', 'Guru I', 'Guru II', 'Master', 'Enlightened', 'Burned'];

function nextAvailableAt(stage) {
  if (stage >= 9) return null;
  return now() + SRS_HOURS[stage] * 3600 * 1000;
}

// Applies one item's review outcome for a whole session (missCount = how
// many wrong sub-answers it got this session, 0 if answered clean).
function applyReviewOutcome(record, missCount) {
  if (missCount === 0) {
    record.stage = Math.min(record.stage + 1, 9);
  } else {
    const penalty = record.stage >= 5 ? 2 : 1;
    const drop = Math.ceil(missCount / 2) * penalty;
    record.stage = Math.max(1, record.stage - drop);
  }
  record.availableAt = nextAvailableAt(record.stage);
  record.lastReviewedAt = now();
}

/* ======================================================================
   STATE — persisted to localStorage.
   ====================================================================== */

const STORAGE_KEY = 'jpPracticeState_v1';

function defaultState() {
  return {
    items: {},              // key `${type}:${id}` -> { stage, availableAt, learnedAt, lastReviewedAt }
    levels: { vocab: 1, kanji: 1, grammar: 1 },
    recentMistakes: [],     // { type, id, at }
    lessonBatchSize: 5,     // how many new items are taught per lesson session before the end-of-batch quiz
    devTimeOffsetMs: 0,     // DEV ONLY — lets the "+24h" button fast-forward review timing for testing
    customVocab: { vocab: [], kanji: [], grammar: [] }, // per-user words added from the "Add Custom Vocab" screen
    audioSettings: {
      enabled: true,
      // empty array = "all voices of this gender allowed" (see
      // enabledSpeakerPool) — starts empty rather than pre-filled with
      // every id from FEMALE_SPEAKERS/MALE_SPEAKERS because defaultState()
      // runs before those consts are initialized (this runs at the very
      // top of STATE setup, they're declared much further down the file)
      voices: { female: [], male: [] }
    }
  };
}

// STATE starts empty and is only ever populated for real once sign-in
// resolves (see onAuthStateChanged below) — this app now requires an
// account, since progress is per-user and synced to the cloud. CURRENT_UID
// scopes localStorage per-account too, so two friends sharing one browser
// never see each other's cached progress.
let STATE = defaultState();
let CURRENT_UID = null;
function localKeyFor(uid) { return STORAGE_KEY + ':' + uid; }
function loadLocalState(uid) {
  try {
    const raw = localStorage.getItem(localKeyFor(uid));
    if (raw) return Object.assign(defaultState(), JSON.parse(raw));
  } catch (e) {}
  return defaultState();
}

// Local save is always synchronous and instant (works offline, no lag while
// typing/reviewing). Cloud sync piggybacks on every save but is fire-and-
// forget and debounced — see scheduleCloudSync() below.
function saveState() {
  if (CURRENT_UID) localStorage.setItem(localKeyFor(CURRENT_UID), JSON.stringify(STATE));
  scheduleCloudSync();
}
function now() { return Date.now() + STATE.devTimeOffsetMs; }

function itemKey(type, id) { return type + ':' + id; }
function getRecord(type, id) { return STATE.items[itemKey(type, id)]; }
function isIntroduced(type, id) { return !!getRecord(type, id); }

function introduceItem(type, id) {
  if (isIntroduced(type, id)) return;
  STATE.items[itemKey(type, id)] = { stage: 1, availableAt: nextAvailableAt(1), learnedAt: now(), lastReviewedAt: null };
}

// force a specific item straight to a given stage, bypassing the normal
// "just introduced -> Apprentice I" path. Used only by the one-time
// progress seed below, for items you'd already learned before this app
// existed (so they shouldn't start the SRS clock from zero).
function setItemStage(type, id, stage) {
  STATE.items[itemKey(type, id)] = { stage, availableAt: nextAvailableAt(stage), learnedAt: now(), lastReviewedAt: now() };
}

// Custom vocab you add yourself (see "Add Custom Vocab" in Settings)
// starts at Apprentice I like normal, but skips the usual 4-hour wait —
// it's due for review right away instead of hours from now.
function introduceCustomItem(type, id) {
  if (isIntroduced(type, id)) return;
  STATE.items[itemKey(type, id)] = { stage: 1, availableAt: now(), learnedAt: now(), lastReviewedAt: null };
}

// NOTE: the one-time progress seed and Duo auto-introduce that used to run
// unconditionally here were Casey-account-specific (her real pre-app
// progress) and would have wrongly given every new friend signup a head
// start. That history was moved out to a one-time backup-JSON import (see
// migrate-duo-vocab.js) that Casey imports once from the Backup/Restore
// screen on her own account — new accounts now genuinely start blank.
//
// postLoadInit() runs once per sign-in, after STATE has been resolved from
// local+cloud storage (see onAuthStateChanged below) — NOT at script-parse
// time, since there's no real STATE to act on until someone's logged in.
function postLoadInit() {
  // Auto-introduce any custom vocab a user has added that isn't in their
  // review pool yet (mirrors the old Duo behavior: words you add yourself
  // are ones you already know, so they go straight into reviews).
  (STATE.customVocab && STATE.customVocab.vocab || []).forEach(v => {
    if (!isIntroduced('vocab', v.id)) introduceCustomItem('vocab', v.id);
  });
  saveState();
}

/* ======================================================================
   CONTENT / SECTION HELPERS — generic across vocab / kanji / grammar.
   ====================================================================== */

const COLOR_MAP = {
  vocab:     { accent: '#AA00FF', dark: '#8600B9', light: '#EDC8FF' },
  kanji:     { accent: '#FF00AA', dark: '#B9007B', light: '#FFD4F1' },
  grammar:   { accent: '#00AA00', dark: '#007A00', light: '#CDF5CD' },
  sentences: { accent: '#00AAFF', dark: '#0069AC', light: '#CBEBFF' }
};
const SECTION_LABEL = { vocab: 'Vocabulary', kanji: 'Kanji', grammar: 'Grammar' };
const SECTION_CHIP = { vocab: '語', kanji: '字', grammar: '文法' };
const BATCH_SIZE = { vocab: 15, kanji: 15, grammar: 5 };

function contentFor(type) {
  const base = type === 'vocab' ? VOCAB : type === 'kanji' ? KANJI : GRAMMAR;
  const custom = (STATE.customVocab && STATE.customVocab[type]) || [];
  return custom.length ? base.concat(custom) : base;
}
function displayWord(type, item) {
  return type === 'kanji' ? item.char : (type === 'grammar' ? item.title : item.word);
}
function displayReading(type, item) {
  // on'yomi is the "headline" reading for a kanji (falls back to kun'yomi
  // for the handful with no on'yomi at all, like 皿/貝)
  if (type === 'grammar') return item.subtitle;
  if (type === 'kanji') return item.onyomi || item.kunyomi;
  return item.reading;
}
function displayMeaning(type, item) {
  return type === 'grammar' ? item.explanation : item.meaning;
}

// Shared "Reading" section body for kanji vs vocab lesson/detail/review-
// panel views — kanji shows both readings plus the on/kun usage note
// (the "why"), vocab shows its one reading plus the readingType "why".
// Centralized here instead of duplicated across renderLessonItem,
// viewItemDetail, and the quiz wrong-answer panel.
function readingSectionHTML(type, item, audioText) {
  if (type === 'kanji') {
    const rows = [];
    if (item.onyomi) rows.push(`<div class="field"><div class="k">Reading</div><div class="v primary jp-field">${item.onyomi}</div></div>`);
    const otherReadingsNote = item.otherReadings && item.otherReadings.length
      ? `<p class="prose">This kanji is also read <strong>${item.otherReadings.join('、')}</strong> in other words/compounds (often the reading used when it stands alone as its own vocab word) — that's a real reading, just not the one being quizzed here, so typing it gets a "try the one we're asking for" nudge instead of a hard miss.</p>`
      : '';
    return `
      <div class="field-row">${rows.join('')}</div>
      ${audioText ? audioButtonsHTML(audioText) : ''}
      ${otherReadingsNote ? `<h3 class="mnemonic-label">Other Readings</h3>${otherReadingsNote}` : ''}
      ${item.examples && item.examples.length ? `
        <h3 class="mnemonic-label">Example Sentences</h3>
        ${item.examples.map(e => exampleSentenceHTML(e, `<div class="example-label">${e.level}</div>`)).join('')}
      ` : ''}`;
  }
  return `
    <div class="reading-row"><div class="reading-jp">${item.reading || ''}</div>${audioText ? audioButtonsHTML(audioText) : ''}</div>
    <h3 class="mnemonic-label">Why This Reading</h3>
    <p class="prose">${item.readingType || '<em>No note added yet.</em>'}</p>`;
}

function setAccent(type) {
  const c = COLOR_MAP[type] || COLOR_MAP.vocab;
  const r = document.documentElement.style;
  r.setProperty('--accent', c.accent);
  r.setProperty('--accent-dark', c.dark);
  r.setProperty('--accent-light', c.light);
}

function levelBatch(type, level) {
  const all = contentFor(type);
  const withLevels = all.some(it => it.level != null);
  if (withLevels) return all.filter(it => it.level === level);
  const size = BATCH_SIZE[type];
  return all.slice((level - 1) * size, level * size);
}
function totalLevels(type) {
  const all = contentFor(type);
  if (!all.length) return 1;
  const withLevels = all.some(it => it.level != null);
  if (withLevels) return Math.max(1, ...all.map(it => it.level || 1));
  return Math.max(1, Math.ceil(all.length / BATCH_SIZE[type]));
}
function maybeLevelUp(type) {
  const level = STATE.levels[type];
  const batch = levelBatch(type, level);
  if (!batch.length) return false;
  const guruCount = batch.filter(it => { const r = getRecord(type, it.id); return r && r.stage >= 5; }).length;
  if (guruCount / batch.length >= 0.8 && level < totalLevels(type)) {
    STATE.levels[type] = level + 1;
    return true;
  }
  return false;
}
function lessonQueueFor(type) {
  const level = STATE.levels[type];
  return levelBatch(type, level).filter(it => !isIntroduced(type, it.id));
}
function reviewQueueFor(type) {
  return contentFor(type).filter(it => {
    const r = getRecord(type, it.id);
    return r && r.stage < 9 && r.availableAt !== null && r.availableAt <= now();
  });
}
function introducedItems(type) {
  return contentFor(type)
    .filter(it => isIntroduced(type, it.id))
    .sort((a, b) => (getRecord(type, b.id).learnedAt || 0) - (getRecord(type, a.id).learnedAt || 0));
}

// counts introduced items into the 5 named SRS tiers (grouping the 8
// numbered stages the way WK's own dashboard does: Apprentice = 1-4).
function stageBreakdown(type) {
  const counts = { apprentice: 0, guru: 0, master: 0, enlightened: 0, burned: 0 };
  contentFor(type).forEach(it => {
    const r = getRecord(type, it.id);
    if (!r) return;
    if (r.stage <= 4) counts.apprentice++;
    else if (r.stage <= 6) counts.guru++;
    else if (r.stage === 7) counts.master++;
    else if (r.stage === 8) counts.enlightened++;
    else counts.burned++;
  });
  return counts;
}

function fieldsFor(type) { return type === 'grammar' ? ['blank'] : ['meaning', 'reading']; }
function acceptedFor(type, item, field) {
  if (type === 'grammar') {
    return (item.blankAnswerAccepted && item.blankAnswerAccepted.length ? item.blankAnswerAccepted : [item.blankAnswer]).filter(Boolean);
  }
  if (field === 'meaning') {
    return (item.altMeanings && item.altMeanings.length ? [item.meaning, ...item.altMeanings] : [item.meaning]).filter(Boolean);
  }
  // Matches real WK: a reading question has exactly ONE correct answer —
  // the "headline" reading (on'yomi, falling back to kun'yomi for the rare
  // kanji with none) — not "either reading accepted." Typing the OTHER
  // valid reading of the character isn't treated as this-is-correct-too;
  // it gets its own soft "wrong reading type" handling in attachQuizHandlers
  // (see otherReadingFor) instead of silently passing here.
  const base = type === 'kanji' ? [item.onyomi || item.kunyomi] : [item.reading];
  return base.filter(Boolean).concat(item.readingAccepted && item.readingAccepted.length ? item.readingAccepted : []);
}

// Other REAL readings of this kanji that aren't the one being quizzed right
// now — an empty array if there are none (or field isn't 'reading'). Used
// for the soft "that's a real reading, just not this one" shake+retry
// instead of a hard wrong answer. Generalized from the old on'yomi/
// kun'yomi-only pair to any number of otherReadings, since a kanji can
// have several (WK's own vocab-level readings included).
function otherReadingFor(type, item, field) {
  if (type !== 'kanji' || field !== 'reading') return [];
  return item.otherReadings || [];
}

/* ======================================================================
   MATCHING — fuzzy/tolerant answer checking, shared everywhere.
   ====================================================================== */

// converts the **bold** markdown from your mnemonic source files into the
// <span class="hl"> highlight styling, so mnemonics can be pasted in as-is.
function mdBold(s) { return String(s || '').replace(/\*\*(.+?)\*\*/g, '<span class="hl">$1</span>'); }

function normalizeAnswer(s) { return String(s || '').trim().toLowerCase().replace(/[.,、。\s!！]/g, ''); }
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = new Array(n + 1);
  for (let j = 0; j <= n; j++) dp[j] = j;
  for (let i = 1; i <= m; i++) {
    let prev = dp[0]; dp[0] = i;
    for (let j = 1; j <= n; j++) {
      const tmp = dp[j];
      dp[j] = a[i - 1] === b[j - 1] ? prev : 1 + Math.min(prev, dp[j], dp[j - 1]);
      prev = tmp;
    }
  }
  return dp[n];
}
function isCloseEnough(rawVal, acceptedList) {
  const val = normalizeAnswer(rawVal);
  if (!val) return false;
  for (const raw of acceptedList) {
    const target = normalizeAnswer(raw);
    if (!target) continue;
    if (val === target) return true;
    // BUG FIX: this used to floor(length*0.12) but then force a MINIMUM of
    // 1 edit allowed regardless of length. For short targets (a huge share
    // of kana readings are 1-3 characters), a 1-edit tolerance is
    // enormous relative to the string — it was accepting almost any input
    // as "close enough" to e.g. a 1-character reading. Short answers now
    // require an exact match; typo tolerance only kicks in once there's
    // enough length for a 1-character slip to actually mean "typo" rather
    // than "wrong answer."
    if (target.length <= 4) continue;
    const tolerance = Math.floor(target.length * 0.15);
    if (tolerance > 0 && levenshtein(val, target) <= tolerance) return true;
  }
  return false;
}

/* ======================================================================
   VOICEVOX — text-to-speech via the local VOICEVOX Engine app.
   ====================================================================== */
// Three-tier fallback, so audio works on your phone with no server at all,
// and still works anywhere else:
//   1. A pre-generated file in audio/ (see generate-audio.js) — no network,
//      no VOICEVOX Engine needed, works offline on a phone/PWA. This is
//      the normal path for anything already in your vocab/kanji/sentences.
//   2. Live VOICEVOX Engine call (voicevox_core has no browser/mobile
//      binding — only the desktop Engine app exposes an HTTP API a page
//      can call, and only while it's running on that machine) — covers
//      brand-new text at your desk before you've re-run generate-audio.js.
//   3. The browser's own built-in speechSynthesis — no server, no engine,
//      works on any device (including iOS Safari, which ships Japanese
//      voices), just lower quality than VOICEVOX. Last resort so
//      something always plays.
const VOICEVOX_BASE = 'http://127.0.0.1:50021';

// Your requested voice pool, split by gender. "Mixed around" means: rather
// than one fixed voice per gender, which specific voice gets used for a
// given piece of text is picked deterministically from a hash of the text
// itself (pickSpeaker below) — so it's stable across regenerations (the
// same word always gets the same voice) but varies which of the two voices
// in that gender shows up from one word to the next. This EXACT list and
// pickSpeaker function are duplicated in generate-audio.js — the two must
// stay in sync, or pre-generated files won't match what the live fallback
// would pick.
const FEMALE_SPEAKERS = [
  { id: 2, name: 'Shikoku Metan', style: 'Bright & playful' },
  { id: 8, name: 'Kasukabe Tsumugi', style: 'Calm & clear' },
  { id: 10, name: 'Amehare Hau', style: 'Soft & gentle' },
  { id: 9, name: 'Namine Ritsu', style: 'Cool & low-toned' },
  { id: 16, name: 'Kyushu Sora', style: 'Warm & friendly' }
];
const MALE_SPEAKERS = [
  { id: 52, name: 'Suzumatsu Shuji', style: 'Smooth & mature' },
  { id: 21, name: 'Kenzaki', style: 'Deep & steady' },
  { id: 11, name: 'Kurono Takehiro', style: 'Energetic & warm' },
  { id: 12, name: 'Shirakami Kotaro', style: 'Upbeat & enthusiastic' },
  { id: 13, name: 'Aoyama Ryusei', style: 'Bold & hot-blooded' }
];

// Only speakers the user has left checked in Settings > Voices are
// eligible for the random rotation. Falls back to the full pool if
// somehow every voice in a gender got unchecked, so playback never
// breaks (pool[x % 0] would be NaN otherwise).
function enabledSpeakerPool(gender) {
  const full = gender === 'male' ? MALE_SPEAKERS : FEMALE_SPEAKERS;
  const allowedIds = STATE.audioSettings && STATE.audioSettings.voices && STATE.audioSettings.voices[gender];
  if (!allowedIds || !allowedIds.length) return full;
  const filtered = full.filter(s => allowedIds.includes(s.id));
  return filtered.length ? filtered : full;
}

function pickSpeakerId(gender, text) {
  const pool = enabledSpeakerPool(gender);
  let h = 0;
  for (const ch of String(text)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return pool[h % pool.length].id;
}

let _audioManifestPromise = null;
function loadAudioManifest() {
  if (!_audioManifestPromise) {
    _audioManifestPromise = fetch('audio/manifest.json').then(r => r.ok ? r.json() : {}).catch(() => ({}));
  }
  return _audioManifestPromise;
}

async function playPreGenerated(text, gender) {
  const manifest = await loadAudioManifest();
  const key = normalizeAnswer(text);
  const entry = manifest[key];
  const filename = entry && entry[gender];
  if (!filename) return false;
  const audio = new Audio('audio/' + filename);
  await audio.play();
  return true;
}

async function playViaVoicevoxEngine(text, speakerId) {
  const qRes = await fetch(`${VOICEVOX_BASE}/audio_query?speaker=${speakerId}&text=${encodeURIComponent(text)}`, { method: 'POST' });
  if (!qRes.ok) throw new Error('audio_query failed (' + qRes.status + ')');
  const query = await qRes.json();
  const sRes = await fetch(`${VOICEVOX_BASE}/synthesis?speaker=${speakerId}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(query)
  });
  if (!sRes.ok) throw new Error('synthesis failed (' + sRes.status + ')');
  const blob = await sRes.blob();
  const url = URL.createObjectURL(blob);
  const audio = new Audio(url);
  audio.addEventListener('ended', () => URL.revokeObjectURL(url));
  await audio.play();
}

function playViaBrowserTTS(text) {
  if (!window.speechSynthesis) return false;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP';
  window.speechSynthesis.speak(utter);
  return true;
}

async function playTTS(text, gender = 'female') {
  if (!text) return;
  if (STATE.audioSettings && STATE.audioSettings.enabled === false) return;
  try {
    if (await playPreGenerated(text, gender)) return;
  } catch (err) {
    console.warn('Pre-generated audio playback failed, trying live VOICEVOX:', err);
  }
  try {
    await playViaVoicevoxEngine(text, pickSpeakerId(gender, text));
    return;
  } catch (err) {
    console.warn('Live VOICEVOX Engine unreachable, falling back to browser TTS:', err);
  }
  if (!playViaBrowserTTS(text)) {
    alert('No audio available: no pre-generated file, VOICEVOX Engine unreachable, and this browser has no built-in speech synthesis.');
  }
}

// two-button (female/male) audio widget, used everywhere a play button
// appears. `extraStyle` lets callers on a colored hero background swap in
// the translucent-white look instead of the default card-on-white style.
function audioButtonsHTML(text, extraStyle = '') {

  </span>`;
}

/* ======================================================================
   ROMAJI -> KANA — simple live IME-style conversion for reading answers.
   ====================================================================== */

// Greedy longest-match romaji->hiragana table. Re-run on the WHOLE input
// value on every keystroke rather than tracking incremental state: already-
// converted kana characters simply don't match any romaji key, so they
// pass through unchanged, and only the newly-typed trailing romaji gets
// converted — this makes "reconvert everything each keystroke" safe and
// much simpler than trying to track partial syllable state by hand.
const ROMAJI_TO_HIRAGANA = {
  kya:'きゃ',kyu:'きゅ',kyo:'きょ', gya:'ぎゃ',gyu:'ぎゅ',gyo:'ぎょ',
  sha:'しゃ',shu:'しゅ',sho:'しょ', sya:'しゃ',syu:'しゅ',syo:'しょ',
  ja:'じゃ',ju:'じゅ',jo:'じょ', zya:'じゃ',zyu:'じゅ',zyo:'じょ',
  cha:'ちゃ',chu:'ちゅ',cho:'ちょ', tya:'ちゃ',tyu:'ちゅ',tyo:'ちょ',
  nya:'にゃ',nyu:'にゅ',nyo:'にょ',
  hya:'ひゃ',hyu:'ひゅ',hyo:'ひょ',
  bya:'びゃ',byu:'びゅ',byo:'びょ',
  pya:'ぴゃ',pyu:'ぴゅ',pyo:'ぴょ',
  mya:'みゃ',myu:'みゅ',myo:'みょ',
  rya:'りゃ',ryu:'りゅ',ryo:'りょ',
  dya:'ぢゃ',dyu:'ぢゅ',dyo:'ぢょ',
  a:'あ',i:'い',u:'う',e:'え',o:'お',
  ka:'か',ki:'き',ku:'く',ke:'け',ko:'こ',
  ga:'が',gi:'ぎ',gu:'ぐ',ge:'げ',go:'ご',
  sa:'さ',shi:'し',si:'し',su:'す',se:'せ',so:'そ',
  za:'ざ',ji:'じ',zi:'じ',zu:'ず',ze:'ぜ',zo:'ぞ',
  ta:'た',chi:'ち',ti:'ち',tsu:'つ',tu:'つ',te:'て',to:'と',
  da:'だ',di:'ぢ',du:'づ',de:'で',do:'ど',
  na:'な',ni:'に',nu:'ぬ',ne:'ね',no:'の',
  ha:'は',hi:'ひ',fu:'ふ',hu:'ふ',he:'へ',ho:'ほ',
  ba:'ば',bi:'び',bu:'ぶ',be:'べ',bo:'ぼ',
  pa:'ぱ',pi:'ぴ',pu:'ぷ',pe:'ぺ',po:'ぽ',
  ma:'ま',mi:'み',mu:'む',me:'め',mo:'も',
  ya:'や',yu:'ゆ',yo:'よ',
  ra:'ら',ri:'り',ru:'る',re:'れ',ro:'ろ',
  wa:'わ',wo:'を',
  vu:'ゔ',
  '-':'ー'
};
const HIRAGANA_START = 0x3041, HIRAGANA_END = 0x3096, KATAKANA_OFFSET = 0x60;
function hiraganaToKatakana(s) {
  return s.replace(/[ぁ-ゖ]/g, ch => String.fromCharCode(ch.charCodeAt(0) + KATAKANA_OFFSET));
}

function romajiToKana(input, katakana) {
  const s = input.toLowerCase();
  let out = '';
  let i = 0;
  while (i < s.length) {
    const c = s[i], c2 = s[i + 1];
    // "n" not followed by a vowel/y/another pending n-context -> ん
    if (c === 'n' && c2 !== undefined && "aiueoy".indexOf(c2) === -1 && c2 !== "'") {
      out += 'ん'; i++; continue;
    }
    if (c === 'n' && c2 === "'") { out += 'ん'; i += 2; continue; }
    // NOTE: deliberately NOT converting a trailing "n" with nothing after it
    // yet (c2 === undefined). This runs on the whole field on every
    // keystroke, so right after you type the "n" in "na" it briefly IS the
    // last character with nothing following — eagerly turning that into ん
    // pre-empted the vowel that was about to complete na/ni/nu/ne/no, which
    // is exactly the bug reported. A genuinely-trailing n (e.g. finishing
    // on "hon") is caught by finalizeTrailingN() at answer-check time
    // instead, once we actually know nothing more is coming.
    // sokuon: doubled consonant -> っ, then re-process the second one
    if (c === c2 && 'kstpgzbdjcf'.indexOf(c) !== -1) { out += 'っ'; i++; continue; }
    let matched = false;
    for (const len of [3, 2, 1]) {
      const chunk = s.slice(i, i + len);
      if (ROMAJI_TO_HIRAGANA[chunk]) { out += ROMAJI_TO_HIRAGANA[chunk]; i += len; matched = true; break; }
    }
    if (!matched) { out += s[i]; i++; }
  }
  return katakana ? hiraganaToKatakana(out) : out;
}

// Converts a genuinely trailing lone "n" left over from live conversion
// (e.g. finishing on "hon") to ん — safe to call once we know the answer
// is actually being submitted, since nothing more is coming after it.
function finalizeTrailingN(s, katakana) {
  if (/n$/i.test(s)) return s.slice(0, -1) + (katakana ? 'ン' : 'ん');
  return s;
}

/* ======================================================================
   CONFETTI — shared burst effect.
   ====================================================================== */

function burstConfetti() {
  const colors = [getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#AA00FF', '#FF00AA', '#00AAFF', '#FFC700'];
  const originX = window.innerWidth / 2, originY = window.innerHeight * 0.75;
  for (let i = 0; i < 46; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = originX + 'px';
    piece.style.top = originY + 'px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    const angleRad = (-90 + (Math.random() * 120 - 60)) * Math.PI / 180;
    const dist = 160 + Math.random() * 260;
    piece.style.setProperty('--fx', (Math.cos(angleRad) * dist).toFixed(1));
    piece.style.setProperty('--fy', (Math.sin(angleRad) * dist).toFixed(1));
    piece.style.setProperty('--rot', Math.floor(180 + Math.random() * 360));
    piece.style.animationDuration = (0.7 + Math.random() * 0.4) + 's';
    document.body.appendChild(piece);
    piece.addEventListener('animationend', () => piece.remove());
  }
}

function currentRoute() { return location.hash.replace(/^#\/?/, '').split('/').filter(Boolean); }
function navigate(path) { location.hash = path; }
window.addEventListener('hashchange', render);

// App boot is gated on sign-in (see the AUTH block near the bottom of this
// script) — render() is a no-op until APP_BOOTED flips true, so a stray
// hashchange during the sign-in check can't flash the dashboard against
// empty STATE before the real account data has loaded.
let APP_BOOTED = false;
function render() {
  if (!APP_BOOTED) return;
  const parts = currentRoute();
  const section = parts[0] || 'dashboard';
  const root = document.getElementById('app');

  if (section === 'vocab' || section === 'kanji' || section === 'grammar') setAccent(section);
  else if (section === 'sentences') setAccent('sentences');
  else setAccent('vocab');

  let view;
  if (section === 'dashboard' || !section) view = viewDashboard();
  else if (section === 'vocab' || section === 'kanji' || section === 'grammar') view = viewSectionRoute(section, parts.slice(1));
  else if (section === 'sentences') view = viewSentencesRoute(parts.slice(1));
  else if (section === 'practice' && parts[1] === 'custom') view = viewCustomPracticePicker();
  else if (section === 'backup') view = viewBackupRestore();
  else if (section === 'customvocab') view = viewAddCustomVocab();
  else if (section === 'reviews') view = viewActiveReviews();
  else if (section === 'settings') view = viewSettings();
  else view = viewDashboard();

  root.innerHTML = topNav(section, parts) + view.html;
  if (view.after) view.after();
  window.scrollTo(0, 0);
}

function voiceRowHTML(gender, speaker) {
  const list = STATE.audioSettings.voices[gender];
  // empty list = "all allowed" (see enabledSpeakerPool), so every voice
  // shows as checked until the user actually unchecks one
  const checked = !list.length || list.includes(speaker.id);
  return `
    <label class="voice-row">
      <input type="checkbox" data-gender="${gender}" data-speaker-id="${speaker.id}" ${checked ? 'checked' : ''}>
      <span class="voice-name">${speaker.name}</span>

function attachSettingsHandlers() {
  document.getElementById('settingsSignOut').addEventListener('click', signOutUser);
  document.getElementById('settingsDevSkip').addEventListener('click', devSkipTime);

  document.getElementById('audioEnabledToggle').addEventListener('change', e => {
    STATE.audioSettings.enabled = e.target.checked;
    saveState();
    render();
  });

  document.querySelectorAll('#voicePickerBody input[type="checkbox"]').forEach(box => {
    box.addEventListener('change', () => {
      const gender = box.dataset.gender;
      const id = Number(box.dataset.speakerId);
      const fullIds = (gender === 'male' ? MALE_SPEAKERS : FEMALE_SPEAKERS).map(s => s.id);
      // an empty list means "all allowed" — materialize it into an
      // explicit full list before editing, otherwise unchecking one voice
      // from that implicit "all" state has nothing to splice out of
      let list = STATE.audioSettings.voices[gender].length ? STATE.audioSettings.voices[gender] : fullIds.slice();
      const idx = list.indexOf(id);
      if (box.checked && idx === -1) list.push(id);
      if (!box.checked && idx !== -1) list.splice(idx, 1);
      STATE.audioSettings.voices[gender] = list;
      saveState();
    });
  });

  document.querySelectorAll('.voice-preview-btn').forEach(btn => {
    btn.addEventListener('click', () => playPreviewVoice(Number(btn.dataset.previewSpeaker)));
  });
}

// Previews one EXACT voice, unlike playTTS (which picks a voice from the
// enabled pool by hash) — always hits the live VOICEVOX Engine directly
// since pre-generated files only store one voice per gender per word, not
// one per specific speaker.
async function playPreviewVoice(speakerId) {
  try {
    await playViaVoicevoxEngine('こんにちは、よろしくお願いします。', speakerId);
  } catch (err) {
    console.warn('Voice preview failed (VOICEVOX Engine unreachable?):', err);
    if (!playViaBrowserTTS('こんにちは、よろしくお願いします。')) {
      alert('Could not preview this voice — VOICEVOX Engine isn\'t running, and this browser has no built-in speech synthesis fallback.');
    }
  }
}

function attachCustomVocabHandlers() {
  document.getElementById('cvAddWord').addEventListener('click', () => {

        <span id="copyStatus" class="backup-status"></span>
      </div>
      <div class="backup-section">

        <textarea class="backup-textarea" id="importBox" placeholder="Paste exported JSON here"></textarea>
        <button class="wk-button" id="importBtn">Import (overwrites current progress)</button>
        <span id="importStatus" class="backup-status"></span>
      </div>
    </main>`, after: attachBackupHandlers };

function attachBackupHandlers() {
  const exportBox = document.getElementById('exportBox');
  const copyBtn = document.getElementById('copyBtn');
  const copyStatus = document.getElementById('copyStatus');
  const importBox = document.getElementById('importBox');
  const importBtn = document.getElementById('importBtn');
  const importStatus = document.getElementById('importStatus');

  exportBox.value = JSON.stringify(STATE, null, 2);

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(exportBox.value);
      copyStatus.textContent = 'Copied!';
    } catch (err) {
      // clipboard API can refuse without a secure context/permission —
      // fall back to select-and-let-the-user-Ctrl+C
      exportBox.select();
      copyStatus.textContent = 'Select-all done — press Ctrl+C (or Cmd+C) to copy.';
    }
  });

  importBtn.addEventListener('click', () => {
    let parsed;
    try {
      parsed = JSON.parse(importBox.value);
    } catch (err) {
      importStatus.textContent = 'That doesn\'t look like valid backup JSON.';
      importStatus.style.color = 'var(--color-incorrect)';
      return;
    }
    if (!parsed || typeof parsed !== 'object' || !parsed.items || typeof parsed.items !== 'object') {
      importStatus.textContent = 'That JSON is missing the expected "items" field — not a valid backup.';
      importStatus.style.color = 'var(--color-incorrect)';
      return;
    }
    STATE = Object.assign(defaultState(), parsed);
    saveState();
    importStatus.textContent = 'Imported! Reloading…';
    importStatus.style.color = 'var(--color-correct)';
    setTimeout(() => { location.hash = '#/dashboard'; render(); }, 600);
  });
}

// ---- "Review Previous" pools ----

// items introduced OR mistaken in the last 24h — the no-penalty
// "Recent" practice pool, same items the dashboard's Recent Mistakes
// widget already surfaces for the mistake half of this.
function recentPoolFor(type) {
  const cutoff = now() - 24 * 3600 * 1000;
  return contentFor(type).filter(it => {
    const r = getRecord(type, it.id);
    if (!r) return false;
    if (r.learnedAt && r.learnedAt >= cutoff) return true;
    return STATE.recentMistakes.some(m => m.type === type && m.id === it.id && m.at >= cutoff);
  });
}

function viewPracticeRecent(type) {
  const items = recentPoolFor(type);
  if (!items.length) return { html: `<main><p class="empty-state" style="margin-top:40px">Nothing learned or missed in the last 24 hours. <a href="#/${sectionBase(type)}">Back to ${SECTION_LABEL[type]}</a></p></main>` };
  quizSession = buildQuizSession(type, items, 'practice');
  return { html: renderQuizQuestion(), after: attachQuizHandlers };
}

function viewPracticeLevel(type, level) {
  const items = levelBatch(type, level).filter(it => isIntroduced(type, it.id));
  if (!items.length) return { html: `<main><p class="empty-state" style="margin-top:40px">No introduced items in Level ${level} yet. <a href="#/${sectionBase(type)}">Back to ${SECTION_LABEL[type]}</a></p></main>` };
  quizSession = buildQuizSession(type, items, 'practice');
  return { html: renderQuizQuestion(), after: attachQuizHandlers };
}

// groups items by their `level` field for picker display — items with no
// level (e.g. Duolingo vocab, which skips the leveled batches entirely)
// land in their own "No Level" bucket at the end, not mixed in with Level 1.
function groupByLevel(items) {
  const byLevel = {};
  const noLevel = [];
  items.forEach(it => {
    if (it.level == null) { noLevel.push(it); return; }
    (byLevel[it.level] = byLevel[it.level] || []).push(it);
  });
  const groups = Object.keys(byLevel).map(Number).sort((a, b) => a - b)
    .map(level => ({ label: `Level ${level}`, items: byLevel[level] }));
  if (noLevel.length) groups.push({ label: 'No Level', items: noLevel });
  return groups;
}

function attachPickerHandlers(type) {
  const checks = Array.from(document.querySelectorAll('.picker-check'));
  const countEl = document.getElementById('pickCount');
  const startBtn = document.getElementById('pickStart');
  const allBtn = document.getElementById('pickAll');
  const noneBtn = document.getElementById('pickNone');
  if (!checks.length) return;

  function updateCount() {
    const n = checks.filter(c => c.checked).length;
    countEl.textContent = `${n} selected`;
    startBtn.disabled = n === 0;
  }
  checks.forEach(c => c.addEventListener('change', () => { c.closest('.picker-tile').classList.toggle('checked', c.checked); updateCount(); }));
  if (allBtn) allBtn.addEventListener('click', () => { checks.forEach(c => { c.checked = true; c.closest('.picker-tile').classList.add('checked'); }); updateCount(); });
  if (noneBtn) noneBtn.addEventListener('click', () => { checks.forEach(c => { c.checked = false; c.closest('.picker-tile').classList.remove('checked'); }); updateCount(); });
  if (startBtn) startBtn.addEventListener('click', () => {
    const ids = checks.filter(c => c.checked).map(c => decodeURIComponent(c.value));
    const items = contentFor(type).filter(it => ids.includes(it.id));
    if (!items.length) return;
    quizSession = buildQuizSession(type, items, 'practice');
    document.getElementById('app').innerHTML = topNav(currentRoute()[0], currentRoute()) + renderQuizQuestion();
    attachQuizHandlers();
    window.scrollTo(0, 0);
  });
}
