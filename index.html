}

function practiceSession(mode) {
  const pool = availableSentences().filter(s => mode === 'translate' ? (s.acceptedTranslations && s.acceptedTranslations.length) : (s.acceptedReadings && s.acceptedReadings.length));
  return { mode, pool, index: 0, total: pool.length };
}

let sentencePractice = null;

function viewReadType() {
  sentencePractice = practiceSession('read-type');
  return { html: renderSentencePractice(), after: attachSentencePracticeHandlers };
}
function viewTranslate() {
  sentencePractice = practiceSession('translate');
  return { html: renderSentencePractice(), after: attachSentencePracticeHandlers };
}

function renderSentencePractice() {
  const { mode, pool, index, total } = sentencePractice;
  if (!total) {
    return `<main><p class="empty-state" style="margin-top:40px">No sentences available for this mode yet. <a href="#/sentences">Back to Sentences</a></p></main>`;
  }
  const s = pool[index];
  const isTranslate = mode === 'translate';
  return `
    <div class="quiz-hero" id="hero">
      <div class="quiz-hero-top">
        <a class="home" href="#/sentences" style="color:#fff;text-decoration:none">🏠</a>
        <div class="count" style="font-size:13px;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 12px">Sentence ${index + 1} of ${total}</div>
      </div>
      <div class="session-bar"><span class="done" style="width:100%"></span></div>
      ${isTranslate
        ? `<div style="font-size:12px;font-weight:700;text-transform:uppercase;opacity:.8;margin-top:22px">Translate</div><div style="font-size:26px;margin-top:8px;font-weight:500">${s.en}</div>`
        : `<div class="quiz-char" style="font-size:30px">${s.jp}</div><div style="margin-top:6px">${audioButtonsHTML(s.jp, 'background:rgba(255,255,255,.18);border-color:transparent;color:#fff')}</div>`}
    </div>
    <div class="quiz-card">
      <div class="question-label">${isTranslate ? 'Type it in Japanese' : 'Type the reading (romaji)'}</div>
      <input class="answer" id="answerInput" type="text" placeholder="${isTranslate ? 'kana/kanji or romaji' : 'romaji'}" autocomplete="off" autofocus>
      <div class="hint">${isTranslate ? 'Kana/kanji or romaji both work.' : 'Read the sentence above, then type its reading.'}</div>
      <div class="feedback-row">

        <button class="btn check" id="checkBtn">Check</button>
      </div>

        ${(s.breakdown || []).map(w => `<div class="w" data-jp="${w.jp}" data-romaji="${w.romaji}" data-tag="${w.tag}" data-explain="${(w.explain || '').replace(/"/g, '&quot;')}"><div class="jp">${w.jp}</div><div class="romaji">${w.romaji}</div></div>`).join('')}

        <div class="wd-explain" id="wdExplain"></div>
      </div>

}

function attachSentencePracticeHandlers() {
  const input = document.getElementById('answerInput');
  const checkBtn = document.getElementById('checkBtn');
  if (!input || !checkBtn) return;
  const feedback = document.getElementById('feedbackMsg');
  const hero = document.getElementById('hero');
  const lessonReviewPanel = document.getElementById('lessonReview');
  let locked = false;

  function check() {
    if (locked) return;
    const val = input.value.trim();
    if (!val) return;
    const { mode, pool, index } = sentencePractice;
    const s = pool[index];
    const accepted = mode === 'translate' ? s.acceptedTranslations : s.acceptedReadings;
    const correct = isCloseEnough(val, accepted);

    if (correct) {
      locked = true;
      input.classList.add('correct');
      hero.classList.add('state-correct');
      feedback.textContent = 'Correct!';
      feedback.className = 'feedback-msg correct';
      lessonReviewPanel.classList.remove('visible');
      burstConfetti();
      setTimeout(() => {
        sentencePractice.index = (sentencePractice.index + 1) % sentencePractice.total;
        document.getElementById('app').innerHTML = topNav('sentences', ['sentences', mode]) + renderSentencePractice();
        attachSentencePracticeHandlers();
        window.scrollTo(0, 0);
      }, 1100);
    } else {
      input.classList.remove('shake');
      void input.offsetWidth;
      input.classList.add('incorrect', 'shake');
      hero.classList.add('state-incorrect');
      feedback.textContent = 'Not quite — try again';
      feedback.className = 'feedback-msg incorrect';
      lessonReviewPanel.classList.add('visible');
      setTimeout(() => hero.classList.remove('state-incorrect'), 500);
    }
  }

  checkBtn.addEventListener('click', check);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') check();
    if (!locked) input.classList.remove('correct', 'incorrect');
  });

  const wordBreakdown = document.getElementById('wordBreakdown');
  const wordDetail = document.getElementById('wordDetail');
  if (wordBreakdown) {
    wordBreakdown.addEventListener('click', e => {
      const tile = e.target.closest('.w');
      if (!tile) return;
      const alreadyActive = tile.classList.contains('active');
      wordBreakdown.querySelectorAll('.w').forEach(w => w.classList.remove('active'));
      if (alreadyActive) { wordDetail.classList.remove('visible'); return; }
      tile.classList.add('active');
      document.getElementById('wdTag').textContent = tile.dataset.tag;
      document.getElementById('wdJp').textContent = tile.dataset.jp;
      document.getElementById('wdRomaji').textContent = tile.dataset.romaji;
      document.getElementById('wdExplain').textContent = tile.dataset.explain;
      wordDetail.classList.add('visible');
    });
  }
}

/* ======================================================================
   AUTH / CLOUD SYNC — Firebase Authentication (email+password) gates the
   whole app behind sign-in, and Firestore mirrors STATE per-account so
   progress follows you across devices/browsers, not just this one
   browser's localStorage. Uses the Firebase *compat* SDK (loaded via
   <script> tags at the top of <head>) specifically so this stays a
   single plain HTML file with no build step / npm / bundler — the
   modern modular SDK requires ES module imports and a bundler to use
   sanely, compat doesn't.

   Sync model (kept deliberately simple, per your ask):
   - On sign-in, if a cloud doc already exists for this account, it wins
     (cloud is the source of truth for cross-device sync). If there's no
     cloud doc yet (first-ever sign-in), whatever's in local storage for
     this browser gets pushed up as the starting point.
   - Every saveState() schedules a debounced push to Firestore (1s after
     the last change, so a burst of review answers is one write, not many).
   - This is last-write-wins, not real-time multi-device merge — if you
     reviewed offline on two devices before either reconnected, the one
     that syncs last overwrites the other's meanwhile-changes. Fine for
     one person on one device at a time, which covers PC+phone in
     practice, but worth knowing about.
   ====================================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyCt7D67udsc-Ki22ZUCh9wwoVf_Zn9i6tc",
  authDomain: "japanese-practice-df9bb.firebaseapp.com",
  projectId: "japanese-practice-df9bb",
  storageBucket: "japanese-practice-df9bb.firebasestorage.app",
  messagingSenderId: "506662605484",
  appId: "1:506662605484:web:434aa99803a27991e2c509",
  measurementId: "G-HFR0N7N33H"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let CURRENT_USER_EMAIL = null;
let cloudSyncTimer = null;

function scheduleCloudSync() {
  if (!CURRENT_UID) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(() => {
    db.collection('users').doc(CURRENT_UID).set(STATE).catch(err => {
      console.warn('Cloud sync failed (will retry on next save):', err.message);
    });
  }, 1000);
}

function renderAuthLoading() {
  document.getElementById('app').innerHTML = `<div class="auth-shell"><div class="auth-loading">Loading…</div></div>`;
}

function renderAuthScreen(mode, errorMsg) {
  const isSignup = mode === 'signup';
  document.getElementById('app').innerHTML = `
    <div class="auth-shell">
      <div class="auth-card">
        <h1>日本 Practice</h1>
        <p class="auth-sub">${isSignup ? 'Create an account to start syncing your progress.' : 'Sign in to pick up where you left off.'}</p>
        <div class="auth-field"><label>Email</label><input type="email" id="authEmail" autocomplete="email"></div>
        <div class="auth-field"><label>Password</label><input type="password" id="authPassword" autocomplete="${isSignup ? 'new-password' : 'current-password'}"></div>
        <div class="auth-error">${errorMsg || ''}</div>
        <button class="wk-button primary" id="authSubmit" style="width:100%">${isSignup ? 'Create account' : 'Sign in'}</button>
        <div class="auth-toggle">
          ${isSignup ? 'Already have an account? <a id="authToggle">Sign in</a>' : "New here? <a id=\"authToggle\">Create an account</a>"}
        </div>
      </div>
    </div>`;

  document.getElementById('authToggle').addEventListener('click', () => renderAuthScreen(isSignup ? 'login' : 'signup'));
  document.getElementById('authSubmit').addEventListener('click', () => {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if (!email || !password) { renderAuthScreen(mode, 'Enter an email and password.'); return; }
    const action = isSignup
      ? auth.createUserWithEmailAndPassword(email, password)
      : auth.signInWithEmailAndPassword(email, password);
    action.catch(err => renderAuthScreen(mode, err.message));
  });
}

// Fired on load, on sign-in, and on sign-out. This is the single place
// that decides what STATE is and flips the app on — nothing else reads
// STATE for real until this has run at least once.
auth.onAuthStateChanged(user => {
  clearTimeout(cloudSyncTimer);
  if (!user) {
    APP_BOOTED = false;
    CURRENT_UID = null;
    CURRENT_USER_EMAIL = null;
    renderAuthScreen('login');
    return;
  }

  CURRENT_UID = user.uid;
  CURRENT_USER_EMAIL = user.email;
  renderAuthLoading();

  db.collection('users').doc(user.uid).get()
    .then(doc => {
      const local = loadLocalState(user.uid);
      STATE = doc.exists ? Object.assign(defaultState(), doc.data()) : local;
      postLoadInit();
      APP_BOOTED = true;
      if (!location.hash || location.hash === '#/') location.hash = '#/dashboard';
      render();
      if (!doc.exists) scheduleCloudSync(); // push local progress up as the starting cloud copy
    })
    .catch(err => {
      console.warn('Could not reach cloud, using local copy:', err.message);
      STATE = loadLocalState(user.uid);
      postLoadInit();
      APP_BOOTED = true;
      if (!location.hash || location.hash === '#/') location.hash = '#/dashboard';
      render();
    });
});

// register the service worker for offline/installable support. Wrapped in
// a feature check + try/catch since this also gets opened via Live
// Preview / file:// sometimes, where serviceWorker either doesn't exist or
// refuses to register (it requires a real http(s) origin) — the app must
// keep working fine either way, this is purely additive.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('Service worker registration skipped:', err.message);
    });
  });
}
</script>
