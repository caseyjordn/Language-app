  {id:'人数',word:'人数',reading:'にんずう',altMeanings:[],meaning:'The Number Of People',readingType:`noun`,level:8,meaningMnemonic:`Person (にん) + count (ずう).`,examples:[{level:'easy',jp:'人数が多いです。',romaji:'Ninzuu ga ooi desu.',en:'There is a large number of people.'}, {level:'advanced',jp:'この会議には、正確に人数が何人参加するのか、まだ確定していない。',romaji:'Kono kaigi ni wa, seikaku ni ninzuu ga nannin sanka suru no ka, mada kakutei shite inai.',en:'It hasn\'t been confirmed yet exactly how many people will attend this meeting.'}]},
  {id:'この前',word:'この前',reading:'このまえ',altMeanings:[],meaning:'The Other Day',readingType:`noun`,level:8,meaningMnemonic:`This (この) + front (まえ).`,examples:[{level:'easy',jp:'この前会いました。',romaji:'Kono mae aimashita.',en:'I met you the other day.'}, {level:'advanced',jp:'この前の会議で決まったことを、もう一度確認しましょう。',romaji:'Kono mae no kaigi de kimatta koto o, mou ichido kakunin shimashou.',en:'Let\'s confirm once more what was decided at the meeting the other day.'}]},
  {id:'引き分け',word:'引き分け',reading:'ひきわけ',altMeanings:[],meaning:'Tie',readingType:`noun`,level:8,meaningMnemonic:`Pull (ひき) + divide (わけ).`,examples:[{level:'easy',jp:'引き分けでした。',romaji:'Hikiwake deshita.',en:'It was a tie.'}, {level:'advanced',jp:'その試合は、両チームとも譲らず引き分けに終わった。',romaji:'Sono shiai wa, ryouchiimu tomo yuzurazu hikiwake ni owatta.',en:'That match ended in a tie, with neither team giving ground.'}]},
  {id:'時間',word:'時間',reading:'じかん',altMeanings:[],meaning:'Time',readingType:`noun`,level:8,meaningMnemonic:`Time (じ) + interval (かん).`,examples:[{level:'easy',jp:'時間がありません。',romaji:'Jikan ga arimasen.',en:'There\'s no time.'}, {level:'advanced',jp:'この件については、時間をかけて慎重に検討する必要がある。',romaji:'Kono ken ni tsuite wa, jikan o kakete shinchou ni kentou suru hitsuyou ga aru.',en:'This matter needs to be carefully examined, taking time.'}]},
  {id:'答える',word:'答える',reading:'こたえる',altMeanings:[],meaning:'To Answer',readingType:`ichidan verb`,level:8,meaningMnemonic:`Answer (こた) + える.`,examples:[{level:'easy',jp:'質問に答えます。',romaji:'Shitsumon ni kotaemasu.',en:'I\'ll answer the question.'}, {level:'advanced',jp:'彼は、その質問に自信を持って答えることができた。',romaji:'Kare wa, sono shitsumon ni jishin o motte kotaeru koto ga dekita.',en:'He was able to answer that question with confidence.'}]},
  {id:'出来上がる',word:'出来上がる',reading:'できあがる',altMeanings:[],meaning:'To Be Finished',readingType:`godan verb`,level:8,meaningMnemonic:`できる + 上がる.`,examples:[{level:'easy',jp:'料理が出来上がりました。',romaji:'Ryouri ga dekiagarimashita.',en:'The meal is finished.'}, {level:'advanced',jp:'長い作業の末に、ついにその作品が出来上がった。',romaji:'Nagai sagyou no sue ni, tsui ni sono sakuhin ga dekiagatta.',en:'After a long process of work, that piece was finally completed.'}]},
  {id:'交じる',word:'交じる',reading:'まじる',altMeanings:[],meaning:'To Be Mixed',readingType:`godan verb`,level:8,meaningMnemonic:`Mix (まじ) + る.`,examples:[{level:'easy',jp:'色が交じります。',romaji:'Iro ga majirimasu.',en:'The colors mix.'}, {level:'advanced',jp:'彼の声には、かすかな緊張が交じっているように感じた。',romaji:'Kare no koe ni wa, kasuka na kinchou ga majitte iru you ni kanjita.',en:'I sensed a faint tension mixed into his voice.'}]},
  {id:'曲げる',word:'曲げる',reading:'まげる',altMeanings:[],meaning:'To Bend',readingType:`ichidan verb`,level:8,meaningMnemonic:`Music/bend (ま) + げる.`,examples:[{level:'easy',jp:'腕を曲げます。',romaji:'Ude o magemasu.',en:'I\'ll bend my arm.'}, {level:'advanced',jp:'彼女は、感情の高まりに耐えかねて、思わず顔を曲げた。',romaji:'Kanojo wa, kanjou no takamari ni taekanete, omowazu kao o mageta.',en:'Unable to bear her rising emotions, she unconsciously twisted her face.'}]},
  {id:'役に立つ',word:'役に立つ',reading:'やくにたつ',altMeanings:[],meaning:'To Be Useful',readingType:`compound phrase`,level:8,meaningMnemonic:`Service (やく) + に + stand (たつ).`,examples:[{level:'easy',jp:'役に立ちます。',romaji:'Yaku ni tachimasu.',en:'It will be useful.'}, {level:'advanced',jp:'彼の助言は、その決断を下す上で非常に役に立った。',romaji:'Kare no jogen wa, sono ketsudan o kudasu ue de hijou ni yaku ni tatta.',en:'His advice was extremely useful in making that decision.'}]},
  {id:'買う',word:'買う',reading:'かう',altMeanings:[],meaning:'To Buy',readingType:`godan verb`,level:8,meaningMnemonic:`Buy (か) + う.`,examples:[{level:'easy',jp:'これを買います。',romaji:'Kore o kaimasu.',en:'I\'ll buy this.'}, {level:'advanced',jp:'彼女は、その古いレコード店で貴重な一枚を見つけて買った。',romaji:'Kanojo wa, sono furui rekoodo-ten de kichou na ichimai o mitsukete katta.',en:'She found and bought a valuable record at that old record shop.'}]},
  {id:'化ける',word:'化ける',reading:'ばける',altMeanings:[],meaning:'To Change Form',readingType:`ichidan verb`,level:8,meaningMnemonic:`Change (ば) + ける.`,examples:[{level:'easy',jp:'姿が化けます。',romaji:'Sugata ga bakemasu.',en:'The form changes/transforms.'}, {level:'advanced',jp:'この俳優は、役ごとにまるで別人のように化けることで有名だ。',romaji:'Kono haiyuu wa, yaku goto ni marude betsujin no you ni bakeru koto de yuumei da.',en:'This actor is famous for transforming into what seems like a completely different person for each role.'}]},
  {id:'数える',word:'数える',reading:'かぞえる',altMeanings:[],meaning:'To Count',readingType:`ichidan verb`,level:8,meaningMnemonic:`Count (かぞ) + える.`,examples:[{level:'easy',jp:'数を数えます。',romaji:'Kazu o kazoemasu.',en:'I\'ll count the numbers.'}, {level:'advanced',jp:'彼は、頭の中だけで複雑な数字を数えることができる。',romaji:'Kare wa, atama no naka dake de fukuzatsu na suuji o kazoeru koto ga dekiru.',en:'He\'s able to count complex figures entirely in his head.'}]},
  {id:'見分ける',word:'見分ける',reading:'みわける',altMeanings:[],meaning:'To Distinguish',readingType:`ichidan verb`,level:8,meaningMnemonic:`See (み) + divide (わける).`,examples:[{level:'easy',jp:'違いを見分けます。',romaji:'Chigai o miwakemasu.',en:'I\'ll distinguish the difference.'}, {level:'advanced',jp:'専門家でさえ、その二つを見分けるのは難しいと言われている。',romaji:'Senmonka de sae, sono futatsu o miwakeru no wa muzukashii to iwarete iru.',en:'It\'s said that even experts find it difficult to distinguish between the two.'}]},
  {id:'対する',word:'対する',reading:'たいする',altMeanings:[],meaning:'To Face',readingType:`suru-verb`,level:8,meaningMnemonic:`Versus (たい) + する.`,examples:[{level:'easy',jp:'問題に対します。',romaji:'Mondai ni taishimasu.',en:'I\'ll face the problem.'}, {level:'advanced',jp:'彼の対応は、いつも冷静で的確だと評判だ。',romaji:'Kare no taiou wa, itsumo reisei de tekikaku da to hyouban da.',en:'His responses are reputed to always be calm and precise.'}]},
  {id:'近づく',word:'近づく',reading:'ちかづく',altMeanings:[],meaning:'To Get Close',readingType:`godan verb`,level:8,meaningMnemonic:`Near (ちか) + づく.`,examples:[{level:'easy',jp:'近づきます。',romaji:'Chikazukimasu.',en:'I\'ll get closer.'}, {level:'advanced',jp:'締め切りが近づくにつれて、彼のプレッシャーは増していった。',romaji:'Shimekiri ga chikazuku ni tsurete, kare no puressha wa mashite itta.',en:'As the deadline approached, his pressure kept increasing.'}]},
  {id:'当てる',word:'当てる',reading:'あてる',altMeanings:[],meaning:'To Guess',readingType:`ichidan verb`,level:8,meaningMnemonic:`Hit (あ) + てる.`,examples:[{level:'easy',jp:'答えを当てます。',romaji:'Kotae o atemasu.',en:'I\'ll guess the answer.'}, {level:'advanced',jp:'彼女は、驚くほど正確にその結果を当てて見せた。',romaji:'Kanojo wa, odoroku hodo seikaku ni sono kekka o atete miseta.',en:'She guessed that result with surprising accuracy.'}]},
  {id:'助ける',word:'助ける',reading:'たすける',altMeanings:[],meaning:'To Help',readingType:`ichidan verb`,level:8,meaningMnemonic:`Help (たす) + ける.`,examples:[{level:'easy',jp:'助けてください。',romaji:'Tasukete kudasai.',en:'Please help me.'}, {level:'advanced',jp:'彼の助言のおかげで、私はその難しい決断を下すことができた。',romaji:'Kare no jogen no okage de, watashi wa sono muzukashii ketsudan o kudasu koto ga dekita.',en:'Thanks to his advice, I was able to make that difficult decision.'}]},
  {id:'東京',word:'東京',reading:'とうきょう',altMeanings:[],meaning:'Tokyo',readingType:`proper noun`,level:8,meaningMnemonic:`East (とう) + capital (きょう).`,examples:[{level:'easy',jp:'東京に住んでいます。',romaji:'Toukyou ni sunde imasu.',en:'I live in Tokyo.'}, {level:'advanced',jp:'東京は、世界でも有数の巨大都市として知られている。',romaji:'Toukyou wa, sekai demo yuusuu na kyodai toshi toshite shirarete iru.',en:'Tokyo is known as one of the world\'s greatest megacities.'}]},
  {id:'住む',word:'住む',reading:'すむ',altMeanings:[],meaning:'To Live',readingType:`godan verb`,level:8,meaningMnemonic:`Dwell (す) + む.`,examples:[{level:'easy',jp:'ここに住んでいます。',romaji:'Koko ni sunde imasu.',en:'I live here.'}, {level:'advanced',jp:'この地域の住民たちは、開発計画に強く反対している。',romaji:'Kono chiiki no juumin-tachi wa, kaihatsu keikaku ni tsuyoku hantai shite iru.',en:'The residents of this area strongly oppose the development plan.'}]},
  {id:'通る',word:'通る',reading:'とおる',altMeanings:[],meaning:'To Pass Through',readingType:`godan verb`,level:8,meaningMnemonic:`Pass through (とお) + る.`,examples:[{level:'easy',jp:'ここを通ります。',romaji:'Koko o toorimasu.',en:'I\'ll pass through here.'}, {level:'advanced',jp:'この道は、朝の通勤時間帯になると通行量が急増する。',romaji:'Kono michi wa, asa no tsuukin jikantai ni naru to tsuukouryou ga kyuuzou suru.',en:'Traffic on this road increases sharply during the morning commute.'}]},
  {id:'思い出す',word:'思い出す',reading:'おもいだす',altMeanings:[],meaning:'To Remember',readingType:`godan verb`,level:8,meaningMnemonic:`Think (おもい) + out (だす).`,examples:[{level:'easy',jp:'思い出しました。',romaji:'Omoidashimashita.',en:'I remembered.'}, {level:'advanced',jp:'彼女は、その旅行を人生最高の思い出の一つだと思い出していた。',romaji:'Kanojo wa, sono ryokou o jinsei saikou no omoide no hitotsu da to omoidashite ita.',en:'She was remembering that trip as one of the best memories of her life.'}]},
  {id:'走り回る',word:'走り回る',reading:'はしりまわる',altMeanings:[],meaning:'To Run Around',readingType:`godan verb`,level:8,meaningMnemonic:`Run (はしり) + revolve (まわる).`,examples:[{level:'easy',jp:'走り回ります。',romaji:'Hashirimawarimasu.',en:'I\'ll run around.'}, {level:'advanced',jp:'子供たちは、庭を元気いっぱいに走り回っていた。',romaji:'Kodomotachi wa, niwa o genki ippai ni hashirimawatte ita.',en:'The children were running around the garden full of energy.'}]},
  {id:'話す',word:'話す',reading:'はなす',altMeanings:[],meaning:'To Speak',readingType:`godan verb`,level:8,meaningMnemonic:`Talk (はな) + す.`,examples:[{level:'easy',jp:'日本語を話します。',romaji:'Nihongo o hanashimasu.',en:'I\'ll speak Japanese.'}, {level:'advanced',jp:'彼女は、電話で長い間、旧友と話すことを楽しんでいた。',romaji:'Kanojo wa, denwa de nagai aida, kyuuyuu to hanasu koto o tanoshinde ita.',en:'She enjoyed talking with an old friend on the phone for a long time.'}]},
  {id:'支える',word:'支える',reading:'ささえる',altMeanings:[],meaning:'To Support',readingType:`ichidan verb`,level:8,meaningMnemonic:`Support (ささ) + える.`,examples:[{level:'easy',jp:'家族を支えます。',romaji:'Kazoku o sasaemasu.',en:'I\'ll support my family.'}, {level:'advanced',jp:'彼の助言のおかげで、私はその困難な時期を支えられた。',romaji:'Kare no jogen no okage de, watashi wa sono konnan na jiki o sasaerareta.',en:'Thanks to his advice, I was supported through that difficult period.'}]},
  {id:'投げる',word:'投げる',reading:'なげる',altMeanings:[],meaning:'To Throw',readingType:`ichidan verb`,level:8,meaningMnemonic:`Throw (な) + げる.`,examples:[{level:'easy',jp:'ボールを投げます。',romaji:'Booru o nagemasu.',en:'I\'ll throw the ball.'}, {level:'advanced',jp:'あの投手は、驚異的なスピードでボールを投げることで有名だ。',romaji:'Ano toushu wa, kyoui-teki na supiido de booru o nageru koto de yuumei da.',en:'That pitcher is famous for throwing the ball at phenomenal speed.'}]},
  {id:'回す',word:'回す',reading:'まわす',altMeanings:[],meaning:'To Turn Something',readingType:`godan verb`,level:8,meaningMnemonic:`Times/revolve (まわ) + す.`,examples:[{level:'easy',jp:'ハンドルを回します。',romaji:'Handoru o mawashimasu.',en:'I\'ll turn the handle.'}, {level:'advanced',jp:'彼は、その事件について話を聞くため、あちこち人を回している。',romaji:'Kare wa, sono jiken ni tsuite hanashi o kiku tame, achikochi hito o mawashite iru.',en:'He\'s going around to various people to hear about that incident.'}]},
  {id:'点ける',word:'点ける',reading:'つける',altMeanings:[],meaning:'To Turn Something On',readingType:`ichidan verb`,level:8,meaningMnemonic:`Point (つ) + ける.`,examples:[{level:'easy',jp:'電気を点けます。',romaji:'Denki o tsukemasu.',en:'I\'ll turn on the light.'}, {level:'advanced',jp:'彼女は、暗い部屋に入るとすぐに明かりを点けた。',romaji:'Kanojo wa, kurai heya ni hairu to sugu ni akari o tsuketa.',en:'As soon as she entered the dark room, she turned on the light.'}]},
  {id:'向ける',word:'向ける',reading:'むける',altMeanings:[],meaning:'To Turn Something Towards',readingType:`ichidan verb`,level:8,meaningMnemonic:`Yonder (む) + ける.`,examples:[{level:'easy',jp:'カメラを向けます。',romaji:'Kamera o mukemasu.',en:'I\'ll point the camera.'}, {level:'advanced',jp:'彼は、困難な状況にも前向きな姿勢を向け続けている。',romaji:'Kare wa, konnan na joukyou ni mo maemuki na shisei o muketsuzukete iru.',en:'He keeps directing a positive attitude even at difficult situations.'}]},
  {id:'電車',word:'電車',reading:'でんしゃ',altMeanings:[],meaning:'Train',readingType:`noun`,level:8,meaningMnemonic:`Electricity (でん) + car (しゃ).`,examples:[{level:'easy',jp:'電車に乗ります。',romaji:'Densha ni norimasu.',en:'I\'ll get on the train.'}, {level:'advanced',jp:'電車の中は、通勤時間帯でとても混んでいた。',romaji:'Densha no naka wa, tsuukin jikantai de totemo konde ita.',en:'The inside of the train was very crowded during commuting hours.'}]},
  {id:'水道',word:'水道',reading:'すいどう',altMeanings:[],meaning:'Water Supply',readingType:`noun`,level:8,meaningMnemonic:`Water (すい) + road/method (どう).`,examples:[{level:'easy',jp:'水道があります。',romaji:'Suidou ga arimasu.',en:'There is a water supply.'}, {level:'advanced',jp:'この地域は、水道インフラの老朽化が深刻な問題になっている。',romaji:'Kono chiiki wa, suidou infura no roukyuuka ga shinkoku na mondai ni natte iru.',en:'The aging water supply infrastructure has become a serious problem in this region.'}]},
  {id:'どこ',word:'どこ',reading:'どこ',altMeanings:[],meaning:'Where',readingType:`question word`,level:8,meaningMnemonic:`Kun-native demonstrative.`,examples:[{level:'easy',jp:'どこですか。',romaji:'Doko desu ka.',en:'Where is it?'}, {level:'advanced',jp:'彼が今どこにいるのか、誰も正確には把握していない。',romaji:'Kare ga ima doko ni iru no ka, dare mo seikaku ni wa haaku shite inai.',en:'No one knows exactly where he is right now.'}]},
  {id:'全身',word:'全身',reading:'ぜんしん',altMeanings:[],meaning:'Whole Body',readingType:`noun`,level:8,meaningMnemonic:`All (ぜん) + body (しん).`,examples:[{level:'easy',jp:'全身が痛いです。',romaji:'Zenshin ga itai desu.',en:'My whole body hurts.'}, {level:'advanced',jp:'彼女は、全身全霊をかけてその舞台に取り組んだ。',romaji:'Kanojo wa, zenshin zenrei o kakete sono butai ni torikunda.',en:'She devoted her whole body and soul to that stage performance.'}]},
  {id:'森',word:'森',reading:'もり',altMeanings:[],meaning:'Woods',readingType:`noun`,level:8,meaningMnemonic:`"**MOH-REE**," deep in the **FOREST**.`,examples:[{level:'easy',jp:'森があります。',romaji:'Mori ga arimasu.',en:'There is a forest.'}, {level:'advanced',jp:'彼らは、深い森の中で貴重な植物を発見したと発表した。',romaji:'Karera wa, fukai mori no naka de kichou na shokubutsu o hakken shita to happyou shita.',en:'They announced that they\'d discovered a rare plant deep in the forest.'}]},
  {id:'お前',word:'お前',reading:'おまえ',altMeanings:[],meaning:'You',readingType:`pronoun, informal`,level:8,meaningMnemonic:`Honorific + front (まえ).`,examples:[{level:'easy',jp:'お前が好きだ。',romaji:'Omae ga suki da.',en:'I like you.'}, {level:'advanced',jp:'彼は、お前は間違っていると、はっきりと指摘した。',romaji:'Kare wa, omae wa machigatte iru to, hakkiri to shiteki shita.',en:'He clearly pointed out that "you" were wrong.'}]},
  {id:'君',word:'君',reading:'きみ',altMeanings:[],meaning:'You',readingType:`pronoun`,level:8,meaningMnemonic:`On, standalone.`,examples:[{level:'easy',jp:'君が好きです。',romaji:'Kimi ga suki desu.',en:'I like you.'}, {level:'advanced',jp:'君主国と呼ばれる国々には、それぞれ独自の統治体制がある。',romaji:'Kunshukoku to yobareru kuniguni ni wa, sorezore dokuji no touchi taisei ga aru.',en:'Each of the countries called monarchies has its own unique system of governance.'}]},

  // ---- Level 9 ----
  {id:'全部',word:'全部',reading:'ぜんぶ',altMeanings:[],meaning:'All',readingType:`noun/adverb`,level:9,meaningMnemonic:`All (ぜん) + part (ぶ).`,examples:[{level:'easy',jp:'全部食べました。',romaji:'Zenbu tabemashita.',en:'I ate all of it.'}, {level:'advanced',jp:'彼は全部の資料に目を通してから、慎重に判断を下した。',romaji:'Kare wa zenbu no shiryou ni me o tooshite kara, shinchou ni handan o kudashita.',en:'He carefully made his judgment only after reviewing all the materials.'}]},
  {id:'角度',word:'角度',reading:'かくど',altMeanings:[],meaning:'Angle',readingType:`noun`,level:9,meaningMnemonic:`Angle (かく) + degree (ど).`,examples:[{level:'easy',jp:'角度を測ります。',romaji:'Kakudo o hakarimasu.',en:'I\'ll measure the angle.'}, {level:'advanced',jp:'この道の角度は、車の運転には少し急すぎる。',romaji:'Kono michi no kakudo wa, kuruma no unten ni wa sukoshi kyuusugiru.',en:'The angle of this road is a bit too steep for driving.'}]},
  {id:'発表',word:'発表',reading:'はっぴょう',altMeanings:[],meaning:'Announcement',readingType:`noun/suru-verb`,level:9,meaningMnemonic:`Departure (はつ→はっ) + express (ひょう).`,examples:[{level:'easy',jp:'発表します。',romaji:'Happyou shimasu.',en:'I\'ll make an announcement.'}, {level:'advanced',jp:'研究チームは、その分野で画期的な発見を発表した。',romaji:'Kenkyuu chiimu wa, sono bun\'ya de kakkiteki na hakken o happyou shita.',en:'The research team announced a groundbreaking discovery in that field.'}]},
  {id:'記事',word:'記事',reading:'きじ',altMeanings:[],meaning:'Article',readingType:`noun`,level:9,meaningMnemonic:`Write down (き) + occurrence (じ).`,examples:[{level:'easy',jp:'記事を読みます。',romaji:'Kiji o yomimasu.',en:'I\'ll read the article.'}, {level:'advanced',jp:'この記事には、事故当時の詳しい状況が書かれている。',romaji:'Kono kiji ni wa, jiko touji no kuwashii joukyou ga kakarete iru.',en:'This article describes in detail the situation at the time of the accident.'}]},
  {id:'仮定',word:'仮定',reading:'かてい',altMeanings:[],meaning:'Assumption',readingType:`noun/suru-verb`,level:9,meaningMnemonic:`Temporary (か) + determine (てい).`,examples:[{level:'easy',jp:'仮定します。',romaji:'Katei shimasu.',en:'I\'ll assume so.'}, {level:'advanced',jp:'この計画は、あくまで仮定に基づいたものにすぎない。',romaji:'Kono keikaku wa, akumade katei ni motozuita mono ni suginai.',en:'This plan is nothing more than something based on an assumption.'}]},
  {id:'通り',word:'通り',reading:'とおり',altMeanings:[],meaning:'Avenue',readingType:`noun`,level:9,meaningMnemonic:`Pass through (とお) + り.`,examples:[{level:'easy',jp:'通りを歩きます。',romaji:'Toori o arukimasu.',en:'I\'ll walk along the avenue.'}, {level:'advanced',jp:'この通りは、朝の通勤時間帯になるといつも混雑している。',romaji:'Kono toori wa, asa no tsuukin jikantai ni naru to itsumo konzatsu shite iru.',en:'This avenue is always crowded during the morning commute.'}]},
  {id:'美しい',word:'美しい',reading:'うつくしい',altMeanings:[],meaning:'Beautiful',readingType:`い-adjective`,level:9,meaningMnemonic:`Beauty (うつく) + しい.`,examples:[{level:'easy',jp:'美しいです。',romaji:'Utsukushii desu.',en:'It\'s beautiful.'}, {level:'advanced',jp:'山頂から見る朝日は、息をのむほど美しかった。',romaji:'Sanchou kara miru asahi wa, iki o nomu hodo utsukushikatta.',en:'The morning sun seen from the summit was breathtakingly beautiful.'}]},
  {id:'美人',word:'美人',reading:'びじん',altMeanings:[],meaning:'Beautiful Woman',readingType:`noun`,level:9,meaningMnemonic:`Beauty (び) + person (じん).`,examples:[{level:'easy',jp:'美人ですね。',romaji:'Bijin desu ne.',en:'She\'s beautiful, isn\'t she.'}, {level:'advanced',jp:'彼女は、街で評判の美人として知られている。',romaji:'Kanojo wa, machi de hyouban no bijin toshite shirarete iru.',en:'She\'s known around town as a renowned beauty.'}]},
  {id:'気を付けて',word:'気を付けて',reading:'きをつけて',altMeanings:[],meaning:'Be Careful',readingType:`phrase`,level:9,meaningMnemonic:`Energy (き) + を + attach (つけて).`,examples:[{level:'easy',jp:'気を付けてください。',romaji:'Ki o tsukete kudasai.',en:'Please be careful.'}, {level:'advanced',jp:'彼女は、道に迷わないよう気を付けて進んだ。',romaji:'Kanojo wa, michi ni mayowanai you ki o tsukete susunda.',en:'She proceeded carefully so as not to lose her way.'}]},

  {id:'泳ぎ',word:'泳ぎ',reading:'およぎ',altMeanings:[],meaning:'Swimming',readingType:`noun`,level:9,meaningMnemonic:`Swim (およ) + ぎ.`,examples:[{level:'easy',jp:'泳ぎが得意です。',romaji:'Oyogi ga tokui desu.',en:'I\'m good at swimming.'}, {level:'advanced',jp:'彼は毎朝、近くのプールで泳ぎを日課にしている。',romaji:'Kare wa maiasa, chikaku no puuru de oyogi o nikka ni shite iru.',en:'He makes swimming at a nearby pool his daily routine every morning.'}]},

  {id:'札',word:'札',reading:'ふだ',altMeanings:[],meaning:'Tag',readingType:`noun`,level:9,meaningMnemonic:`Kun-native, standalone.`,examples:[{level:'easy',jp:'名札があります。',romaji:'Nafuda ga arimasu.',en:'There is a name tag.'}, {level:'advanced',jp:'会場の入り口には、番号札を受け取る長い列ができていた。',romaji:'Kaijou no iriguchi ni wa, bangoufuda o uketoru nagai retsu ga dekite ita.',en:'A long line had formed at the venue\'s entrance to receive numbered tags.'}]},
  {id:'受験',word:'受験',reading:'じゅけん',altMeanings:[],meaning:'Taking An Exam',readingType:`noun/suru-verb`,level:9,meaningMnemonic:`Accept (じゅ) + test (けん).`,examples:[{level:'easy',jp:'受験します。',romaji:'Juken shimasu.',en:'I\'ll take the exam.'}, {level:'advanced',jp:'彼女は、来月の受験に向けて、毎日遅くまで勉強している。',romaji:'Kanojo wa, raigetsu no juken ni mukete, mainichi osoku made benkyou shite iru.',en:'She studies late every day in preparation for next month\'s exam.'}]},

  {id:'用事',word:'用事',reading:'ようじ',altMeanings:[],meaning:'Task',readingType:`noun`,level:9,meaningMnemonic:`Task (よう) + occurrence (じ).`,examples:[{level:'easy',jp:'用事があります。',romaji:'Youji ga arimasu.',en:'I have some business to attend to.'}, {level:'advanced',jp:'彼は、急な用事のため会議に出席できなくなった。',romaji:'Kare wa, kyuu na youji no tame kaigi ni shusseki dekinaku natta.',en:'He became unable to attend the meeting due to sudden business.'}]},
  {id:'教え',word:'教え',reading:'おしえ',altMeanings:[],meaning:'Teaching',readingType:`noun`,level:9,meaningMnemonic:`Teach (おし) + え.`,examples:[{level:'easy',jp:'いい教えです。',romaji:'Ii oshie desu.',en:'It\'s good teaching.'}, {level:'advanced',jp:'彼女は、母の教えを今も大切に守り続けている。',romaji:'Kanojo wa, haha no oshie o ima mo taisetsu ni mamoritsuzukete iru.',en:'She still cherishes and keeps to her mother\'s teachings.'}]},
  {id:'茶屋',word:'茶屋',reading:'ちゃや',altMeanings:[],meaning:'Tea Shop',readingType:`noun`,level:9,meaningMnemonic:`Tea (ちゃ) + shop (や).`,examples:[{level:'easy',jp:'茶屋があります。',romaji:'Chaya ga arimasu.',en:'There is a tea shop.'}, {level:'advanced',jp:'この茶屋は、地元の人々に長年愛されてきた。',romaji:'Kono chaya wa, jimoto no hitobito ni naganen aisarete kita.',en:'This tea shop has been loved by locals for many years.'}]},
  {id:'十分間',word:'十分間',reading:'じゅっぷんかん',altMeanings:[],meaning:'Ten Minutes',readingType:`noun`,level:9,meaningMnemonic:`Ten (じゅう→じゅっ) + minute (ふん→ぷん) + interval (かん).`,examples:[{level:'easy',jp:'十分間待ちます。',romaji:'Juppunkan machimasu.',en:'I\'ll wait ten minutes.'}, {level:'advanced',jp:'彼は、たった十分間の遅刻を深く謝罪した。',romaji:'Kare wa, tatta juppunkan no chikoku o fukaku shazai shita.',en:'He deeply apologized for being just ten minutes late.'}]},

  {id:'そこ',word:'そこ',reading:'そこ',altMeanings:[],meaning:'There',readingType:`demonstrative pronoun`,level:9,meaningMnemonic:`Kun-native demonstrative.`,examples:[{level:'easy',jp:'そこにあります。',romaji:'Soko ni arimasu.',en:'It\'s there.'}, {level:'advanced',jp:'そこまで話が進んでいるとは、誰も予想していなかった。',romaji:'Soko made hanashi ga susunde iru to wa, dare mo yosou shite inakatta.',en:'No one expected the discussion to have progressed that far.'}]},

  {id:'物',word:'物',reading:'もの',altMeanings:[],meaning:'Thing',readingType:`noun`,level:9,meaningMnemonic:`Kun-native, standalone.`,examples:[{level:'easy',jp:'いい物です。',romaji:'Ii mono desu.',en:'It\'s a good thing.'}, {level:'advanced',jp:'彼にとって、家族との時間こそが何よりの宝物だ。',romaji:'Kare ni totte, kazoku to no jikan koso ga nani yori no takaramono da.',en:'For him, time with his family is his greatest treasure of all.'}]},

  {id:'表す',word:'表す',reading:'あらわす',altMeanings:[],meaning:'To Express Something',readingType:`godan verb`,level:9,meaningMnemonic:`Express (あらわ) + す.`,examples:[{level:'easy',jp:'感謝を表します。',romaji:'Kansha o arawashimasu.',en:'I\'ll express my gratitude.'}, {level:'advanced',jp:'彼女は、自分の感情を言葉で表すのが少し苦手なようだ。',romaji:'Kanojo wa, jibun no kanjou o kotoba de arawasu no ga sukoshi nigate na you da.',en:'She seems a little bad at expressing her feelings in words.'}]},

  {id:'欠ける',word:'欠ける',reading:'かける',altMeanings:[],meaning:'To Get Chipped',readingType:`ichidan verb`,level:9,meaningMnemonic:`Lack (か) + ける.`,examples:[{level:'easy',jp:'皿が欠けました。',romaji:'Sara ga kakemashita.',en:'The plate got chipped.'}, {level:'advanced',jp:'彼のスピーチには、いくつか欠けている部分があるように感じた。',romaji:'Kare no supiichi ni wa, ikutsuka kakete iru bubun ga aru you ni kanjita.',en:'I felt his speech had a few missing parts.'}]},
  {id:'持つ',word:'持つ',reading:'もつ',altMeanings:[],meaning:'To Hold Something',readingType:`godan verb`,level:9,meaningMnemonic:`Hold (も) + つ.`,examples:[{level:'easy',jp:'カバンを持ちます。',romaji:'Kaban o mochimasu.',en:'I\'ll hold the bag.'}, {level:'advanced',jp:'彼は、その状況に対して独自の考えを持っているようだった。',romaji:'Kare wa, sono joukyou ni taishite dokuji no kangae o motte iru you datta.',en:'He seemed to have his own unique view on that situation.'}]},
  {id:'交わる',word:'交わる',reading:'まじわる',altMeanings:[],meaning:'To Intersect',readingType:`godan verb`,level:9,meaningMnemonic:`Mix (まじ) + わる.`,examples:[{level:'easy',jp:'道が交わります。',romaji:'Michi ga majiwarimasu.',en:'The roads intersect.'}, {level:'advanced',jp:'二つの意見が交わることで、新しい発想が生まれた。',romaji:'Futatsu no iken ga majiwaru koto de, atarashii hassou ga umareta.',en:'A new idea was born from the intersection of the two opinions.'}]},
  {id:'通す',word:'通す',reading:'とおす',altMeanings:[],meaning:'To Let Something Pass',readingType:`godan verb`,level:9,meaningMnemonic:`Pass through (とお) + す.`,examples:[{level:'easy',jp:'光を通します。',romaji:'Hikari o tooshimasu.',en:'It lets light through.'}, {level:'advanced',jp:'この道は、通す車の量を制限するために工事が行われている。',romaji:'Kono michi wa, toosu kuruma no ryou o seigen suru tame ni kouji ga okonawarete iru.',en:'Construction is being carried out on this road to limit the amount of traffic let through.'}]},

  {id:'要る',word:'要る',reading:'いる',altMeanings:[],meaning:'To Need',readingType:`godan verb`,level:9,meaningMnemonic:`Need (い) + る.`,examples:[{level:'easy',jp:'お金が要ります。',romaji:'Okane ga irimasu.',en:'I need money.'}, {level:'advanced',jp:'この提案には、いくつかの必要な修正が要ると思う。',romaji:'Kono teian ni wa, ikutsuka no hitsuyou na shuusei ga iru to omou.',en:'I think this proposal needs a few necessary revisions.'}]},
  {id:'道具',word:'道具',reading:'どうぐ',altMeanings:[],meaning:'Tool',readingType:`noun`,level:9,meaningMnemonic:`Road (どう) + tool (ぐ).`,examples:[{level:'easy',jp:'道具があります。',romaji:'Dougu ga arimasu.',en:'There is a tool.'}, {level:'advanced',jp:'彼女は、独自の道具を使って、その難問を鮮やかに解決した。',romaji:'Kanojo wa, dokuji no dougu o tsukatte, sono nanmon o azayaka ni kaiketsu shita.',en:'She brilliantly solved that difficult problem using her own tools.'}]},
  {id:'保つ',word:'保つ',reading:'たもつ',altMeanings:[],meaning:'To Preserve Something',readingType:`godan verb`,level:9,meaningMnemonic:`Preserve (たも) + つ.`,examples:[{level:'easy',jp:'健康を保ちます。',romaji:'Kenkou o tamochimasu.',en:'I\'ll maintain my health.'}, {level:'advanced',jp:'この会社は、長年にわたって高い品質を保ち続けている。',romaji:'Kono kaisha wa, naganen ni watatte takai hinshitsu o tamochitsuzukete iru.',en:'This company has continued to maintain high quality for many years.'}]},
  {id:'受け取る',word:'受け取る',reading:'うけとる',altMeanings:[],meaning:'To Receive Something',readingType:`godan verb`,level:9,meaningMnemonic:`Accept (うけ) + take (とる).`,examples:[{level:'easy',jp:'荷物を受け取ります。',romaji:'Nimotsu o uketorimasu.',en:'I\'ll receive the package.'}, {level:'advanced',jp:'彼女は、丁寧にお礼の手紙を受け取って喜んだ。',romaji:'Kanojo wa, teinei ni orei no tegami o uketotte yorokonda.',en:'She was pleased to receive the polite thank-you letter.'}]},
  {id:'受ける',word:'受ける',reading:'うける',altMeanings:[],meaning:'To Receive Something',readingType:`ichidan verb`,level:9,meaningMnemonic:`Accept (う) + ける.`,examples:[{level:'easy',jp:'試験を受けます。',romaji:'Shiken o ukemasu.',en:'I\'ll take the exam.'}, {level:'advanced',jp:'彼女は、来月の試験を受けるために、毎日遅くまで勉強している。',romaji:'Kanojo wa, raigetsu no shiken o ukeru tame ni, mainichi osoku made benkyou shite iru.',en:'She studies late every day in order to take next month\'s exam.'}]},
  {id:'返す',word:'返す',reading:'かえす',altMeanings:[],meaning:'To Return Something',readingType:`godan verb`,level:9,meaningMnemonic:`Return (かえ) + す.`,examples:[{level:'easy',jp:'本を返します。',romaji:'Hon o kaeshimasu.',en:'I\'ll return the book.'}, {level:'advanced',jp:'彼のメールに対する返事は、いつも驚くほど早く返された。',romaji:'Kare no meeru ni taisuru henji wa, itsumo odoroku hodo hayaku kaesareta.',en:'Replies to his emails were always returned surprisingly fast.'}]},
  {id:'乗る',word:'乗る',reading:'のる',altMeanings:[],meaning:'To Ride',readingType:`godan verb`,level:9,meaningMnemonic:`Ride (の) + る.`,examples:[{level:'easy',jp:'電車に乗ります。',romaji:'Densha ni norimasu.',en:'I\'ll get on the train.'}, {level:'advanced',jp:'彼は、自転車に乗って毎日通勤している。',romaji:'Kare wa, jitensha ni notte mainichi tsuukin shite iru.',en:'He commutes to work by bicycle every day.'}]},
  {id:'売る',word:'売る',reading:'うる',altMeanings:[],meaning:'To Sell Something',readingType:`godan verb`,level:9,meaningMnemonic:`Sell (う) + る.`,examples:[{level:'easy',jp:'車を売ります。',romaji:'Kuruma o urimasu.',en:'I\'ll sell the car.'}, {level:'advanced',jp:'新製品の発売は、来月に予定されている。',romaji:'Shinseihin no hatsubai wa, raigetsu ni yotei sarete iru.',en:'The launch of the new product is scheduled for next month.'}]},
  {id:'送る',word:'送る',reading:'おくる',altMeanings:[],meaning:'To Send Something',readingType:`godan verb`,level:9,meaningMnemonic:`Send (おく) + る.`,examples:[{level:'easy',jp:'手紙を送ります。',romaji:'Tegami o okurimasu.',en:'I\'ll send a letter.'}, {level:'advanced',jp:'彼女は、遠く離れた家族に、毎月荷物を送っている。',romaji:'Kanojo wa, tooku hanareta kazoku ni, maitsuki nimotsu o okutte iru.',en:'She sends packages every month to her family who lives far away.'}]},
  {id:'泳ぐ',word:'泳ぐ',reading:'およぐ',altMeanings:[],meaning:'To Swim',readingType:`godan verb`,level:9,meaningMnemonic:`Swim (およ) + ぐ.`,examples:[{level:'easy',jp:'泳ぎます。',romaji:'Oyogimasu.',en:'I\'ll swim.'}, {level:'advanced',jp:'彼は毎朝、近くのプールで泳ぐことを日課にしている。',romaji:'Kare wa maiasa, chikaku no puuru de oyogu koto o nikka ni shite iru.',en:'He makes it his daily routine to swim at a nearby pool every morning.'}]},
  {id:'試みる',word:'試みる',reading:'こころみる',altMeanings:[],meaning:'To Try To Do Something',readingType:`ichidan verb`,level:9,meaningMnemonic:`Try (こころ) + みる.`,examples:[{level:'easy',jp:'試みます。',romaji:'Kokoromimasu.',en:'I\'ll try/attempt it.'}, {level:'advanced',jp:'彼女は、新しい方法を試みることを恐れない性格だ。',romaji:'Kanojo wa, atarashii houhou o kokoromiru koto o osorenai seikaku da.',en:'She has a personality that isn\'t afraid to try new methods.'}]},

  {id:'犬',char:'犬',onyomi:'いぬ',kunyomi:null,altMeanings:[],otherReadings:['けん'],meaning:'Dog',level:2,meaningMnemonic:`The **DOG** barks "**EW, NO!**" (いぬ) at its own tail.`,examples:[{level:'easy',jp:'犬が公園を走っています。',romaji:'Inu ga kouen o hashitte imasu.',en:'The dog is running in the park.'}, {level:'advanced',jp:'迷子になった犬の飼い主を探しています。',romaji:'Maigo ni natta inu no kainushi o sagashite imasu.',en:'We\'re looking for the owner of a lost dog.'}]},
  {id:'夕',char:'夕',onyomi:'ゆう',kunyomi:null,altMeanings:['Dusk'],otherReadings:['せき'],meaning:'Evening',level:2,meaningMnemonic:`"**YOU** (ゆう) always come out at **EVENING**."`,examples:[{level:'easy',jp:'夕べは早く寝ました。',romaji:'Yuube wa hayaku nemashita.',en:'I went to bed early last night.'}, {level:'advanced',jp:'夕方になると、この通りは屋台で賑わう。',romaji:'Yuugata ni naru to, kono toori wa yatai de nigiwau.',en:'Once evening comes, this street bustles with food stalls.'}]},
  {id:'出',char:'出',onyomi:'しゅつ',kunyomi:null,altMeanings:['Leave', 'Go out', 'Appear'],otherReadings:['で', 'だ'],meaning:'Exit',level:2,meaningMnemonic:`**SHOOT** (しゅつ) straight out the **EXIT**.`,examples:[{level:'easy',jp:'出口はどこですか。',romaji:'Deguchi wa doko desu ka.',en:'Where is the exit?'}, {level:'advanced',jp:'彼は突然の質問に、何も言葉が出てこなかった。',romaji:'Kare wa totsuzen no shitsumon ni, nani mo kotoba ga dete konakatta.',en:'At the sudden question, no words came out of him at all.'}]},
  {id:'目',char:'目',onyomi:'め',kunyomi:null,altMeanings:['Item', 'Category (as in 一番目)'],otherReadings:['もく', 'ぼく'],meaning:'Eye',level:2,meaningMnemonic:`"**MAY** (め) I look at you with my wide-open **EYE**?"`,examples:[{level:'easy',jp:'目が痛いです。',romaji:'Me ga itai desu.',en:'My eyes hurt.'}, {level:'advanced',jp:'彼はいつも物事を冷静な目で見ている。',romaji:'Kare wa itsumo monogoto o reisei na me de mite iru.',en:'He always looks at things with a calm eye.'}]},
  {id:'火',char:'火',onyomi:'か',kunyomi:null,altMeanings:['Flame', 'Tuesday (in compounds)'],otherReadings:['ひ'],meaning:'Fire',level:2,meaningMnemonic:`A **CAR** (か) bursts into **FIRE**.`,examples:[{level:'easy',jp:'火が消えました。',romaji:'Hi ga kiemashita.',en:'The fire went out.'}, {level:'advanced',jp:'キャンプ場では、火の取り扱いに十分注意してください。',romaji:'Kyanpujou dewa, hi no toriatsukai ni juubun chuui shite kudasai.',en:'Please be very careful when handling fire at the campsite.'}]},
  {id:'五',char:'五',onyomi:'ご',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Five',level:2,meaningMnemonic:`"**GO** (ご) get **FIVE** more!"`,examples:[{level:'easy',jp:'五時に会いましょう。',romaji:'Goji ni aimashou.',en:'Let\'s meet at five o\'clock.'}, {level:'advanced',jp:'このチームは、五年連続で優勝している。',romaji:'Kono chiimu wa, gonen renzoku de yuushou shite iru.',en:'This team has won the championship five years in a row.'}]},
  {id:'四',char:'四',onyomi:'し',kunyomi:null,altMeanings:[],otherReadings:['よん', 'よ'],meaning:'Four',level:2,meaningMnemonic:`"**SHE** (し) counts to **FOUR**."`,examples:[{level:'easy',jp:'四月に生まれました。',romaji:'Shigatsu ni umaremashita.',en:'I was born in April.'}, {level:'advanced',jp:'四つの選択肢の中から、最も適切なものを選んでください。',romaji:'Yottsu no sentakushi no naka kara, mottomo tekisetsu na mono o erande kudasai.',en:'Please choose the most appropriate option from among the four.'}]},
  {id:'手',char:'手',onyomi:'て',kunyomi:null,altMeanings:['Method', 'Skill'],otherReadings:['しゅ'],meaning:'Hand',level:2,meaningMnemonic:`"**TAY** (て) raised her **HAND**."`,examples:[{level:'easy',jp:'手を洗ってください。',romaji:'Te o aratte kudasai.',en:'Please wash your hands.'}, {level:'advanced',jp:'この問題を解決するための良い手が思いつかない。',romaji:'Kono mondai o kaiketsu suru tame no yoi te ga omoitsukanai.',en:'I can\'t think of a good way to solve this problem.'}]},
  {id:'天',char:'天',onyomi:'てん',kunyomi:null,altMeanings:['Sky', 'Nature'],otherReadings:[],meaning:'Heaven',level:2,meaningMnemonic:`**TEN** (てん) angels sit in the **HEAVENS**.`,examples:[{level:'easy',jp:'天気がいいですね。',romaji:'Tenki ga ii desu ne.',en:'The weather is nice, isn\'t it.'}, {level:'advanced',jp:'彼は天性の才能で、周りを驚かせ続けている。',romaji:'Kare wa tensei no sainou de, mawari o odorokase tsuzukete iru.',en:'With his natural-born talent, he keeps surprising those around him.'}]},
  {id:'王',char:'王',onyomi:'おう',kunyomi:null,altMeanings:['Monarch', 'Ruler'],otherReadings:[],meaning:'King',level:2,meaningMnemonic:`"**OH!** (おう)" gasps the crowd for the **KING**.`,examples:[{level:'easy',jp:'王子と王女がいます。',romaji:'Ouji to oujo ga imasu.',en:'There is a prince and a princess.'}, {level:'advanced',jp:'その国では、王が絶対的な権力を握っている。',romaji:'Sono kuni dewa, ou ga zettaiteki na kenryoku o nigitte iru.',en:'In that country, the king holds absolute power.'}]},
  {id:'左',char:'左',onyomi:'さ',kunyomi:null,altMeanings:[],otherReadings:['ひだり'],meaning:'Left',level:2,meaningMnemonic:`"**SAH!** (さ)" steadying a tool with her **LEFT** hand.`,examples:[{level:'easy',jp:'左に曲がってください。',romaji:'Hidari ni magatte kudasai.',en:'Please turn left.'}, {level:'advanced',jp:'彼の意見は、党の左派からも右派からも批判されている。',romaji:'Kare no iken wa, tou no sahagai kara mo uhagai kara mo hihan sarete iru.',en:'His opinion is criticized by both the left and right wings of the party.'}]},
  {id:'中',char:'中',onyomi:'ちゅう',kunyomi:null,altMeanings:['Inside', 'Among', 'During'],otherReadings:['なか'],meaning:'Middle',level:2,meaningMnemonic:`**CHEW** (ちゅう) an arrow through the **MIDDLE**.`,examples:[{level:'easy',jp:'中に入ってください。',romaji:'Naka ni haitte kudasai.',en:'Please come inside.'}, {level:'advanced',jp:'会議中は、携帯電話の電源をお切りください。',romaji:'Kaigichuu wa, keitaidenwa no dengen o okiri kudasai.',en:'Please turn off your phone during the meeting.'}]},
  {id:'月',char:'月',onyomi:'げつ',kunyomi:null,altMeanings:['Month', 'Monday (in compounds)'],otherReadings:['がつ', 'つき'],meaning:'Moon',level:2,meaningMnemonic:`"**GET** (げつ) me to the **MOON**."`,examples:[{level:'easy',jp:'月がきれいです。',romaji:'Tsuki ga kirei desu.',en:'The moon is beautiful.'}, {level:'advanced',jp:'来月から、新しいプロジェクトが始まる予定です。',romaji:'Raigetsu kara, atarashii purojekuto ga hajimaru yotei desu.',en:'A new project is scheduled to start next month.'}]},
  {id:'々',char:'々',onyomi:'のま',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Repeater',level:2,meaningMnemonic:`*Not a true kanji — marks that the previous character repeats*`,examples:[{level:'easy',jp:'人々が集まっています。',romaji:'Hitobito ga atsumatte imasu.',en:'People are gathering.'}, {level:'advanced',jp:'時々、昔のことを思い出す。',romaji:'Tokidoki, mukashi no koto o omoidasu.',en:'I sometimes remember things from the past.'}]},
  {id:'田',char:'田',onyomi:'た',kunyomi:null,altMeanings:['Field'],otherReadings:['でん'],meaning:'Rice Paddy',level:2,meaningMnemonic:`"**TAH**-dah!" (た) The **RICE PADDY**.`,examples:[{level:'easy',jp:'田んぼがたくさんあります。',romaji:'Tanbo ga takusan arimasu.',en:'There are many rice paddies.'}, {level:'advanced',jp:'この村は、昔から米作りの田で有名だ。',romaji:'Kono mura wa, mukashi kara komezukuri no ta de yuumei da.',en:'This village has long been famous for its rice-growing paddies.'}]},
  {id:'右',char:'右',onyomi:'ゆう',kunyomi:null,altMeanings:[],otherReadings:['う', 'みぎ'],meaning:'Right',level:2,meaningMnemonic:`"Is that **YOU**? (ゆう)" covering mouth with **RIGHT** hand.`,examples:[{level:'easy',jp:'右に曲がってください。',romaji:'Migi ni magatte kudasai.',en:'Please turn right.'}, {level:'advanced',jp:'彼は会社の中で、社長の右腕として信頼されている。',romaji:'Kare wa kaisha no naka de, shachou no migiude toshite shinrai sarete iru.',en:'Within the company, he\'s trusted as the president\'s right-hand man.'}]},
  {id:'六',char:'六',onyomi:'ろく',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Six',level:2,meaningMnemonic:`**SIX** little **ROCK**s (ろく) stacked up.`,examples:[{level:'easy',jp:'六時に起きます。',romaji:'Rokuji ni okimasu.',en:'I wake up at six o\'clock.'}, {level:'advanced',jp:'このパズルには、六つのピースが足りない。',romaji:'Kono pazuru ni wa, muttsu no piisu ga tarinai.',en:'This puzzle is missing six pieces.'}]},
  {id:'小',char:'小',onyomi:'しょう',kunyomi:null,altMeanings:['Little', 'Minor'],otherReadings:['こ', 'お'],meaning:'Small',level:2,meaningMnemonic:`A tiny magic **SHOW** (しょう) — two **SMALL** beads.`,examples:[{level:'easy',jp:'小さい犬がいます。',romaji:'Chiisai inu ga imasu.',en:'There is a small dog.'}, {level:'advanced',jp:'小さな失敗が、後に大きな問題を引き起こすこともある。',romaji:'Chiisana shippai ga, nochi ni ookina mondai o hikiokosu koto mo aru.',en:'A small mistake can sometimes lead to a bigger problem later.'}]},
  {id:'立',char:'立',onyomi:'りつ',kunyomi:null,altMeanings:['Establish', 'Set up'],otherReadings:['りゅう', 'たつ'],meaning:'Stand',level:2,meaningMnemonic:`Check into the **RITZ** (りつ) — the doorman **STANDS** straight.`,examples:[{level:'easy',jp:'そこに立ってください。',romaji:'Soko ni tatte kudasai.',en:'Please stand there.'}, {level:'advanced',jp:'彼は若くして自分の会社を立てた。',romaji:'Kare wa wakakushite jibun no kaisha o tateta.',en:'He established his own company at a young age.'}]},
  {id:'丁',char:'丁',onyomi:'ちょう',kunyomi:null,altMeanings:['Even number', 'City block'],otherReadings:['てい'],meaning:'Street',level:2,meaningMnemonic:`"**CHO!** (ちょう)" one nail down the **STREET** sign.`,examples:[{level:'easy',jp:'この丁目に住んでいます。',romaji:'Kono choume ni sunde imasu.',en:'I live in this district.'}, {level:'advanced',jp:'ちょうど良いタイミングで彼が現れた。',romaji:'Choudo yoi taimingu de kare ga arawareta.',en:'He showed up at exactly the right moment.'}]},
  {id:'日',char:'日',onyomi:'にち',kunyomi:null,altMeanings:['Day', 'Japan (in compounds)', 'Sunday'],otherReadings:['じつ', 'ひ', 'か'],meaning:'Sun',level:2,meaningMnemonic:`The boxed-in **SUN** glows "**NEE-CHI**" (にち).`,examples:[{level:'easy',jp:'今日はいい天気です。',romaji:'Kyou wa ii tenki desu.',en:'Today the weather is nice.'}, {level:'advanced',jp:'彼女は毎日、日記をつけている。',romaji:'Kanojo wa mainichi, nikki o tsukete iru.',en:'She keeps a diary every day.'}]},
  {id:'刀',char:'刀',onyomi:'とう',kunyomi:null,altMeanings:['Blade'],otherReadings:[],meaning:'Sword',level:2,meaningMnemonic:`Watch your **TOE**! (とう) That curved **SWORD**.`,examples:[{level:'easy',jp:'これは古い刀です。',romaji:'Kore wa furui katana desu.',en:'This is an old sword.'}, {level:'advanced',jp:'博物館には、江戸時代の刀が展示されている。',romaji:'Hakubutsukan ni wa, Edo-jidai no katana ga tenji sarete iru.',en:'Swords from the Edo period are displayed at the museum.'}]},
  {id:'才',char:'才',onyomi:'さい',kunyomi:null,altMeanings:['Years old (counter)', 'Ability'],otherReadings:[],meaning:'Talent',level:2,meaningMnemonic:`A wistful **SIGH** (さい) admiring his **TALENT**.`,examples:[{level:'easy',jp:'彼は十才です。',romaji:'Kare wa jussai desu.',en:'He is ten years old.'}, {level:'advanced',jp:'彼女は幼い頃から、その分野で天才的な才能を見せていた。',romaji:'Kanojo wa osanai koro kara, sono bun\'ya de tensaiteki na sainou o misete ita.',en:'Since she was young, she\'d shown genius-level talent in that field.'}]},
  {id:'千',char:'千',onyomi:'せん',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Thousand',level:2,meaningMnemonic:`A **THOUSAND CENTS** (せん) stacked high.`,examples:[{level:'easy',jp:'千円をください。',romaji:'Sen\'en o kudasai.',en:'Please give me a thousand yen.'}, {level:'advanced',jp:'このイベントには、千人以上の人が集まった。',romaji:'Kono ibento ni wa, sennin ijou no hito ga atsumatta.',en:'More than a thousand people gathered for this event.'}]},
  {id:'木',char:'木',onyomi:'もく',kunyomi:null,altMeanings:['Wood', 'Thursday (in compounds)'],otherReadings:['ぼく', 'き'],meaning:'Tree',level:2,meaningMnemonic:`Roots dig into the **MUCK** (もく) below this **TREE**.`,examples:[{level:'easy',jp:'大きい木があります。',romaji:'Ookii ki ga arimasu.',en:'There is a big tree.'}, {level:'advanced',jp:'この家具は、すべて天然の木で作られている。',romaji:'Kono kagu wa, subete tennen no ki de tsukurarete iru.',en:'This furniture is all made from natural wood.'}]},
  {id:'水',char:'水',onyomi:'すい',kunyomi:null,altMeanings:['Wednesday (in compounds)', 'Liquid'],otherReadings:['みず'],meaning:'Water',level:2,meaningMnemonic:`**SWEET** (すい), cool **WATER** splashes out.`,examples:[{level:'easy',jp:'水を飲みます。',romaji:'Mizu o nomimasu.',en:'I\'ll drink water.'}, {level:'advanced',jp:'この地域は、水不足が深刻な問題になっている。',romaji:'Kono chiiki wa, mizubusoku ga shinkoku na mondai ni natte iru.',en:'In this area, water shortage has become a serious problem.'}]},
  {id:'白',char:'白',onyomi:'はく',kunyomi:null,altMeanings:['Blank', 'Pure', 'Innocent'],otherReadings:['びゃく', 'しろ'],meaning:'White',level:2,meaningMnemonic:`A **WHITE HAWK** (はく) glides past the sun.`,examples:[{level:'easy',jp:'白い服を着ています。',romaji:'Shiroi fuku o kite imasu.',en:'I\'m wearing white clothes.'}, {level:'advanced',jp:'彼は無実を主張し、白黒はっきりさせたいと言った。',romaji:'Kare wa mujitsu o shuchou shi, shirokuro hakkiri sasetai to itta.',en:'He claimed innocence and said he wanted to make things clear, black and white.'}]},
  {id:'文',char:'文',onyomi:'ぶん',kunyomi:null,altMeanings:['Sentence', 'Literature', 'Culture'],otherReadings:['もん'],meaning:'Writing',level:2,meaningMnemonic:`What a **BOON** (ぶん) to learn **WRITING**.`,examples:[{level:'easy',jp:'文を書きます。',romaji:'Bun o kakimasu.',en:'I\'ll write a sentence.'}, {level:'advanced',jp:'彼の文章は、いつも読みやすく整理されている。',romaji:'Kare no bunshou wa, itsumo yomiyasuku seiri sarete iru.',en:'His writing is always organized and easy to read.'}]},
  {id:'円',char:'円',onyomi:'えん',kunyomi:null,altMeanings:['Circle', 'Round'],otherReadings:[],meaning:'Yen',level:2,meaningMnemonic:`Drop a coin worth one **YEN** (えん).`,examples:[{level:'easy',jp:'千円をください。',romaji:'Sen\'en o kudasai.',en:'Please give me a thousand yen.'}, {level:'advanced',jp:'円高の影響で、輸出企業の利益が減少している。',romaji:'Endaka no eikyou de, yushutsu kigyou no rieki ga genshou shite iru.',en:'Due to the strong yen, export companies\' profits are declining.'}]},

  // ---- Level 3 ----
  {id:'矢',char:'矢',onyomi:'や',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Arrow',level:3,meaningMnemonic:`"**YAH!** (や)" the archer shouts, releasing an **ARROW**.`,examples:[{level:'easy',jp:'矢が的に当たりました。',romaji:'Ya ga mato ni atarimashita.',en:'The arrow hit the target.'}, {level:'advanced',jp:'彼の言葉は、まるで矢のように鋭く心に刺さった。',romaji:'Kare no kotoba wa, marude ya no you ni surudoku kokoro ni sasatta.',en:'His words pierced my heart, sharp as an arrow.'}]},
  {id:'明',char:'明',onyomi:'あ',kunyomi:null,altMeanings:['Clear', 'Next (as in 明日)'],otherReadings:['めい', 'みょう'],meaning:'Bright',level:3,meaningMnemonic:`"**AH!** (あ)" she gasps at how **BRIGHT** it is.`,examples:[{level:'easy',jp:'明るい部屋です。',romaji:'Akarui heya desu.',en:'It\'s a bright room.'}, {level:'advanced',jp:'彼は自分の間違いを明らかにし、素直に謝った。',romaji:'Kare wa jibun no machigai o akiraka ni shi, sunao ni ayamatta.',en:'He made his mistake clear and apologized honestly.'}]},
  {id:'市',char:'市',onyomi:'し',kunyomi:null,altMeanings:['Market'],otherReadings:['いち'],meaning:'City',level:3,meaningMnemonic:`"**SHE** (し) runs the busiest stall in the **CITY**."`,examples:[{level:'easy',jp:'この市は大きいです。',romaji:'Kono shi wa ookii desu.',en:'This city is big.'}, {level:'advanced',jp:'市の人口は、この十年で大きく変化した。',romaji:'Shi no jinkou wa, kono juunen de ookiku henka shita.',en:'The city\'s population has changed significantly over the past decade.'}]},
  {id:'牛',char:'牛',onyomi:'ぎゅう',kunyomi:null,altMeanings:['Cattle', 'Beef (in compounds)'],otherReadings:[],meaning:'Cow',level:3,meaningMnemonic:`The **COW** chews sticky **GOO** (ぎゅう).`,examples:[{level:'easy',jp:'牛が草を食べています。',romaji:'Ushi ga kusa o tabete imasu.',en:'The cow is eating grass.'}, {level:'advanced',jp:'この地域は、牛肉の生産で有名だ。',romaji:'Kono chiiki wa, gyuuniku no seisan de yuumei da.',en:'This region is famous for its beef production.'}]},
  {id:'切',char:'切',onyomi:'せつ',kunyomi:null,altMeanings:['Cutting', 'Urgent (in compounds)'],otherReadings:['きる'],meaning:'Cut',level:3,meaningMnemonic:`"**SET** (せつ) the knife down after you **CUT**."`,examples:[{level:'easy',jp:'紙を切ります。',romaji:'Kami o kirimasu.',en:'I\'ll cut the paper.'}, {level:'advanced',jp:'彼女はその提案を、大切な問題として真剣に受け止めた。',romaji:'Kanojo wa sono teian o, taisetsu na mondai to shite shinken ni uketometa.',en:'She took that proposal seriously, as an important matter.'}]},
  {id:'方',char:'方',onyomi:'ほう',kunyomi:null,altMeanings:['Way', 'Side', 'Person (polite)'],otherReadings:[],meaning:'Direction',level:3,meaningMnemonic:`"**HO!** (ほう) That **DIRECTION**!"`,examples:[{level:'easy',jp:'あちらの方に行ってください。',romaji:'Achira no hou ni itte kudasai.',en:'Please go in that direction.'}, {level:'advanced',jp:'この問題の解決方法について、みんなで話し合った。',romaji:'Kono mondai no kaiketsu houhou ni tsuite, minna de hanashiatta.',en:'We all discussed how to solve this problem together.'}]},
  {id:'戸',char:'戸',onyomi:'と',kunyomi:null,altMeanings:['Household (in compounds)'],otherReadings:[],meaning:'Door',level:3,meaningMnemonic:`Stub your **TOE** (と) on this swinging **DOOR**.`,examples:[{level:'easy',jp:'戸を閉めてください。',romaji:'To o shimete kudasai.',en:'Please close the door.'}, {level:'advanced',jp:'昔ながらの木の戸口が、この家の雰囲気を作り出している。',romaji:'Mukashinagara no ki no toguchi ga, kono ie no fun\'iki o tsukuridashite iru.',en:'The traditional wooden doorway creates this house\'s atmosphere.'}]},
  {id:'太',char:'太',onyomi:'ふと',kunyomi:null,altMeanings:['Thick', 'Bold (as in 太字)'],otherReadings:['たい'],meaning:'Fat',level:3,meaningMnemonic:`Take a **PHOTO** (ふと) of the **FAT** man.`,examples:[{level:'easy',jp:'太い線を引いてください。',romaji:'Futoi sen o hiite kudasai.',en:'Please draw a thick line.'}, {level:'advanced',jp:'彼は最近、忙しさのあまり太ってしまったと嘆いていた。',romaji:'Kare wa saikin, isogashisa no amari futotte shimatta to nageite ita.',en:'He lamented that he\'d recently gained weight from being too busy.'}]},
  {id:'父',char:'父',onyomi:'ちち',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Father',level:3,meaningMnemonic:`"**CHI-CHI!** (ちち)" calls the strict **FATHER**.`,examples:[{level:'easy',jp:'父は医者です。',romaji:'Chichi wa isha desu.',en:'My father is a doctor.'}, {level:'advanced',jp:'彼はお父さんの後を継いで、家業を始めることにした。',romaji:'Kare wa otousan no ato o tsuide, kagyou o hajimeru koto ni shita.',en:'He decided to succeed his father and take over the family business.'}]},
  {id:'少',char:'少',onyomi:'しょう',kunyomi:null,altMeanings:['Little', 'Minor', 'Young (in compounds)'],otherReadings:[],meaning:'Few',level:3,meaningMnemonic:`Only a **SHOW** (しょう) of a **FEW** drops remain.`,examples:[{level:'easy',jp:'少し待ってください。',romaji:'Sukoshi matte kudasai.',en:'Please wait a little.'}, {level:'advanced',jp:'この会社では、少ない人数で多くの仕事をこなしている。',romaji:'Kono kaisha dewa, sukunai ninzuu de ooku no shigoto o konashite iru.',en:'At this company, a small number of people handle a large amount of work.'}]},
  {id:'友',char:'友',onyomi:'ゆう',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Friend',level:3,meaningMnemonic:`"It's **YOU**! (ゆう) clasping hands with her best **FRIEND**."`,examples:[{level:'easy',jp:'友人と会います。',romaji:'Yuujin to aimasu.',en:'I\'ll meet my friend.'}, {level:'advanced',jp:'彼女とは、学生時代からの長い友人関係が続いている。',romaji:'Kanojo to wa, gakuseijidai kara no nagai yuujin kankei ga tsuzuite iru.',en:'Our long friendship has continued since our student days.'}]},
  {id:'毛',char:'毛',onyomi:'もう',kunyomi:null,altMeanings:['Hair', 'Wool (in compounds)'],otherReadings:[],meaning:'Fur',level:3,meaningMnemonic:`**MOW** (もう) through this curling **FUR**.`,examples:[{level:'easy',jp:'猫の毛は柔らかいです。',romaji:'Neko no ke wa yawarakai desu.',en:'The cat\'s fur is soft.'}, {level:'advanced',jp:'このセーターは、上質な羊毛で編まれている。',romaji:'Kono seetaa wa, joushitsu na youmou de amarete iru.',en:'This sweater is knitted from high-quality wool.'}]},
  {id:'半',char:'半',onyomi:'はん',kunyomi:null,altMeanings:['Semi-', 'Middle (of a period)'],otherReadings:[],meaning:'Half',level:3,meaningMnemonic:`"**HON** (はん), you only get **HALF**."`,examples:[{level:'easy',jp:'半分食べました。',romaji:'Hanbun tabemashita.',en:'I ate half.'}, {level:'advanced',jp:'会議は二時半に始まる予定です。',romaji:'Kaigi wa nijihan ni hajimaru yotei desu.',en:'The meeting is scheduled to start at two thirty.'}]},
  {id:'心',char:'心',onyomi:'しん',kunyomi:null,altMeanings:['Mind', 'Spirit', 'Center'],otherReadings:[],meaning:'Heart',level:3,meaningMnemonic:`A glossy **SHEEN** (しん) coats this little **HEART**.`,examples:[{level:'easy',jp:'心が痛いです。',romaji:'Kokoro ga itai desu.',en:'My heart aches.'}, {level:'advanced',jp:'彼の心強い言葉に、みんなが勇気づけられた。',romaji:'Kare no kokorozuyoi kotoba ni, minna ga yuukizukerareta.',en:'Everyone was encouraged by his reassuring words.'}]},
  {id:'字',char:'字',onyomi:'じ',kunyomi:null,altMeanings:['Character', 'Handwriting'],otherReadings:[],meaning:'Letter',level:3,meaningMnemonic:`"**Gee**" (じ), tracing his first **LETTER**.`,examples:[{level:'easy',jp:'字が上手ですね。',romaji:'Ji ga jouzu desu ne.',en:'Your handwriting is good, isn\'t it.'}, {level:'advanced',jp:'彼の文字は、まるで印刷したように整っている。',romaji:'Kare no moji wa, marude insatsu shita you ni totonotte iru.',en:'His handwriting is as neat as if it were printed.'}]},
  {id:'生',char:'生',onyomi:'せい',kunyomi:null,altMeanings:['Birth', 'Raw', 'Student (in compounds)'],otherReadings:['しょう', 'なま', 'いきる'],meaning:'Life',level:3,meaningMnemonic:`"**SAY** (せい) hello to new **LIFE**."`,examples:[{level:'easy',jp:'学生です。',romaji:'Gakusei desu.',en:'I am a student.'}, {level:'advanced',jp:'彼女は困難な人生を乗り越え、強く生きてきた。',romaji:'Kanojo wa konnan na jinsei o norikoe, tsuyoku ikite kita.',en:'She\'s overcome a difficult life and lived on strongly.'}]},
  {id:'台',char:'台',onyomi:'だい',kunyomi:null,altMeanings:['Platform', 'Stand', 'Counter for machines'],otherReadings:['たい (as in 舞台 stage)'],meaning:'Machine',level:3,meaningMnemonic:`Roll the **DIE** (だい) on this sturdy **MACHINE**.`,examples:[{level:'easy',jp:'車が一台あります。',romaji:'Kuruma ga ichidai arimasu.',en:'There is one car.'}, {level:'advanced',jp:'舞台の上で、彼女は堂々とスピーチをした。',romaji:'Butai no ue de, kanojo wa doudou to supiichi o shita.',en:'On the stage, she gave a confident speech.'}]},
  {id:'母',char:'母',onyomi:'はは',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Mother',level:3,meaningMnemonic:`"**HAHA**! (はは)" laughs **MOTHER**.`,examples:[{level:'easy',jp:'母は先生です。',romaji:'Haha wa sensei desu.',en:'My mother is a teacher.'}, {level:'advanced',jp:'彼はお母さんに毎週電話をかけている。',romaji:'Kare wa okaasan ni maishuu denwa o kakete iru.',en:'He calls his mother every week.'}]},
  {id:'午',char:'午',onyomi:'ご',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Noon',level:3,meaningMnemonic:`"**GO** (ご) eat, it's **NOON**!"`,examples:[{level:'easy',jp:'午後に会いましょう。',romaji:'Gogo ni aimashou.',en:'Let\'s meet in the afternoon.'}, {level:'advanced',jp:'午前中に、その報告書を提出しなければならない。',romaji:'Gozenchuu ni, sono houkokusho o teishutsu shinakereba naranai.',en:'I have to submit that report by the morning.'}]},
  {id:'北',char:'北',onyomi:'きた',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'North',level:3,meaningMnemonic:`A **CHEETAH** (きた) races **NORTH**.`,examples:[{level:'easy',jp:'北はどこですか。',romaji:'Kita wa doko desu ka.',en:'Where is north?'}, {level:'advanced',jp:'彼らは北国の厳しい冬を乗り越えて暮らしている。',romaji:'Karera wa kitaguni no kibishii fuyu o norikoete kurashite iru.',en:'They live through the harsh winters of the northern country.'}]},
  {id:'今',char:'今',onyomi:'こん',kunyomi:null,altMeanings:['Present', 'This (as in 今月)'],otherReadings:['いま'],meaning:'Now',level:3,meaningMnemonic:`The **CON** (こん) artist ducks under the lid **NOW**.`,examples:[{level:'easy',jp:'今、外にいます。',romaji:'Ima, soto ni imasu.',en:'I\'m outside right now.'}, {level:'advanced',jp:'今回のプロジェクトは、今までで最も難しい挑戦だった。',romaji:'Konkai no purojekuto wa, ima made de mottomo muzukashii chousen datta.',en:'This time\'s project was the most difficult challenge yet.'}]},
  {id:'古',char:'古',onyomi:'こ',kunyomi:null,altMeanings:['Ancient', 'Used'],otherReadings:[],meaning:'Old',level:3,meaningMnemonic:`"**CO**-worker" (こ), that's an **OLD** story.`,examples:[{level:'easy',jp:'古い本があります。',romaji:'Furui hon ga arimasu.',en:'There is an old book.'}, {level:'advanced',jp:'この寺は、古来から地域の人々に大切にされてきた。',romaji:'Kono tera wa, korai kara chiiki no hitobito ni taisetsu ni sarete kita.',en:'This temple has been cherished by the local people since ancient times.'}]},
  {id:'外',char:'外',onyomi:'がい',kunyomi:null,altMeanings:['Foreign', 'Other'],otherReadings:['そと'],meaning:'Outside',level:3,meaningMnemonic:`That **GUY** (がい) stepped **OUTSIDE**.`,examples:[{level:'easy',jp:'外は寒いです。',romaji:'Soto wa samui desu.',en:'It\'s cold outside.'}, {level:'advanced',jp:'彼は海外で長年働いた経験を持っている。',romaji:'Kare wa kaigai de naganen hataraita keiken o motte iru.',en:'He has years of experience working overseas.'}]},
  {id:'分',char:'分',onyomi:'ぶん',kunyomi:null,altMeanings:['Minute', 'Understand (as in 分かる)', 'Portion'],otherReadings:['ふん', 'ぶ'],meaning:'Part',level:3,meaningMnemonic:`What a **BOON** (ぶん) — split into two **PART**s.`,examples:[{level:'easy',jp:'半分あげます。',romaji:'Hanbun agemasu.',en:'I\'ll give you half.'}, {level:'advanced',jp:'彼の気持ちは、なんとなく分かる気がする。',romaji:'Kare no kimochi wa, nantonaku wakaru ki ga suru.',en:'I feel like I somewhat understand how he feels.'}]},
  {id:'引',char:'引',onyomi:'ひ',kunyomi:null,altMeanings:['Draw', 'Subtract (in math)'],otherReadings:[],meaning:'Pull',level:3,meaningMnemonic:`"**HE** (ひ) can really **PULL** that bowstring back."`,examples:[{level:'easy',jp:'ドアを引いてください。',romaji:'Doa o hiite kudasai.',en:'Please pull the door.'}, {level:'advanced',jp:'彼女は、その場の空気を一気に引き締めた。',romaji:'Kanojo wa, sono ba no kuuki o ikki ni hikishimeta.',en:'She instantly tightened the atmosphere of the room.'}]},
  {id:'止',char:'止',onyomi:'し',kunyomi:null,altMeanings:['Halt', 'Prevent'],otherReadings:['とまる'],meaning:'Stop',level:3,meaningMnemonic:`"**SHE** (し) plants her foot and comes to a dead **STOP**."`,examples:[{level:'easy',jp:'ここで止まってください。',romaji:'Koko de tomatte kudasai.',en:'Please stop here.'}, {level:'advanced',jp:'医者は、彼にたばこを止めるよう強く勧めた。',romaji:'Isha wa, kare ni tabako o yameru you tsuyoku susumeta.',en:'The doctor strongly urged him to quit smoking.'}]},
  {id:'用',char:'用',onyomi:'よう',kunyomi:null,altMeanings:['Use', 'Business', 'Errand'],otherReadings:[],meaning:'Task',level:3,meaningMnemonic:`"**YO** (よう), finish this **TASK**."`,examples:[{level:'easy',jp:'用があります。',romaji:'You ga arimasu.',en:'I have some business to attend to.'}, {level:'advanced',jp:'この道具は、様々な場面で用いることができる。',romaji:'Kono dougu wa, samazama na bamen de mochiiru koto ga dekiru.',en:'This tool can be used in a variety of situations.'}]},
  {id:'万',char:'万',onyomi:'まん',kunyomi:null,altMeanings:['Myriad', 'All (in compounds)'],otherReadings:[],meaning:'Ten Thousand',level:3,meaningMnemonic:`**MON**ey (まん) piles up by the **TEN THOUSAND**.`,examples:[{level:'easy',jp:'一万円あります。',romaji:'Ichiman\'en arimasu.',en:'I have ten thousand yen.'}, {level:'advanced',jp:'万が一のために、保険に入っておいた方がいい。',romaji:'Man ga ichi no tame ni, hoken ni haitte oita hou ga ii.',en:'For that one-in-ten-thousand chance, it\'s better to have insurance.'}]},
  {id:'広',char:'広',onyomi:'ひろ',kunyomi:null,altMeanings:['Spacious', 'Broad'],otherReadings:[],meaning:'Wide',level:3,meaningMnemonic:`The **HERO** (ひろ) needed a **WIDE** roof.`,examples:[{level:'easy',jp:'広い部屋です。',romaji:'Hiroi heya desu.',en:'It\'s a spacious room.'}, {level:'advanced',jp:'そのニュースは、あっという間に広がった。',romaji:'Sono nyuusu wa, atto iu ma ni hirogatta.',en:'That news spread in an instant.'}]},
  {id:'冬',char:'冬',onyomi:'ふゆ',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Winter',level:3,meaningMnemonic:`"**PHEW**, (ふゆ) it's cold!" **WINTER**'s here.`,examples:[{level:'easy',jp:'冬は寒いです。',romaji:'Fuyu wa samui desu.',en:'Winter is cold.'}, {level:'advanced',jp:'彼らは厳しい冬休みの間、スキー場で働いていた。',romaji:'Karera wa kibishii fuyuyasumi no aida, sukiijou de hataraite ita.',en:'They worked at a ski resort during the harsh winter break.'}]},
