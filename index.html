<!--
  Japanese Practice — functional app shell.

  This is the real app going forward (successor to japanese-practice_
  OLDAPP.html), not a wireframe. No sample vocab/kanji/grammar/sentences
  are included on purpose — you're adding real content yourself. Look for
  the CONTENT DATA block near the top of the <script>: it's four empty
  arrays (VOCAB, KANJI, GRAMMAR, SENTENCES) with the exact object shape
  documented in a comment above each one. Paste real entries in that shape
  and everything else — lessons, reviews, leveling, the Sentences gating —
  works against whatever's there. Empty arrays are fine; every screen has
  a "nothing here yet" state instead of breaking.

  Scope, per your last message: Vocab, Kanji, and Sentences (with Grammar
  nested inside Sentences) are real and functional. Speaking and Photos
  are intentionally left out of the nav — not stubbed, just absent — since
  you said to hold off on those.

  Architecture notes:
  - Single file, no build step, state in localStorage — same convention
    as the old app, and keeps the PWA/offline path open later.
  - Vocab, Kanji, and Grammar all run on one generic "SRS section" engine
    (same lesson/review/level code, parameterized by type) rather than
    three separate copies — that's what let Grammar reuse the Vocab
    lesson/review pattern directly, per your ask.
  - SRS math matches your WaniKani writeup exactly: 8-stage ladder with
    the real hour intervals, the double-penalty-at-Guru+ demotion formula,
    Burned items dropping out of review. A DEV-ONLY "+24h" button in the
    nav lets you fast-forward the clock to actually test review timing
    without waiting real hours — remove it before this ships for real use,
    it's a testing aid, not a feature.
  - Sentences only serves sentences whose every tagged vocab/kanji/grammar
    id has been INTRODUCED (any SRS stage, not necessarily mastered) —
    that's the "reflect only the grammar I've learned" gating. A sentence
    that references content you haven't started yet simply won't appear.
  - Word-by-word sentence breakdowns (for the wrong-answer review panel)
    are NOT auto-generated — there's no real segmentation/parsing here.
    Each SENTENCES entry needs its own manually-written `breakdown` array,
    same as the wireframes did.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Japanese Practice</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-apple-touch.png">
<meta name="theme-color" content="#AA00FF">
<!-- iOS ignores the web manifest for "Add to Home Screen" — these meta
     tags are what actually make it open full-screen (no Safari chrome)
     and use the icon above once added from iOS Safari's share sheet. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日本語">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --color-widget-background:#FFFFFF;
    --color-widget-border:#CAD0D6;
    --color-widget-primary-text:#333333;
    --color-widget-secondary-text:#6B7079;
    --color-widget-divider:#CAD0D6;
    --color-page-background:#F4F4F4;
    --color-locked-bg:#E7E9EB;
    --color-correct:#35A753;
    --color-incorrect:#E01F14;
    --border-radius-tight:4px;
    --border-radius-normal:8px;
    --border-radius-widget:16px;
    --border-radius-pill:9999px;
    --font-family-default:"Noto Sans","Noto Sans JP","Noto Sans SC",sans-serif;
    /* per-section accent, swapped by JS via setAccent(type) */
    --accent:#AA00FF;
    --accent-dark:#8600B9;
    --accent-light:#EDC8FF;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--color-page-background);font-family:var(--font-family-default);font-weight:350;color:var(--color-widget-primary-text);min-height:100vh}
  a{color:inherit}

  /* ---------- top nav ---------- */
  /* padding-top uses the safe-area inset so this sits below the iPhone
     notch/dynamic island when installed as a standalone full-screen PWA
     (viewport-fit=cover above is what makes env() have a real value) */
  .topnav{
    display:flex;align-items:center;gap:16px;
    padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));
    background:#fff;border-bottom:1px solid var(--color-widget-divider);
  }
  .wordmark{font-size:18px;font-weight:700;display:flex;gap:2px;white-space:nowrap;text-decoration:none;flex:none}
  .wordmark .jp{color:#FF00AA} .wordmark .dot{color:#00AAFF} .wordmark .en{color:#AA00FF}
  /* BUG FIX: this used to be a plain flex row with no wrap/scroll handling
     — "Dashboard / Vocab / Sentences / Kanji" plus the wordmark, icons,
     and dev button don't fit on an iPhone-width screen, which either
     clipped nav items or forced the entire page to scroll sideways.
     Scrolling just the nav strip itself keeps the rest of the page from
     ever needing horizontal scroll. */
  .navlinks{display:flex;gap:16px;flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .navlinks::-webkit-scrollbar{display:none}
  .navlinks a{text-decoration:none;font-weight:500;font-size:14px;padding:6px 2px;border-bottom:2px solid transparent;color:var(--color-widget-primary-text);white-space:nowrap;flex:none}
  .navlinks a.active{border-bottom-color:var(--accent)}
  .navright{display:flex;align-items:center;gap:8px;flex:none}
  .dev-btn{
    font-size:11px;font-weight:700;color:#8A6D1F;background:#FFF7E6;border:1px dashed #E0BE6A;
    border-radius:var(--border-radius-pill);padding:5px 8px;cursor:pointer;flex:none;
  }
  .settings-btn{
    display:flex;align-items:center;justify-content:center;width:34px;height:34px;font-size:17px;
    text-decoration:none;color:var(--color-widget-primary-text);border-radius:50%;flex:none;
  }
  .settings-btn:hover,.settings-btn.active{background:var(--accent-light)}
  @media (max-width:480px){
    .wordmark .en{display:none} /* "日本・" is enough branding at this width, "Practice" just eats space */
    .dev-btn{padding:5px 6px;font-size:10px}
  }

  main{max-width:1000px;margin:0 auto;padding:16px 16px 60px}

  /* ---------- dashboard ---------- */
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-bottom:16px}
  .col-6{grid-column:span 6} .col-12{grid-column:span 12}
  @media (max-width:700px){ .grid > *{grid-column:span 12 !important} }
  .section-card{
    background:#fff;border:1px solid var(--color-widget-border);border-radius:var(--border-radius-widget);
    padding:16px;display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;
  }
  .section-chip{width:40px;height:40px;border-radius:var(--border-radius-normal);display:flex;align-items:center;justify-content:center;flex:none;color:#fff;font-family:"Noto Sans JP",sans-serif;font-size:18px}
  .section-body{flex:1;min-width:0}
  .section-name{font-size:16px;font-weight:700}
  .section-stat{font-size:11px;color:var(--color-widget-secondary-text);margin-top:2px}
  .progress-track{height:6px;background:var(--color-locked-bg);border-radius:4px;margin-top:8px;overflow:hidden}
  .progress-fill{height:100%;border-radius:4px}
  .chevron{color:var(--color-widget-secondary-text);font-size:18px;flex:none}

  .mistakes-widget{background:#fff;border:1px solid var(--color-widget-border);border-radius:var(--border-radius-widget);padding:16px 24px}
  .widget-title-row{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
  .widget-title-row .title{font-size:18px;font-weight:700}
  .wk-text{font-size:14px;color:var(--color-widget-secondary-text);margin:0 0 12px}
  .count-bubble{display:inline-flex;align-items:center;justify-content:center;background:#6B7079;color:#fff;border-radius:var(--border-radius-pill);font-size:14px;font-weight:700;padding:1px 10px;min-width:22px}
  .tilerow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tile{width:44px;height:44px;border-radius:var(--border-radius-normal);display:flex;align-items:center;justify-content:center;color:#fff;font-family:"Noto Sans JP",sans-serif;font-size:15px}
  .empty-state{font-size:13px;color:var(--color-widget-secondary-text);font-style:italic;padding:8px 0}

  .wk-button{border:1px solid var(--color-widget-border);background:#fff;border-radius:var(--border-radius-normal);padding:8px 16px;font-size:13px;font-weight:700;color:var(--color-widget-primary-text);cursor:pointer;text-decoration:none;display:inline-block}
  .wk-button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .wk-button:disabled{opacity:.4;cursor:default}

  /* ---------- section main (vocab/kanji/grammar) ---------- */
  .page-header{display:flex;align-items:center;justify-content:space-between;padding:24px 0 0}
  .page-header h1{font-size:24px;font-weight:700;margin:0;display:flex;align-items:center;gap:10px}
  .page-header h1 .chip{width:30px;height:30px;border-radius:var(--border-radius-normal);background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans JP",sans-serif;font-size:15px}
  .library-link{font-size:14px;font-weight:600;color:var(--accent-dark);text-decoration:none}

  .levelup-banner{background:var(--accent);color:#fff;border-radius:var(--border-radius-widget);padding:18px 24px;margin-top:24px;display:flex;align-items:center;justify-content:space-between}
  .levelup-banner .msg{font-size:18px;font-weight:700}
  .levelup-banner .sub{font-size:11px;opacity:.85;margin-top:2px}
  .levelup-banner .dismiss{background:rgba(255,255,255,.2);border:none;color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer}

  .level-widget{background:#fff;border:1px solid var(--color-widget-border);border-radius:var(--border-radius-widget);padding:16px 24px;margin:16px 0}
  .level-widget-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .level-widget-head .title{font-size:18px;font-weight:700}
  .level-nav{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--color-widget-secondary-text)}
  .level-nav button{background:none;border:none;font-size:14px;color:var(--color-widget-secondary-text);cursor:pointer}
  .progress-track2{height:10px;background:#E7E9EB;border-radius:4px;overflow:hidden;margin-bottom:8px}
  .progress-fill2{height:100%;background:var(--accent);border-radius:4px}
  .level-pips{display:flex;gap:3px;margin-bottom:4px}
  .level-pips span{flex:1;height:6px;border-radius:2px;background:var(--color-locked-bg)}
  .level-pips span.done{background:var(--accent)}
  .level-footnote{font-size:11px;color:var(--color-widget-secondary-text)}

  .dash-level-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--color-widget-divider)}
  .dash-level-row:first-of-type{border-top:none}
  .type-chip{width:32px;height:32px;border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans JP",sans-serif;font-size:15px;flex:none}
  .dash-level-info{flex:1;min-width:0}
  .dash-level-title{font-size:13px;font-weight:700;margin-bottom:4px}
  .dash-level-count{font-size:15px;font-weight:700;text-align:right;flex:none}
  .dash-level-count span{display:block;font-size:10px;font-weight:500;color:var(--color-widget-secondary-text)}

  .spread-header{display:grid;grid-template-columns:1fr 60px 60px;font-size:11px;font-weight:700;text-align:center;margin-bottom:4px}
  .spread-header div:first-child{text-align:left}
  .spread-row{display:grid;grid-template-columns:1fr 60px 60px;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--color-widget-divider)}
  .spread-row:first-of-type{border-top:none}
  .spread-label{font-size:12px}
  .spread-count{color:#fff;border-radius:999px;font-size:12px;font-weight:700;text-align:center;padding:2px 0;margin:0 auto;width:36px}

  .lr-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
  @media (max-width:600px){ .lr-row{grid-template-columns:1fr} }
  .lr-widget{background:#fff;border:1px solid var(--color-widget-border);border-radius:var(--border-radius-widget);padding:16px 24px}

  .batch-size-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-widget-secondary-text);margin-bottom:10px}
  .batch-btn{width:22px;height:22px;border-radius:50%;border:1px solid var(--color-widget-border);background:#fff;cursor:pointer;font-size:14px;line-height:1;padding:0}
  #batchSizeDisplay{font-weight:700;color:var(--color-widget-primary-text);min-width:16px;text-align:center}

  .practice-options{display:flex;flex-direction:column;gap:10px}
  .practice-option{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--color-widget-divider);font-size:13px}
  .practice-option:first-child{border-top:none}
  /* font-size must be >=16px: below that, iOS Safari auto-zooms the whole
     page in when this is tapped/focused — not a style choice, a real
     platform behavior for any text input/select under 16px */
  .level-select{border:1px solid var(--color-widget-border);border-radius:8px;padding:6px 8px;font-size:16px;margin-right:6px}

  .picker-toolbar{display:flex;gap:10px;margin-bottom:14px}
  .picker-level-label{font-size:13px;font-weight:700;margin:0 0 8px;padding-top:6px}
  .picker-level-count{font-weight:500;color:var(--color-widget-secondary-text)}
  .category-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .category-tab{border:2px solid var(--color-widget-border);background:#fff;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;color:var(--color-widget-secondary-text);cursor:pointer}
  .category-tab.active{background:#fff}

  .backup-section{background:#fff;border:1px solid var(--color-widget-border);border-radius:16px;padding:20px 24px;margin-bottom:16px}
  .backup-section h2{font-size:18px;margin:0 0 6px}
  /* font-size 16px minimum — same iOS auto-zoom reason as .level-select */
  .backup-textarea{width:100%;min-height:140px;font-family:monospace;font-size:16px;border:1px solid var(--color-widget-border);border-radius:8px;padding:10px;margin:10px 0;resize:vertical}
  .backup-status{margin-left:10px;font-size:12px;color:var(--color-widget-secondary-text)}
  .picker-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(110px,1fr));gap:10px;padding-bottom:60px}
  .picker-tile{position:relative;border:1px solid var(--color-widget-border);border-radius:var(--border-radius-normal);padding:10px 8px;text-align:center;cursor:pointer;background:#fff}
  .picker-tile:has(.picker-check:checked){border-color:var(--accent);background:var(--accent-light)}
  .picker-tile.checked{border-color:var(--accent);background:var(--accent-light)}
  .picker-check{position:absolute;top:6px;right:6px}
  .picker-tile .word{font-family:"Noto Sans JP",sans-serif;font-size:18px}
  .picker-tile .reading{font-size:11px;color:var(--color-widget-secondary-text)}

  /* ---------- library ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff;border-bottom:1px solid var(--color-widget-divider)}
  .back-link{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--color-widget-primary-text);font-weight:500;font-size:14px}
  .section-title{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700}
  .section-title .chip{width:26px;height:26px;border-radius:4px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans JP",sans-serif;font-size:13px}
  .tile-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));gap:10px}
  .vtile{border-radius:var(--border-radius-normal);padding:10px 6px 9px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;background:var(--accent)}
  .vtile .word{font-family:"Noto Sans JP",sans-serif;font-size:20px;font-weight:500;line-height:1.2;color:#fff}
  .vtile .reading{font-family:"Noto Sans JP",sans-serif;font-size:12px;color:#fff}
  .vtile .meaning{font-size:11px;color:var(--accent-light)}

  /* ---------- lesson (single scroll + anchor tabs) ---------- */
  html{scroll-behavior:smooth}
  .hero{position:relative;padding:18px 24px 30px;text-align:center;color:#fff;background:var(--accent)}
  .hero-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;max-width:820px;margin:0 auto}
  .hero-top .home{text-decoration:none;color:#fff;opacity:.9}
  .hero-top .counts{display:flex;gap:10px;font-size:12px}
  .hero-top .counts span{background:rgba(255,255,255,.18);border-radius:var(--border-radius-pill);padding:2px 9px}
  .hero .char{font-family:"Noto Sans JP",sans-serif;font-size:56px;line-height:1;margin:14px 0 4px}
  .hero .meaning{font-size:20px;font-weight:500}
  .tabbar{background:#2C2E35;display:flex;justify-content:center;gap:28px;padding:12px 0;position:sticky;top:0;z-index:10;flex-wrap:wrap}
  .tabbar a{color:#8A8D97;font-size:14px;font-weight:600;text-decoration:none}
  .tabbar a:hover{color:#fff}
  .lesson-main{max-width:820px;margin:0 auto;padding:0 24px 140px}
  .lesson-section{background:#fff;margin-top:20px;padding:26px 40px;border-radius:12px;scroll-margin-top:56px}
  .lesson-section h2{font-size:22px;font-weight:400;margin:0 0 14px;border-bottom:1px solid #eee;padding-bottom:12px}
  .mnemonic-label{font-size:14px;font-weight:700;color:var(--accent-dark);text-transform:uppercase;letter-spacing:.03em;margin:22px 0 8px}
  .field-row{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:10px}
  .field .k{font-size:12px;color:var(--color-widget-secondary-text);margin-bottom:2px}
  .field .v{font-size:16px} .field .v.primary{font-weight:700}
  .field .v.jp-field{font-family:"Noto Sans JP",sans-serif;font-size:20px}
  .prose{font-size:15px;line-height:1.7}
  .prose .hl{background:var(--accent-light);color:var(--accent-dark);padding:0 4px;border-radius:3px}
  .reading-row{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
  .reading-jp{font-family:"Noto Sans JP",sans-serif;font-size:24px}
  .audio-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--color-widget-border);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--color-widget-primary-text);cursor:pointer}
  .audio-btn:hover{background:#F4F4F4}
  /* padding-bottom includes the safe-area inset so these buttons clear the
     iPhone home-indicator bar when installed as a standalone full-screen
     app, instead of sitting half-behind it */
  .session-footer{
    position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--color-widget-border);
    padding:14px 24px;padding-bottom:calc(14px + env(safe-area-inset-bottom));
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
  }

  /* ---------- review / quiz ---------- */
  .quiz-hero{background:var(--accent);color:#fff;padding:16px 20px 40px;text-align:center;transition:background .2s ease}
  .quiz-hero.state-correct{background:var(--color-correct)}
  .quiz-hero.state-incorrect{background:var(--color-incorrect)}
  .quiz-hero-top{display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:0 auto 18px}
  .session-bar{display:flex;gap:2px;max-width:640px;margin:0 auto}
  .session-bar span{flex:1;height:6px;border-radius:2px;background:rgba(255,255,255,.3)}
  .session-bar span.done{background:#fff}
  .quiz-char{font-family:"Noto Sans JP",sans-serif;font-size:64px;margin-top:26px;line-height:1}
  .quiz-card{max-width:520px;margin:-24px auto 0;background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.06);padding:28px 30px 26px;position:relative}
  .question-label{display:inline-block;background:var(--accent);color:#fff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:6px;padding:4px 10px;margin-bottom:14px}
  input.answer{width:100%;border:none;border-bottom:2px solid var(--color-widget-border);font-family:"Noto Sans JP",sans-serif;font-size:22px;padding:8px 2px;outline:none;background:transparent}
  input.answer:focus{border-bottom-color:var(--accent)}
  input.answer.correct{border-bottom-color:var(--color-correct);color:var(--color-correct)}
  input.answer.incorrect{border-bottom-color:var(--color-incorrect);color:var(--color-incorrect)}
  @keyframes shake{10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)} 30%,50%,70%{transform:translateX(-8px)} 40%,60%{transform:translateX(8px)}}
  input.answer.shake{animation:shake .4s}
  .feedback-row{display:flex;align-items:center;justify-content:space-between;margin-top:18px;min-height:40px}
  .feedback-msg{font-size:14px;font-weight:700}
  .feedback-msg.correct{color:var(--color-correct)} .feedback-msg.incorrect{color:var(--color-incorrect)}
  .btn.check{background:var(--accent);color:#fff;border:none;border-radius:var(--border-radius-normal);padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer}
  .hint{font-size:12px;color:var(--color-widget-secondary-text);margin-top:6px}

  .lesson-review{max-width:520px;margin:14px auto 0;background:#fff;border-radius:16px;border:1px solid var(--color-widget-border);padding:22px 30px;display:none}
  .lesson-review.visible{display:block}
  .lesson-review .lr-title{font-size:12px;font-weight:700;color:var(--color-incorrect);text-transform:uppercase;letter-spacing:.03em;margin-bottom:12px}
  .lesson-review h4{font-size:13px;font-weight:700;color:var(--accent-dark);text-transform:uppercase;letter-spacing:.03em;margin:14px 0 4px}
  .lesson-review h4:first-of-type{margin-top:0}
  .lesson-review p{font-size:14px;line-height:1.6;margin:0}
  .lesson-review .jp{font-family:"Noto Sans JP",sans-serif;font-size:19px}

  .word-breakdown{display:flex;gap:10px;flex-wrap:wrap}

/* ======================================================================
   SRS ENGINE — exact math from your WaniKani writeup.
   ====================================================================== */

// hours to wait after REACHING that stage before the item is due again.
// index = stage (1-8). Stage 9 = Burned, never reviewed again.
const SRS_HOURS = [null, 4, 8, 23, 47, 167, 335, 719, 2879];
const STAGE_NAMES = ['', 'Apprentice I', 'Apprentice II', 'Apprentice III', 'Apprentice IV', 'Guru I', 'Guru II', 'Master', 'Enlightened', 'Burned'];

function nextAvailableAt(stage) {
  if (stage >= 9) return null;
  return now() + SRS_HOURS[stage] * 3600 * 1000;
}

// Applies one item's review outcome for a whole session (missCount = how
// many wrong sub-answers it got this session, 0 if answered clean).
function applyReviewOutcome(record, missCount) {
  if (missCount === 0) {
    record.stage = Math.min(record.stage + 1, 9);
  } else {
    const penalty = record.stage >= 5 ? 2 : 1;
    const drop = Math.ceil(missCount / 2) * penalty;
    record.stage = Math.max(1, record.stage - drop);
  }
  record.availableAt = nextAvailableAt(record.stage);
  record.lastReviewedAt = now();
}

/* ======================================================================
   STATE — persisted to localStorage.
   ====================================================================== */

const STORAGE_KEY = 'jpPracticeState_v1';

function defaultState() {
  return {
    items: {},              // key `${type}:${id}` -> { stage, availableAt, learnedAt, lastReviewedAt }
    levels: { vocab: 1, kanji: 1, grammar: 1 },
    recentMistakes: [],     // { type, id, at }
    lessonBatchSize: 5,     // how many new items are taught per lesson session before the end-of-batch quiz
    devTimeOffsetMs: 0,     // DEV ONLY — lets the "+24h" button fast-forward review timing for testing
    customVocab: { vocab: [], kanji: [], grammar: [] } // per-user words added from the "Add Custom Vocab" screen
  };
}

// STATE starts empty and is only ever populated for real once sign-in
// resolves (see onAuthStateChanged below) — this app now requires an
// account, since progress is per-user and synced to the cloud. CURRENT_UID
// scopes localStorage per-account too, so two friends sharing one browser
// never see each other's cached progress.
let STATE = defaultState();
let CURRENT_UID = null;
function localKeyFor(uid) { return STORAGE_KEY + ':' + uid; }
function loadLocalState(uid) {
  try {
    const raw = localStorage.getItem(localKeyFor(uid));
    if (raw) return Object.assign(defaultState(), JSON.parse(raw));
  } catch (e) {}
  return defaultState();
}

// Local save is always synchronous and instant (works offline, no lag while
// typing/reviewing). Cloud sync piggybacks on every save but is fire-and-
// forget and debounced — see scheduleCloudSync() below.
function saveState() {
  if (CURRENT_UID) localStorage.setItem(localKeyFor(CURRENT_UID), JSON.stringify(STATE));
  scheduleCloudSync();
}
function now() { return Date.now() + STATE.devTimeOffsetMs; }

function itemKey(type, id) { return type + ':' + id; }
function getRecord(type, id) { return STATE.items[itemKey(type, id)]; }
function isIntroduced(type, id) { return !!getRecord(type, id); }

function introduceItem(type, id) {
  if (isIntroduced(type, id)) return;
  STATE.items[itemKey(type, id)] = { stage: 1, availableAt: nextAvailableAt(1), learnedAt: now(), lastReviewedAt: null };
}

// force a specific item straight to a given stage, bypassing the normal
// "just introduced -> Apprentice I" path. Used only by the one-time
// progress seed below, for items you'd already learned before this app
// existed (so they shouldn't start the SRS clock from zero).
function setItemStage(type, id, stage) {
  STATE.items[itemKey(type, id)] = { stage, availableAt: nextAvailableAt(stage), learnedAt: now(), lastReviewedAt: now() };
}

// Custom vocab you add yourself (see "Add Custom Vocab" in Settings)
// starts at Apprentice I like normal, but skips the usual 4-hour wait —
// it's due for review right away instead of hours from now.
function introduceCustomItem(type, id) {
  if (isIntroduced(type, id)) return;
  STATE.items[itemKey(type, id)] = { stage: 1, availableAt: now(), learnedAt: now(), lastReviewedAt: null };
}

// NOTE: the one-time progress seed and Duo auto-introduce that used to run
// unconditionally here were Casey-account-specific (her real pre-app
// progress) and would have wrongly given every new friend signup a head
// start. That history was moved out to a one-time backup-JSON import (see
// migrate-duo-vocab.js) that Casey imports once from the Backup/Restore
// screen on her own account — new accounts now genuinely start blank.
//
// postLoadInit() runs once per sign-in, after STATE has been resolved from
// local+cloud storage (see onAuthStateChanged below) — NOT at script-parse
// time, since there's no real STATE to act on until someone's logged in.
function postLoadInit() {
  // Auto-introduce any custom vocab a user has added that isn't in their
  // review pool yet (mirrors the old Duo behavior: words you add yourself
  // are ones you already know, so they go straight into reviews).
  (STATE.customVocab && STATE.customVocab.vocab || []).forEach(v => {
    if (!isIntroduced('vocab', v.id)) introduceCustomItem('vocab', v.id);
  });
  saveState();
}

/* ======================================================================
   CONTENT / SECTION HELPERS — generic across vocab / kanji / grammar.
   ====================================================================== */

const COLOR_MAP = {
  vocab:   { accent: '#AA00FF', dark: '#8600B9', light: '#EDC8FF' },
  kanji:   { accent: '#FF00AA', dark: '#B9007B', light: '#FFD4F1' },
  grammar: { accent: '#00AA00', dark: '#007A00', light: '#CDF5CD' }
};
const SECTION_LABEL = { vocab: 'Vocabulary', kanji: 'Kanji', grammar: 'Grammar' };
const SECTION_CHIP = { vocab: '語', kanji: '字', grammar: '文法' };
const BATCH_SIZE = { vocab: 15, kanji: 15, grammar: 5 };

function contentFor(type) {
  const base = type === 'vocab' ? VOCAB : type === 'kanji' ? KANJI : GRAMMAR;
  const custom = (STATE.customVocab && STATE.customVocab[type]) || [];
  return custom.length ? base.concat(custom) : base;
}
function displayWord(type, item) {
  return type === 'kanji' ? item.char : (type === 'grammar' ? item.title : item.word);
}
function displayReading(type, item) {
  // on'yomi is the "headline" reading for a kanji (falls back to kun'yomi
  // for the handful with no on'yomi at all, like 皿/貝)
  if (type === 'grammar') return item.subtitle;
  if (type === 'kanji') return item.onyomi || item.kunyomi;
  return item.reading;
}
function displayMeaning(type, item) {
  return type === 'grammar' ? item.explanation : item.meaning;
}

// Shared "Reading" section body for kanji vs vocab lesson/detail/review-
// panel views — kanji shows both readings plus the on/kun usage note
// (the "why"), vocab shows its one reading plus the readingType "why".
// Centralized here instead of duplicated across renderLessonItem,
// viewItemDetail, and the quiz wrong-answer panel.
function readingSectionHTML(type, item, audioText) {
  if (type === 'kanji') {
    const rows = [];
    if (item.onyomi) rows.push(`<div class="field"><div class="k">On'yomi</div><div class="v primary jp-field">${item.onyomi}</div></div>`);
    if (item.kunyomi) rows.push(`<div class="field"><div class="k">Kun'yomi</div><div class="v jp-field">${item.kunyomi}</div></div>`);
    return `
      <div class="field-row">${rows.join('')}</div>
      ${audioText ? audioButtonsHTML(audioText) : ''}
      <h3 class="mnemonic-label">Why This Reading</h3>
      <p class="prose">${item.usageNote || '<em>No usage note added yet.</em>'}</p>`;
  }
  return `
    <div class="reading-row"><div class="reading-jp">${item.reading || ''}</div>${audioText ? audioButtonsHTML(audioText) : ''}</div>
    <h3 class="mnemonic-label">Why This Reading</h3>
    <p class="prose">${item.readingType || '<em>No note added yet.</em>'}</p>`;
}

function setAccent(type) {
  const c = COLOR_MAP[type] || COLOR_MAP.vocab;
  const r = document.documentElement.style;
  r.setProperty('--accent', c.accent);
  r.setProperty('--accent-dark', c.dark);
  r.setProperty('--accent-light', c.light);
}

function levelBatch(type, level) {
  const all = contentFor(type);
  const withLevels = all.some(it => it.level != null);
  if (withLevels) return all.filter(it => it.level === level);
  const size = BATCH_SIZE[type];
  return all.slice((level - 1) * size, level * size);
}
function totalLevels(type) {
  const all = contentFor(type);
  if (!all.length) return 1;
  const withLevels = all.some(it => it.level != null);
  if (withLevels) return Math.max(1, ...all.map(it => it.level || 1));
  return Math.max(1, Math.ceil(all.length / BATCH_SIZE[type]));
}
function maybeLevelUp(type) {
  const level = STATE.levels[type];
  const batch = levelBatch(type, level);
  if (!batch.length) return false;
  const guruCount = batch.filter(it => { const r = getRecord(type, it.id); return r && r.stage >= 5; }).length;
  if (guruCount / batch.length >= 0.8 && level < totalLevels(type)) {
    STATE.levels[type] = level + 1;
    return true;
  }
  return false;
}
function lessonQueueFor(type) {
  const level = STATE.levels[type];
  return levelBatch(type, level).filter(it => !isIntroduced(type, it.id));
}
function reviewQueueFor(type) {
  return contentFor(type).filter(it => {
    const r = getRecord(type, it.id);
    return r && r.stage < 9 && r.availableAt !== null && r.availableAt <= now();
  });
}
function introducedItems(type) {
  return contentFor(type)
    .filter(it => isIntroduced(type, it.id))
    .sort((a, b) => (getRecord(type, b.id).learnedAt || 0) - (getRecord(type, a.id).learnedAt || 0));
}

// counts introduced items into the 5 named SRS tiers (grouping the 8
// numbered stages the way WK's own dashboard does: Apprentice = 1-4).
function stageBreakdown(type) {
  const counts = { apprentice: 0, guru: 0, master: 0, enlightened: 0, burned: 0 };
  contentFor(type).forEach(it => {
    const r = getRecord(type, it.id);
    if (!r) return;
    if (r.stage <= 4) counts.apprentice++;
    else if (r.stage <= 6) counts.guru++;
    else if (r.stage === 7) counts.master++;
    else if (r.stage === 8) counts.enlightened++;
    else counts.burned++;
  });
  return counts;
}

function fieldsFor(type) { return type === 'grammar' ? ['blank'] : ['meaning', 'reading']; }
function acceptedFor(type, item, field) {
  if (type === 'grammar') {
    return (item.blankAnswerAccepted && item.blankAnswerAccepted.length ? item.blankAnswerAccepted : [item.blankAnswer]).filter(Boolean);
  }
  if (field === 'meaning') {
    return (item.altMeanings && item.altMeanings.length ? [item.meaning, ...item.altMeanings] : [item.meaning]).filter(Boolean);
  }
  // Matches real WK: a reading question has exactly ONE correct answer —
  // the "headline" reading (on'yomi, falling back to kun'yomi for the rare
  // kanji with none) — not "either reading accepted." Typing the OTHER
  // valid reading of the character isn't treated as this-is-correct-too;
  // it gets its own soft "wrong reading type" handling in attachQuizHandlers
  // (see otherReadingFor) instead of silently passing here.
  const base = type === 'kanji' ? [item.onyomi || item.kunyomi] : [item.reading];
  return base.filter(Boolean).concat(item.readingAccepted && item.readingAccepted.length ? item.readingAccepted : []);
}

// the kanji reading NOT being quizzed right now — null if there isn't one
// (either the kanji only has one reading, or field isn't 'reading')
function otherReadingFor(type, item, field) {
  if (type !== 'kanji' || field !== 'reading') return null;
  if (!item.onyomi || !item.kunyomi) return null;
  return item.kunyomi; // onyomi is always the headline/quizzed reading when both exist
}

/* ======================================================================
   MATCHING — fuzzy/tolerant answer checking, shared everywhere.
   ====================================================================== */

// converts the **bold** markdown from your mnemonic source files into the
// <span class="hl"> highlight styling, so mnemonics can be pasted in as-is.
function mdBold(s) { return String(s || '').replace(/\*\*(.+?)\*\*/g, '<span class="hl">$1</span>'); }

function normalizeAnswer(s) { return String(s || '').trim().toLowerCase().replace(/[.,、。\s!！]/g, ''); }
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = new Array(n + 1);
  for (let j = 0; j <= n; j++) dp[j] = j;
  for (let i = 1; i <= m; i++) {
    let prev = dp[0]; dp[0] = i;
    for (let j = 1; j <= n; j++) {
      const tmp = dp[j];
      dp[j] = a[i - 1] === b[j - 1] ? prev : 1 + Math.min(prev, dp[j], dp[j - 1]);
      prev = tmp;
    }
  }
  return dp[n];
}
function isCloseEnough(rawVal, acceptedList) {
  const val = normalizeAnswer(rawVal);
  if (!val) return false;
  for (const raw of acceptedList) {
    const target = normalizeAnswer(raw);
    if (!target) continue;
    if (val === target) return true;
    // BUG FIX: this used to floor(length*0.12) but then force a MINIMUM of
    // 1 edit allowed regardless of length. For short targets (a huge share
    // of kana readings are 1-3 characters), a 1-edit tolerance is
    // enormous relative to the string — it was accepting almost any input
    // as "close enough" to e.g. a 1-character reading. Short answers now
    // require an exact match; typo tolerance only kicks in once there's
    // enough length for a 1-character slip to actually mean "typo" rather
    // than "wrong answer."
    if (target.length <= 4) continue;
    const tolerance = Math.floor(target.length * 0.15);
    if (tolerance > 0 && levenshtein(val, target) <= tolerance) return true;
  }
  return false;
}

/* ======================================================================
   VOICEVOX — text-to-speech via the local VOICEVOX Engine app.
   ====================================================================== */
// Three-tier fallback, so audio works on your phone with no server at all,
// and still works anywhere else:
//   1. A pre-generated file in audio/ (see generate-audio.js) — no network,
//      no VOICEVOX Engine needed, works offline on a phone/PWA. This is
//      the normal path for anything already in your vocab/kanji/sentences.
//   2. Live VOICEVOX Engine call (voicevox_core has no browser/mobile
//      binding — only the desktop Engine app exposes an HTTP API a page
//      can call, and only while it's running on that machine) — covers
//      brand-new text at your desk before you've re-run generate-audio.js.
//   3. The browser's own built-in speechSynthesis — no server, no engine,
//      works on any device (including iOS Safari, which ships Japanese
//      voices), just lower quality than VOICEVOX. Last resort so
//      something always plays.
const VOICEVOX_BASE = 'http://127.0.0.1:50021';

// Your requested voice pool, split by gender. "Mixed around" means: rather
// than one fixed voice per gender, which specific voice gets used for a
// given piece of text is picked deterministically from a hash of the text
// itself (pickSpeaker below) — so it's stable across regenerations (the
// same word always gets the same voice) but varies which of the two voices
// in that gender shows up from one word to the next. This EXACT list and
// pickSpeaker function are duplicated in generate-audio.js — the two must
// stay in sync, or pre-generated files won't match what the live fallback
// would pick.
const FEMALE_SPEAKERS = [{ id: 2, name: 'Shikoku Metan' }, { id: 8, name: 'Kasukabe Tsumugi' }];
const MALE_SPEAKERS = [{ id: 52, name: 'Suzumatsu Shuji' }, { id: 21, name: 'Kenzaki' }];

function pickSpeakerId(gender, text) {
  const pool = gender === 'male' ? MALE_SPEAKERS : FEMALE_SPEAKERS;
  let h = 0;
  for (const ch of String(text)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return pool[h % pool.length].id;
}

let _audioManifestPromise = null;
function loadAudioManifest() {
  if (!_audioManifestPromise) {
    _audioManifestPromise = fetch('audio/manifest.json').then(r => r.ok ? r.json() : {}).catch(() => ({}));
  }
  return _audioManifestPromise;
}

async function playPreGenerated(text, gender) {
  const manifest = await loadAudioManifest();
  const key = normalizeAnswer(text);
  const entry = manifest[key];
  const filename = entry && entry[gender];
  if (!filename) return false;
  const audio = new Audio('audio/' + filename);
  await audio.play();
  return true;
}

async function playViaVoicevoxEngine(text, speakerId) {
  const qRes = await fetch(`${VOICEVOX_BASE}/audio_query?speaker=${speakerId}&text=${encodeURIComponent(text)}`, { method: 'POST' });
  if (!qRes.ok) throw new Error('audio_query failed (' + qRes.status + ')');
  const query = await qRes.json();
  const sRes = await fetch(`${VOICEVOX_BASE}/synthesis?speaker=${speakerId}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(query)
  });
  if (!sRes.ok) throw new Error('synthesis failed (' + sRes.status + ')');
  const blob = await sRes.blob();
  const url = URL.createObjectURL(blob);
  const audio = new Audio(url);
  audio.addEventListener('ended', () => URL.revokeObjectURL(url));
  await audio.play();
}

function playViaBrowserTTS(text) {
  if (!window.speechSynthesis) return false;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP';
  window.speechSynthesis.speak(utter);
  return true;
}

async function playTTS(text, gender = 'female') {
  if (!text) return;
  try {
    if (await playPreGenerated(text, gender)) return;
  } catch (err) {
    console.warn('Pre-generated audio playback failed, trying live VOICEVOX:', err);
  }
  try {
    await playViaVoicevoxEngine(text, pickSpeakerId(gender, text));
    return;
  } catch (err) {
    console.warn('Live VOICEVOX Engine unreachable, falling back to browser TTS:', err);
  }

  }
}

/* ======================================================================
   ROMAJI -> KANA — simple live IME-style conversion for reading answers.
   ====================================================================== */

// Greedy longest-match romaji->hiragana table. Re-run on the WHOLE input
// value on every keystroke rather than tracking incremental state: already-
// converted kana characters simply don't match any romaji key, so they
// pass through unchanged, and only the newly-typed trailing romaji gets
// converted — this makes "reconvert everything each keystroke" safe and
// much simpler than trying to track partial syllable state by hand.
const ROMAJI_TO_HIRAGANA = {
  kya:'きゃ',kyu:'きゅ',kyo:'きょ', gya:'ぎゃ',gyu:'ぎゅ',gyo:'ぎょ',
  sha:'しゃ',shu:'しゅ',sho:'しょ', sya:'しゃ',syu:'しゅ',syo:'しょ',
  ja:'じゃ',ju:'じゅ',jo:'じょ', zya:'じゃ',zyu:'じゅ',zyo:'じょ',
  cha:'ちゃ',chu:'ちゅ',cho:'ちょ', tya:'ちゃ',tyu:'ちゅ',tyo:'ちょ',
  nya:'にゃ',nyu:'にゅ',nyo:'にょ',
  hya:'ひゃ',hyu:'ひゅ',hyo:'ひょ',
  bya:'びゃ',byu:'びゅ',byo:'びょ',
  pya:'ぴゃ',pyu:'ぴゅ',pyo:'ぴょ',
  mya:'みゃ',myu:'みゅ',myo:'みょ',
  rya:'りゃ',ryu:'りゅ',ryo:'りょ',
  dya:'ぢゃ',dyu:'ぢゅ',dyo:'ぢょ',
  a:'あ',i:'い',u:'う',e:'え',o:'お',
  ka:'か',ki:'き',ku:'く',ke:'け',ko:'こ',
  ga:'が',gi:'ぎ',gu:'ぐ',ge:'げ',go:'ご',
  sa:'さ',shi:'し',si:'し',su:'す',se:'せ',so:'そ',
  za:'ざ',ji:'じ',zi:'じ',zu:'ず',ze:'ぜ',zo:'ぞ',
  ta:'た',chi:'ち',ti:'ち',tsu:'つ',tu:'つ',te:'て',to:'と',
  da:'だ',di:'ぢ',du:'づ',de:'で',do:'ど',
  na:'な',ni:'に',nu:'ぬ',ne:'ね',no:'の',
  ha:'は',hi:'ひ',fu:'ふ',hu:'ふ',he:'へ',ho:'ほ',
  ba:'ば',bi:'び',bu:'ぶ',be:'べ',bo:'ぼ',
  pa:'ぱ',pi:'ぴ',pu:'ぷ',pe:'ぺ',po:'ぽ',
  ma:'ま',mi:'み',mu:'む',me:'め',mo:'も',
  ya:'や',yu:'ゆ',yo:'よ',
  ra:'ら',ri:'り',ru:'る',re:'れ',ro:'ろ',
  wa:'わ',wo:'を',
  vu:'ゔ',
  '-':'ー'
};
const HIRAGANA_START = 0x3041, HIRAGANA_END = 0x3096, KATAKANA_OFFSET = 0x60;
function hiraganaToKatakana(s) {
  return s.replace(/[ぁ-ゖ]/g, ch => String.fromCharCode(ch.charCodeAt(0) + KATAKANA_OFFSET));
}

function romajiToKana(input, katakana) {
  const s = input.toLowerCase();
  let out = '';
  let i = 0;
  while (i < s.length) {
    const c = s[i], c2 = s[i + 1];
    // "n" not followed by a vowel/y/another pending n-context -> ん
    if (c === 'n' && c2 !== undefined && "aiueoy".indexOf(c2) === -1 && c2 !== "'") {
      out += 'ん'; i++; continue;
    }
    if (c === 'n' && c2 === "'") { out += 'ん'; i += 2; continue; }
    // NOTE: deliberately NOT converting a trailing "n" with nothing after it
    // yet (c2 === undefined). This runs on the whole field on every
    // keystroke, so right after you type the "n" in "na" it briefly IS the
    // last character with nothing following — eagerly turning that into ん
    // pre-empted the vowel that was about to complete na/ni/nu/ne/no, which
    // is exactly the bug reported. A genuinely-trailing n (e.g. finishing
    // on "hon") is caught by finalizeTrailingN() at answer-check time
    // instead, once we actually know nothing more is coming.
    // sokuon: doubled consonant -> っ, then re-process the second one
    if (c === c2 && 'kstpgzbdjcf'.indexOf(c) !== -1) { out += 'っ'; i++; continue; }
    let matched = false;
    for (const len of [3, 2, 1]) {
      const chunk = s.slice(i, i + len);
      if (ROMAJI_TO_HIRAGANA[chunk]) { out += ROMAJI_TO_HIRAGANA[chunk]; i += len; matched = true; break; }
    }
    if (!matched) { out += s[i]; i++; }
  }
  return katakana ? hiraganaToKatakana(out) : out;
}

// Converts a genuinely trailing lone "n" left over from live conversion
// (e.g. finishing on "hon") to ん — safe to call once we know the answer
// is actually being submitted, since nothing more is coming after it.
function finalizeTrailingN(s, katakana) {
  if (/n$/i.test(s)) return s.slice(0, -1) + (katakana ? 'ン' : 'ん');
  return s;
}

/* ======================================================================
   CONFETTI — shared burst effect.
   ====================================================================== */

function burstConfetti() {
  const colors = [getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#AA00FF', '#FF00AA', '#00AAFF', '#FFC700'];
  const originX = window.innerWidth / 2, originY = window.innerHeight * 0.75;
  for (let i = 0; i < 46; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = originX + 'px';
    piece.style.top = originY + 'px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    const angleRad = (-90 + (Math.random() * 120 - 60)) * Math.PI / 180;
    const dist = 160 + Math.random() * 260;
    piece.style.setProperty('--fx', (Math.cos(angleRad) * dist).toFixed(1));
    piece.style.setProperty('--fy', (Math.sin(angleRad) * dist).toFixed(1));
    piece.style.setProperty('--rot', Math.floor(180 + Math.random() * 360));
    piece.style.animationDuration = (0.7 + Math.random() * 0.4) + 's';
    document.body.appendChild(piece);
    piece.addEventListener('animationend', () => piece.remove());
  }
}

/* ======================================================================
   ROUTER
   ====================================================================== */

function currentRoute() { return location.hash.replace(/^#\/?/, '').split('/').filter(Boolean); }
function navigate(path) { location.hash = path; }
window.addEventListener('hashchange', render);

// App boot is gated on sign-in (see the AUTH block near the bottom of this
// script) — render() is a no-op until APP_BOOTED flips true, so a stray
// hashchange during the sign-in check can't flash the dashboard against
// empty STATE before the real account data has loaded.
let APP_BOOTED = false;
function render() {
  if (!APP_BOOTED) return;
  const parts = currentRoute();
  const section = parts[0] || 'dashboard';
  const root = document.getElementById('app');

  if (section === 'vocab' || section === 'kanji') setAccent(section);
  else if (section === 'sentences' && parts[1] === 'grammar') setAccent('grammar');
  else setAccent('vocab');

  let view;
  if (section === 'dashboard' || !section) view = viewDashboard();
  else if (section === 'vocab' || section === 'kanji') view = viewSectionRoute(section, parts.slice(1));
  else if (section === 'sentences') view = viewSentencesRoute(parts.slice(1));
  else if (section === 'practice' && parts[1] === 'custom') view = viewCustomPracticePicker();
  else if (section === 'backup') view = viewBackupRestore();
  else if (section === 'customvocab') view = viewAddCustomVocab();
  else if (section === 'reviews') view = viewActiveReviews();
  else if (section === 'settings') view = viewSettings();
  else view = viewDashboard();

  root.innerHTML = topNav(section, parts) + view.html;
  if (view.after) view.after();
  window.scrollTo(0, 0);
}

function topNav(section, parts) {
  const isSentencesGrammar = section === 'sentences' && parts[1] === 'grammar';
  return `
    <nav class="topnav">
      <a class="wordmark" href="#/dashboard"><span class="jp">日本</span><span class="dot">・</span><span class="en">Practice</span></a>
      <div class="navlinks">
        <a href="#/dashboard" class="${section === 'dashboard' ? 'active' : ''}">Dashboard</a>
        <a href="#/vocab" class="${section === 'vocab' ? 'active' : ''}">Vocab</a>
        <a href="#/sentences" class="${section === 'sentences' && !isSentencesGrammar ? 'active' : ''}">Sentences</a>
        <a href="#/kanji" class="${section === 'kanji' ? 'active' : ''}">Kanji</a>
      </div>
      <div class="navright">
        <a class="settings-btn ${section === 'settings' ? 'active' : ''}" href="#/settings" title="Settings" aria-label="Settings">⚙</a>
      </div>
    </nav>`;
}

function signOutUser() {
  firebase.auth().signOut();
}

function devSkipTime() {
  STATE.devTimeOffsetMs += 24 * 3600 * 1000;

}

  // ---- Level Progress widget: level + how many Guru+ at that level, per type ----
  const levelRows = sections.map(type => {

  const tiers = [['apprentice', 'Apprentice'], ['guru', 'Guru'], ['master', 'Master'], ['enlightened', 'Enlightened'], ['burned', 'Burned']];

      <div class="spread-count" style="background:${COLOR_MAP.kanji.accent}">${spread.kanji[key]}</div>
    </div>`).join('');

        <div class="reviews-banner-count">${dueCount}</div>
        <div class="reviews-banner-body">
          <div class="reviews-banner-title">${dueCount ? 'Reviews Available' : 'No Reviews Due'}</div>
          <div class="reviews-banner-sub">${dueCount ? 'Vocab, Kanji, and Grammar due right now — start them together.' : "You're all caught up. Check back later."}</div>
        </div>
        ${dueCount ? '<div class="chevron">›</div>' : ''}

      <div class="grid">${cards}${sentencesCard}</div>

      <div class="grid">
        <div class="level-widget col-6" style="margin:0">

          <div class="spread-header"><div></div><div style="color:${COLOR_MAP.vocab.accent}">Vocab</div><div style="color:${COLOR_MAP.kanji.accent}">Kanji</div></div>
          ${spreadRows}

      <div class="mistakes-widget">

}

function slugifyCustomId(prefix, text) {
  return 'custom:' + prefix + ':' + text + ':' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function attachCustomVocabHandlers() {
  document.getElementById('cvAddWord').addEventListener('click', () => {
    const word = document.getElementById('cvWord').value.trim();
    const reading = document.getElementById('cvReading').value.trim();
    const meaning = document.getElementById('cvMeaning').value.trim();
    const status = document.getElementById('cvWordStatus');
    if (!word || !reading || !meaning) { status.textContent = 'Fill in all three fields.'; status.style.color = '#C00'; return; }
    STATE.customVocab = STATE.customVocab || { vocab: [], kanji: [], grammar: [] };
    const item = { id: slugifyCustomId('vocab', word), word, reading, meaning, source: 'custom' };
    STATE.customVocab.vocab.push(item);
    introduceCustomItem('vocab', item.id);
    saveState();
    render();
  });

  document.getElementById('cvAddKanji').addEventListener('click', () => {
    const char = document.getElementById('cvChar').value.trim();
    const onyomi = document.getElementById('cvOnyomi').value.trim() || null;
    const kunyomi = document.getElementById('cvKunyomi').value.trim() || null;
    const meaning = document.getElementById('cvKanjiMeaning').value.trim();
    const status = document.getElementById('cvKanjiStatus');
    if (!char || !meaning || (!onyomi && !kunyomi)) { status.textContent = 'Character, meaning, and at least one reading are required.'; status.style.color = '#C00'; return; }
    STATE.customVocab = STATE.customVocab || { vocab: [], kanji: [], grammar: [] };
    const item = { id: slugifyCustomId('kanji', char), char, onyomi, kunyomi, meaning, source: 'custom' };
    STATE.customVocab.kanji.push(item);
    introduceCustomItem('kanji', item.id);
    saveState();
    render();
  });

  document.querySelectorAll('.cv-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.type;
      const id = btn.dataset.id;
      STATE.customVocab[type] = STATE.customVocab[type].filter(it => it.id !== id);
      delete STATE.items[itemKey(type, id)];
      saveState();
      render();
    });
  });
}

        <p class="wk-text">Paste a previously-exported backup below. <strong>This replaces your current progress in this browser</strong> — export first if you want to keep it.</p>
        <textarea class="backup-textarea" id="importBox" placeholder="Paste exported JSON here"></textarea>
        <button class="wk-button" id="importBtn">Import (overwrites current progress)</button>
        <span id="importStatus" class="backup-status"></span>
      </div>
    </main>`, after: attachBackupHandlers };
}

function attachBackupHandlers() {
  const exportBox = document.getElementById('exportBox');
  const copyBtn = document.getElementById('copyBtn');
  const copyStatus = document.getElementById('copyStatus');
  const importBox = document.getElementById('importBox');
  const importBtn = document.getElementById('importBtn');
  const importStatus = document.getElementById('importStatus');

  exportBox.value = JSON.stringify(STATE, null, 2);

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(exportBox.value);
      copyStatus.textContent = 'Copied!';
    } catch (err) {
      // clipboard API can refuse without a secure context/permission —
      // fall back to select-and-let-the-user-Ctrl+C
      exportBox.select();
      copyStatus.textContent = 'Select-all done — press Ctrl+C (or Cmd+C) to copy.';
    }
  });

  importBtn.addEventListener('click', () => {
    let parsed;
    try {
      parsed = JSON.parse(importBox.value);
    } catch (err) {
      importStatus.textContent = 'That doesn\'t look like valid backup JSON.';
      importStatus.style.color = 'var(--color-incorrect)';
      return;
    }
    if (!parsed || typeof parsed !== 'object' || !parsed.items || typeof parsed.items !== 'object') {
      importStatus.textContent = 'That JSON is missing the expected "items" field — not a valid backup.';
      importStatus.style.color = 'var(--color-incorrect)';
      return;
    }
    STATE = Object.assign(defaultState(), parsed);
    saveState();
    importStatus.textContent = 'Imported! Reloading…';
    importStatus.style.color = 'var(--color-correct)';
    setTimeout(() => { location.hash = '#/dashboard'; render(); }, 600);
  });
}

function viewSectionRoute(type, subparts) {
  const sub = subparts[0];
  if (sub === 'library' && subparts[1]) return viewItemDetail(type, decodeURIComponent(subparts[1]));
  if (sub === 'library') return viewLibrary(type);
  if (sub === 'lesson') return viewLesson(type);
  if (sub === 'review') return viewReview(type);
  if (sub === 'practice' && subparts[1] === 'recent') return viewPracticeRecent(type);
  if (sub === 'practice' && subparts[1] === 'level' && subparts[2]) return viewPracticeLevel(type, Number(subparts[2]));
  if (sub === 'practice' && subparts[1] === 'pick') return viewPracticePicker(type);
  return viewSectionMain(type);
}

// ---- "Review Previous" pools ----

// items introduced OR mistaken in the last 24h — the no-penalty
// "Recent" practice pool, same items the dashboard's Recent Mistakes
// widget already surfaces for the mistake half of this.
function recentPoolFor(type) {
  const cutoff = now() - 24 * 3600 * 1000;
  return contentFor(type).filter(it => {
    const r = getRecord(type, it.id);
    if (!r) return false;
    if (r.learnedAt && r.learnedAt >= cutoff) return true;
    return STATE.recentMistakes.some(m => m.type === type && m.id === it.id && m.at >= cutoff);
  });
}

function viewPracticeRecent(type) {
  const items = recentPoolFor(type);
  if (!items.length) return { html: `<main><p class="empty-state" style="margin-top:40px">Nothing learned or missed in the last 24 hours. <a href="#/${sectionBase(type)}">Back to ${SECTION_LABEL[type]}</a></p></main>` };
  quizSession = buildQuizSession(type, items, 'practice');
  return { html: renderQuizQuestion(), after: attachQuizHandlers };
}

function viewPracticeLevel(type, level) {
  const items = levelBatch(type, level).filter(it => isIntroduced(type, it.id));
  if (!items.length) return { html: `<main><p class="empty-state" style="margin-top:40px">No introduced items in Level ${level} yet. <a href="#/${sectionBase(type)}">Back to ${SECTION_LABEL[type]}</a></p></main>` };
  quizSession = buildQuizSession(type, items, 'practice');
  return { html: renderQuizQuestion(), after: attachQuizHandlers };
}

// groups items by their `level` field for picker display — items with no
// level (e.g. Duolingo vocab, which skips the leveled batches entirely)
// land in their own "No Level" bucket at the end, not mixed in with Level 1.
function groupByLevel(items) {
  const byLevel = {};
  const noLevel = [];
  items.forEach(it => {
    if (it.level == null) { noLevel.push(it); return; }
    (byLevel[it.level] = byLevel[it.level] || []).push(it);
  });
  const groups = Object.keys(byLevel).map(Number).sort((a, b) => a - b)
    .map(level => ({ label: `Level ${level}`, items: byLevel[level] }));
  if (noLevel.length) groups.push({ label: 'No Level', items: noLevel });
  return groups;
}

function pickerTileHTML(type, it, extraClass) {
  return `
    <label class="picker-tile" data-group="${type}">
      <input type="checkbox" class="picker-check ${extraClass || ''}" data-type="${type}" value="${encodeURIComponent(it.id)}">
      <div class="word">${displayWord(type, it)}</div>
      <div class="reading">${displayReading(type, it) || ''}</div>
    </label>`;
}

function viewPracticePicker(type) {
  const items = introducedItems(type);
  const levelGroups = groupByLevel(items);
  return { html: `
    <div class="topbar">
      <a class="back-link" href="#/${sectionBase(type)}">‹ Back to ${SECTION_LABEL[type]}</a>
      <div class="section-title"><span class="chip">${SECTION_CHIP[type]}</span>Choose Items To Practice</div>
    </div>
    <main>
      ${items.length ? `
        <div class="picker-toolbar">
          <button class="wk-button" id="pickAll">Select all</button>
          <button class="wk-button" id="pickNone">Select none</button>
        </div>
        ${levelGroups.map(g => `
          <div class="picker-level-label">${g.label} <span class="picker-level-count">(${g.items.length})</span></div>
          <div class="picker-grid" style="margin-bottom:18px">${g.items.map(it => pickerTileHTML(type, it, 'picker-check-plain')).join('')}</div>
        `).join('')}
        <div class="session-footer">
          <span id="pickCount" style="align-self:center;font-size:13px;color:var(--color-widget-secondary-text)">0 selected</span>
          <button class="wk-button primary" id="pickStart" disabled>Start practice</button>
        </div>
      ` : `<p class="empty-state">Nothing learned yet to pick from.</p>`}
    </main>`, after: () => attachPickerHandlers(type) };
}

function attachPickerHandlers(type) {
  const checks = Array.from(document.querySelectorAll('.picker-check'));
  const countEl = document.getElementById('pickCount');
  const startBtn = document.getElementById('pickStart');
  const allBtn = document.getElementById('pickAll');
  const noneBtn = document.getElementById('pickNone');
  if (!checks.length) return;

  function updateCount() {
    const n = checks.filter(c => c.checked).length;
    countEl.textContent = `${n} selected`;
    startBtn.disabled = n === 0;
  }
  checks.forEach(c => c.addEventListener('change', () => { c.closest('.picker-tile').classList.toggle('checked', c.checked); updateCount(); }));
  if (allBtn) allBtn.addEventListener('click', () => { checks.forEach(c => { c.checked = true; c.closest('.picker-tile').classList.add('checked'); }); updateCount(); });
  if (noneBtn) noneBtn.addEventListener('click', () => { checks.forEach(c => { c.checked = false; c.closest('.picker-tile').classList.remove('checked'); }); updateCount(); });
  if (startBtn) startBtn.addEventListener('click', () => {
    const ids = checks.filter(c => c.checked).map(c => decodeURIComponent(c.value));
    const items = contentFor(type).filter(it => ids.includes(it.id));
    if (!items.length) return;
    quizSession = buildQuizSession(type, items, 'practice');
    document.getElementById('app').innerHTML = topNav(currentRoute()[0], currentRoute()) + renderQuizQuestion();
    attachQuizHandlers();
    window.scrollTo(0, 0);
  });
}

        </div>
      ` : `<p class="empty-state">Nothing learned yet across Vocab, Kanji, or Grammar — finish some lessons first.</p>`}
    </main>`, after: attachCustomPickerHandlers };

function attachCustomPickerHandlers() {
  // tab switching — one category visible at a time instead of one long
  // scroll through all three
  const tabs = Array.from(document.querySelectorAll('.category-tab'));
  tabs.forEach(tab => tab.addEventListener('click', () => {
    const target = tab.dataset.tab;
    tabs.forEach(t => {
      const isActive = t === tab;
      t.classList.toggle('active', isActive);
      t.style.borderColor = isActive ? COLOR_MAP[t.dataset.tab].accent : '';
      t.style.color = isActive ? COLOR_MAP[t.dataset.tab].accent : '';
    });
    document.querySelectorAll('.category-tab-panel').forEach(p => { p.hidden = p.dataset.panel !== target; });
  }));

  const checks = Array.from(document.querySelectorAll('.custom-check'));
  const countEl = document.getElementById('customPickCount');
  const startBtn = document.getElementById('customPickStart');
  if (!checks.length) return;

  function updateCount() {
    const n = checks.filter(c => c.checked).length;
    countEl.textContent = `${n} selected`;
    startBtn.disabled = n === 0;
  }
  checks.forEach(c => c.addEventListener('change', () => { c.closest('.picker-tile').classList.toggle('checked', c.checked); updateCount(); }));
  document.querySelectorAll('.custom-pick-all').forEach(btn => btn.addEventListener('click', () => {
    checks.filter(c => c.dataset.type === btn.dataset.group).forEach(c => { c.checked = true; c.closest('.picker-tile').classList.add('checked'); });
    updateCount();
  }));
  document.querySelectorAll('.custom-pick-none').forEach(btn => btn.addEventListener('click', () => {
    checks.filter(c => c.dataset.type === btn.dataset.group).forEach(c => { c.checked = false; c.closest('.picker-tile').classList.remove('checked'); });
    updateCount();
  }));
  if (startBtn) startBtn.addEventListener('click', () => {
    const entries = checks.filter(c => c.checked).map(c => {
      const type = c.dataset.type;
      const id = decodeURIComponent(c.value);
      const item = contentFor(type).find(it => it.id === id);
      return item ? { type, item } : null;
    }).filter(Boolean);
    if (!entries.length) return;
    quizSession = buildMixedQuizSession(entries, 'practice', 'dashboard');
    document.getElementById('app').innerHTML = topNav('practice', ['practice', 'custom']) + renderQuizQuestion();
    attachQuizHandlers();
    window.scrollTo(0, 0);
  });
}

        ${readingSectionHTML(type, item, displayReading(type, item))}
      </div>`;
  }

  return `
    <div class="hero">
      <div class="hero-top">
        <a class="home" href="#/${sectionBase(type)}">🏠</a>
        <div class="counts"><span>${SECTION_LABEL[type]} ${remaining[type]} left</span></div>
      </div>
      <div class="char">${displayWord(type, item)}</div>
      <div class="meaning">${type === 'grammar' ? (item.subtitle || '') : (item.meaning || '')}</div>
    </div>
    <div class="tabbar">${tabs.map(([id, label]) => `<a href="#${id}">${label}</a>`).join('')}</div>
    <main class="lesson-main">${sections}</main>
    <div class="session-footer">
      <button class="wk-button" id="lessonBack" ${index === 0 ? 'disabled' : ''}>‹ Back</button>
      <button class="wk-button primary" id="lessonNext">${isLast ? 'Start quiz ›' : 'Next ›'}</button>
    </div>`;
}

function attachLessonHandlers() {
  // the tab bar's #meaning/#reading links are same-page scroll anchors,
  // not routes — they'd otherwise fire the app's hashchange router and
  // blow the lesson away to render the dashboard, so intercept them here
  // and scroll manually instead of letting the hash actually change.
  document.querySelectorAll('.tabbar a').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const target = document.getElementById(a.getAttribute('href').slice(1));
      if (target) target.scrollIntoView({ behavior: 'smooth' });
    });
  });
  const backBtn = document.getElementById('lessonBack');
  const nextBtn = document.getElementById('lessonNext');
  if (backBtn) backBtn.addEventListener('click', () => {
    if (lessonSession.index > 0) { lessonSession.index--; rerenderLesson(); }
  });
  if (nextBtn) nextBtn.addEventListener('click', () => {
    const { type, items, index } = lessonSession;
    if (!items.length) return;
    if (index < items.length - 1) {
      lessonSession.index++;
      rerenderLesson();
    } else {
      // batch's mnemonic content is done — hand off to the quiz engine in
      // 'lesson' mode. Items only actually get introduceItem()'d (i.e.
      // enter the real SRS ladder) as each is answered correctly there,
      // per your ask for a comprehension check before moving on.
      quizSession = buildQuizSession(type, items, 'lesson');
      document.getElementById('app').innerHTML = topNav(currentRoute()[0], currentRoute()) + renderQuizQuestion();
      attachQuizHandlers();
      window.scrollTo(0, 0);
    }
  });
}
function rerenderLesson() {
  document.getElementById('app').innerHTML = topNav(currentRoute()[0], currentRoute()) + renderLessonItem();
  attachLessonHandlers();
  window.scrollTo(0, 0);
}

/* ---- Quiz engine — shared by real Reviews, the end-of-lesson-batch quiz,
   and no-penalty Practice sessions. `mode` controls what happens to real
   SRS state when a question set finishes:
   - 'review':   normal SRS scoring (promote/demote), can level up
   - 'lesson':   just-taught items get introduceItem()'d — this IS how a
                 lesson batch actually enters your review queue; a wrong
                 answer here doesn't demote anything (nothing to demote —
                 the item isn't in the SRS ladder yet)
   - 'practice': no state changes at all — pure drilling, same spirit as
                 WK's "Extra Study" / Recent Mistakes feature
   A wrong answer always re-queues the question to the end of the list —
   the same "keep trying until right, within this session" behavior for
   every mode, per your feedback. ---- */

let quizSession = null;

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Single-type session (Reviews, end-of-lesson quiz, per-section Practice) —
// every question is tagged with its type internally (q.itemType) even
// though it's the same type throughout, so this and buildMixedQuizSession
// share one rendering/checking code path.
function buildQuizSession(type, items, mode) {
  return buildMixedQuizSession(items.map(item => ({ type, item })), mode, sectionBase(type));
}

// Cross-category session (the Dashboard's "Custom Review") — entries is
// [{type, item}, ...] spanning vocab/kanji/grammar in one shuffled mix.
// backRoute is where "back"/finish navigates to, since a mixed session has
// no single section to return to.
function buildMixedQuizSession(entries, mode, backRoute) {
  const questions = [];
  entries.forEach(({ type, item }) => fieldsFor(type).forEach(field => questions.push({ itemType: type, itemId: item.id, field })));
  shuffleArray(questions);
  // Tracks every distinct type in the session so a finished mixed review
  // (e.g. the "Active Reviews" page, vocab+kanji together) can check
  // level-up for each type it touched, not just whichever type happened
  // to be the last question answered.
  const types = [...new Set(entries.map(e => e.type))];
  return { mode, backRoute, totalQuestions: questions.length, remaining: questions, missByItem: {}, answeredCount: 0, types };
}

function viewReview(type) {
  quizSession = buildQuizSession(type, reviewQueueFor(type), 'review');
  return { html: renderQuizQuestion(), after: attachQuizHandlers };
}

// Cross-category "Active Reviews" — every vocab/kanji/grammar item due
// right now, in one shuffled session. This is a REAL review (mode
// 'review'): correct/incorrect here moves the item's actual SRS stage,
// same as the per-section Reviews button — just combined across types.
function viewActiveReviews() {
  const entries = ['vocab', 'kanji', 'grammar']
    .flatMap(type => reviewQueueFor(type).map(item => ({ type, item })));
  if (!entries.length) {
    return { html: `<main><p class="empty-state" style="margin-top:40px">Nothing due for review right now. <a href="#/dashboard">Back to Dashboard</a></p></main>` };
  }
  quizSession = buildMixedQuizSession(entries, 'review', 'dashboard');
  return { html: renderQuizQuestion(), after: attachQuizHandlers };
}

function allDueCount() {
  return ['vocab', 'kanji', 'grammar'].reduce((sum, type) => sum + reviewQueueFor(type).length, 0);
}

function renderQuizQuestion() {
  const { mode, remaining, totalQuestions, answeredCount, backRoute } = quizSession;
  if (!remaining.length) {
    return `<main><p class="empty-state" style="margin-top:40px">Nothing here right now. <a href="#/${backRoute}">Back</a></p></main>`;
  }
  const q = remaining[0];
  const type = q.itemType;
  setAccent(type);
  const item = contentFor(type).find(it => it.id === q.itemId);
  const segCount = Math.min(totalQuestions, 18);
  const segs = Array.from({ length: segCount }, (_, i) => `<span class="${i < Math.round((answeredCount / totalQuestions) * segCount) ? 'done' : ''}"></span>`).join('');

  const label = type === 'grammar' ? 'Fill in the blank' : (q.field === 'meaning' ? 'Meaning' : 'Reading');
  const promptChar = type === 'grammar' ? blankSentence(item) : displayWord(type, item);
  const placeholder = type === 'grammar' ? 'type the missing part' : (q.field === 'meaning' ? 'English meaning' : 'reading (kana or romaji)');
  // audio only offered on Meaning questions — playing the reading on a
  // Reading question would just hand you the answer
  const ttsButton = (type !== 'grammar' && q.field === 'meaning' && displayReading(type, item))
    ? `<div style="margin-top:8px">${audioButtonsHTML(displayReading(type, item), 'background:rgba(255,255,255,.18);border-color:transparent;color:#fff')}</div>`
    : '';
  const modeBadge = mode === 'lesson'
    ? `<div style="font-size:11px;font-weight:700;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 12px;display:inline-block;margin-top:6px">Lesson Quiz</div>`
    : mode === 'practice'
    ? `<div style="font-size:11px;font-weight:700;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 12px;display:inline-block;margin-top:6px">Practice — doesn't affect SRS progress</div>`
    : '';

  return `
    <div class="quiz-hero" id="hero">
      <div class="quiz-hero-top">
        <a class="home" href="#/${backRoute}" style="color:#fff;text-decoration:none">🏠</a>
        <div class="count" id="sessionCount" style="font-size:13px;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 12px">${answeredCount + 1} of ${totalQuestions}</div>
      </div>
      <div class="session-bar" id="sessionBar">${segs}</div>
      <div class="quiz-char" style="${type === 'grammar' ? 'font-size:26px' : ''}">${promptChar}</div>
      ${ttsButton}
      ${modeBadge}
    </div>
    <div class="quiz-card">
      <div class="question-label">${label}</div>
      <input class="answer" id="answerInput" type="text" placeholder="${placeholder}" autocomplete="off" autofocus>
      <div class="hint">Press Enter or Check to submit.</div>
      <div class="feedback-row">
        <div class="feedback-msg" id="feedbackMsg"></div>
        <button class="btn check" id="checkBtn">Check</button>
      </div>
    </div>
    <div class="lesson-review" id="lessonReview">
      <div class="lr-title">⚠ Let's review this one</div>
      ${type === 'grammar' ? `
        <h4>Explanation</h4><p>${item.explanation || ''}</p>
        <h4>Example</h4><p class="jp">${item.example ? item.example.jp : ''}</p><p>${item.example ? item.example.en : ''}</p>
      ` : `
        <h4>Meaning</h4><p><strong>${item.meaning || ''}</strong></p>
        <h4>Meaning Mnemonic</h4><p>${mdBold(item.meaningMnemonic)}</p>
        <h4>Reading</h4>
        ${readingSectionHTML(type, item, null)}
      `}
    </div>`;
}

function blankSentence(item) {
  if (!item || !item.example) return '';
  return item.example.jp.replace(item.blankAnswer, '＿＿＿');
}

function attachQuizHandlers() {
  const input = document.getElementById('answerInput');
  const checkBtn = document.getElementById('checkBtn');
  if (!input || !checkBtn) return;
  const feedback = document.getElementById('feedbackMsg');
  const hero = document.getElementById('hero');
  const lessonReviewPanel = document.getElementById('lessonReview');
  let locked = false;
  let awaitingNext = false;

  function check() {
    if (locked || awaitingNext) return;
    let val = input.value.trim();
    if (!val) return;
    const { mode, remaining } = quizSession;
    const q = remaining[0];
    const type = q.itemType;
    const item = contentFor(type).find(it => it.id === q.itemId);
    // catch a lone trailing "n" the live converter deliberately left
    // unconverted (see romajiToKana) — safe now that the answer's actually
    // being submitted, since we know nothing more is coming after it.
    if (type !== 'grammar' && q.field === 'reading') {
      val = finalizeTrailingN(val, /[゠-ヿ]/.test(displayReading(type, item) || ''));
    }
    const accepted = acceptedFor(type, item, q.field);
    const correct = isCloseEnough(val, accepted);

    if (correct) {
      locked = true;
      input.classList.add('correct');
      hero.classList.add('state-correct');
      feedback.textContent = 'Correct!';
      feedback.className = 'feedback-msg correct';
      lessonReviewPanel.classList.remove('visible');
      burstConfetti();
      setTimeout(() => {
        quizSession.remaining.shift();
        quizSession.answeredCount++;
        const stillPending = quizSession.remaining.some(r => r.itemId === q.itemId);
        if (!stillPending) {
          if (mode === 'review') {
            const record = getRecord(type, q.itemId);
            const missCount = quizSession.missByItem[q.itemId] || 0;
            applyReviewOutcome(record, missCount);
            if (missCount > 0) recordMistake(type, q.itemId);
          } else if (mode === 'lesson') {
            introduceItem(type, q.itemId);
          }
          // mode === 'practice': no state change — pure drilling
          saveState();
        }
        if (!quizSession.remaining.length) {
          if (mode === 'review') (quizSession.types || [type]).forEach(t => maybeLevelUp(t));
          saveState();
          navigate(quizSession.backRoute);
        } else {
          rerenderQuiz();
        }
      }, 1100);
    } else if (isCloseEnough(val, [otherReadingFor(type, item, q.field)])) {
      // Matches real WK: you typed a genuinely correct reading of this
      // kanji, just not the one this question is asking for (e.g. kun'yomi
      // when on'yomi was wanted). That's not a "wrong answer" the same way
      // a totally unrelated guess is — shake + a specific note, then let
      // you retry immediately on the SAME question, no Next click, no
      // info panel. It still counts as a miss for SRS purposes, same as
      // real WK, just with friendlier UX than a full miss.
      quizSession.missByItem[q.itemId] = (quizSession.missByItem[q.itemId] || 0) + 1;
      input.classList.remove('shake');
      void input.offsetWidth;
      input.classList.add('incorrect', 'shake');
      feedback.textContent = `That's the other reading (${otherReadingFor(type, item, q.field)}) — try the one we're asking for.`;
      feedback.className = 'feedback-msg incorrect';
      setTimeout(() => { input.classList.remove('incorrect'); input.value = ''; }, 500);
    } else {
      quizSession.missByItem[q.itemId] = (quizSession.missByItem[q.itemId] || 0) + 1;
      input.classList.remove('shake');
      void input.offsetWidth;
      input.classList.add('incorrect', 'shake');
      hero.classList.add('state-incorrect');
      feedback.textContent = 'Not quite — review below, then click Next';
      feedback.className = 'feedback-msg incorrect';
      lessonReviewPanel.classList.add('visible');
      // BUG FIX (kept): rotating quizSession.remaining without re-rendering
      // used to leave the screen showing the question you'd just missed
      // while the data had already moved to a different one, so typing the
      // right answer for what was on screen still failed. Per your latest
      // feedback, this no longer auto-advances on a timer either — it now
      // waits for you to actually click Next, so you have as long as you
      // want to read the mnemonic/info panel before moving on.
      awaitingNext = true;
      checkBtn.textContent = 'Next ›';
    }
  }

  function advanceAfterMiss() {
    // BUG FIX: this used to always push the missed question to the very
    // END of the queue — a deterministic FIFO rotation, not an actual
    // reshuffle. With few items left in a session that made it reappear
    // on a predictable schedule (and with only 2 items queued, it looked
    // exactly like "just repeats until correct"). Now it's spliced back in
    // at a random position instead — a real reshuffle into the deck —
    // and never at index 0, so it can't immediately repeat as the very
    // next question either.
    const missed = quizSession.remaining.shift();
    if (quizSession.remaining.length === 0) {
      quizSession.remaining.push(missed);
    } else {
      const insertAt = 1 + Math.floor(Math.random() * quizSession.remaining.length);
      quizSession.remaining.splice(insertAt, 0, missed);
    }
    rerenderQuiz();
  }

  checkBtn.addEventListener('click', () => { if (awaitingNext) advanceAfterMiss(); else check(); });
  input.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (awaitingNext) advanceAfterMiss();
    else check();
  });

  // romaji -> kana live conversion on Reading questions (vocab/kanji),
  // since the expected answer there is kana, not English or free-form
  // Japanese. Not applied to Meaning questions, grammar's fill-in-the-
  // blank, or the Sentences practice screens (Translate especially can
  // need kanji, which this simple converter can't produce).
  if (quizSession.remaining[0] && quizSession.remaining[0].itemType !== 'grammar' && quizSession.remaining[0].field === 'reading') {
    const q0 = quizSession.remaining[0];
    const currentItem = contentFor(q0.itemType).find(it => it.id === q0.itemId);
    const targetReading = displayReading(q0.itemType, currentItem) || '';
    const useKatakana = /[゠-ヿ]/.test(targetReading);
    input.addEventListener('input', () => {
      const converted = romajiToKana(input.value, useKatakana);
      if (converted !== input.value) {
        input.value = converted;
      }
    });
  }
}
function rerenderQuiz() {
  document.getElementById('app').innerHTML = topNav(currentRoute()[0], currentRoute()) + renderQuizQuestion();
  attachQuizHandlers();
  window.scrollTo(0, 0);
}

/* ======================================================================
   SENTENCES (hub, grammar sub-section, Read & Type, Translate)
   ====================================================================== */

function availableSentences() {
  return SENTENCES.filter(s =>
    (s.requiredVocab || []).every(id => isIntroduced('vocab', id)) &&
    (s.requiredKanji || []).every(id => isIntroduced('kanji', id)) &&
    (s.requiredGrammar || []).every(id => isIntroduced('grammar', id))
  );
}

function viewSentencesRoute(subparts) {
  const sub = subparts[0];
  if (sub === 'grammar') return viewSectionRoute('grammar', subparts.slice(1));
  if (sub === 'read-type') return viewReadType();
  if (sub === 'translate') return viewTranslate();
  return viewSentencesHub();
}

function viewSentencesHub() {
  const vocabCount = introducedItems('vocab').length;
  const kanjiCount = introducedItems('kanji').length;
  const grammarCount = introducedItems('grammar').length;
  const available = availableSentences().length;
  return { html: `
    <main>
