function attachLessonHandlers() {
  // the tab bar's #meaning/#reading links are same-page scroll anchors,
  // not routes — they'd otherwise fire the app's hashchange router and
  // blow the lesson away to render the dashboard, so intercept them here
  // and scroll manually instead of letting the hash actually change.
  document.querySelectorAll('.tabbar a').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const target = document.getElementById(a.getAttribute('href').slice(1));
      if (target) target.scrollIntoView({ behavior: 'smooth' });
    });
  });
  const backBtn = document.getElementById('lessonBack');
  const nextBtn = document.getElementById('lessonNext');
  if (backBtn) backBtn.addEventListener('click', () => {
    if (lessonSession.index > 0) { lessonSession.index--; rerenderLesson(); }
  });
  if (nextBtn) nextBtn.addEventListener('click', () => {
    const { type, items, index } = lessonSession;
    if (!items.length) return;
    if (index < items.length - 1) {
      lessonSession.index++;
      rerenderLesson();
    } else {
      // batch's mnemonic content is done — hand off to the quiz engine in
      // 'lesson' mode. Items only actually get introduceItem()'d (i.e.
      // enter the real SRS ladder) as each is answered correctly there,
      // per your ask for a comprehension check before moving on.
      quizSession = buildQuizSession(type, items, 'lesson');
      document.getElementById('app').innerHTML = topNav(currentRoute()[0], currentRoute()) + renderQuizQuestion();
      attachQuizHandlers();
      window.scrollTo(0, 0);
    }
  });
}
function rerenderLesson() {
  document.getElementById('app').innerHTML = topNav(currentRoute()[0], currentRoute()) + renderLessonItem();
  attachLessonHandlers();
  window.scrollTo(0, 0);
}

/* ---- Quiz engine — shared by real Reviews, the end-of-lesson-batch quiz,
   and no-penalty Practice sessions. `mode` controls what happens to real
   SRS state when a question set finishes:
   - 'review':   normal SRS scoring (promote/demote), can level up
   - 'lesson':   just-taught items get introduceItem()'d — this IS how a
                 lesson batch actually enters your review queue; a wrong
                 answer here doesn't demote anything (nothing to demote —
                 the item isn't in the SRS ladder yet)
   - 'practice': no state changes at all — pure drilling, same spirit as
                 WK's "Extra Study" / Recent Mistakes feature
   A wrong answer always re-queues the question to the end of the list —
   the same "keep trying until right, within this session" behavior for
   every mode, per your feedback. ---- */

let quizSession = null;

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Single-type session (Reviews, end-of-lesson quiz, per-section Practice) —
// every question is tagged with its type internally (q.itemType) even
// though it's the same type throughout, so this and buildMixedQuizSession
// share one rendering/checking code path.
function buildQuizSession(type, items, mode) {
  return buildMixedQuizSession(items.map(item => ({ type, item })), mode, sectionBase(type));
}

// Cross-category session (the Dashboard's "Custom Review") — entries is
// [{type, item}, ...] spanning vocab/kanji/grammar in one shuffled mix.
// backRoute is where "back"/finish navigates to, since a mixed session has
// no single section to return to.
function buildMixedQuizSession(entries, mode, backRoute) {
  const questions = [];
  entries.forEach(({ type, item }) => fieldsFor(type).forEach(field => questions.push({ itemType: type, itemId: item.id, field })));
  shuffleArray(questions);
  // Tracks every distinct type in the session so a finished mixed review
  // (e.g. the "Active Reviews" page, vocab+kanji together) can check
  // level-up for each type it touched, not just whichever type happened
  // to be the last question answered.
  const types = [...new Set(entries.map(e => e.type))];
  return { mode, backRoute, totalQuestions: questions.length, remaining: questions, missByItem: {}, answeredCount: 0, types };
}

function viewReview(type) {
  quizSession = buildQuizSession(type, reviewQueueFor(type), 'review');
  return { html: renderQuizQuestion(), after: attachQuizHandlers };
}

// Cross-category "Active Reviews" — every vocab/kanji/grammar item due
// right now, in one shuffled session. This is a REAL review (mode
// 'review'): correct/incorrect here moves the item's actual SRS stage,
// same as the per-section Reviews button — just combined across types.
function viewActiveReviews() {
  const entries = ['vocab', 'kanji', 'grammar']
    .flatMap(type => reviewQueueFor(type).map(item => ({ type, item })));
  if (!entries.length) {
    return { html: `<main><p class="empty-state" style="margin-top:40px">Nothing due for review right now. <a href="#/dashboard">Back to Dashboard</a></p></main>` };
  }
  quizSession = buildMixedQuizSession(entries, 'review', 'dashboard');
  return { html: renderQuizQuestion(), after: attachQuizHandlers };
}

function allDueCount() {
  return ['vocab', 'kanji', 'grammar'].reduce((sum, type) => sum + reviewQueueFor(type).length, 0);
}

function renderQuizQuestion() {
  const { mode, remaining, totalQuestions, answeredCount, backRoute } = quizSession;
  if (!remaining.length) {
    return `<main><p class="empty-state" style="margin-top:40px">Nothing here right now. <a href="#/${backRoute}">Back</a></p></main>`;
  }
  const q = remaining[0];
  const type = q.itemType;
  setAccent(type);
  const item = contentFor(type).find(it => it.id === q.itemId);
  const segCount = Math.min(totalQuestions, 18);
  const segs = Array.from({ length: segCount }, (_, i) => `<span class="${i < Math.round((answeredCount / totalQuestions) * segCount) ? 'done' : ''}"></span>`).join('');

  const label = type === 'grammar' ? 'Fill in the blank' : (q.field === 'meaning' ? 'Meaning' : 'Reading');
  const promptChar = type === 'grammar' ? blankSentence(item) : displayWord(type, item);
  const placeholder = type === 'grammar' ? 'type the missing part' : (q.field === 'meaning' ? 'English meaning' : 'reading (kana or romaji)');
  // audio only offered on Meaning questions — playing the reading on a
  // Reading question would just hand you the answer
  const ttsButton = (type !== 'grammar' && q.field === 'meaning' && displayReading(type, item))
    ? `<div style="margin-top:8px">${audioButtonsHTML(displayReading(type, item), 'background:rgba(255,255,255,.18);border-color:transparent;color:#fff')}</div>`
    : '';
  const modeBadge = mode === 'lesson'
    ? `<div style="font-size:11px;font-weight:700;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 12px;display:inline-block;margin-top:6px">Lesson Quiz</div>`
    : mode === 'practice'
    ? `<div style="font-size:11px;font-weight:700;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 12px;display:inline-block;margin-top:6px">Practice — doesn't affect SRS progress</div>`
    : '';

  return `
    <div class="quiz-hero" id="hero">
      <div class="quiz-hero-top">
        <a class="home" href="#/${backRoute}" style="color:#fff;text-decoration:none">🏠</a>
        <div class="count" id="sessionCount" style="font-size:13px;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 12px">${answeredCount + 1} of ${totalQuestions}</div>
      </div>
      <div class="session-bar" id="sessionBar">${segs}</div>
      <div class="quiz-char" style="${type === 'grammar' ? 'font-size:26px' : ''}">${promptChar}</div>
      ${ttsButton}
      ${modeBadge}
    </div>
    <div class="quiz-card">
      <div class="question-label">${label}</div>
      <input class="answer" id="answerInput" type="text" placeholder="${placeholder}" autocomplete="off" autofocus>
      <div class="hint">Press Enter or Check to submit.</div>
      <div class="feedback-row">
        <div class="feedback-msg" id="feedbackMsg"></div>
        <button class="btn check" id="checkBtn">Check</button>
      </div>
    </div>
    <div class="lesson-review" id="lessonReview">
      <div class="lr-title">⚠ Let's review this one</div>
      ${type === 'grammar' ? `
        <h4>Explanation</h4><p>${item.explanation || ''}</p>
        <h4>Example</h4><p class="jp">${item.example ? item.example.jp : ''}</p><p>${item.example ? item.example.en : ''}</p>
      ` : `
        <h4>Meaning</h4><p><strong>${item.meaning || ''}</strong></p>
        <h4>Meaning Mnemonic</h4><p>${mdBold(item.meaningMnemonic)}</p>
        <h4>Reading</h4>
        ${readingSectionHTML(type, item, null)}
      `}
    </div>`;
}

function blankSentence(item) {
  if (!item || !item.example) return '';
  return item.example.jp.replace(item.blankAnswer, '＿＿＿');
}

function attachQuizHandlers() {
  const input = document.getElementById('answerInput');
  const checkBtn = document.getElementById('checkBtn');
  if (!input || !checkBtn) return;
  const feedback = document.getElementById('feedbackMsg');
  const hero = document.getElementById('hero');
  const lessonReviewPanel = document.getElementById('lessonReview');
  let locked = false;
  let awaitingNext = false;

  function check() {
    if (locked || awaitingNext) return;
    let val = input.value.trim();
    if (!val) return;
    const { mode, remaining } = quizSession;
    const q = remaining[0];
    const type = q.itemType;
    const item = contentFor(type).find(it => it.id === q.itemId);
    // catch a lone trailing "n" the live converter deliberately left
    // unconverted (see romajiToKana) — safe now that the answer's actually
    // being submitted, since we know nothing more is coming after it.
    if (type !== 'grammar' && q.field === 'reading') {
      val = finalizeTrailingN(val, /[゠-ヿ]/.test(displayReading(type, item) || ''));
    } else if (type === 'grammar' && q.field === 'blank') {
      val = finalizeTrailingN(val, /[゠-ヿ]/.test(item.blankAnswer || ''));
    }
    const accepted = acceptedFor(type, item, q.field);
    const correct = isCloseEnough(val, accepted);

    if (correct) {
      locked = true;
      input.classList.add('correct');
      hero.classList.add('state-correct');
      feedback.textContent = 'Correct!';
      feedback.className = 'feedback-msg correct';
      lessonReviewPanel.classList.remove('visible');
      burstConfetti();
      setTimeout(() => {
        quizSession.remaining.shift();
        quizSession.answeredCount++;
        const stillPending = quizSession.remaining.some(r => r.itemId === q.itemId);
        if (!stillPending) {
          if (mode === 'review') {
            const record = getRecord(type, q.itemId);
            const missCount = quizSession.missByItem[q.itemId] || 0;
            applyReviewOutcome(record, missCount);
            if (missCount > 0) recordMistake(type, q.itemId);
          } else if (mode === 'lesson') {
            introduceItem(type, q.itemId);
          }
          // mode === 'practice': no state change — pure drilling
          saveState();
        }
        if (!quizSession.remaining.length) {
          if (mode === 'review') (quizSession.types || [type]).forEach(t => maybeLevelUp(t));
          saveState();
          navigate(quizSession.backRoute);
        } else {
          rerenderQuiz();
        }
      }, 1100);
    } else if (isCloseEnough(val, [otherReadingFor(type, item, q.field)])) {
      // Matches real WK: you typed a genuinely correct reading of this
      // kanji, just not the one this question is asking for (e.g. kun'yomi
      // when on'yomi was wanted). That's not a "wrong answer" the same way
      // a totally unrelated guess is — shake + a specific note, then let
      // you retry immediately on the SAME question, no Next click, no
      // info panel. It still counts as a miss for SRS purposes, same as
      // real WK, just with friendlier UX than a full miss.
      quizSession.missByItem[q.itemId] = (quizSession.missByItem[q.itemId] || 0) + 1;
      input.classList.remove('shake');
      void input.offsetWidth;
      input.classList.add('incorrect', 'shake');
      feedback.textContent = `That's the other reading (${otherReadingFor(type, item, q.field)}) — try the one we're asking for.`;
      feedback.className = 'feedback-msg incorrect';
      setTimeout(() => { input.classList.remove('incorrect'); input.value = ''; }, 500);
    } else {
      quizSession.missByItem[q.itemId] = (quizSession.missByItem[q.itemId] || 0) + 1;
      input.classList.remove('shake');
      void input.offsetWidth;
      input.classList.add('incorrect', 'shake');
      hero.classList.add('state-incorrect');
      feedback.textContent = 'Not quite — review below, then click Next';
      feedback.className = 'feedback-msg incorrect';
      lessonReviewPanel.classList.add('visible');
      // BUG FIX (kept): rotating quizSession.remaining without re-rendering
      // used to leave the screen showing the question you'd just missed
      // while the data had already moved to a different one, so typing the
      // right answer for what was on screen still failed. Per your latest
      // feedback, this no longer auto-advances on a timer either — it now
      // waits for you to actually click Next, so you have as long as you
      // want to read the mnemonic/info panel before moving on.
      awaitingNext = true;
      checkBtn.textContent = 'Next ›';
    }
  }

  function advanceAfterMiss() {
    // BUG FIX: this used to always push the missed question to the very
    // END of the queue — a deterministic FIFO rotation, not an actual
    // reshuffle. With few items left in a session that made it reappear
    // on a predictable schedule (and with only 2 items queued, it looked
    // exactly like "just repeats until correct"). Now it's spliced back in
    // at a random position instead — a real reshuffle into the deck —
    // and never at index 0, so it can't immediately repeat as the very
    // next question either.
    const missed = quizSession.remaining.shift();
    if (quizSession.remaining.length === 0) {
      quizSession.remaining.push(missed);
    } else {
      const insertAt = 1 + Math.floor(Math.random() * quizSession.remaining.length);
      quizSession.remaining.splice(insertAt, 0, missed);
    }
    rerenderQuiz();
  }

  checkBtn.addEventListener('click', () => { if (awaitingNext) advanceAfterMiss(); else check(); });
  input.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (awaitingNext) advanceAfterMiss();
    else check();
  });

  // romaji -> kana live conversion on Reading questions (vocab/kanji) and
  // Grammar's fill-in-the-blank (particles/conjugated forms are kana too),
  // since the expected answer there is kana, not English or free-form
  // Japanese. Not applied to Meaning questions or the Sentences practice
  // screens (Translate especially can need kanji, which this simple
  // converter can't produce).
  const q0 = quizSession.remaining[0];
  const isGrammarBlank = q0 && q0.itemType === 'grammar' && q0.field === 'blank';
  const isReading = q0 && q0.itemType !== 'grammar' && q0.field === 'reading';
  if (q0 && (isReading || isGrammarBlank)) {
    const currentItem = contentFor(q0.itemType).find(it => it.id === q0.itemId);
    const targetReading = isGrammarBlank ? (currentItem.blankAnswer || '') : (displayReading(q0.itemType, currentItem) || '');
    const useKatakana = /[゠-ヿ]/.test(targetReading);
    input.addEventListener('input', () => {
      const converted = romajiToKana(input.value, useKatakana);
      if (converted !== input.value) {
        input.value = converted;
      }
    });
  }
}
function rerenderQuiz() {
  document.getElementById('app').innerHTML = topNav(currentRoute()[0], currentRoute()) + renderQuizQuestion();
  attachQuizHandlers();
  window.scrollTo(0, 0);
}

  const hero = document.getElementById('hero');

  function check() {

      document.getElementById('wdExplain').textContent = tile.dataset.explain;
      wordDetail.classList.add('visible');
    });
  }
}

/* ======================================================================
   AUTH / CLOUD SYNC — Firebase Authentication (email+password) gates the
   whole app behind sign-in, and Firestore mirrors STATE per-account so
   progress follows you across devices/browsers, not just this one
   browser's localStorage. Uses the Firebase *compat* SDK (loaded via
   <script> tags at the top of <head>) specifically so this stays a
   single plain HTML file with no build step / npm / bundler — the
   modern modular SDK requires ES module imports and a bundler to use
   sanely, compat doesn't.

   Sync model (kept deliberately simple, per your ask):
   - On sign-in, if a cloud doc already exists for this account, it wins
     (cloud is the source of truth for cross-device sync). If there's no
     cloud doc yet (first-ever sign-in), whatever's in local storage for
     this browser gets pushed up as the starting point.
   - Every saveState() schedules a debounced push to Firestore (1s after
     the last change, so a burst of review answers is one write, not many).
   - This is last-write-wins, not real-time multi-device merge — if you
     reviewed offline on two devices before either reconnected, the one
     that syncs last overwrites the other's meanwhile-changes. Fine for
     one person on one device at a time, which covers PC+phone in
     practice, but worth knowing about.
   ====================================================================== */

// Fired on load, on sign-in, and on sign-out. This is the single place
// that decides what STATE is and flips the app on — nothing else reads
// STATE for real until this has run at least once.
auth.onAuthStateChanged(user => {
  clearTimeout(cloudSyncTimer);
  if (!user) {
    APP_BOOTED = false;
    CURRENT_UID = null;
    CURRENT_USER_EMAIL = null;
    renderAuthScreen('login');
    return;
  }

  CURRENT_UID = user.uid;
  CURRENT_USER_EMAIL = user.email;
  renderAuthLoading();

  db.collection('users').doc(user.uid).get()
    .then(doc => {
      const local = loadLocalState(user.uid);
      STATE = doc.exists ? Object.assign(defaultState(), doc.data()) : local;
      postLoadInit();
      APP_BOOTED = true;
      if (!location.hash || location.hash === '#/') location.hash = '#/dashboard';
      render();
      if (!doc.exists) scheduleCloudSync(); // push local progress up as the starting cloud copy
    })
    .catch(err => {
      console.warn('Could not reach cloud, using local copy:', err.message);
      STATE = loadLocalState(user.uid);
      postLoadInit();
      APP_BOOTED = true;
      if (!location.hash || location.hash === '#/') location.hash = '#/dashboard';
      render();
    });
});

// register the service worker for offline/installable support. Wrapped in
// a feature check + try/catch since this also gets opened via Live
// Preview / file:// sometimes, where serviceWorker either doesn't exist or
// refuses to register (it requires a real http(s) origin) — the app must
// keep working fine either way, this is purely additive.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('Service worker registration skipped:', err.message);
    });
  });
}
</script>
</body>
</html>
