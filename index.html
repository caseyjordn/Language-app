<!--
  Japanese Practice — functional app shell.

  This is the real app going forward (successor to japanese-practice_
  OLDAPP.html), not a wireframe. No sample vocab/kanji/grammar/sentences
  are included on purpose — you're adding real content yourself. Look for
  the CONTENT DATA block near the top of the <script>: it's four empty
  arrays (VOCAB, KANJI, GRAMMAR, SENTENCES) with the exact object shape
  documented in a comment above each one. Paste real entries in that shape
  and everything else — lessons, reviews, leveling, the Sentences gating —
  works against whatever's there. Empty arrays are fine; every screen has
  a "nothing here yet" state instead of breaking.

  Scope, per your last message: Vocab, Kanji, and Sentences (with Grammar
  nested inside Sentences) are real and functional. Speaking and Photos
  are intentionally left out of the nav — not stubbed, just absent — since
  you said to hold off on those.

  Architecture notes:
  - Single file, no build step, state in localStorage — same convention
    as the old app, and keeps the PWA/offline path open later.
  - Vocab, Kanji, and Grammar all run on one generic "SRS section" engine
    (same lesson/review/level code, parameterized by type) rather than
    three separate copies — that's what let Grammar reuse the Vocab
    lesson/review pattern directly, per your ask.
  - SRS math matches your WaniKani writeup exactly: 8-stage ladder with
    the real hour intervals, the double-penalty-at-Guru+ demotion formula,
    Burned items dropping out of review. A DEV-ONLY "+24h" button in the
    nav lets you fast-forward the clock to actually test review timing
    without waiting real hours — remove it before this ships for real use,
    it's a testing aid, not a feature.
  - Sentences only serves sentences whose every tagged vocab/kanji/grammar
    id has been INTRODUCED (any SRS stage, not necessarily mastered) —
    that's the "reflect only the grammar I've learned" gating. A sentence
    that references content you haven't started yet simply won't appear.
  - Word-by-word sentence breakdowns (for the wrong-answer review panel)
    are NOT auto-generated — there's no real segmentation/parsing here.
    Each SENTENCES entry needs its own manually-written `breakdown` array,
    same as the wireframes did.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Japanese Practice</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-apple-touch.png">
<meta name="theme-color" content="#AA00FF">
<!-- iOS ignores the web manifest for "Add to Home Screen" — these meta
     tags are what actually make it open full-screen (no Safari chrome)
     and use the icon above once added from iOS Safari's share sheet. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日本語">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --color-widget-background:#FFFFFF;
    --color-widget-border:#CAD0D6;
    --color-widget-primary-text:#333333;
    --color-widget-secondary-text:#6B7079;
    --color-widget-divider:#CAD0D6;
    --color-page-background:#F4F4F4;
    --color-locked-bg:#E7E9EB;
    --color-correct:#35A753;
    --color-incorrect:#E01F14;
    --border-radius-tight:4px;
    --border-radius-normal:8px;
    --border-radius-widget:16px;
    --border-radius-pill:9999px;
    --font-family-default:"Noto Sans","Noto Sans JP","Noto Sans SC",sans-serif;
    /* per-section accent, swapped by JS via setAccent(type) */
    --accent:#AA00FF;
    --accent-dark:#8600B9;
    --accent-light:#EDC8FF;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--color-page-background);font-family:var(--font-family-default);font-weight:350;color:var(--color-widget-primary-text);min-height:100vh}
  a{color:inherit}

  /* ---------- top nav ---------- */
  /* padding-top uses the safe-area inset so this sits below the iPhone
     notch/dynamic island when installed as a standalone full-screen PWA
     (viewport-fit=cover above is what makes env() have a real value) */
  .topnav{
    display:flex;align-items:center;gap:16px;
    padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));
    background:#fff;border-bottom:1px solid var(--color-widget-divider);
  }
  .wordmark{font-size:18px;font-weight:700;display:flex;gap:2px;white-space:nowrap;text-decoration:none;flex:none}
  .wordmark .jp{color:#FF00AA} .wordmark .dot{color:#00AAFF} .wordmark .en{color:#AA00FF}
  /* BUG FIX: this used to be a plain flex row with no wrap/scroll handling
     — "Dashboard / Vocab / Sentences / Kanji" plus the wordmark, icons,
     and dev button don't fit on an iPhone-width screen, which either
     clipped nav items or forced the entire page to scroll sideways.
     Scrolling just the nav strip itself keeps the rest of the page from
     ever needing horizontal scroll. */
  .navlinks{display:flex;gap:16px;flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .navlinks::-webkit-scrollbar{display:none}
  .navlinks a{text-decoration:none;font-weight:500;font-size:14px;padding:6px 2px;border-bottom:2px solid transparent;color:var(--color-widget-primary-text);white-space:nowrap;flex:none}
  .navlinks a.active{border-bottom-color:var(--accent)}
  .navright{display:flex;align-items:center;gap:8px;flex:none}
  .dev-btn{
    font-size:11px;font-weight:700;color:#8A6D1F;background:#FFF7E6;border:1px dashed #E0BE6A;
    border-radius:var(--border-radius-pill);padding:5px 8px;cursor:pointer;flex:none;
  }
  .settings-btn{
    display:flex;align-items:center;justify-content:center;width:34px;height:34px;font-size:17px;
    text-decoration:none;color:var(--color-widget-primary-text);border-radius:50%;flex:none;
  }
  .settings-btn:hover,.settings-btn.active{background:var(--accent-light)}
  @media (max-width:480px){
    .wordmark .en{display:none} /* "日本・" is enough branding at this width, "Practice" just eats space */
    .dev-btn{padding:5px 6px;font-size:10px}
  }

  main{max-width:1000px;margin:0 auto;padding:16px 16px 60px}

  /* ---------- dashboard ---------- */
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-bottom:16px}
  .col-6{grid-column:span 6} .col-12{grid-column:span 12}
  @media (max-width:700px){ .grid > *{grid-column:span 12 !important} }
  .section-card{
    background:#fff;border:1px solid var(--color-widget-border);border-radius:var(--border-radius-widget);
    padding:16px;display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;
  }
  .section-chip{width:40px;height:40px;border-radius:var(--border-radius-normal);display:flex;align-items:center;justify-content:center;flex:none;color:#fff;font-family:"Noto Sans JP",sans-serif;font-size:18px}
  .section-body{flex:1;min-width:0}
  .section-name{font-size:16px;font-weight:700}
  .section-stat{font-size:11px;color:var(--color-widget-secondary-text);margin-top:2px}
  .progress-track{height:6px;background:var(--color-locked-bg);border-radius:4px;margin-top:8px;overflow:hidden}
  .progress-fill{height:100%;border-radius:4px}
  .chevron{color:var(--color-widget-secondary-text);font-size:18px;flex:none}

  .mistakes-widget{background:#fff;border:1px solid var(--color-widget-border);border-radius:var(--border-radius-widget);padding:16px 24px}
  .widget-title-row{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
  .widget-title-row .title{font-size:18px;font-weight:700}
  .wk-text{font-size:14px;color:var(--color-widget-secondary-text);margin:0 0 12px}
  .count-bubble{display:inline-flex;align-items:center;justify-content:center;background:#6B7079;color:#fff;border-radius:var(--border-radius-pill);font-size:14px;font-weight:700;padding:1px 10px;min-width:22px}
  .tilerow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tile{width:44px;height:44px;border-radius:var(--border-radius-normal);display:flex;align-items:center;justify-content:center;color:#fff;font-family:"Noto Sans JP",sans-serif;font-size:15px}
  .empty-state{font-size:13px;color:var(--color-widget-secondary-text);font-style:italic;padding:8px 0}

  .wk-button{border:1px solid var(--color-widget-border);background:#fff;border-radius:var(--border-radius-normal);padding:8px 16px;font-size:13px;font-weight:700;color:var(--color-widget-primary-text);cursor:pointer;text-decoration:none;display:inline-block}
  .wk-button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .wk-button:disabled{opacity:.4;cursor:default}

  /* ---------- section main (vocab/kanji/grammar) ---------- */
  .page-header{display:flex;align-items:center;justify-content:space-between;padding:24px 0 0}
  .page-header h1{font-size:24px;font-weight:700;margin:0;display:flex;align-items:center;gap:10px}
  .page-header h1 .chip{width:30px;height:30px;border-radius:var(--border-radius-normal);background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans JP",sans-serif;font-size:15px}
  .library-link{font-size:14px;font-weight:600;color:var(--accent-dark);text-decoration:none}

  .levelup-banner{background:var(--accent);color:#fff;border-radius:var(--border-radius-widget);padding:18px 24px;margin-top:24px;display:flex;align-items:center;justify-content:space-between}
  .levelup-banner .msg{font-size:18px;font-weight:700}
  .levelup-banner .sub{font-size:11px;opacity:.85;margin-top:2px}
  .levelup-banner .dismiss{background:rgba(255,255,255,.2);border:none;color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer}

  .level-widget{background:#fff;border:1px solid var(--color-widget-border);border-radius:var(--border-radius-widget);padding:16px 24px;margin:16px 0}
  .level-widget-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .level-widget-head .title{font-size:18px;font-weight:700}
  .level-nav{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--color-widget-secondary-text)}
  .level-nav button{background:none;border:none;font-size:14px;color:var(--color-widget-secondary-text);cursor:pointer}
  .progress-track2{height:10px;background:#E7E9EB;border-radius:4px;overflow:hidden;margin-bottom:8px}
  .progress-fill2{height:100%;background:var(--accent);border-radius:4px}
  .level-pips{display:flex;gap:3px;margin-bottom:4px}
  .level-pips span{flex:1;height:6px;border-radius:2px;background:var(--color-locked-bg)}
  .level-pips span.done{background:var(--accent)}
  .level-footnote{font-size:11px;color:var(--color-widget-secondary-text)}

  .dash-level-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--color-widget-divider)}
  .dash-level-row:first-of-type{border-top:none}
  .type-chip{width:32px;height:32px;border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans JP",sans-serif;font-size:15px;flex:none}
  .dash-level-info{flex:1;min-width:0}
  .dash-level-title{font-size:13px;font-weight:700;margin-bottom:4px}
  .dash-level-count{font-size:15px;font-weight:700;text-align:right;flex:none}
  .dash-level-count span{display:block;font-size:10px;font-weight:500;color:var(--color-widget-secondary-text)}

  .spread-header{display:grid;grid-template-columns:1fr 60px 60px;font-size:11px;font-weight:700;text-align:center;margin-bottom:4px}
  .spread-header div:first-child{text-align:left}
  .spread-row{display:grid;grid-template-columns:1fr 60px 60px;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--color-widget-divider)}
  .spread-row:first-of-type{border-top:none}
  .spread-label{font-size:12px}
  .spread-count{color:#fff;border-radius:999px;font-size:12px;font-weight:700;text-align:center;padding:2px 0;margin:0 auto;width:36px}

  .lr-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
  @media (max-width:600px){ .lr-row{grid-template-columns:1fr} }
  .lr-widget{background:#fff;border:1px solid var(--color-widget-border);border-radius:var(--border-radius-widget);padding:16px 24px}

  .batch-size-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-widget-secondary-text);margin-bottom:10px}
  .batch-btn{width:22px;height:22px;border-radius:50%;border:1px solid var(--color-widget-border);background:#fff;cursor:pointer;font-size:14px;line-height:1;padding:0}
  #batchSizeDisplay{font-weight:700;color:var(--color-widget-primary-text);min-width:16px;text-align:center}

  .practice-options{display:flex;flex-direction:column;gap:10px}
  .practice-option{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--color-widget-divider);font-size:13px}
  .practice-option:first-child{border-top:none}
  /* font-size must be >=16px: below that, iOS Safari auto-zooms the whole
     page in when this is tapped/focused — not a style choice, a real
     platform behavior for any text input/select under 16px */
  .level-select{border:1px solid var(--color-widget-border);border-radius:8px;padding:6px 8px;font-size:16px;margin-right:6px}

  .picker-toolbar{display:flex;gap:10px;margin-bottom:14px}
  .picker-level-label{font-size:13px;font-weight:700;margin:0 0 8px;padding-top:6px}
  .picker-level-count{font-weight:500;color:var(--color-widget-secondary-text)}
  .category-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .category-tab{border:2px solid var(--color-widget-border);background:#fff;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;color:var(--color-widget-secondary-text);cursor:pointer}
  .category-tab.active{background:#fff}

  .backup-section{background:#fff;border:1px solid var(--color-widget-border);border-radius:16px;padding:20px 24px;margin-bottom:16px}
  .backup-section h2{font-size:18px;margin:0 0 6px}
  /* font-size 16px minimum — same iOS auto-zoom reason as .level-select */
  .backup-textarea{width:100%;min-height:140px;font-family:monospace;font-size:16px;border:1px solid var(--color-widget-border);border-radius:8px;padding:10px;margin:10px 0;resize:vertical}
  .backup-status{margin-left:10px;font-size:12px;color:var(--color-widget-secondary-text)}
  .picker-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(110px,1fr));gap:10px;padding-bottom:60px}
  .picker-tile{position:relative;border:1px solid var(--color-widget-border);border-radius:var(--border-radius-normal);padding:10px 8px;text-align:center;cursor:pointer;background:#fff}
  .picker-tile:has(.picker-check:checked){border-color:var(--accent);background:var(--accent-light)}
  .picker-tile.checked{border-color:var(--accent);background:var(--accent-light)}
  .picker-check{position:absolute;top:6px;right:6px}
  .picker-tile .word{font-family:"Noto Sans JP",sans-serif;font-size:18px}
  .picker-tile .reading{font-size:11px;color:var(--color-widget-secondary-text)}

  /* ---------- library ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff;border-bottom:1px solid var(--color-widget-divider)}
  .back-link{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--color-widget-primary-text);font-weight:500;font-size:14px}
  .section-title{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700}
  .section-title .chip{width:26px;height:26px;border-radius:4px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans JP",sans-serif;font-size:13px}
  .tile-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));gap:10px}
  .vtile{border-radius:var(--border-radius-normal);padding:10px 6px 9px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;background:var(--accent)}
  .vtile .word{font-family:"Noto Sans JP",sans-serif;font-size:20px;font-weight:500;line-height:1.2;color:#fff}
  .vtile .reading{font-family:"Noto Sans JP",sans-serif;font-size:12px;color:#fff}
  .vtile .meaning{font-size:11px;color:var(--accent-light)}

  /* ---------- lesson (single scroll + anchor tabs) ---------- */
  html{scroll-behavior:smooth}
  .hero{position:relative;padding:18px 24px 30px;text-align:center;color:#fff;background:var(--accent)}
  .hero-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;max-width:820px;margin:0 auto}
  .hero-top .home{text-decoration:none;color:#fff;opacity:.9}
  .hero-top .counts{display:flex;gap:10px;font-size:12px}
  .hero-top .counts span{background:rgba(255,255,255,.18);border-radius:var(--border-radius-pill);padding:2px 9px}
  .hero .char{font-family:"Noto Sans JP",sans-serif;font-size:56px;line-height:1;margin:14px 0 4px}
  .hero .meaning{font-size:20px;font-weight:500}
  .tabbar{background:#2C2E35;display:flex;justify-content:center;gap:28px;padding:12px 0;position:sticky;top:0;z-index:10;flex-wrap:wrap}
  .tabbar a{color:#8A8D97;font-size:14px;font-weight:600;text-decoration:none}
  .tabbar a:hover{color:#fff}
  .lesson-main{max-width:820px;margin:0 auto;padding:0 24px 140px}
  .lesson-section{background:#fff;margin-top:20px;padding:26px 40px;border-radius:12px;scroll-margin-top:56px}
  .lesson-section h2{font-size:22px;font-weight:400;margin:0 0 14px;border-bottom:1px solid #eee;padding-bottom:12px}
  .mnemonic-label{font-size:14px;font-weight:700;color:var(--accent-dark);text-transform:uppercase;letter-spacing:.03em;margin:22px 0 8px}
  .field-row{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:10px}
  .field .k{font-size:12px;color:var(--color-widget-secondary-text);margin-bottom:2px}
  .field .v{font-size:16px} .field .v.primary{font-weight:700}
  .field .v.jp-field{font-family:"Noto Sans JP",sans-serif;font-size:20px}
  .prose{font-size:15px;line-height:1.7}
  .prose .hl{background:var(--accent-light);color:var(--accent-dark);padding:0 4px;border-radius:3px}
  .reading-row{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
  .reading-jp{font-family:"Noto Sans JP",sans-serif;font-size:24px}
  .audio-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--color-widget-border);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--color-widget-primary-text);cursor:pointer}
  .audio-btn:hover{background:#F4F4F4}

  .example-sentence{background:#F9F9FA;border:1px solid var(--color-widget-border);border-radius:var(--border-radius-normal);padding:14px 16px;margin-bottom:12px}
  .example-sentence .example-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--color-widget-secondary-text);margin-bottom:6px}
  .translation-reveal{margin-top:6px}
  .translation-reveal .sentence-translation{filter:blur(7px);user-select:none;transition:filter .15s;margin:0 0 8px;cursor:default}
  .translation-reveal.revealed .sentence-translation{filter:blur(0);user-select:text}
  .reveal-btn{border:1px solid var(--color-widget-border);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--accent-dark);cursor:pointer}
  .reveal-btn:hover{background:var(--accent-light)}
  /* padding-bottom includes the safe-area inset so these buttons clear the
     iPhone home-indicator bar when installed as a standalone full-screen
     app, instead of sitting half-behind it */
  .session-footer{
    position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--color-widget-border);
    padding:14px 24px;padding-bottom:calc(14px + env(safe-area-inset-bottom));
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
  }

  /* ---------- review / quiz ---------- */
  /* BUG FIX: on mobile, focusing the answer input pops the keyboard and
     the browser auto-scrolls that input into view — which was scrolling
     the word/kanji itself out of view above the fold, since nothing was
     anchoring it. Sticking the hero to the top of the viewport means that
     auto-scroll can never carry it away: it just pins there instead,
     staying visible the whole time you're typing. */
  .quiz-hero{background:var(--accent);color:#fff;padding:16px 20px 40px;text-align:center;transition:background .2s ease;position:sticky;top:0;z-index:5}
  .quiz-hero.state-correct{background:var(--color-correct)}
  .quiz-hero.state-incorrect{background:var(--color-incorrect)}
  .quiz-hero-top{display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:0 auto 18px}
  .session-bar{display:flex;gap:2px;max-width:640px;margin:0 auto}
  .session-bar span{flex:1;height:6px;border-radius:2px;background:rgba(255,255,255,.3)}
  .session-bar span.done{background:#fff}
  .quiz-char{font-family:"Noto Sans JP",sans-serif;font-size:64px;margin-top:26px;line-height:1}
  .quiz-card{max-width:520px;margin:-24px auto 0;background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.06);padding:28px 30px 26px;position:relative}
  .question-label{display:inline-block;background:var(--accent);color:#fff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:6px;padding:4px 10px;margin-bottom:14px}
  input.answer{width:100%;border:none;border-bottom:2px solid var(--color-widget-border);font-family:"Noto Sans JP",sans-serif;font-size:22px;padding:8px 2px;outline:none;background:transparent}
  input.answer:focus{border-bottom-color:var(--accent)}
  input.answer.correct{border-bottom-color:var(--color-correct);color:var(--color-correct)}
  input.answer.incorrect{border-bottom-color:var(--color-incorrect);color:var(--color-incorrect)}
  @keyframes shake{10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)} 30%,50%,70%{transform:translateX(-8px)} 40%,60%{transform:translateX(8px)}}
  input.answer.shake{animation:shake .4s}
  .feedback-row{display:flex;align-items:center;justify-content:space-between;margin-top:18px;min-height:40px}
  .feedback-msg{font-size:14px;font-weight:700}
  .feedback-msg.correct{color:var(--color-correct)} .feedback-msg.incorrect{color:var(--color-incorrect)}

  .word-breakdown .w .romaji{font-size:11px;color:var(--color-widget-secondary-text)}

  .word-detail .wd-head .romaji{font-size:13px;color:var(--color-widget-secondary-text)}

  {id:'下さい',word:'下さい',reading:'ください',altMeanings:['Please (do something)'],meaning:'Please Give Me',readingType:`polite request form`,level:1,meaningMnemonic:`"**Coo, da, sigh**... **PLEASE GIVE ME** a chance."`,examples:[{level:'easy',jp:'水を下さい。',romaji:'Mizu o kudasai.',en:'Please give me water.'}, {level:'advanced',jp:'もう少し時間を下さい、必ず期限までに終わらせます。',romaji:'Mou sukoshi jikan o kudasai, kanarazu kigen made ni owarasemasu.',en:'Please give me a bit more time — I\'ll definitely finish by the deadline.'}]},
  {id:'人口',word:'人口',reading:'じんこう',altMeanings:[],meaning:'Population',readingType:`noun`,level:1,meaningMnemonic:`The census counts the **POPULATION**.`,examples:[{level:'easy',jp:'人口が多いです。',romaji:'Jinkou ga ooi desu.',en:'The population is large.'}, {level:'advanced',jp:'この町の人口は、この十年で半分以下に減少した。',romaji:'Kono machi no jinkou wa, kono juunen de hanbun ika ni genshou shita.',en:'This town\'s population has dropped to less than half over the past ten years.'}]},
  {id:'力',word:'力',reading:'ちから',altMeanings:['Strength', 'Force', 'Energy'],meaning:'Power',readingType:`noun`,level:1,meaningMnemonic:`"**CHIKARA!**" flexing with sudden **POWER**.`,examples:[{level:'easy',jp:'力がありません。',romaji:'Chikara ga arimasen.',en:'I don\'t have the strength.'}, {level:'advanced',jp:'彼女は逆境に負けない強い力を持っている。',romaji:'Kanojo wa gyakkyou ni makenai tsuyoi chikara o motte iru.',en:'She possesses a strong inner power that doesn\'t yield to adversity.'}]},
  {id:'川',word:'川',reading:'かわ',altMeanings:[],meaning:'River',readingType:`noun`,level:1,meaningMnemonic:`A **CAR** gets **WOW**ed floating down the **RIVER**.`,examples:[{level:'easy',jp:'川が長いです。',romaji:'Kawa ga nagai desu.',en:'The river is long.'}, {level:'advanced',jp:'大雨の影響で、川の水位が危険な水準まで上昇した。',romaji:'Ooame no eikyou de, kawa no suii ga kiken na suijun made joushou shita.',en:'Due to the heavy rain, the river\'s water level has risen to a dangerous level.'}]},
  {id:'七',word:'七',reading:'なな',altMeanings:[],meaning:'Seven',readingType:`number`,level:1,meaningMnemonic:`**NANA** bakes exactly **SEVEN** cookies.`,examples:[{level:'easy',jp:'七はラッキーです。',romaji:'Nana wa rakkii desu.',en:'Seven is lucky.'}, {level:'advanced',jp:'この店は開店から七年間、休まず営業を続けている。',romaji:'Kono mise wa kaiten kara nananenkan, yasumazu eigyou o tsuzukete iru.',en:'This shop has stayed open without a break for seven years since opening.'}]},
  {id:'七つ',word:'七つ',reading:'ななつ',altMeanings:[],meaning:'Seven Things',readingType:`counter`,level:1,meaningMnemonic:`**NANA** counts out **SEVEN THINGS**.`,examples:[{level:'easy',jp:'七つ買いました。',romaji:'Nanatsu kaimashita.',en:'I bought seven.'}, {level:'advanced',jp:'世界には七つの海があると昔から言われている。',romaji:'Sekai ni wa nanatsu no umi ga aru to mukashi kara iwarete iru.',en:'It\'s long been said that there are seven seas in the world.'}]},
  {id:'大きさ',word:'大きさ',reading:'おおきさ',altMeanings:['Dimensions', 'Scale'],meaning:'Size',readingType:`noun`,level:1,meaningMnemonic:`"**OH, KEY, SAH!**" what a huge **SIZE**!`,examples:[{level:'easy',jp:'大きさが同じです。',romaji:'Ookisa ga onaji desu.',en:'The size is the same.'}, {level:'advanced',jp:'この問題の大きさに気づいたのは、もうかなり後になってからだった。',romaji:'Kono mondai no ookisa ni kizuita no wa, mou kanari ato ni natte kara datta.',en:'It wasn\'t until much later that the scale of this problem was realized.'}]},
  {id:'十',word:'十',reading:'じゅう',altMeanings:[],meaning:'Ten',readingType:`number`,level:1,meaningMnemonic:`At the **ZOO**, exactly **TEN** pens.`,examples:[{level:'easy',jp:'十まで数えます。',romaji:'Juu made kazoemasu.',en:'I\'ll count to ten.'}, {level:'advanced',jp:'この会社を設立してから、もう十年以上になる。',romaji:'Kono kaisha o setsuritsu shite kara, mou juunen ijou ni naru.',en:'It\'s been more than ten years since this company was founded.'}]},
  {id:'三',word:'三',reading:'さん',altMeanings:[],meaning:'Three',readingType:`number`,level:1,meaningMnemonic:`**THREE** stripes on his **SON**'s sleeve.`,examples:[{level:'easy',jp:'三が好きです。',romaji:'San ga suki desu.',en:'I like three.'}, {level:'advanced',jp:'この提案には、大きく分けて三つの問題点がある。',romaji:'Kono teian ni wa, ookiku wakete mittsu no mondaiten ga aru.',en:'This proposal has, broadly speaking, three major problems.'}]},
  {id:'三人',word:'三人',reading:'さんにん',altMeanings:[],meaning:'Three People',readingType:`counter`,level:1,meaningMnemonic:`**THREE PEOPLE** nap under the **SUN**.`,examples:[{level:'easy',jp:'三人来ます。',romaji:'Sannin kimasu.',en:'Three people are coming.'}, {level:'advanced',jp:'このプロジェクトを完成させるには、少なくとも三人の専門家が必要だ。',romaji:'Kono purojekuto o kansei saseru ni wa, sukunakutomo sannin no senmonka ga hitsuyou da.',en:'At least three specialists are needed to complete this project.'}]},
  {id:'三つ',word:'三つ',reading:'みっつ',altMeanings:[],meaning:'Three Things',readingType:`counter`,level:1,meaningMnemonic:`**THREE THINGS MEET** on the table.`,examples:[{level:'easy',jp:'三つ選んでください。',romaji:'Mittsu erande kudasai.',en:'Please choose three.'}, {level:'advanced',jp:'成功する人には、共通して三つの習慣があると言われている。',romaji:'Seikou suru hito ni wa, kyoutsuu shite mittsu no shuukan ga aru to iwarete iru.',en:'It\'s said that successful people commonly share three habits.'}]},
  {id:'入る',word:'入る',reading:'はいる',altMeanings:['To go into', 'To join', 'To get in'],meaning:'To Enter',readingType:`godan verb`,level:1,meaningMnemonic:`"**HI!** Rule one: **ENTER** quietly."`,examples:[{level:'easy',jp:'お風呂に入ります。',romaji:'Ofuro ni hairimasu.',en:'I\'ll get in the bath.'}, {level:'advanced',jp:'彼はその大学に入るために、三年間浪人した。',romaji:'Kare wa sono daigaku ni hairu tame ni, sannenkan rounin shita.',en:'He spent three years as a ronin in order to get into that university.'}]},
  {id:'上げる',word:'上げる',reading:'あげる',altMeanings:['To raise', 'To give (humble)'],meaning:'To Lift Something',readingType:`ichidan verb`,level:1,meaningMnemonic:`"**AH, GEAR** up!" ready to **LIFT**.`,examples:[{level:'easy',jp:'手を上げてください。',romaji:'Te o agete kudasai.',en:'Please raise your hand.'}, {level:'advanced',jp:'政府はガソリン税を来月から引き上げる方針を発表した。',romaji:'Seifu wa gasorinzei o raigetsu kara hikiageru houshin o happyou shita.',en:'The government announced its policy of raising the gasoline tax starting next month.'}]},
  {id:'下げる',word:'下げる',reading:'さげる',altMeanings:['To hang', 'To reduce', 'To move back'],meaning:'To Lower Something',readingType:`ichidan verb`,level:1,meaningMnemonic:`"**SAH, GEAR** down," **LOWERING** slowly.`,examples:[{level:'easy',jp:'声を下げてください。',romaji:'Koe o sagete kudasai.',en:'Please lower your voice.'}, {level:'advanced',jp:'会社は競争力を保つため、製品の価格を思い切って下げた。',romaji:'Kaisha wa kyousouryoku o tamotsu tame, seihin no kakaku o omoikitte sageta.',en:'The company drastically lowered its product prices to maintain competitiveness.'}]},
  {id:'二',word:'二',reading:'に',altMeanings:[],meaning:'Two',readingType:`number`,level:1,meaningMnemonic:`Bend **TWO KNEE**s.`,examples:[{level:'easy',jp:'二階にあります。',romaji:'Nikai ni arimasu.',en:'It\'s on the second floor.'}, {level:'advanced',jp:'この計画には、大きく分けて二つの選択肢がある。',romaji:'Kono keikaku ni wa, ookiku wakete futatsu no sentakushi ga aru.',en:'This plan has, broadly speaking, two options.'}]},
  {id:'二人',word:'二人',reading:'ふたり',altMeanings:[],meaning:'Two People',readingType:`counter, irregular reading`,level:1,meaningMnemonic:`**TWO PEOPLE** pose for a **PHOTO**.`,examples:[{level:'easy',jp:'二人で行きます。',romaji:'Futari de ikimasu.',en:'The two of us will go.'}, {level:'advanced',jp:'二人は長い間連絡を取り合っていなかったが、偶然街で再会した。',romaji:'Futari wa nagai aida renraku o toriatte inakatta ga, guuzen machi de saikai shita.',en:'The two of them hadn\'t been in touch for a long time, but happened to reunite in town by chance.'}]},
  {id:'二つ',word:'二つ',reading:'ふたつ',altMeanings:[],meaning:'Two Things',readingType:`counter`,level:1,meaningMnemonic:`A **PHOTO** shows **TWO THINGS** side by side.`,examples:[{level:'easy',jp:'二つお願いします。',romaji:'Futatsu onegaishimasu.',en:'Two, please.'}, {level:'advanced',jp:'この問題を解決する方法は、大きく分けて二つ考えられる。',romaji:'Kono mondai o kaiketsu suru houhou wa, ookiku wakete futatsu kangaerareru.',en:'There are, broadly speaking, two conceivable ways to solve this problem.'}]},
  {id:'力いっぱい',word:'力いっぱい',reading:'ちからいっぱい',altMeanings:['As hard as possible', 'With full force'],meaning:'With All One\'s Strength',readingType:`adverbial phrase`,level:1,meaningMnemonic:`"**CHIKARA! EAT PIE!**" pushing with all her strength.`,examples:[{level:'easy',jp:'力いっぱい引きました。',romaji:'Chikara ippai hikimashita.',en:'I pulled with all my strength.'}, {level:'advanced',jp:'彼は力いっぱい叫んだが、誰にも声は届かなかった。',romaji:'Kare wa chikara ippai sakenda ga, dare ni mo koe wa todokanakatta.',en:'He shouted with all his strength, but his voice reached no one.'}]},
  {id:'女',word:'女',reading:'おんな',altMeanings:['Female', 'Girl (informal)'],meaning:'Woman',readingType:`noun`,level:1,meaningMnemonic:`"It's my **OWN, NAH** business," says the confident **WOMAN**.`,examples:[{level:'easy',jp:'あの女の人は医者です。',romaji:'Ano onna no hito wa isha desu.',en:'That woman is a doctor.'}, {level:'advanced',jp:'その分野で女性がリーダーの地位に就くのは、まだ珍しいことだ。',romaji:'Sono bun\'ya de josei ga riidaa no chii ni tsuku no wa, mada mezurashii koto da.',en:'It\'s still rare for a woman to rise to a leadership position in that field.'}]},

  {id:'本',word:'本',reading:'ほん',altMeanings:['Main', 'Origin (in compounds)'],meaning:'Book',readingType:`noun`,level:2,meaningMnemonic:`Your **PHONE** makes a fine bookmark for a **BOOK**.`,examples:[{level:'easy',jp:'本を読みます。',romaji:'Hon o yomimasu.',en:'I\'ll read a book.'}, {level:'advanced',jp:'この本屋には、珍しい古書がたくさん並んでいる。',romaji:'Kono hon\'ya ni wa, mezurashii kosho ga takusan narande iru.',en:'This bookstore has many rare old books lined up.'}]},
  {id:'子',word:'子',reading:'こ',altMeanings:['Kid', 'Offspring'],meaning:'Child',readingType:`noun`,level:2,meaningMnemonic:`"**CO**-me here," calls the **CHILD**.`,examples:[{level:'easy',jp:'子供がいます。',romaji:'Kodomo ga imasu.',en:'There is a child.'}, {level:'advanced',jp:'あの女の子は、まだ幼いのにとても賢い。',romaji:'Ano onna no ko wa, mada osanai noni totemo kashikoi.',en:'That girl is still young, yet very clever.'}]},
  {id:'丸',word:'丸',reading:'まる',altMeanings:['Round mark', 'Whole'],meaning:'Circle',readingType:`noun`,level:2,meaningMnemonic:`A **MARBLE** rolls in a perfect **CIRCLE**.`,examples:[{level:'easy',jp:'丸を描きます。',romaji:'Maru o egakimasu.',en:'I\'ll draw a circle.'}, {level:'advanced',jp:'彼はその話を丸ごと信じてしまったようだ。',romaji:'Kare wa sono hanashi o marugoto shinjite shimatta you da.',en:'He seems to have believed that story entirely.'}]},
  {id:'丸い',word:'丸い',reading:'まるい',altMeanings:[],meaning:'Circular',readingType:`い-adjective`,level:2,meaningMnemonic:`That **MARBLE** is perfectly **CIRCULAR**.`,examples:[{level:'easy',jp:'丸い皿です。',romaji:'Marui sara desu.',en:'It\'s a round plate.'}, {level:'advanced',jp:'彼女は、丸い眼鏡がよく似合っている。',romaji:'Kanojo wa, marui megane ga yoku niatte iru.',en:'Round glasses suit her well.'}]},
  {id:'正しい',word:'正しい',reading:'ただしい',altMeanings:[],meaning:'Correct',readingType:`い-adjective`,level:2,meaningMnemonic:`"**TAH-DAH!** That's the **CORRECT** one."`,examples:[{level:'easy',jp:'正しい答えです。',romaji:'Tadashii kotae desu.',en:'It\'s the correct answer.'}, {level:'advanced',jp:'彼の判断は、後になって正しかったことが証明された。',romaji:'Kare no handan wa, ato ni natte tadashikatta koto ga shoumei sareta.',en:'His judgment was later proven to have been correct.'}]},
  {id:'土',word:'土',reading:'つち',altMeanings:['Soil', 'Ground'],meaning:'Dirt',readingType:`noun`,level:2,meaningMnemonic:`"**TSU-CHI**" — dig up the **DIRT**.`,examples:[{level:'easy',jp:'土が柔らかいです。',romaji:'Tsuchi ga yawarakai desu.',en:'The soil is soft.'}, {level:'advanced',jp:'この地域の土は、農作物を育てるのに適していない。',romaji:'Kono chiiki no tsuchi wa, nousakubutsu o sodateru no ni tekishite inai.',en:'The soil in this area isn\'t suited for growing crops.'}]},
  {id:'犬',word:'犬',reading:'いぬ',altMeanings:[],meaning:'Dog',readingType:`noun`,level:2,meaningMnemonic:`The **DOG** barks "**EW, NO!**"`,examples:[{level:'easy',jp:'犬が好きです。',romaji:'Inu ga suki desu.',en:'I like dogs.'}, {level:'advanced',jp:'迷子になった犬を、近所の人が保護してくれた。',romaji:'Maigo ni natta inu o, kinjo no hito ga hogo shite kureta.',en:'A neighbor took in a dog that had gotten lost.'}]},
  {id:'八日',word:'八日',reading:'ようか',altMeanings:[],meaning:'Eighth Day',readingType:`noun, irregular reading (day-name)`,level:2,meaningMnemonic:`"**YO, KA!** The **EIGHTH DAY**."`,examples:[{level:'easy',jp:'八日に会いましょう。',romaji:'Youka ni aimashou.',en:'Let\'s meet on the eighth.'}, {level:'advanced',jp:'八日までに、この書類を提出しなければならない。',romaji:'Youka made ni, kono shorui o teishutsu shinakereba naranai.',en:'I have to submit this document by the eighth.'}]},
  {id:'出口',word:'出口',reading:'でぐち',altMeanings:[],meaning:'Exit',readingType:`noun`,level:2,meaningMnemonic:`"**DEH-GOO-CHI**" — mouth of the **EXIT**.`,examples:[{level:'easy',jp:'出口はどこですか。',romaji:'Deguchi wa doko desu ka.',en:'Where is the exit?'}, {level:'advanced',jp:'非常出口の場所を、事前に確認しておくべきだ。',romaji:'Hijou deguchi no basho o, jizen ni kakunin shite oku beki da.',en:'You should check the location of the emergency exit in advance.'}]},
  {id:'目',word:'目',reading:'め',altMeanings:['Item', 'Ordinal marker (as in 一番目)'],meaning:'Eye',readingType:`noun`,level:2,meaningMnemonic:`"**MAY** I look with my **EYE**?"`,examples:[{level:'easy',jp:'目が痛いです。',romaji:'Me ga itai desu.',en:'My eyes hurt.'}, {level:'advanced',jp:'彼はいつも冷静な目で状況を判断している。',romaji:'Kare wa itsumo reisei na me de joukyou o handan shite iru.',en:'He always judges situations with a calm eye.'}]},
  {id:'目玉',word:'目玉',reading:'めだま',altMeanings:[],meaning:'Eyeball',readingType:`noun`,level:2,meaningMnemonic:`"**MAY, TAMA**" — the **EYEBALL**.`,examples:[{level:'easy',jp:'目玉焼きを作ります。',romaji:'Medamayaki o tsukurimasu.',en:'I\'ll make a fried egg.'}, {level:'advanced',jp:'このセールの目玉商品は、あっという間に売り切れた。',romaji:'Kono seeru no medama shouhin wa, atto iu ma ni urikireta.',en:'The flagship item of this sale sold out in an instant.'}]},
  {id:'二月',word:'二月',reading:'にがつ',altMeanings:[],meaning:'February',readingType:`noun (calendar)`,level:2,meaningMnemonic:`Two (に) + month (がつ).`,examples:[{level:'easy',jp:'二月は寒いです。',romaji:'Nigatsu wa samui desu.',en:'February is cold.'}, {level:'advanced',jp:'二月に入ってから、急に気温が下がった。',romaji:'Nigatsu ni haitte kara, kyuu ni kion ga sagatta.',en:'Once February arrived, the temperature suddenly dropped.'}]},
  {id:'五日',word:'五日',reading:'いつか',altMeanings:[],meaning:'Fifth Day',readingType:`noun, irregular reading (day-name)`,level:2,meaningMnemonic:`"**EAT, SKAH!** By the **FIFTH DAY**."`,examples:[{level:'easy',jp:'五日に休みます。',romaji:'Itsuka ni yasumimasu.',en:'I\'ll rest on the fifth.'}, {level:'advanced',jp:'このイベントは、五日間にわたって開催される予定だ。',romaji:'Kono ibento wa, itsukakan ni watatte kaisai sareru yotei da.',en:'This event is scheduled to be held over the course of five days.'}]},
  {id:'五十',word:'五十',reading:'ごじゅう',altMeanings:[],meaning:'Fifty',readingType:`number`,level:2,meaningMnemonic:`Five (ご) + ten (じゅう).`,examples:[{level:'easy',jp:'五十円です。',romaji:'Gojuuen desu.',en:'It\'s fifty yen.'}, {level:'advanced',jp:'彼は、五十歳を過ぎても現役で活躍し続けている。',romaji:'Kare wa, gojuussai o sugitemo genneki de katsuyaku shitsuzukete iru.',en:'Even past fifty, he continues to be active and successful.'}]},
  {id:'火',word:'火',reading:'ひ',altMeanings:[],meaning:'Fire',readingType:`noun`,level:2,meaningMnemonic:`A car bursts into **FIRE**.`,examples:[{level:'easy',jp:'火が消えました。',romaji:'Hi ga kiemashita.',en:'The fire went out.'}, {level:'advanced',jp:'キャンプ場では、火の取り扱いに十分気をつけてください。',romaji:'Kyanpujou dewa, hi no toriatsukai ni juubun ki o tsukete kudasai.',en:'Please be very careful with fire at the campsite.'}]},
  {id:'五',word:'五',reading:'ご',altMeanings:[],meaning:'Five',readingType:`number`,level:2,meaningMnemonic:`"**GO** get **FIVE** more!"`,examples:[{level:'easy',jp:'五時に会います。',romaji:'Goji ni aimasu.',en:'I\'ll meet at five o\'clock.'}, {level:'advanced',jp:'このチームは、五年連続で優勝を果たしている。',romaji:'Kono chiimu wa, gonen renzoku de yuushou o hatashite iru.',en:'This team has achieved victory five years in a row.'}]},
  {id:'五つ',word:'五つ',reading:'いつつ',altMeanings:[],meaning:'Five Things',readingType:`counter`,level:2,meaningMnemonic:`"**EAT-SU!**" — **FIVE THINGS**.`,examples:[{level:'easy',jp:'五つ買いました。',romaji:'Itsutsu kaimashita.',en:'I bought five.'}, {level:'advanced',jp:'このパズルには、五つのピースが欠けている。',romaji:'Kono pazuru ni wa, itsutsu no piisu ga kakete iru.',en:'This puzzle is missing five pieces.'}]},
  {id:'四',word:'四',reading:'よん',altMeanings:[],meaning:'Four',readingType:`number`,level:2,meaningMnemonic:`"**YAWN**, that's **FOUR** hours left."`,examples:[{level:'easy',jp:'四時に行きます。',romaji:'Yoji ni ikimasu.',en:'I\'ll go at four o\'clock.'}, {level:'advanced',jp:'四つの選択肢のうち、どれを選ぶべきか迷っている。',romaji:'Yottsu no sentakushi no uchi, dore o erabu beki ka mayotte iru.',en:'I\'m torn about which of the four options to choose.'}]},
  {id:'天才',word:'天才',reading:'てんさい',altMeanings:[],meaning:'Genius',readingType:`noun`,level:2,meaningMnemonic:`**TEN** **SIGH**s of admiration for the **GENIUS**.`,examples:[{level:'easy',jp:'天才ですね。',romaji:'Tensai desu ne.',en:'You\'re a genius, aren\'t you.'}, {level:'advanced',jp:'彼女は、幼い頃からその分野で天才的な才能を発揮していた。',romaji:'Kanojo wa, osanai koro kara sono bun\'ya de tensaiteki na sainou o hakki shite ita.',en:'She\'d been showing genius-level talent in that field since she was young.'}]},
  {id:'女子',word:'女子',reading:'じょし',altMeanings:['Female (student, athlete, etc.)'],meaning:'Girl',readingType:`noun`,level:2,meaningMnemonic:`"**JO-SHE**" — the **GIRL**'s nickname.`,examples:[{level:'easy',jp:'女子学生です。',romaji:'Joshi gakusei desu.',en:'I\'m a female student.'}, {level:'advanced',jp:'この大学の女子学生の割合は、年々増加している。',romaji:'Kono daigaku no joshi gakusei no wariai wa, nennen zouka shite iru.',en:'The proportion of female students at this university is increasing year by year.'}]},
  {id:'女の子',word:'女の子',reading:'おんなのこ',altMeanings:[],meaning:'Girl',readingType:`noun`,level:2,meaningMnemonic:`Woman (おんな) + child (こ).`,examples:[{level:'easy',jp:'女の子がいます。',romaji:'Onna no ko ga imasu.',en:'There is a girl.'}, {level:'advanced',jp:'あの女の子は、将来医者になりたいと話していた。',romaji:'Ano onna no ko wa, shourai isha ni naritai to hanashite ita.',en:'That girl was saying she wants to become a doctor in the future.'}]},

  {id:'おはよう',word:'おはよう',reading:'おはよう',altMeanings:[],meaning:'Good Morning',readingType:`fixed greeting`,level:2,meaningMnemonic:`Standard morning greeting.`,examples:[{level:'easy',jp:'おはようございます。',romaji:'Ohayou gozaimasu.',en:'Good morning.'}, {level:'advanced',jp:'彼はいつも元気よく「おはよう」と挨拶してくれる。',romaji:'Kare wa itsumo genki yoku "ohayou" to aisatsu shite kureru.',en:'He always greets me energetically with "good morning."'}]},

  {id:'ホテル',word:'ホテル',reading:'ホテル',altMeanings:[],meaning:'Hotel',readingType:`noun, loanword`,level:2,meaningMnemonic:`Matches English "hotel."`,examples:[{level:'easy',jp:'ホテルに泊まります。',romaji:'Hoteru ni tomarimasu.',en:'I\'ll stay at a hotel.'}, {level:'advanced',jp:'このホテルは、上質なサービスで高く評価されている。',romaji:'Kono hoteru wa, joushitsu na saabisu de takaku hyouka sarete iru.',en:'This hotel is highly rated for its quality service.'}]},
  {id:'入力',word:'入力',reading:'にゅうりょく',altMeanings:[],meaning:'Input',readingType:`noun/suru-verb`,level:2,meaningMnemonic:`"**NEW, RYOKU**" — **INPUT** power.`,examples:[{level:'easy',jp:'データを入力します。',romaji:'Deeta o nyuuryoku shimasu.',en:'I\'ll input the data.'}, {level:'advanced',jp:'このシステムは、音声入力にも対応している。',romaji:'Kono shisutemu wa, onsei nyuuryoku ni mo taiou shite iru.',en:'This system also supports voice input.'}]},

  {id:'一月',word:'一月',reading:'いちがつ',altMeanings:[],meaning:'January',readingType:`noun (calendar)`,level:2,meaningMnemonic:`One (いち) + month (がつ).`,examples:[{level:'easy',jp:'一月に生まれました。',romaji:'Ichigatsu ni umaremashita.',en:'I was born in January.'}, {level:'advanced',jp:'一月は、一年で最も寒い月だと言われている。',romaji:'Ichigatsu wa, ichinen de mottomo samui tsuki da to iwarete iru.',en:'January is said to be the coldest month of the year.'}]},
  {id:'日本',word:'日本',reading:'にほん',altMeanings:[],meaning:'Japan',readingType:`proper noun`,level:2,meaningMnemonic:`"**KNEE, HONE**" — the classic name for **JAPAN**.`,examples:[{level:'easy',jp:'日本が好きです。',romaji:'Nihon ga suki desu.',en:'I like Japan.'}, {level:'advanced',jp:'日本の伝統文化は、世界中の多くの人々を魅了している。',romaji:'Nihon no dentou bunka wa, sekaijuu no ooku no hitobito o miryou shite iru.',en:'Japan\'s traditional culture captivates many people around the world.'}]},
  {id:'六月',word:'六月',reading:'ろくがつ',altMeanings:[],meaning:'June',readingType:`noun (calendar)`,level:2,meaningMnemonic:`Six (ろく) + month (がつ).`,examples:[{level:'easy',jp:'六月に結婚します。',romaji:'Rokugatsu ni kekkon shimasu.',en:'I\'ll get married in June.'}, {level:'advanced',jp:'六月は、雨の日が多いことで知られている。',romaji:'Rokugatsu wa, ame no hi ga ooi koto de shirarete iru.',en:'June is known for having many rainy days.'}]},

  {id:'夕べ',word:'夕べ',reading:'ゆうべ',altMeanings:[],meaning:'Last Night',readingType:`noun`,level:2,meaningMnemonic:`"**YOU, BEH**, remember **LAST NIGHT**?"`,examples:[{level:'easy',jp:'夕べは早く寝ました。',romaji:'Yuube wa hayaku nemashita.',en:'I went to bed early last night.'}, {level:'advanced',jp:'夕べのニュースは、多くの人々に衝撃を与えた。',romaji:'Yuube no nyuusu wa, ooku no hitobito ni shougeki o ataeta.',en:'Last night\'s news shocked many people.'}]},

  {id:'左',word:'左',reading:'ひだり',altMeanings:[],meaning:'Left Direction',readingType:`noun`,level:2,meaningMnemonic:`"**HE, DAH, REE**" points **LEFT**.`,examples:[{level:'easy',jp:'左に曲がります。',romaji:'Hidari ni magarimasu.',en:'I\'ll turn left.'}, {level:'advanced',jp:'彼は、会社の中で社長の左腕として信頼されている。',romaji:'Kare wa, kaisha no naka de shachou no hidariude toshite shinrai sarete iru.',en:'Within the company, he\'s trusted as the president\'s right-hand man. (lit. "left arm")'}]},
  {id:'五月',word:'五月',reading:'ごがつ',altMeanings:[],meaning:'May',readingType:`noun (calendar)`,level:2,meaningMnemonic:`Five (ご) + month (がつ).`,examples:[{level:'easy',jp:'五月に旅行します。',romaji:'Gogatsu ni ryokou shimasu.',en:'I\'ll travel in May.'}, {level:'advanced',jp:'五月になると、この地域の花々が一斉に咲き始める。',romaji:'Gogatsu ni naru to, kono chiiki no hanabana ga issei ni sakihajimeru.',en:'When May comes, the flowers in this region all start blooming at once.'}]},
  {id:'月',word:'月',reading:'つき',altMeanings:[],meaning:'Moon',readingType:`noun`,level:2,meaningMnemonic:`"**GET** me to the **MOON**."`,examples:[{level:'easy',jp:'月がきれいです。',romaji:'Tsuki ga kirei desu.',en:'The moon is beautiful.'}, {level:'advanced',jp:'満月の夜には、いつもより明るく感じる。',romaji:'Mangetsu no yoru ni wa, itsumo yori akaruku kanjiru.',en:'On full moon nights, it feels brighter than usual.'}]},
  {id:'九日',word:'九日',reading:'ここのか',altMeanings:[],meaning:'Ninth Day',readingType:`noun, irregular reading (day-name)`,level:2,meaningMnemonic:`"**CO-CO-NO-KAH**" — **NINTH DAY**.`,examples:[{level:'easy',jp:'九日に会います。',romaji:'Kokonoka ni aimasu.',en:'I\'ll meet on the ninth.'}, {level:'advanced',jp:'九日までに、全ての準備を終わらせる必要がある。',romaji:'Kokonoka made ni, subete no junbi o owaraseru hitsuyou ga aru.',en:'All preparations need to be finished by the ninth.'}]},

  {id:'千円',word:'千円',reading:'せんえん',altMeanings:[],meaning:'One Thousand Yen',readingType:`noun`,level:2,meaningMnemonic:`Thousand (せん) + yen (えん).`,examples:[{level:'easy',jp:'千円あります。',romaji:'Sen\'en arimasu.',en:'I have a thousand yen.'}, {level:'advanced',jp:'このランチは、千円以下で食べられるのでとても人気だ。',romaji:'Kono ranchi wa, sen\'en ika de taberareru node totemo ninki da.',en:'This lunch is very popular since you can eat it for under a thousand yen.'}]},

  {id:'子犬',word:'子犬',reading:'こいぬ',altMeanings:[],meaning:'Puppy',readingType:`noun`,level:2,meaningMnemonic:`"**CO-EE-NOO**" — tiny **PUPPY**.`,examples:[{level:'easy',jp:'子犬が可愛いです。',romaji:'Koinu ga kawaii desu.',en:'The puppy is cute.'}, {level:'advanced',jp:'彼女は、保護施設からその子犬を引き取ることに決めた。',romaji:'Kanojo wa, hogo shisetsu kara sono koinu o hikitoru koto ni kimeta.',en:'She decided to adopt that puppy from the shelter.'}]},

  {id:'中々',word:'中々',reading:'なかなか',altMeanings:['Quite', 'Not easily (with negative)'],meaning:'Rather',readingType:`adverb`,level:2,meaningMnemonic:`"**NAH-KAH, NAH-KAH** — **RATHER** good!"`,examples:[{level:'easy',jp:'中々いいです。',romaji:'Nakanaka ii desu.',en:'It\'s quite good.'}, {level:'advanced',jp:'この問題は、中々解決できずに長引いている。',romaji:'Kono mondai wa, nakanaka kaiketsu dekizu ni nagabiite iru.',en:'This problem has dragged on, not easily resolved.'}]},

  {id:'田んぼ',word:'田んぼ',reading:'たんぼ',altMeanings:[],meaning:'Rice Paddy',readingType:`noun`,level:2,meaningMnemonic:`"**TAHN-BOH**" — full **RICE PADDY**.`,examples:[{level:'easy',jp:'田んぼがあります。',romaji:'Tanbo ga arimasu.',en:'There is a rice paddy.'}, {level:'advanced',jp:'この地域の田んぼは、秋になると黄金色に輝く。',romaji:'Kono chiiki no tanbo wa, aki ni naru to kogane-iro ni kagayaku.',en:'This region\'s rice paddies shine golden when autumn comes.'}]},

  {id:'七日',word:'七日',reading:'なのか',altMeanings:[],meaning:'Seventh Day',readingType:`noun, irregular reading (day-name)`,level:2,meaningMnemonic:`"**NAH-NO-KAH** — **SEVENTH DAY**."`,examples:[{level:'easy',jp:'七日に休みます。',romaji:'Nanoka ni yasumimasu.',en:'I\'ll rest on the seventh.'}, {level:'advanced',jp:'このイベントは、七日間続く予定になっている。',romaji:'Kono ibento wa, nanokakan tsuzuku yotei ni natte iru.',en:'This event is scheduled to continue for seven days.'}]},
  {id:'六',word:'六',reading:'ろく',altMeanings:[],meaning:'Six',readingType:`number`,level:2,meaningMnemonic:`**SIX** little **ROCK**s.`,examples:[{level:'easy',jp:'六時に起きます。',romaji:'Rokuji ni okimasu.',en:'I wake up at six.'}, {level:'advanced',jp:'このパズルには、六つのピースが不足している。',romaji:'Kono pazuru ni wa, muttsu no piisu ga fusoku shite iru.',en:'This puzzle is short six pieces.'}]},
  {id:'十六',word:'十六',reading:'じゅうろく',altMeanings:[],meaning:'Sixteen',readingType:`number`,level:2,meaningMnemonic:`Ten (じゅう) + six (ろく).`,examples:[{level:'easy',jp:'十六才です。',romaji:'Juurokusai desu.',en:'I\'m sixteen years old.'}, {level:'advanced',jp:'彼は十六歳にして、すでにプロとして活躍している。',romaji:'Kare wa juurokusai ni shite, sude ni puro toshite katsuyaku shite iru.',en:'At sixteen, he\'s already active as a professional.'}]},
  {id:'六日',word:'六日',reading:'むいか',altMeanings:[],meaning:'Sixth Day',readingType:`noun, irregular reading (day-name)`,level:2,meaningMnemonic:`"**MOO-EE-KAH** — **SIXTH DAY**."`,examples:[{level:'easy',jp:'六日に行きます。',romaji:'Muika ni ikimasu.',en:'I\'ll go on the sixth.'}, {level:'advanced',jp:'六日までに、この件の返答をお願いします。',romaji:'Muika made ni, kono ken no hentou o onegaishimasu.',en:'Please give me a response on this matter by the sixth.'}]},
  {id:'六つ',word:'六つ',reading:'むっつ',altMeanings:[],meaning:'Six Things',readingType:`counter`,level:2,meaningMnemonic:`"**MOOTS-TSU**" — **SIX THINGS**.`,examples:[{level:'easy',jp:'六つあります。',romaji:'Muttsu arimasu.',en:'There are six.'}, {level:'advanced',jp:'彼女は、テーブルの上に六つのカップを並べた。',romaji:'Kanojo wa, teeburu no ue ni muttsu no kappu o narabeta.',en:'She lined up six cups on the table.'}]},
  {id:'小さい',word:'小さい',reading:'ちいさい',altMeanings:[],meaning:'Small',readingType:`い-adjective`,level:2,meaningMnemonic:`A tiny magic **SHOW** — **SMALL** beads.`,examples:[{level:'easy',jp:'小さい犬です。',romaji:'Chiisai inu desu.',en:'It\'s a small dog.'}, {level:'advanced',jp:'小さな失敗が、後に大きな問題につながることもある。',romaji:'Chiisana shippai ga, nochi ni ookina mondai ni tsunagaru koto mo aru.',en:'A small mistake can sometimes lead to a bigger problem later.'}]},
  {id:'日',word:'日',reading:'ひ',altMeanings:['Day'],meaning:'Sun',readingType:`noun`,level:2,meaningMnemonic:`The sun glows, "**HEE**."`,examples:[{level:'easy',jp:'日が沈みます。',romaji:'Hi ga shizumimasu.',en:'The sun sets.'}, {level:'advanced',jp:'今日の日差しは、いつもより強く感じられる。',romaji:'Kyou no hizashi wa, itsumo yori tsuyoku kanjirareru.',en:'Today\'s sunlight feels stronger than usual.'}]},
  {id:'刀',word:'刀',reading:'かたな',altMeanings:[],meaning:'Sword',readingType:`noun`,level:2,meaningMnemonic:`Watch your **TOE**! That curved **SWORD**.`,examples:[{level:'easy',jp:'刀があります。',romaji:'Katana ga arimasu.',en:'There is a sword.'}, {level:'advanced',jp:'博物館には、歴史的に価値のある刀が展示されている。',romaji:'Hakubutsukan ni wa, rekishiteki ni kachi no aru katana ga tenji sarete iru.',en:'Historically valuable swords are on display at the museum.'}]},
  {id:'十日',word:'十日',reading:'とおか',altMeanings:[],meaning:'Tenth Day',readingType:`noun, irregular reading (day-name)`,level:2,meaningMnemonic:`"**TOH-KAH** — **TENTH DAY**."`,examples:[{level:'easy',jp:'十日に会います。',romaji:'Tooka ni aimasu.',en:'I\'ll meet on the tenth.'}, {level:'advanced',jp:'十日までにレポートを提出しなければならない。',romaji:'Tooka made ni repooto o teishutsu shinakereba naranai.',en:'I have to submit the report by the tenth.'}]},
  {id:'三日',word:'三日',reading:'みっか',altMeanings:[],meaning:'Third Day',readingType:`noun, irregular reading (day-name)`,level:2,meaningMnemonic:`"**MEE-KAH** — **THIRD DAY**."`,examples:[{level:'easy',jp:'三日休みます。',romaji:'Mikka yasumimasu.',en:'I\'ll rest for three days.'}, {level:'advanced',jp:'三日坊主にならないよう、計画を立てて取り組んでいる。',romaji:'Mikkabouzu ni naranai you, keikaku o tatete torikunde iru.',en:'I\'m making a plan and working on it so I don\'t give up after just a few days. (lit. "three-day monk")'}]},
  {id:'千',word:'千',reading:'せん',altMeanings:[],meaning:'Thousand',readingType:`number`,level:2,meaningMnemonic:`A **THOUSAND CENTS** stacked high.`,examples:[{level:'easy',jp:'千円です。',romaji:'Sen\'en desu.',en:'It\'s a thousand yen.'}, {level:'advanced',jp:'このイベントには、千人を超える人々が集まった。',romaji:'Kono ibento ni wa, sennin o koeru hitobito ga atsumatta.',en:'More than a thousand people gathered for this event.'}]},
  {id:'上る',word:'上る',reading:'のぼる',altMeanings:['To go up', 'To ascend'],meaning:'To Climb',readingType:`godan verb`,level:2,meaningMnemonic:`"**NO, BOH, ROO**" — **CLIMBING** slowly.`,examples:[{level:'easy',jp:'山に上ります。',romaji:'Yama ni noborimasu.',en:'I\'ll climb the mountain.'}, {level:'advanced',jp:'彼女は、その困難な道を一歩ずつ上っていった。',romaji:'Kanojo wa, sono konnan na michi o ippo zutsu nobotte itta.',en:'She climbed that difficult path one step at a time.'}]},

  {id:'明かり',word:'明かり',reading:'あかり',altMeanings:[],meaning:'Light',readingType:`noun`,level:3,meaningMnemonic:`"**AH-KAH-REE**" — a warm **LIGHT**.`,examples:[{level:'easy',jp:'明かりをつけます。',romaji:'Akari o tsukemasu.',en:'I\'ll turn on the light.'}, {level:'advanced',jp:'遠くに、小さな明かりがかすかに見えた。',romaji:'Tooku ni, chiisana akari ga kasuka ni mieta.',en:'A small light could faintly be seen in the distance.'}]},
  {id:'ビー玉',word:'ビー玉',reading:'びーだま',altMeanings:[],meaning:'Marble',readingType:`noun`,level:3,meaningMnemonic:`"Bee" + tama (ball) = **MARBLE**.`,examples:[{level:'easy',jp:'ビー玉で遊びます。',romaji:'Biidama de asobimasu.',en:'I\'ll play with marbles.'}, {level:'advanced',jp:'彼は、子供の頃に集めたビー玉のコレクションを今も大切にしている。',romaji:'Kare wa, kodomo no koro ni atsumeta biidama no korekushon o ima mo taisetsu ni shite iru.',en:'He still treasures the marble collection he gathered as a child.'}]},
  {id:'母',word:'母',reading:'はは',altMeanings:[],meaning:'Mother',readingType:`noun`,level:3,meaningMnemonic:`"**HAHA**!" laughs **MOTHER**.`,examples:[{level:'easy',jp:'母は先生です。',romaji:'Haha wa sensei desu.',en:'My mother is a teacher.'}, {level:'advanced',jp:'彼女は、母の教えを今も大切に守り続けている。',romaji:'Kanojo wa, haha no oshie o ima mo taisetsu ni mamoritsuzukete iru.',en:'She still cherishes and keeps to her mother\'s teachings.'}]},

  {id:'北',word:'北',reading:'きた',altMeanings:[],meaning:'North',readingType:`noun`,level:3,meaningMnemonic:`A **CHEETAH** races **NORTH**.`,examples:[{level:'easy',jp:'北に行きます。',romaji:'Kita ni ikimasu.',en:'I\'ll go north.'}, {level:'advanced',jp:'彼らは、北国の厳しい冬を乗り越えて生活している。',romaji:'Karera wa, kitaguni no kibishii fuyu o norikoete seikatsu shite iru.',en:'They live through the harsh winters of the northern country.'}]},

  {id:'〜人',word:'〜人',reading:'にん',altMeanings:[],meaning:'Number Of People',readingType:`counter`,level:3,meaningMnemonic:`Straightforward counter for **PEOPLE**.`,examples:[{level:'easy',jp:'三人来ました。',romaji:'Sannin kimashita.',en:'Three people came.'}, {level:'advanced',jp:'この会議には十人以上の外国人が参加する予定だ。',romaji:'Kono kaigi ni wa juunin ijou no gaikokujin ga sanka suru yotei da.',en:'More than ten foreigners are expected to attend this meeting.'}]},

  {id:'中古',word:'中古',reading:'ちゅうこ',altMeanings:[],meaning:'Secondhand',readingType:`noun/adjectival`,level:3,meaningMnemonic:`"**CHEW, KOH**" — a bit old, **SECONDHAND**.`,examples:[{level:'easy',jp:'中古の車です。',romaji:'Chuuko no kuruma desu.',en:'It\'s a secondhand car.'}, {level:'advanced',jp:'彼は、予算を抑えるために中古の家具を買うことにした。',romaji:'Kare wa, yosan o osaeru tame ni chuuko no kagu o kau koto ni shita.',en:'He decided to buy secondhand furniture to keep costs down.'}]},

  {id:'十台',word:'十台',reading:'じゅうだい',altMeanings:[],meaning:'Ten Machines',readingType:`counter`,level:3,meaningMnemonic:`Ten (じゅう) + machine counter (だい).`,examples:[{level:'easy',jp:'車が十台あります。',romaji:'Kuruma ga juudai arimasu.',en:'There are ten cars.'}, {level:'advanced',jp:'この工場には、十台以上の生産ラインが稼働している。',romaji:'Kono koujou ni wa, juudai ijou no seisan rain ga kadou shite iru.',en:'More than ten production lines are operating in this factory.'}]},

  {id:'これ',word:'これ',reading:'これ',altMeanings:[],meaning:'This One',readingType:`demonstrative pronoun`,level:3,meaningMnemonic:`"**KOH-REH**" — **THIS ONE** right here.`,examples:[{level:'easy',jp:'これをください。',romaji:'Kore o kudasai.',en:'I\'ll take this one, please.'}, {level:'advanced',jp:'これこそが、私たちが長年探し求めていた答えだ。',romaji:'Kore koso ga, watashitachi ga naganen sagashimotomete ita kotae da.',en:'This is exactly the answer we\'ve been searching for all these years.'}]},

  {id:'引く',word:'引く',reading:'ひく',altMeanings:[],meaning:'To Pull',readingType:`godan verb`,level:3,meaningMnemonic:`"**HE** can really **PULL**."`,examples:[{level:'easy',jp:'ドアを引きます。',romaji:'Doa o hikimasu.',en:'I\'ll pull the door.'}, {level:'advanced',jp:'彼女は、その場の空気を一気に引き締めた。',romaji:'Kanojo wa, sono ba no kuuki o ikki ni hikishimeta.',en:'She instantly tightened the atmosphere of the room.'}]},
  {id:'広げる',word:'広げる',reading:'ひろげる',altMeanings:[],meaning:'To Spread Something',readingType:`ichidan verb`,level:3,meaningMnemonic:`The **HERO** **SPREADS** his cape wide.`,examples:[{level:'easy',jp:'地図を広げます。',romaji:'Chizu o hirogemasu.',en:'I\'ll spread out the map.'}, {level:'advanced',jp:'そのニュースは、あっという間に世界中に広がった。',romaji:'Sono nyuusu wa, atto iu ma ni sekaijuu ni hirogatta.',en:'That news spread around the world in an instant.'}]},
  {id:'止める',word:'止める',reading:'とめる',altMeanings:[],meaning:'To Stop Something',readingType:`ichidan verb`,level:3,meaningMnemonic:`"**TOH-MEH-ROO**" — **STOP** right there.`,examples:[{level:'easy',jp:'車を止めます。',romaji:'Kuruma o tomemasu.',en:'I\'ll stop the car.'}, {level:'advanced',jp:'医者は、彼にたばこを止めるよう強く勧めた。',romaji:'Isha wa, kare ni tabako o yameru you tsuyoku susumeta.',en:'The doctor strongly urged him to quit smoking.'}]},
  {id:'用いる',word:'用いる',reading:'もちいる',altMeanings:[],meaning:'To Utilize',readingType:`ichidan verb`,level:3,meaningMnemonic:`"**MOH-CHEE-EE-ROO**" — **UTILIZING** the tool well.`,examples:[{level:'easy',jp:'道具を用います。',romaji:'Dougu o mochiimasu.',en:'I\'ll utilize the tool.'}, {level:'advanced',jp:'この研究では、最新の分析手法が用いられている。',romaji:'Kono kenkyuu dewa, saishin no bunseki shuhou ga mochiirarete iru.',en:'The latest analytical methods are used in this research.'}]},
  {id:'二万',word:'二万',reading:'にまん',altMeanings:[],meaning:'Twenty Thousand',readingType:`number`,level:3,meaningMnemonic:`Two (に) + ten-thousand (まん).`,examples:[{level:'easy',jp:'二万円です。',romaji:'Niman\'en desu.',en:'It\'s twenty thousand yen.'}, {level:'advanced',jp:'この製品の開発には、二万時間以上が費やされたそうだ。',romaji:'Kono seihin no kaihatsu ni wa, niman jikan ijou ga tsuiyasareta sou da.',en:'I hear that more than twenty thousand hours were spent developing this product.'}]},
  {id:'二台',word:'二台',reading:'にだい',altMeanings:[],meaning:'Two Machines',readingType:`counter`,level:3,meaningMnemonic:`Two (に) + machine counter (だい).`,examples:[{level:'easy',jp:'車が二台あります。',romaji:'Kuruma ga nidai arimasu.',en:'There are two cars.'}, {level:'advanced',jp:'彼の家には、洗濯機が二台設置されている。',romaji:'Kare no ie ni wa, sentakuki ga nidai setchi sarete iru.',en:'Two washing machines are installed at his house.'}]},
  {id:'ベッドの下',word:'ベッドの下',reading:'べっどのした',altMeanings:[],meaning:'Under The Bed',readingType:`noun phrase`,level:3,meaningMnemonic:`Bed + の + below (した).`,examples:[{level:'easy',jp:'ベッドの下にあります。',romaji:'Beddo no shita ni arimasu.',en:'It\'s under the bed.'}, {level:'advanced',jp:'彼女は、ベッドの下に大切な思い出の品を隠していた。',romaji:'Kanojo wa, beddo no shita ni taisetsu na omoide no shina o kakushite ita.',en:'She had hidden a precious keepsake under the bed.'}]},

  {id:'冬',word:'冬',reading:'ふゆ',altMeanings:[],meaning:'Winter',readingType:`noun`,level:3,meaningMnemonic:`"**PHEW!**" it's cold — **WINTER**.`,examples:[{level:'easy',jp:'冬は寒いです。',romaji:'Fuyu wa samui desu.',en:'Winter is cold.'}, {level:'advanced',jp:'彼らは、厳しい冬を乗り越えて、無事に春を迎えた。',romaji:'Karera wa, kibishii fuyu o norikoete, buji ni haru o mukaeta.',en:'They got through the harsh winter and safely welcomed spring.'}]},
  {id:'女の人',word:'女の人',reading:'おんなのひと',altMeanings:[],meaning:'Woman',readingType:`noun`,level:3,meaningMnemonic:`Woman (おんな) + の + person (ひと).`,examples:[{level:'easy',jp:'女の人がいます。',romaji:'Onna no hito ga imasu.',en:'There is a woman.'}, {level:'advanced',jp:'あの女の人は、この分野で高く評価されている専門家だ。',romaji:'Ano onna no hito wa, kono bun\'ya de takaku hyouka sarete iru senmonka da.',en:'That woman is a highly regarded expert in this field.'}]},

  {id:'他人',word:'他人',reading:'たにん',altMeanings:[],meaning:'Another Person',readingType:`noun`,level:4,meaningMnemonic:`Other (た) + person (にん).`,examples:[{level:'easy',jp:'他人に迷惑をかけません。',romaji:'Tanin ni meiwaku o kakemasen.',en:'I won\'t bother other people.'}, {level:'advanced',jp:'彼は、他人の意見に流されず、自分の考えを貫いた。',romaji:'Kare wa, tanin no iken ni nagasarezu, jibun no kangae o tsuranuita.',en:'Without being swayed by others\' opinions, he stuck to his own thinking.'}]},

  {id:'大気',word:'大気',reading:'たいき',altMeanings:[],meaning:'Atmosphere',readingType:`noun`,level:4,meaningMnemonic:`Big (たい) + energy/air (き).`,examples:[{level:'easy',jp:'大気がきれいです。',romaji:'Taiki ga kirei desu.',en:'The atmosphere/air is clean.'}, {level:'advanced',jp:'この惑星の大気は、地球とは大きく異なる組成を持つ。',romaji:'Kono wakusei no taiki wa, chikyuu to wa ookiku kotonaru soseigi o motsu.',en:'This planet\'s atmosphere has a composition very different from Earth\'s.'}]},
  {id:'赤ちゃん',word:'赤ちゃん',reading:'あかちゃん',altMeanings:[],meaning:'Baby',readingType:`noun`,level:4,meaningMnemonic:`Red (あか) + ちゃん (cute suffix).`,examples:[{level:'easy',jp:'赤ちゃんが泣いています。',romaji:'Akachan ga naite imasu.',en:'The baby is crying.'}, {level:'advanced',jp:'彼女は、初めての赤ちゃんの誕生を心待ちにしている。',romaji:'Kanojo wa, hajimete no akachan no tanjou o kokoromachi ni shite iru.',en:'She\'s eagerly awaiting the birth of her first baby.'}]},
  {id:'竹',word:'竹',reading:'たけ',altMeanings:[],meaning:'Bamboo',readingType:`noun`,level:4,meaningMnemonic:`A **TACO** stand shaded by **BAMBOO**.`,examples:[{level:'easy',jp:'竹があります。',romaji:'Take ga arimasu.',en:'There is bamboo.'}, {level:'advanced',jp:'この庭は、青々とした竹に囲まれている。',romaji:'Kono niwa wa, aoao to shita take ni kakomarete iru.',en:'This garden is surrounded by lush green bamboo.'}]},
  {id:'竹の子',word:'竹の子',reading:'たけのこ',altMeanings:[],meaning:'Bamboo Shoot',readingType:`noun`,level:4,meaningMnemonic:`Bamboo (たけ) + の + child (こ).`,examples:[{level:'easy',jp:'竹の子が好きです。',romaji:'Takenoko ga suki desu.',en:'I like bamboo shoots.'}, {level:'advanced',jp:'この時期は、新鮮な竹の子が市場に多く出回る。',romaji:'Kono jiki wa, shinsen na takenoko ga ichiba ni ooku demawaru.',en:'At this time of year, fresh bamboo shoots are widely available at markets.'}]},
  {id:'少年',word:'少年',reading:'しょうねん',altMeanings:[],meaning:'Boy',readingType:`noun`,level:4,meaningMnemonic:`"**SHOW, NEN**" — a young **BOY**.`,examples:[{level:'easy',jp:'少年がいます。',romaji:'Shounen ga imasu.',en:'There is a boy.'}, {level:'advanced',jp:'あの少年は、まだ幼いながらも並外れた才能を見せている。',romaji:'Ano shounen wa, mada osanai nagara mo namihazureta sainou o misete iru.',en:'That boy, though still young, shows extraordinary talent.'}]},
  {id:'明るい',word:'明るい',reading:'あかるい',altMeanings:[],meaning:'Bright',readingType:`い-adjective`,level:4,meaningMnemonic:`"**AH-KAH-ROO-EE**" — so **BRIGHT**.`,examples:[{level:'easy',jp:'明るい部屋です。',romaji:'Akarui heya desu.',en:'It\'s a bright room.'}, {level:'advanced',jp:'彼女は、いつも明るい性格で周りを元気づけている。',romaji:'Kanojo wa, itsumo akarui seikaku de mawari o genkizukete iru.',en:'With her always-bright personality, she energizes those around her.'}]},
  {id:'虫',word:'虫',reading:'むし',altMeanings:[],meaning:'Bug',readingType:`noun`,level:4,meaningMnemonic:`That **INSECT** looks **MUSHY**.`,examples:[{level:'easy',jp:'虫がいます。',romaji:'Mushi ga imasu.',en:'There is a bug.'}, {level:'advanced',jp:'子供の頃、夏になると毛虫を捕まえて遊んだものだ。',romaji:'Kodomo no koro, natsu ni naru to kemushi o tsukamaete asonda mono da.',en:'As a child, I used to catch caterpillars and play with them in summer.'}]},
  {id:'年内',word:'年内',reading:'ねんない',altMeanings:[],meaning:'By The End Of The Year',readingType:`noun`,level:4,meaningMnemonic:`Year (ねん) + inside (ない).`,examples:[{level:'easy',jp:'年内に終わらせます。',romaji:'Nen\'nai ni owarasemasu.',en:'I\'ll finish it by the end of the year.'}, {level:'advanced',jp:'このプロジェクトは、年内に必ず完了させる必要がある。',romaji:'Kono purojekuto wa, nen\'nai ni kanarazu kanryou saseru hitsuyou ga aru.',en:'This project absolutely needs to be completed by the end of the year.'}]},
  {id:'子牛',word:'子牛',reading:'こうし',altMeanings:[],meaning:'Calf',readingType:`noun`,level:4,meaningMnemonic:`Child (こ) + cow (うし) = baby cow.`,examples:[{level:'easy',jp:'子牛がいます。',romaji:'Koushi ga imasu.',en:'There is a calf.'}, {level:'advanced',jp:'この牧場では、生まれたばかりの子牛を大切に育てている。',romaji:'Kono bokujou dewa, umareta bakari no koushi o taisetsu ni sodatete iru.',en:'At this ranch, newborn calves are raised with great care.'}]},
  {id:'平気',word:'平気',reading:'へいき',altMeanings:[],meaning:'Calm',readingType:`na-adjective`,level:4,meaningMnemonic:`"**HEY, KEY**" — staying totally **CALM**.`,examples:[{level:'easy',jp:'平気です。',romaji:'Heiki desu.',en:'I\'m fine/calm.'}, {level:'advanced',jp:'彼は、どんな困難な状況でも平気な顔をしている。',romaji:'Kare wa, donna konnan na joukyou demo heiki na kao o shite iru.',en:'He keeps a calm face no matter how difficult the situation.'}]},
  {id:'車',word:'車',reading:'くるま',altMeanings:[],meaning:'Car',readingType:`noun`,level:4,meaningMnemonic:`"**KOO-ROO-MAH**" — the **CAR**.`,examples:[{level:'easy',jp:'車で行きます。',romaji:'Kuruma de ikimasu.',en:'I\'ll go by car.'}, {level:'advanced',jp:'電車の中は、通勤時間帯でとても混んでいた。',romaji:'Densha no naka wa, tsuukin jikantai de totemo konde ita.',en:'The inside of the train was very crowded during commuting hours.'}]},
  {id:'中央',word:'中央',reading:'ちゅうおう',altMeanings:[],meaning:'Center',readingType:`noun`,level:4,meaningMnemonic:`Middle (ちゅう) + center (おう).`,examples:[{level:'easy',jp:'中央に立ちます。',romaji:'Chuuou ni tachimasu.',en:'I\'ll stand in the center.'}, {level:'advanced',jp:'その建物は、街の中央に堂々とそびえている。',romaji:'Sono tatemono wa, machi no chuuou ni doudou to sobiete iru.',en:'That building stands proudly in the center of town.'}]},
  {id:'休日',word:'休日',reading:'きゅうじつ',altMeanings:[],meaning:'Day Off',readingType:`noun`,level:4,meaningMnemonic:`Rest (きゅう) + day (じつ).`,examples:[{level:'easy',jp:'休日です。',romaji:'Kyuujitsu desu.',en:'It\'s a day off.'}, {level:'advanced',jp:'彼は、久しぶりの休日を家族とゆっくり過ごした。',romaji:'Kare wa, hisashiburi no kyuujitsu o kazoku to yukkuri sugoshita.',en:'He spent his first day off in a while relaxing with his family.'}]},

  {id:'早い',word:'早い',reading:'はやい',altMeanings:[],meaning:'Early',readingType:`い-adjective`,level:4,meaningMnemonic:`"**HAH-YAH-EE**" — so **EARLY**.`,examples:[{level:'easy',jp:'早く起きます。',romaji:'Hayaku okimasu.',en:'I\'ll wake up early.'}, {level:'advanced',jp:'彼の対応は、驚くほど早くて的確だった。',romaji:'Kare no taiou wa, odoroku hodo hayakute tekikaku datta.',en:'His response was surprisingly quick and precise.'}]},
  {id:'元気',word:'元気',reading:'げんき',altMeanings:[],meaning:'Energy',readingType:`na-adjective`,level:4,meaningMnemonic:`Origin (げん) + energy (き).`,examples:[{level:'easy',jp:'元気ですか。',romaji:'Genki desu ka.',en:'Are you well?'}, {level:'advanced',jp:'彼女は、その知らせを聞いて一気に元気を取り戻した。',romaji:'Kanojo wa, sono shirase o kiite ikki ni genki o torimodoshita.',en:'She instantly regained her energy upon hearing that news.'}]},
  {id:'気',word:'気',reading:'き',altMeanings:['Spirit', 'Mood'],meaning:'Energy',readingType:`noun`,level:4,meaningMnemonic:`Turn the **KEY** for **ENERGY**.`,examples:[{level:'easy',jp:'気になります。',romaji:'Ki ni narimasu.',en:'I\'m curious about it.'}, {level:'advanced',jp:'彼女は、いつも周りの人の気持ちに気を配っている。',romaji:'Kanojo wa, itsumo mawari no hito no kimochi ni ki o kubatte iru.',en:'She\'s always attentive to the feelings of those around her.'}]},
  {id:'名人',word:'名人',reading:'めいじん',altMeanings:[],meaning:'Expert',readingType:`noun`,level:4,meaningMnemonic:`Name (めい) + person (じん).`,examples:[{level:'easy',jp:'名人です。',romaji:'Meijin desu.',en:'He\'s a master/expert.'}, {level:'advanced',jp:'彼は、その分野で名人として広く知られている。',romaji:'Kare wa, sono bun\'ya de meijin toshite hiroku shirarete iru.',en:'He\'s widely known as a master in that field.'}]},
  {id:'花火',word:'花火',reading:'はなび',altMeanings:[],meaning:'Fireworks',readingType:`noun`,level:4,meaningMnemonic:`Flower (はな) + fire (び) = **FIREWORKS**.`,examples:[{level:'easy',jp:'花火を見ます。',romaji:'Hanabi o mimasu.',en:'I\'ll watch fireworks.'}, {level:'advanced',jp:'夏の夜空を彩る花火大会は、毎年多くの人を惹きつけている。',romaji:'Natsu no yozora o irodoru hanabi taikai wa, maitoshi ooku no hito o hikitsukete iru.',en:'The fireworks display that colors the summer night sky draws many people every year.'}]},
  {id:'先ず',word:'先ず',reading:'まず',altMeanings:[],meaning:'First Of All',readingType:`adverb`,level:4,meaningMnemonic:`"**MAH-ZU**" — **FIRST OF ALL**, listen up.`,examples:[{level:'easy',jp:'まず食べましょう。',romaji:'Mazu tabemashou.',en:'Let\'s eat first.'}, {level:'advanced',jp:'まず何よりも、この計画の目的をはっきりさせるべきだ。',romaji:'Mazu nani yori mo, kono keikaku no mokuteki o hakkiri saseru beki da.',en:'First of all, above anything, we should make the purpose of this plan clear.'}]},
  {id:'一年生',word:'一年生',reading:'いちねんせい',altMeanings:[],meaning:'First Year Student',readingType:`noun`,level:4,meaningMnemonic:`One (いち) + year (ねん) + student (せい).`,examples:[{level:'easy',jp:'一年生です。',romaji:'Ichinensei desu.',en:'I\'m a first-year student.'}, {level:'advanced',jp:'あの一年生は、入学したばかりなのにすでに周囲から一目置かれている。',romaji:'Ano ichinensei wa, nyuugaku shita bakari na noni sude ni shuui kara ichimoku okarete iru.',en:'That first-year student, though only just enrolled, is already respected by those around them.'}]},
  {id:'五百',word:'五百',reading:'ごひゃく',altMeanings:[],meaning:'Five Hundred',readingType:`number`,level:4,meaningMnemonic:`Five (ご) + hundred (ひゃく).`,examples:[{level:'easy',jp:'五百円です。',romaji:'Gohyakuen desu.',en:'It\'s five hundred yen.'}, {level:'advanced',jp:'この本は、五百ページを超える大作だ。',romaji:'Kono hon wa, gohyaku peeji o koeru taisaku da.',en:'This book is a magnum opus of over five hundred pages.'}]},
  {id:'平ら',word:'平ら',reading:'たいら',altMeanings:[],meaning:'Flat',readingType:`na-adjective`,level:4,meaningMnemonic:`"**TIE-RAH**" — perfectly **FLAT**.`,examples:[{level:'easy',jp:'平らな道です。',romaji:'Taira na michi desu.',en:'It\'s a flat road.'}, {level:'advanced',jp:'この土地は、平らで農業に適していると言われている。',romaji:'Kono tochi wa, taira de nougyou ni tekishite iru to iwarete iru.',en:'This land is said to be flat and suitable for farming.'}]},
  {id:'花',word:'花',reading:'はな',altMeanings:[],meaning:'Flower',readingType:`noun`,level:4,meaningMnemonic:`**HANNAH** waters her **FLOWER**s.`,examples:[{level:'easy',jp:'花がきれいです。',romaji:'Hana ga kirei desu.',en:'The flowers are beautiful.'}, {level:'advanced',jp:'毎年春になると、この公園は花見の人々で賑わう。',romaji:'Maitoshi haru ni naru to, kono kouen wa hanami no hitobito de nigiwau.',en:'Every spring, this park bustles with people cherry-blossom viewing.'}]},
  {id:'足',word:'足',reading:'あし',altMeanings:['Leg'],meaning:'Foot',readingType:`noun`,level:4,meaningMnemonic:`Pull a **SOCK** onto your **FOOT**.`,examples:[{level:'easy',jp:'足が痛いです。',romaji:'Ashi ga itai desu.',en:'My foot hurts.'}, {level:'advanced',jp:'準備の時間が足りないと、彼は心配していた。',romaji:'Junbi no jikan ga tarinai to, kare wa shinpai shite ita.',en:'He was worried that there wasn\'t enough time to prepare.'}]},
  {id:'四十',word:'四十',reading:'よんじゅう',altMeanings:[],meaning:'Forty',readingType:`number`,level:4,meaningMnemonic:`Four (よん) + ten (じゅう).`,examples:[{level:'easy',jp:'四十才です。',romaji:'Yonjussai desu.',en:'I\'m forty years old.'}, {level:'advanced',jp:'彼は、四十代になってからキャリアを大きく転換させた。',romaji:'Kare wa, yonjuudai ni natte kara kyaria o ookiku tenkan saseta.',en:'After entering his forties, he made a major career shift.'}]},

  {id:'四千',word:'四千',reading:'よんせん',altMeanings:[],meaning:'Four Thousand',readingType:`number`,level:4,meaningMnemonic:`Four (よん) + thousand (せん).`,examples:[{level:'easy',jp:'四千円です。',romaji:'Yonsen\'en desu.',en:'It\'s four thousand yen.'}, {level:'advanced',jp:'このイベントには、四千人を超える人々が来場した。',romaji:'Kono ibento ni wa, yonsen-nin o koeru hitobito ga raijou shita.',en:'More than four thousand people attended this event.'}]},
  {id:'さようなら',word:'さようなら',reading:'さようなら',altMeanings:[],meaning:'Goodbye',readingType:`fixed phrase`,level:4,meaningMnemonic:`Standard formal farewell.`,examples:[{level:'easy',jp:'さようなら、また会いましょう。',romaji:'Sayounara, mata aimashou.',en:'Goodbye, let\'s meet again.'}, {level:'advanced',jp:'彼女は、涙を浮かべながら「さようなら」と静かに告げた。',romaji:'Kanojo wa, namida o ukabenagara "sayounara" to shizuka ni tsugeta.',en:'With tears welling up, she quietly said "goodbye."'}]},
  {id:'こんばんは',word:'こんばんは',reading:'こんばんは',altMeanings:[],meaning:'Good Evening',readingType:`fixed greeting`,level:4,meaningMnemonic:`Standard evening greeting.`,examples:[{level:'easy',jp:'こんばんは、元気ですか。',romaji:'Konbanwa, genki desu ka.',en:'Good evening, how are you?'}, {level:'advanced',jp:'彼は、いつも礼儀正しく「こんばんは」と挨拶をする。',romaji:'Kare wa, itsumo reigi tadashiku "konbanwa" to aisatsu o suru.',en:'He always greets people politely with "good evening."'}]},
  {id:'主人',word:'主人',reading:'しゅじん',altMeanings:['Husband', 'Master (of a shop)'],meaning:'Head Of Household',readingType:`noun`,level:4,meaningMnemonic:`The **MASTER** of the house.`,examples:[{level:'easy',jp:'主人がいます。',romaji:'Shujin ga imasu.',en:'I have a husband.'}, {level:'advanced',jp:'この店の主人は、長年にわたって地域の人々に愛されてきた。',romaji:'Kono mise no shujin wa, naganen ni watatte chiiki no hitobito ni aisarete kita.',en:'This shop\'s owner has been loved by the local community for years.'}]},
  {id:'穴',word:'穴',reading:'あな',altMeanings:[],meaning:'Hole',readingType:`noun`,level:4,meaningMnemonic:`**ANNA** digs a **HOLE**.`,examples:[{level:'easy',jp:'穴があります。',romaji:'Ana ga arimasu.',en:'There is a hole.'}, {level:'advanced',jp:'その計画には、まだいくつかの穴があるように思う。',romaji:'Sono keikaku ni wa, mada ikutsuka no ana ga aru you ni omou.',en:'I feel that plan still has a few holes in it.'}]},
  {id:'百',word:'百',reading:'ひゃく',altMeanings:[],meaning:'Hundred',readingType:`number`,level:4,meaningMnemonic:`A **HUNDRED** fluffy **YAK**s.`,examples:[{level:'easy',jp:'百円ください。',romaji:'Hyakuen kudasai.',en:'Please give me a hundred yen.'}, {level:'advanced',jp:'このホールには、百万人以上の人が訪れたことがある。',romaji:'Kono hooru ni wa, hyakuman-nin ijou no hito ga otozureta koto ga aru.',en:'More than a million people have visited this hall.'}]},
  {id:'氷',word:'氷',reading:'こおり',altMeanings:[],meaning:'Ice',readingType:`noun`,level:4,meaningMnemonic:`**COREY** slips on **ICE**.`,examples:[{level:'easy',jp:'氷が冷たいです。',romaji:'Koori ga tsumetai desu.',en:'The ice is cold.'}, {level:'advanced',jp:'かき氷は、夏の暑さをしのぐ定番のデザートだ。',romaji:'Kakigoori wa, natsu no atsusa o shinogu teiban no dezaato da.',en:'Shaved ice is the classic dessert for getting through summer heat.'}]},
  {id:'丸ごと',word:'丸ごと',reading:'まるごと',altMeanings:[],meaning:'In Its Entirety',readingType:`adverb`,level:4,meaningMnemonic:`"**MAH-ROO-GOH-TOH**" — the whole thing.`,examples:[{level:'easy',jp:'丸ごと食べます。',romaji:'Marugoto tabemasu.',en:'I\'ll eat it whole.'}, {level:'advanced',jp:'彼は、その話を丸ごと信じてしまったようだ。',romaji:'Kare wa, sono hanashi o marugoto shinjite shimatta you da.',en:'He seems to have believed the whole story entirely.'}]},
  {id:'一気に',word:'一気に',reading:'いっきに',altMeanings:[],meaning:'In One Go',readingType:`adverb`,level:4,meaningMnemonic:`"**EEK-KEE-NEE**" — **IN ONE GO**.`,examples:[{level:'easy',jp:'一気に飲みます。',romaji:'Ikkini nomimasu.',en:'I\'ll drink it all at once.'}, {level:'advanced',jp:'彼は、その仕事を一気に終わらせてしまった。',romaji:'Kare wa, sono shigoto o ikkini owarasete shimatta.',en:'He finished that job all in one go.'}]},
  {id:'車内',word:'車内',reading:'しゃない',altMeanings:[],meaning:'Inside The Car',readingType:`noun`,level:4,meaningMnemonic:`Car (しゃ) + inside (ない).`,examples:[{level:'easy',jp:'車内にいます。',romaji:'Shanai ni imasu.',en:'I\'m inside the car.'}, {level:'advanced',jp:'車内の忘れ物は、駅の事務所に届けられていることが多い。',romaji:'Shanai no wasuremono wa, eki no jimusho ni todokerarete iru koto ga ooi.',en:'Items forgotten inside trains are often turned in at the station office.'}]},
  {id:'宝石',word:'宝石',reading:'ほうせき',altMeanings:[],meaning:'Jewel',readingType:`noun`,level:4,meaningMnemonic:`Treasure (ほう) + stone (せき).`,examples:[{level:'easy',jp:'宝石が好きです。',romaji:'Houseki ga suki desu.',en:'I like jewelry.'}, {level:'advanced',jp:'彼女は、その宝石の美しさに思わず息をのんだ。',romaji:'Kanojo wa, sono houseki no utsukushisa ni omowazu iki o nonda.',en:'She unconsciously caught her breath at the jewel\'s beauty.'}]},
  {id:'先月',word:'先月',reading:'せんげつ',altMeanings:[],meaning:'Last Month',readingType:`noun`,level:4,meaningMnemonic:`Previous (せん) + month (げつ).`,examples:[{level:'easy',jp:'先月旅行しました。',romaji:'Sengetsu ryokou shimashita.',en:'I traveled last month.'}, {level:'advanced',jp:'先月の売り上げは、予想を大きく上回った。',romaji:'Sengetsu no uriage wa, yosou o ookiku uwamawatta.',en:'Last month\'s sales greatly exceeded expectations.'}]},
