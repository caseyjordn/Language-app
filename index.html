  {id:'出かける',word:'出かける',reading:'でかける',altMeanings:[],meaning:'To Go Out',readingType:`ichidan verb`,level:4,meaningMnemonic:`Exit (で) + hang (かける) = **GO OUT**.`,examples:[{level:'easy',jp:'出かけます。',romaji:'Dekakemasu.',en:'I\'ll go out.'}, {level:'advanced',jp:'彼女は、天気がいい日はいつも散歩に出かけている。',romaji:'Kanojo wa, tenki ga ii hi wa itsumo sanpo ni dekakete iru.',en:'She always goes out for a walk on nice days.'}]},
  {id:'打つ',word:'打つ',reading:'うつ',altMeanings:[],meaning:'To Hit Something',readingType:`godan verb`,level:4,meaningMnemonic:`"**OO-TSU**" — **HIT** it square.`,examples:[{level:'easy',jp:'釘を打ちます。',romaji:'Kugi o uchimasu.',en:'I\'ll hit the nail.'}, {level:'advanced',jp:'監督は選手たちに、次の試合に向けて気持ちを打ち込むよう伝えた。',romaji:'Kantoku wa senshu-tachi ni, tsugi no shiai ni mukete kimochi o uchikomu you tsutaeta.',en:'The coach told the players to put their full energy into the next match.'}]},
  {id:'生きる',word:'生きる',reading:'いきる',altMeanings:[],meaning:'To Live',readingType:`ichidan verb`,level:4,meaningMnemonic:`"**EE-KEE-ROO**" — truly **LIVING**.`,examples:[{level:'easy',jp:'元気に生きます。',romaji:'Genki ni ikimasu.',en:'I\'ll live energetically.'}, {level:'advanced',jp:'彼女は、困難な人生を乗り越え、強く生きてきた。',romaji:'Kanojo wa, konnan na jinsei o norikoe, tsuyoku ikite kita.',en:'She\'s overcome a difficult life and lived on strongly.'}]},
  {id:'口にする',word:'口にする',reading:'くちにする',altMeanings:[],meaning:'To Mention',readingType:`compound verb phrase`,level:4,meaningMnemonic:`Mouth (くち) + に + do (する).`,examples:[{level:'easy',jp:'それを口にしません。',romaji:'Sore o kuchi ni shimasen.',en:'I won\'t mention that.'}, {level:'advanced',jp:'彼は、その話題を決して口にしようとしなかった。',romaji:'Kare wa, sono wadai o kesshite kuchi ni shiyou to shinakatta.',en:'He never once tried to bring up that topic.'}]},
  {id:'休む',word:'休む',reading:'やすむ',altMeanings:[],meaning:'To Rest',readingType:`godan verb`,level:4,meaningMnemonic:`"**YAH-SU-MOO**" — time to **REST**.`,examples:[{level:'easy',jp:'休みます。',romaji:'Yasumimasu.',en:'I\'ll rest.'}, {level:'advanced',jp:'彼は、体調を崩し、一週間、会社を休むことになった。',romaji:'Kare wa, taichou o kuzushi, isshuukan, kaisha o yasumu koto ni natta.',en:'He fell ill and ended up taking a week off work.'}]},
  {id:'申す',word:'申す',reading:'もうす',altMeanings:[],meaning:'To Say Humbly',readingType:`godan verb, humble`,level:4,meaningMnemonic:`"**MOH-SU**" — speaking **HUMBLY**.`,examples:[{level:'easy',jp:'そう申します。',romaji:'Sou moushimasu.',en:'That\'s what I say (humbly).'}, {level:'advanced',jp:'彼は、自分の非礼を丁重に申し上げて謝罪した。',romaji:'Kare wa, jibun no hirei o teichou ni moushiagete shazai shita.',en:'He humbly apologized for his own rudeness.'}]},
  {id:'見る',word:'見る',reading:'みる',altMeanings:[],meaning:'To See',readingType:`ichidan verb`,level:4,meaningMnemonic:`An eye on legs, **SEE**ing everything.`,examples:[{level:'easy',jp:'映画を見ます。',romaji:'Eiga o mimasu.',en:'I\'ll watch a movie.'}, {level:'advanced',jp:'彼の意見に、私も全く同じ見方をしている。',romaji:'Kare no iken ni, watashi mo mattaku onaji mikata o shite iru.',en:'I share exactly the same view as his opinion.'}]},
  {id:'見せる',word:'見せる',reading:'みせる',altMeanings:[],meaning:'To Show',readingType:`ichidan verb`,level:4,meaningMnemonic:`"**MEE-SEH-ROO**" — **SHOWING** off.`,examples:[{level:'easy',jp:'見せてください。',romaji:'Misete kudasai.',en:'Please show me.'}, {level:'advanced',jp:'彼女は、その困難な状況でも笑顔を見せ続けた。',romaji:'Kanojo wa, sono konnan na joukyou demo egao o misetsuzuketa.',en:'She kept showing a smile even in that difficult situation.'}]},
  {id:'気に入る',word:'気に入る',reading:'きにいる',altMeanings:[],meaning:'To Take A Liking',readingType:`compound verb phrase`,level:4,meaningMnemonic:`Energy (き) + に + enter (いる).`,examples:[{level:'easy',jp:'気に入りました。',romaji:'Ki ni irimashita.',en:'I took a liking to it.'}, {level:'advanced',jp:'彼は、その提案をすっかり気に入ったようだった。',romaji:'Kare wa, sono teian o sukkari ki ni itta you datta.',en:'He seemed to have completely taken a liking to that proposal.'}]},
  {id:'町',word:'町',reading:'まち',altMeanings:[],meaning:'Town',readingType:`noun`,level:4,meaningMnemonic:`"**MAH-CHEE**" — the **TOWN** crier.`,examples:[{level:'easy',jp:'この町が好きです。',romaji:'Kono machi ga suki desu.',en:'I like this town.'}, {level:'advanced',jp:'下町には、昔ながらの雰囲気が今も残っている。',romaji:'Shitamachi ni wa, mukashinagara no fun\'iki ga ima mo nokotte iru.',en:'The old downtown still retains its traditional atmosphere today.'}]},
  {id:'宝',word:'宝',reading:'たから',altMeanings:[],meaning:'Treasure',readingType:`noun`,level:4,meaningMnemonic:`"**TAH-KAH-RAH**" — true **TREASURE**.`,examples:[{level:'easy',jp:'宝物があります。',romaji:'Takaramono ga arimasu.',en:'I have a treasure.'}, {level:'advanced',jp:'彼にとって、家族との時間こそが何よりの宝だ。',romaji:'Kare ni totte, kazoku to no jikan koso ga nani yori no takara da.',en:'For him, time with his family is his greatest treasure of all.'}]},
  {id:'二十日',word:'二十日',reading:'はつか',altMeanings:[],meaning:'Twentieth Day',readingType:`noun, irregular reading (day-name)`,level:4,meaningMnemonic:`"**HAH-TSU-KAH**" — **TWENTIETH DAY**.`,examples:[{level:'easy',jp:'二十日に会います。',romaji:'Hatsuka ni aimasu.',en:'I\'ll meet on the twentieth.'}, {level:'advanced',jp:'二十日までに、この案件を片付けなければならない。',romaji:'Hatsuka made ni, kono anken o katazukenakereba naranai.',en:'I have to settle this matter by the twentieth.'}]},
  {id:'二百',word:'二百',reading:'にひゃく',altMeanings:[],meaning:'Two Hundred',readingType:`number`,level:4,meaningMnemonic:`Two (に) + hundred (ひゃく).`,examples:[{level:'easy',jp:'二百円です。',romaji:'Nihyakuen desu.',en:'It\'s two hundred yen.'}, {level:'advanced',jp:'この博物館には、二百点を超える貴重な作品が展示されている。',romaji:'Kono hakubutsukan ni wa, nihyakuten o koeru kichou na sakuhin ga tenji sarete iru.',en:'This museum displays more than two hundred valuable works.'}]},
  {id:'花見',word:'花見',reading:'はなみ',altMeanings:[],meaning:'Viewing Cherry Blossoms',readingType:`noun`,level:4,meaningMnemonic:`Flower (はな) + see (み).`,examples:[{level:'easy',jp:'花見をします。',romaji:'Hanami o shimasu.',en:'I\'ll go cherry-blossom viewing.'}, {level:'advanced',jp:'毎年春になると、この公園は花見客で大変賑わう。',romaji:'Maitoshi haru ni naru to, kono kouen wa hanamikyaku de taihen nigiwau.',en:'Every spring, this park is bustling with cherry-blossom viewers.'}]},
  {id:'村',word:'村',reading:'むら',altMeanings:[],meaning:'Village',readingType:`noun`,level:4,meaningMnemonic:`Pool the **MOOLAH** for the **VILLAGE**.`,examples:[{level:'easy',jp:'小さい村です。',romaji:'Chiisai mura desu.',en:'It\'s a small village.'}, {level:'advanced',jp:'この村人たちは、代々農業を営んで暮らしてきた。',romaji:'Kono murabito-tachi wa, daidai nougyou o itonande kurashite kita.',en:'These villagers have lived by farming for generations.'}]},
  {id:'村人',word:'村人',reading:'むらびと',altMeanings:[],meaning:'Villager',readingType:`noun`,level:4,meaningMnemonic:`Village (むら) + person (ひと).`,examples:[{level:'easy',jp:'村人がいます。',romaji:'Murabito ga imasu.',en:'There are villagers.'}, {level:'advanced',jp:'この村人たちは、代々受け継がれてきた祭りを大切にしている。',romaji:'Kono murabito-tachi wa, daidai uketsugarete kita matsuri o taisetsu ni shite iru.',en:'These villagers cherish the festival passed down through generations.'}]},
  {id:'見方',word:'見方',reading:'みかた',altMeanings:[],meaning:'Way Of Seeing',readingType:`noun`,level:4,meaningMnemonic:`See (み) + direction (かた).`,examples:[{level:'easy',jp:'見方が違います。',romaji:'Mikata ga chigaimasu.',en:'Our ways of seeing it differ.'}, {level:'advanced',jp:'彼の見方には、いつも独自の鋭さが感じられる。',romaji:'Kare no mikata ni wa, itsumo dokuji no surudosa ga kanjirareru.',en:'There\'s always a distinctive sharpness to his perspective.'}]},
  {id:'天気',word:'天気',reading:'てんき',altMeanings:[],meaning:'Weather',readingType:`noun`,level:4,meaningMnemonic:`Heaven (てん) + energy (き).`,examples:[{level:'easy',jp:'天気がいいです。',romaji:'Tenki ga ii desu.',en:'The weather is nice.'}, {level:'advanced',jp:'この地域の天気は、非常に変わりやすいことで知られている。',romaji:'Kono chiiki no tenki wa, hijou ni kawariyasui koto de shirarete iru.',en:'This region\'s weather is known for being extremely changeable.'}]},

  {id:'どれ',word:'どれ',reading:'どれ',altMeanings:[],meaning:'Which One',readingType:`question word`,level:4,meaningMnemonic:`"**DOH-REH**" — **WHICH ONE**?`,examples:[{level:'easy',jp:'どれがいいですか。',romaji:'Dore ga ii desu ka.',en:'Which one is good?'}, {level:'advanced',jp:'数ある選択肢の中で、どれが最適か判断するのは難しい。',romaji:'Suu aru sentakushi no naka de, dore ga saiteki ka handan suru no wa muzukashii.',en:'It\'s difficult to judge which is the best option among the many available.'}]},
  {id:'白い',word:'白い',reading:'しろい',altMeanings:[],meaning:'White',readingType:`い-adjective`,level:4,meaningMnemonic:`"**SHEE-ROH-EE**" — it's **WHITE**.`,examples:[{level:'easy',jp:'白い服です。',romaji:'Shiroi fuku desu.',en:'It\'s white clothing.'}, {level:'advanced',jp:'彼は無実を主張し、白黒はっきりさせたいと言った。',romaji:'Kare wa mujitsu o shuchou shi, shirokuro hakkiri sasetai to itta.',en:'He claimed innocence and said he wanted to make things clear, black and white.'}]},
  {id:'年',word:'年',reading:'とし',altMeanings:['Age'],meaning:'Year',readingType:`noun`,level:4,meaningMnemonic:`"**TOH-SHEE**" — one whole **YEAR**.`,examples:[{level:'easy',jp:'今年は忙しいです。',romaji:'Kotoshi wa isogashii desu.',en:'This year is busy.'}, {level:'advanced',jp:'彼はこの会社で、もう二十年以上働いている。',romaji:'Kare wa kono kaisha de, mou nijuunen ijou hataraite iru.',en:'He\'s been working at this company for more than twenty years now.'}]},
  {id:'２０１１年',word:'２０１１年',reading:'にせんじゅういちねん',altMeanings:[],meaning:'Year 2011',readingType:`noun (date)`,level:4,meaningMnemonic:`2 (に) + 1000 (せん) + 10 (じゅう) + 1 (いち) + year (ねん).`,examples:[{level:'easy',jp:'２０１１年に生まれました。',romaji:'Nisenjuuichinen ni umaremashita.',en:'I was born in 2011.'}, {level:'advanced',jp:'２０１１年は、多くの人にとって忘れられない年になった。',romaji:'Nisenjuuichinen wa, ooku no hito ni totte wasurerarenai toshi ni natta.',en:'2011 became an unforgettable year for many people.'}]},
  {id:'年中',word:'年中',reading:'ねんじゅう',altMeanings:[],meaning:'Year Round',readingType:`noun/adverb`,level:4,meaningMnemonic:`Year (ねん) + throughout (じゅう).`,examples:[{level:'easy',jp:'年中忙しいです。',romaji:'Nenjuu isogashii desu.',en:'I\'m busy all year round.'}, {level:'advanced',jp:'この店は、年中無休で営業していることで知られている。',romaji:'Kono mise wa, nenjuu mukyuu de eigyou shite iru koto de shirarete iru.',en:'This shop is known for operating year-round without any holidays.'}]},
  {id:'うん',word:'うん',reading:'うん',altMeanings:[],meaning:'Yep',readingType:`casual affirmative`,level:4,meaningMnemonic:`Casual "yes."`,examples:[{level:'easy',jp:'うん、分かった。',romaji:'Un, wakatta.',en:'Yeah, got it.'}, {level:'advanced',jp:'彼は、うんともすんとも言わずに黙っていた。',romaji:'Kare wa, un tomo sun tomo iwazu ni damatte ita.',en:'He stayed silent, not saying a single word either way.'}]},
  {id:'はい',word:'はい',reading:'はい',altMeanings:[],meaning:'Yes',readingType:`standard affirmative`,level:4,meaningMnemonic:`Standard "yes."`,examples:[{level:'easy',jp:'はい、分かりました。',romaji:'Hai, wakarimashita.',en:'Yes, understood.'}, {level:'advanced',jp:'彼女は、迷わず「はい」と即座に答えた。',romaji:'Kanojo wa, mayowazu "hai" to sokuza ni kotaeta.',en:'Without hesitation, she immediately answered "yes."'}]},

  {id:'考古学',word:'考古学',reading:'こうこがく',altMeanings:[],meaning:'Archeology',readingType:`noun`,level:5,meaningMnemonic:`Think (こう) + old (こ) + study (がく).`,examples:[{level:'easy',jp:'考古学が好きです。',romaji:'Koukogaku ga suki desu.',en:'I like archeology.'}, {level:'advanced',jp:'彼の考古学に対する情熱は、子供の頃から変わらない。',romaji:'Kare no koukogaku ni taisuru jounetsu wa, kodomo no koro kara kawaranai.',en:'His passion for archeology hasn\'t changed since he was a child.'}]},

  {id:'今すぐ',word:'今すぐ',reading:'いますぐ',altMeanings:[],meaning:'At Once',readingType:`adverb`,level:5,meaningMnemonic:`Now (いま) + straight/immediately (すぐ).`,examples:[{level:'easy',jp:'今すぐ来てください。',romaji:'Imasugu kite kudasai.',en:'Please come right now.'}, {level:'advanced',jp:'彼は、その知らせを聞いて今すぐにでも駆けつけたいと言った。',romaji:'Kare wa, sono shirase o kiite imasugu ni demo kaketsuketai to itta.',en:'He said he wanted to rush over immediately upon hearing the news.'}]},
  {id:'牛肉',word:'牛肉',reading:'ぎゅうにく',altMeanings:[],meaning:'Beef',readingType:`noun`,level:5,meaningMnemonic:`Cow (ぎゅう) + meat (にく).`,examples:[{level:'easy',jp:'牛肉を食べます。',romaji:'Gyuuniku o tabemasu.',en:'I\'ll eat beef.'}, {level:'advanced',jp:'この地域は、良質な牛肉の産地として知られている。',romaji:'Kono chiiki wa, ryoushitsu na gyuuniku no sanchi toshite shirarete iru.',en:'This region is known as a source of high-quality beef.'}]},
  {id:'生まれ',word:'生まれ',reading:'うまれ',altMeanings:[],meaning:'Birthplace',readingType:`noun`,level:5,meaningMnemonic:`"**OO-MAH-REH**" — the place of **BIRTH**.`,examples:[{level:'easy',jp:'東京生まれです。',romaji:'Toukyou umare desu.',en:'I was born in Tokyo.'}, {level:'advanced',jp:'彼は、その生まれ育った土地への深い愛着を語っていた。',romaji:'Kare wa, sono umare sodatta tochi e no fukai aichaku o katatte ita.',en:'He spoke of his deep attachment to the land where he was born and raised.'}]},
  {id:'青い',word:'青い',reading:'あおい',altMeanings:[],meaning:'Blue',readingType:`い-adjective`,level:5,meaningMnemonic:`"**AH-OH-EE**" — that's **BLUE**.`,examples:[{level:'easy',jp:'空が青いです。',romaji:'Sora ga aoi desu.',en:'The sky is blue.'}, {level:'advanced',jp:'彼は青年時代を、海外で過ごした経験がある。',romaji:'Kare wa seinen jidai o, kaigai de sugoshita keiken ga aru.',en:'He has the experience of having spent his youth overseas.'}]},
  {id:'体',word:'体',reading:'からだ',altMeanings:[],meaning:'Body',readingType:`noun`,level:5,meaningMnemonic:`Tie your **BODY** back to its roots.`,examples:[{level:'easy',jp:'体が痛いです。',romaji:'Karada ga itai desu.',en:'My body hurts.'}, {level:'advanced',jp:'彼女は体力をつけるため、毎朝ジョギングをしている。',romaji:'Kanojo wa tairyoku o tsukeru tame, maiasa jogingu o shite iru.',en:'She jogs every morning to build up her physical strength.'}]},
  {id:'太字',word:'太字',reading:'ふとじ',altMeanings:[],meaning:'Bold Letter',readingType:`noun`,level:5,meaningMnemonic:`Fat (ふと) + character (じ).`,examples:[{level:'easy',jp:'太字にします。',romaji:'Futoji ni shimasu.',en:'I\'ll make it bold.'}, {level:'advanced',jp:'重要な部分は、太字で強調するようにしている。',romaji:'Juuyou na bubun wa, futoji de kyouchou suru you ni shite iru.',en:'I make it a point to emphasize important parts in bold.'}]},
  {id:'男の子',word:'男の子',reading:'おとこのこ',altMeanings:[],meaning:'Boy',readingType:`noun`,level:5,meaningMnemonic:`Man (おとこ) + の + child (こ).`,examples:[{level:'easy',jp:'男の子がいます。',romaji:'Otoko no ko ga imasu.',en:'There is a boy.'}, {level:'advanced',jp:'あの男の子は、まだ幼いのに驚くほどしっかりしている。',romaji:'Ano otoko no ko wa, mada osanai noni odoroku hodo shikkari shite iru.',en:'That boy is still young, yet surprisingly mature and reliable.'}]},

  {id:'兄弟',word:'兄弟',reading:'きょうだい',altMeanings:['Siblings'],meaning:'Brothers',readingType:`noun`,level:5,meaningMnemonic:`Older brother (きょう) + younger brother (だい).`,examples:[{level:'easy',jp:'兄弟がいます。',romaji:'Kyoudai ga imasu.',en:'I have siblings.'}, {level:'advanced',jp:'彼らは、幼い頃からずっと仲の良い兄弟として知られている。',romaji:'Karera wa, osanai koro kara zutto naka no yoi kyoudai toshite shirarete iru.',en:'They\'ve long been known as close-knit siblings since childhood.'}]},

  {id:'行く',word:'行く',reading:'いく',altMeanings:[],meaning:'To Go',readingType:`godan verb`,level:5,meaningMnemonic:`"**EE-KOO**" — heading off.`,examples:[{level:'easy',jp:'学校に行きます。',romaji:'Gakkou ni ikimasu.',en:'I\'ll go to school.'}, {level:'advanced',jp:'彼女の行動は、いつも周りの人を勇気づけている。',romaji:'Kanojo no koudou wa, itsumo mawari no hito o yuukizukete iru.',en:'Her actions always encourage those around her.'}]},
  {id:'上がる',word:'上がる',reading:'あがる',altMeanings:[],meaning:'To Go Up',readingType:`godan verb`,level:5,meaningMnemonic:`"Ah, gear up!" — **GOING UP**.`,examples:[{level:'easy',jp:'二階に上がります。',romaji:'Nikai ni agarimasu.',en:'I\'ll go up to the second floor.'}, {level:'advanced',jp:'政府はガソリン税を来月から引き上げる方針を発表した。',romaji:'Seifu wa gasorinzei o raigetsu kara hikiageru houshin o happyou shita.',en:'The government announced its policy of raising the gasoline tax starting next month.'}]},
  {id:'入れる',word:'入れる',reading:'いれる',altMeanings:[],meaning:'To Insert',readingType:`ichidan verb`,level:5,meaningMnemonic:`"**EE-REH-ROO**" — **INSERTING**.`,examples:[{level:'easy',jp:'お茶を入れます。',romaji:'Ocha o iremasu.',en:'I\'ll make/pour tea.'}, {level:'advanced',jp:'彼は、その提案を計画に入れることを決めた。',romaji:'Kare wa, sono teian o keikaku ni ireru koto o kimeta.',en:'He decided to incorporate that suggestion into the plan.'}]},
  {id:'学ぶ',word:'学ぶ',reading:'まなぶ',altMeanings:[],meaning:'To Learn',readingType:`godan verb`,level:5,meaningMnemonic:`"**MAH-NAH-BOO**" — **LEARNING**.`,examples:[{level:'easy',jp:'日本語を学びます。',romaji:'Nihongo o manabimasu.',en:'I\'ll learn Japanese.'}, {level:'advanced',jp:'彼は、その失敗から多くの教訓を学んだと語っていた。',romaji:'Kare wa, sono shippai kara ooku no kyoukun o mananda to katatte ita.',en:'He spoke of having learned many lessons from that failure.'}]},
  {id:'作る',word:'作る',reading:'つくる',altMeanings:[],meaning:'To Make',readingType:`godan verb`,level:5,meaningMnemonic:`"**TSU-KOO-ROO**" — **MAKING** it.`,examples:[{level:'easy',jp:'料理を作ります。',romaji:'Ryouri o tsukurimasu.',en:'I\'ll make a meal.'}, {level:'advanced',jp:'この作品は、彼の代表作と言われている。',romaji:'Kono sakuhin wa, kare no daihyousaku to iwarete iru.',en:'This work is said to be his masterpiece.'}]},
  {id:'会う',word:'会う',reading:'あう',altMeanings:[],meaning:'To Meet',readingType:`godan verb`,level:5,meaningMnemonic:`"**AH-OO**" — **MEETING** up.`,examples:[{level:'easy',jp:'友達に会います。',romaji:'Tomodachi ni aimasu.',en:'I\'ll meet a friend.'}, {level:'advanced',jp:'彼とは、久しぶりに街で偶然会うことができた。',romaji:'Kare to wa, hisashiburi ni machi de guuzen au koto ga dekita.',en:'I was able to meet him by chance in town after a long time.'}]},
  {id:'交ぜる',word:'交ぜる',reading:'まぜる',altMeanings:[],meaning:'To Mix Something',readingType:`ichidan verb`,level:5,meaningMnemonic:`"**MAH-ZEH-ROO**" — **MIXING**.`,examples:[{level:'easy',jp:'色を交ぜます。',romaji:'Iro o mazemasu.',en:'I\'ll mix the colors.'}, {level:'advanced',jp:'この二つの色を交ぜると、きれいな緑になる。',romaji:'Kono futatsu no iro o mazeru to, kirei na midori ni naru.',en:'Mixing these two colors gives a beautiful green.'}]},
  {id:'回る',word:'回る',reading:'まわる',altMeanings:[],meaning:'To Revolve',readingType:`godan verb`,level:5,meaningMnemonic:`"**MAH-WAH-ROO**" — **REVOLVING**.`,examples:[{level:'easy',jp:'車輪が回ります。',romaji:'Sharin ga mawarimasu.',en:'The wheel turns.'}, {level:'advanced',jp:'彼は、その事件について話を聞くため、あちこち回っている。',romaji:'Kare wa, sono jiken ni tsuite hanashi o kiku tame, achikochi mawatte iru.',en:'He\'s going around here and there to hear stories about that incident.'}]},
  {id:'走る',word:'走る',reading:'はしる',altMeanings:[],meaning:'To Run',readingType:`godan verb`,level:5,meaningMnemonic:`"So fast!" — **RUNNING**.`,examples:[{level:'easy',jp:'毎朝走ります。',romaji:'Maiasa hashirimasu.',en:'I run every morning.'}, {level:'advanced',jp:'彼は毎朝、駅まで全力で走行している。',romaji:'Kare wa maiasa, eki made zenryoku de soukou shite iru.',en:'He runs at full speed to the station every morning.'}]},
  {id:'言う',word:'言う',reading:'いう',altMeanings:[],meaning:'To Say',readingType:`godan verb`,level:5,meaningMnemonic:`"**EE-OO**" — **SAYING** it plainly.`,examples:[{level:'easy',jp:'何か言います。',romaji:'Nanika iimasu.',en:'I\'ll say something.'}, {level:'advanced',jp:'彼の言葉には、いつも深い意味が込められている。',romaji:'Kare no kotoba ni wa, itsumo fukai imi ga komerarete iru.',en:'His words always carry deep meaning.'}]},
  {id:'立てる',word:'立てる',reading:'たてる',altMeanings:[],meaning:'To Stand Something Up',readingType:`ichidan verb`,level:5,meaningMnemonic:`"**TAH-TEH-ROO**" — **STANDING** it up.`,examples:[{level:'easy',jp:'旗を立てます。',romaji:'Hata o tatemasu.',en:'I\'ll put up the flag.'}, {level:'advanced',jp:'彼は若くして自分の会社を立てた。',romaji:'Kare wa wakakushite jibun no kaisha o tateta.',en:'He established his own company at a young age.'}]},
  {id:'止まる',word:'止まる',reading:'とまる',altMeanings:[],meaning:'To Stop',readingType:`godan verb`,level:5,meaningMnemonic:`"**TOH-MAH-ROO**" — a **STOP**.`,examples:[{level:'easy',jp:'車が止まります。',romaji:'Kuruma ga tomarimasu.',en:'The car will stop.'}, {level:'advanced',jp:'ここで止まってください、と彼女は静かに言った。',romaji:'Koko de tomatte kudasai, to kanojo wa shizuka ni itta.',en:'"Please stop here," she said quietly.'}]},
  {id:'出す',word:'出す',reading:'だす',altMeanings:[],meaning:'To Take Out',readingType:`godan verb`,level:5,meaningMnemonic:`"**DAH-SU**" — **TAKING** it **OUT**.`,examples:[{level:'easy',jp:'荷物を出します。',romaji:'Nimotsu o dashimasu.',en:'I\'ll take out the luggage.'}, {level:'advanced',jp:'彼女は、突然の質問に何も言葉が出てこなかった。',romaji:'Kanojo wa, totsuzen no shitsumon ni nani mo kotoba ga dete konakatta.',en:'At the sudden question, no words came out of her at all.'}]},
  {id:'考える',word:'考える',reading:'かんがえる',altMeanings:[],meaning:'To Think About',readingType:`ichidan verb`,level:5,meaningMnemonic:`"Come up with something" — **THINK ABOUT**.`,examples:[{level:'easy',jp:'よく考えます。',romaji:'Yoku kangaemasu.',en:'I\'ll think about it carefully.'}, {level:'advanced',jp:'彼の考え方には、深い思慮が感じられる。',romaji:'Kare no kangaekata ni wa, fukai shiryo ga kanjirareru.',en:'A deep thoughtfulness can be felt in his way of thinking.'}]},
  {id:'分かる',word:'分かる',reading:'わかる',altMeanings:[],meaning:'To Understand',readingType:`godan verb`,level:5,meaningMnemonic:`"**WAH-KAH-ROO**" — now I **UNDERSTAND**.`,examples:[{level:'easy',jp:'分かりました。',romaji:'Wakarimashita.',en:'I understand.'}, {level:'advanced',jp:'彼の気持ちは、なんとなく分かる気がする。',romaji:'Kare no kimochi wa, nantonaku wakaru ki ga suru.',en:'I feel like I somewhat understand how he feels.'}]},
  {id:'行き',word:'行き',reading:'ゆき',altMeanings:[],meaning:'Train Direction',readingType:`noun`,level:5,meaningMnemonic:`Go (ゆき) — heading in a **DIRECTION**.`,examples:[{level:'easy',jp:'東京行きです。',romaji:'Toukyou yuki desu.',en:'It\'s bound for Tokyo.'}, {level:'advanced',jp:'この電車は、大阪行きの最終便になる。',romaji:'Kono densha wa, Oosaka yuki no saishuubin ni naru.',en:'This train is the last one bound for Osaka.'}]},
  {id:'走行',word:'走行',reading:'そうこう',altMeanings:[],meaning:'Traveling',readingType:`noun/suru-verb`,level:5,meaningMnemonic:`Run (そう) + go (こう).`,examples:[{level:'easy',jp:'走行します。',romaji:'Soukou shimasu.',en:'It will travel/run.'}, {level:'advanced',jp:'この車は、悪路での走行に非常に適している。',romaji:'Kono kuruma wa, akuro de no soukou ni hijou ni tekishite iru.',en:'This car is very well suited for driving on rough roads.'}]},
  {id:'三角',word:'三角',reading:'さんかく',altMeanings:[],meaning:'Triangle',readingType:`noun`,level:5,meaningMnemonic:`Three (さん) + angle (かく).`,examples:[{level:'easy',jp:'三角の形です。',romaji:'Sankaku no katachi desu.',en:'It\'s a triangular shape.'}, {level:'advanced',jp:'この道の角度は、三角関数を使えば正確に計算できる。',romaji:'Kono michi no kakudo wa, sankaku kansuu o tsukaeba seikaku ni keisan dekiru.',en:'This road\'s angle can be calculated precisely using trigonometric functions.'}]},
  {id:'大学',word:'大学',reading:'だいがく',altMeanings:[],meaning:'University',readingType:`noun`,level:5,meaningMnemonic:`Big (だい) + study (がく).`,examples:[{level:'easy',jp:'大学生です。',romaji:'Daigakusei desu.',en:'I\'m a university student.'}, {level:'advanced',jp:'彼女は、有名な大学で長年、経済学を教えている。',romaji:'Kanojo wa, yuumei na daigaku de naganen, keizaigaku o oshiete iru.',en:'She\'s taught economics at a famous university for many years.'}]},
  {id:'今まで',word:'今まで',reading:'いままで',altMeanings:[],meaning:'Until Now',readingType:`noun/adverb`,level:5,meaningMnemonic:`Now (いま) + まで (until).`,examples:[{level:'easy',jp:'今まで元気でした。',romaji:'Ima made genki deshita.',en:'I\'ve been well up until now.'}, {level:'advanced',jp:'今回のプロジェクトは、今までで最も難しい挑戦だった。',romaji:'Konkai no purojekuto wa, ima made de mottomo muzukashii chousen datta.',en:'This time\'s project was the most difficult challenge yet.'}]},
  {id:'谷',word:'谷',reading:'たに',altMeanings:[],meaning:'Valley',readingType:`noun`,level:5,meaningMnemonic:`A tawny deer grazes in the **VALLEY**.`,examples:[{level:'easy',jp:'谷があります。',romaji:'Tani ga arimasu.',en:'There is a valley.'}, {level:'advanced',jp:'この谷は、四季を通じて美しい景色で知られている。',romaji:'Kono tani wa, shiki o tsuujite utsukushii keshiki de shirarete iru.',en:'This valley is known for its beautiful scenery throughout the four seasons.'}]},
  {id:'色々',word:'色々',reading:'いろいろ',altMeanings:[],meaning:'Various',readingType:`na-adjective/adverb`,level:5,meaningMnemonic:`Color (いろ) repeated = **VARIOUS** kinds.`,examples:[{level:'easy',jp:'色々あります。',romaji:'Iroiro arimasu.',en:'There are various kinds.'}, {level:'advanced',jp:'彼女の答えは、状況によって色々変わるように見えた。',romaji:'Kanojo no kotae wa, joukyou ni yotte iroiro kawaru you ni mieta.',en:'Her answer seemed to change in various ways depending on the situation.'}]},
  {id:'声',word:'声',reading:'こえ',altMeanings:[],meaning:'Voice',readingType:`noun`,level:5,meaningMnemonic:`"Kway!" rings out a loud **VOICE**.`,examples:[{level:'easy',jp:'声が大きいです。',romaji:'Koe ga ookii desu.',en:'Your voice is loud.'}, {level:'advanced',jp:'彼女の心強い声に、みんなが励まされた。',romaji:'Kanojo no kokorozuyoi koe ni, minna ga hagemasareta.',en:'Everyone was encouraged by her reassuring voice.'}]},
  {id:'西',word:'西',reading:'にし',altMeanings:[],meaning:'West',readingType:`noun`,level:5,meaningMnemonic:`"Nee-she went **WEST**."`,examples:[{level:'easy',jp:'西口はどこですか。',romaji:'Nishiguchi wa doko desu ka.',en:'Where is the west exit?'}, {level:'advanced',jp:'この地域は、西ヨーロッパの文化を色濃く受け継いでいる。',romaji:'Kono chiiki wa, nishi-yooroppa no bunka o irokoku uketsuide iru.',en:'This region strongly carries on Western European culture.'}]},
  {id:'西口',word:'西口',reading:'にしぐち',altMeanings:[],meaning:'West Exit',readingType:`noun`,level:5,meaningMnemonic:`West (にし) + exit (ぐち).`,examples:[{level:'easy',jp:'西口で待っています。',romaji:'Nishiguchi de matte imasu.',en:'I\'ll wait at the west exit.'}, {level:'advanced',jp:'待ち合わせは、駅の西口に決まった。',romaji:'Machiawase wa, eki no nishiguchi ni kimatta.',en:'The meeting place was set as the station\'s west exit.'}]},
  {id:'何',word:'何',reading:'なに',altMeanings:[],meaning:'What',readingType:`question word`,level:5,meaningMnemonic:`"Nanny, **WHAT** is that?"`,examples:[{level:'easy',jp:'何ですか。',romaji:'Nan desu ka.',en:'What is it?'}, {level:'advanced',jp:'何度説明しても、彼にはなかなか伝わらなかった。',romaji:'Nando setsumei shitemo, kare ni wa nakanaka tsutawaranakatta.',en:'No matter how many times I explained it, it just didn\'t get through to him.'}]},
  {id:'何月',word:'何月',reading:'なんがつ',altMeanings:[],meaning:'What Month',readingType:`question phrase`,level:5,meaningMnemonic:`What (なん) + month (がつ).`,examples:[{level:'easy',jp:'何月ですか。',romaji:'Nangatsu desu ka.',en:'What month is it?'}, {level:'advanced',jp:'このイベントが何月に開催されるのか、まだ発表されていない。',romaji:'Kono ibento ga nangatsu ni kaisai sareru no ka, mada happyou sarete inai.',en:'It hasn\'t been announced yet which month this event will be held in.'}]},
  {id:'何年',word:'何年',reading:'なんねん',altMeanings:[],meaning:'What Year',readingType:`question phrase`,level:5,meaningMnemonic:`What (なん) + year (ねん).`,examples:[{level:'easy',jp:'何年に生まれましたか。',romaji:'Nannen ni umaremashita ka.',en:'What year were you born?'}, {level:'advanced',jp:'この建物が何年に建てられたのか、正確には分かっていない。',romaji:'Kono tatemono ga nannen ni tateraretano ka, seikaku ni wa wakatte inai.',en:'It isn\'t precisely known what year this building was built.'}]},
  {id:'麦',word:'麦',reading:'むぎ',altMeanings:[],meaning:'Wheat',readingType:`noun`,level:5,meaningMnemonic:`"Moo, gee," says the cow in the **WHEAT** field.`,examples:[{level:'easy',jp:'麦畑があります。',romaji:'Mugibatake ga arimasu.',en:'There is a wheat field.'}, {level:'advanced',jp:'このパンは、地元で収穫された麦から作られている。',romaji:'Kono pan wa, jimoto de shuukaku sareta mugi kara tsukurarete iru.',en:'This bread is made from wheat harvested locally.'}]},
  {id:'一生',word:'一生',reading:'いっしょう',altMeanings:[],meaning:'Whole Life',readingType:`noun`,level:5,meaningMnemonic:`One (いち→いっ) + life (しょう) = **WHOLE LIFE**.`,examples:[{level:'easy',jp:'一生忘れません。',romaji:'Isshou wasuremasen.',en:'I won\'t forget it my whole life.'}, {level:'advanced',jp:'彼は、一生をかけてその研究に打ち込んできた。',romaji:'Kare wa, isshou o kakete sono kenkyuu ni uchikonde kita.',en:'He\'s devoted his whole life to that research.'}]},
  {id:'社内',word:'社内',reading:'しゃない',altMeanings:[],meaning:'Within The Company',readingType:`noun`,level:5,meaningMnemonic:`Company (しゃ) + inside (ない).`,examples:[{level:'easy',jp:'社内にいます。',romaji:'Shanai ni imasu.',en:'I\'m inside the company.'}, {level:'advanced',jp:'この件については、社内で慎重に検討する必要がある。',romaji:'Kono ken ni tsuite wa, shanai de shinchou ni kentou suru hitsuyou ga aru.',en:'This matter needs to be carefully discussed within the company.'}]},
  {id:'毛糸',word:'毛糸',reading:'けいと',altMeanings:[],meaning:'Wool Yarn',readingType:`noun`,level:5,meaningMnemonic:`Fur (け) + thread (いと).`,examples:[{level:'easy',jp:'毛糸を買いました。',romaji:'Keito o kaimashita.',en:'I bought wool yarn.'}, {level:'advanced',jp:'このセーターは、上質な毛糸から丁寧に編まれている。',romaji:'Kono seetaa wa, joushitsu na keito kara teinei ni amarete iru.',en:'This sweater is carefully knitted from high-quality wool yarn.'}]},
  {id:'あなた',word:'あなた',reading:'あなた',altMeanings:[],meaning:'You',readingType:`pronoun`,level:5,meaningMnemonic:`Standard word for **YOU**.`,examples:[{level:'easy',jp:'あなたが好きです。',romaji:'Anata ga suki desu.',en:'I like you.'}, {level:'advanced',jp:'あなたのおかげで、この困難な状況を乗り越えることができました。',romaji:'Anata no okage de, kono konnan na joukyou o norikoeru koto ga dekimashita.',en:'Thanks to you, I was able to overcome this difficult situation.'}]},
  {id:'弟',word:'弟',reading:'おとうと',altMeanings:[],meaning:'Younger Brother',readingType:`noun`,level:5,meaningMnemonic:`Roll the die — the **YOUNGER BROTHER** loses.`,examples:[{level:'easy',jp:'弟がいます。',romaji:'Otouto ga imasu.',en:'I have a younger brother.'}, {level:'advanced',jp:'彼と弟は、性格がまったく正反対だと言われている。',romaji:'Kare to otouto wa, seikaku ga mattaku seihantai da to iwarete iru.',en:'He and his younger brother are said to have completely opposite personalities.'}]},
  {id:'青年',word:'青年',reading:'せいねん',altMeanings:[],meaning:'Youth',readingType:`noun`,level:5,meaningMnemonic:`Blue/young (せい) + year (ねん).`,examples:[{level:'easy',jp:'青年です。',romaji:'Seinen desu.',en:'He is a young man.'}, {level:'advanced',jp:'彼は青年時代を、海外で過ごした経験がある。',romaji:'Kare wa seinen jidai o, kaigai de sugoshita keiken ga aru.',en:'He has the experience of having spent his youth overseas.'}]},

  {id:'全日本',word:'全日本',reading:'ぜんにほん',altMeanings:[],meaning:'All Japan',readingType:`noun`,level:6,meaningMnemonic:`All (ぜん) + Japan (にほん).`,examples:[{level:'easy',jp:'全日本大会です。',romaji:'Zennihon taikai desu.',en:'It\'s the All-Japan tournament.'}, {level:'advanced',jp:'彼女は、全日本選手権で見事な優勝を果たした。',romaji:'Kanojo wa, zennihon senshuken de migoto na yuushou o hatashita.',en:'She achieved a splendid victory at the All-Japan championship.'}]},

  {id:'足首',word:'足首',reading:'あしくび',altMeanings:[],meaning:'Ankle',readingType:`noun`,level:6,meaningMnemonic:`Foot (あし) + neck (くび).`,examples:[{level:'easy',jp:'足首が痛いです。',romaji:'Ashikubi ga itai desu.',en:'My ankle hurts.'}, {level:'advanced',jp:'彼は、試合中に足首を捻挫してしまった。',romaji:'Kare wa, shiaichuu ni ashikubi o nenza shite shimatta.',en:'He sprained his ankle during the match.'}]},
  {id:'カバン',word:'カバン',reading:'カバン',altMeanings:[],meaning:'Bag',readingType:`noun`,level:6,meaningMnemonic:`Loanword-derived (from Chinese/Dutch origin).`,examples:[{level:'easy',jp:'カバンを買いました。',romaji:'Kaban o kaimashita.',en:'I bought a bag.'}, {level:'advanced',jp:'彼女のカバンには、いつも仕事道具がぎっしり詰まっている。',romaji:'Kanojo no kaban ni wa, itsumo shigoto dougu ga gisshiri tsumatte iru.',en:'Her bag is always packed tightly with work tools.'}]},
  {id:'後ろ',word:'後ろ',reading:'うしろ',altMeanings:[],meaning:'Behind',readingType:`noun`,level:6,meaningMnemonic:`"**OO-SHEE-ROH**," stand **BEHIND**.`,examples:[{level:'easy',jp:'後ろに立ちます。',romaji:'Ushiro ni tachimasu.',en:'I\'ll stand behind.'}, {level:'advanced',jp:'彼は、その成功の後ろに隠された努力について語った。',romaji:'Kare wa, sono seikou no ushiro ni kakusareta doryoku ni tsuite katatta.',en:'He spoke of the hidden effort behind that success.'}]},

  {id:'切れる',word:'切れる',reading:'きれる',altMeanings:[],meaning:'To Be Cut',readingType:`ichidan verb`,level:6,meaningMnemonic:`Cut (き) + れる.`,examples:[{level:'easy',jp:'紐が切れました。',romaji:'Himo ga kiremashita.',en:'The string broke.'}, {level:'advanced',jp:'彼の忍耐力は、ついに限界に達し、切れてしまった。',romaji:'Kare no nintairyoku wa, tsui ni genkai ni tasshi, kirete shimatta.',en:'His patience finally reached its limit and snapped.'}]},
  {id:'写る',word:'写る',reading:'うつる',altMeanings:[],meaning:'To Be In A Photograph',readingType:`godan verb`,level:6,meaningMnemonic:`Copy (うつ) + る.`,examples:[{level:'easy',jp:'写真に写ります。',romaji:'Shashin ni utsurimasu.',en:'I\'ll be in the photo.'}, {level:'advanced',jp:'湖面には、山々の姿が美しく映っていた。',romaji:'Komen ni wa, yamayama no sugata ga utsukushiku utsutte ita.',en:'The mountains\' silhouettes were beautifully reflected on the lake\'s surface.'}]},
  {id:'行う',word:'行う',reading:'おこなう',altMeanings:[],meaning:'To Carry Something Out',readingType:`godan verb`,level:6,meaningMnemonic:`Distinct kun from 行く.`,examples:[{level:'easy',jp:'会議を行います。',romaji:'Kaigi o okonaimasu.',en:'I\'ll hold a meeting.'}, {level:'advanced',jp:'この調査は、専門家の協力のもとで慎重に行われた。',romaji:'Kono chousa wa, senmonka no kyouryoku no moto de shinchou ni okonawareta.',en:'This survey was carefully carried out with the cooperation of experts.'}]},
  {id:'死ぬ',word:'死ぬ',reading:'しぬ',altMeanings:[],meaning:'To Die',readingType:`godan verb`,level:6,meaningMnemonic:`Death (し) + ぬ.`,examples:[{level:'easy',jp:'死にたくないです。',romaji:'Shinitakunai desu.',en:'I don\'t want to die.'}, {level:'advanced',jp:'彼は、その病気で死ぬのではないかと家族全員が心配していた。',romaji:'Kare wa, sono byouki de shinu no dewanai ka to kazoku zen\'in ga shinpai shite ita.',en:'The whole family was worried he might die from that illness.'}]},
  {id:'食べる',word:'食べる',reading:'たべる',altMeanings:[],meaning:'To Eat',readingType:`ichidan verb`,level:6,meaningMnemonic:`Eat (た) + べる.`,examples:[{level:'easy',jp:'ご飯を食べます。',romaji:'Gohan o tabemasu.',en:'I\'ll eat a meal.'}, {level:'advanced',jp:'彼女は、和食の作り方を本格的に学び始めた。',romaji:'Kanojo wa, washoku no tsukurikata o honkakuteki ni manabihajimeta.',en:'She began seriously learning how to make Japanese-style food.'}]},
  {id:'首になる',word:'首になる',reading:'くびになる',altMeanings:[],meaning:'To Get Fired',readingType:`compound phrase`,level:6,meaningMnemonic:`Neck (くび) + に + なる.`,examples:[{level:'easy',jp:'首になりました。',romaji:'Kubi ni narimashita.',en:'I got fired.'}, {level:'advanced',jp:'彼は、業績不振を理由に会社を首になってしまった。',romaji:'Kare wa, gyouseki fushin o riyuu ni kaisha o kubi ni natte shimatta.',en:'He ended up getting fired from the company due to poor performance.'}]},
  {id:'生える',word:'生える',reading:'はえる',altMeanings:[],meaning:'To Grow',readingType:`ichidan verb`,level:6,meaningMnemonic:`Life (は) + える.`,examples:[{level:'easy',jp:'草が生えます。',romaji:'Kusa ga haemasu.',en:'Grass grows.'}, {level:'advanced',jp:'庭に、見慣れない植物が生えているのに気づいた。',romaji:'Niwa ni, minarenai shokubutsu ga haete iru no ni kizuita.',en:'I noticed an unfamiliar plant growing in the garden.'}]},
  {id:'有る',word:'有る',reading:'ある',altMeanings:[],meaning:'To Have',readingType:`godan verb`,level:6,meaningMnemonic:`Have (ゆう) verb form.`,examples:[{level:'easy',jp:'お金が有ります。',romaji:'Okane ga arimasu.',en:'I have money.'}, {level:'advanced',jp:'この計画には、いくつかの利点が有ると考えられている。',romaji:'Kono keikaku ni wa, ikutsuka no riten ga aru to kangaerarete iru.',en:'This plan is thought to have several advantages.'}]},
  {id:'知る',word:'知る',reading:'しる',altMeanings:[],meaning:'To Know',readingType:`godan verb`,level:6,meaningMnemonic:`Know (し) + る.`,examples:[{level:'easy',jp:'知っています。',romaji:'Shitte imasu.',en:'I know.'}, {level:'advanced',jp:'彼女は、その分野の知識をとても深く持っている。',romaji:'Kanojo wa, sono bun\'ya no chishiki o totemo fukaku motte iru.',en:'She has very deep knowledge in that field.'}]},
  {id:'亡くなる',word:'亡くなる',reading:'なくなる',altMeanings:[],meaning:'To Pass Away',readingType:`godan verb`,level:6,meaningMnemonic:`Death (な) + くなる.`,examples:[{level:'easy',jp:'祖父が亡くなりました。',romaji:'Sofu ga nakunarimashita.',en:'My grandfather passed away.'}, {level:'advanced',jp:'その事故による死亡者の数は、まだ確定していない。',romaji:'Sono jiko ni yoru shibousha no kazu wa, mada kakutei shite inai.',en:'The number of fatalities from that accident hasn\'t been confirmed yet.'}]},
  {id:'広がる',word:'広がる',reading:'ひろがる',altMeanings:[],meaning:'To Spread Out',readingType:`godan verb`,level:6,meaningMnemonic:`Wide (ひろ) + がる.`,examples:[{level:'easy',jp:'話が広がります。',romaji:'Hanashi ga hirogarimasu.',en:'The story spreads.'}, {level:'advanced',jp:'そのニュースは、あっという間に世界中に広がった。',romaji:'Sono nyuusu wa, atto iu ma ni sekaijuu ni hirogatta.',en:'That news spread around the world in an instant.'}]},
  {id:'取る',word:'取る',reading:'とる',altMeanings:[],meaning:'To Take',readingType:`godan verb`,level:6,meaningMnemonic:`Take (と) + る.`,examples:[{level:'easy',jp:'これを取ります。',romaji:'Kore o torimasu.',en:'I\'ll take this.'}, {level:'advanced',jp:'彼女は、取り扱いの難しい案件を、いつも冷静に処理している。',romaji:'Kanojo wa, toriatsukai no muzukashii anken o, itsumo reisei ni shori shite iru.',en:'She always calmly handles difficult cases.'}]},
  {id:'思う',word:'思う',reading:'おもう',altMeanings:[],meaning:'To Think',readingType:`godan verb`,level:6,meaningMnemonic:`Think (おも) + う.`,examples:[{level:'easy',jp:'そう思います。',romaji:'Sou omoimasu.',en:'I think so.'}, {level:'advanced',jp:'彼の考え方には、深い思慮が感じられる。',romaji:'Kare no kangaekata ni wa, fukai shiryo ga kanjirareru.',en:'A deep thoughtfulness can be felt in his way of thinking.'}]},
  {id:'向く',word:'向く',reading:'むく',altMeanings:[],meaning:'To Turn Toward',readingType:`godan verb`,level:6,meaningMnemonic:`Yonder (む) + く.`,examples:[{level:'easy',jp:'こちらを向いてください。',romaji:'Kochira o muite kudasai.',en:'Please face this way.'}, {level:'advanced',jp:'彼は、困難な状況にも前向きに向き合っている。',romaji:'Kare wa, konnan na joukyou ni mo maemuki ni mukiatte iru.',en:'He faces even difficult situations with a positive attitude.'}]},
  {id:'歩く',word:'歩く',reading:'あるく',altMeanings:[],meaning:'To Walk',readingType:`godan verb`,level:6,meaningMnemonic:`Walk (ある) + く.`,examples:[{level:'easy',jp:'公園を歩きます。',romaji:'Kouen o arukimasu.',en:'I\'ll walk in the park.'}, {level:'advanced',jp:'このプロジェクトは、着実に一歩ずつ前進している。',romaji:'Kono purojekuto wa, chakujitsu ni ippo zutsu zenshin shite iru.',en:'This project is steadily progressing one step at a time.'}]},
  {id:'曲',word:'曲',reading:'きょく',altMeanings:[],meaning:'Tune',readingType:`noun`,level:6,meaningMnemonic:`"**KYO-KU**, that **MUSIC** bends the room."`,examples:[{level:'easy',jp:'この曲が好きです。',romaji:'Kono kyoku ga suki desu.',en:'I like this song.'}, {level:'advanced',jp:'彼女は、感情の高まりに耐えかねて、思わず顔を曲げた。',romaji:'Kanojo wa, kanjou no takamari ni taekanete, omowazu kao o mageta.',en:'Unable to bear her rising emotions, she unconsciously twisted her face.'}]},
  {id:'地中',word:'地中',reading:'ちちゅう',altMeanings:[],meaning:'Underground',readingType:`noun`,level:6,meaningMnemonic:`Earth (ち) + middle (ちゅう).`,examples:[{level:'easy',jp:'地中にあります。',romaji:'Chichuu ni arimasu.',en:'It\'s underground.'}, {level:'advanced',jp:'この地域の地中には、豊富な資源が眠っていると言われている。',romaji:'Kono chiiki no chichuu ni wa, houfu na shigen ga nemutte iru to iwarete iru.',en:'It\'s said that abundant resources lie dormant underground in this region.'}]},
  {id:'地下',word:'地下',reading:'ちか',altMeanings:[],meaning:'Underground',readingType:`noun`,level:6,meaningMnemonic:`Earth (ち) + below (か).`,examples:[{level:'easy',jp:'地下にあります。',romaji:'Chika ni arimasu.',en:'It\'s underground.'}, {level:'advanced',jp:'彼女は、地下鉄を使って毎日通勤している。',romaji:'Kanojo wa, chikatetsu o tsukatte mainichi tsuukin shite iru.',en:'She commutes every day using the subway.'}]},
  {id:'不安',word:'不安',reading:'ふあん',altMeanings:[],meaning:'Uneasiness',readingType:`noun/na-adjective`,level:6,meaningMnemonic:`Not (ふ) + relax (あん).`,examples:[{level:'easy',jp:'不安です。',romaji:'Fuan desu.',en:'I feel uneasy.'}, {level:'advanced',jp:'彼は、将来に対する漠然とした不安を抱えているようだった。',romaji:'Kare wa, shourai ni taisuru bakuzen to shita fuan o kakaete iru you datta.',en:'He seemed to be carrying a vague unease about the future.'}]},
  {id:'米国',word:'米国',reading:'べいこく',altMeanings:[],meaning:'United States',readingType:`proper noun`,level:6,meaningMnemonic:`Rice/America (べい) + country (こく).`,examples:[{level:'easy',jp:'米国に住んでいます。',romaji:'Beikoku ni sunde imasu.',en:'I live in the United States.'}, {level:'advanced',jp:'米国からの観光客が、この地域に増えているようだ。',romaji:'Beikoku kara no kankoukyaku ga, kono chiiki ni fuete iru you da.',en:'It seems tourists from America are increasing in this area.'}]},
  {id:'大文字',word:'大文字',reading:'おおもじ',altMeanings:[],meaning:'Uppercase Letters',readingType:`noun`,level:6,meaningMnemonic:`Big (おお) + character (もじ).`,examples:[{level:'easy',jp:'大文字で書きます。',romaji:'Oomoji de kakimasu.',en:'I\'ll write in uppercase.'}, {level:'advanced',jp:'このパスワードには、大文字と小文字の両方を含める必要がある。',romaji:'Kono pasuwaado ni wa, oomoji to komoji no ryouhou o fukumeru hitsuyou ga aru.',en:'This password needs to include both uppercase and lowercase letters.'}]},
  {id:'活用',word:'活用',reading:'かつよう',altMeanings:[],meaning:'Utilizing',readingType:`noun/suru-verb`,level:6,meaningMnemonic:`Lively (かつ) + task (よう).`,examples:[{level:'easy',jp:'活用します。',romaji:'Katsuyou shimasu.',en:'I\'ll make use of it.'}, {level:'advanced',jp:'この研究では、最新の分析手法が活用されている。',romaji:'Kono kenkyuu dewa, saishin no bunseki shuhou ga katsuyou sarete iru.',en:'The latest analytical methods are utilized in this research.'}]},
  {id:'車両',word:'車両',reading:'しゃりょう',altMeanings:[],meaning:'Vehicle',readingType:`noun`,level:6,meaningMnemonic:`Car (しゃ) + both (りょう).`,examples:[{level:'easy',jp:'車両があります。',romaji:'Sharyou ga arimasu.',en:'There is a vehicle.'}, {level:'advanced',jp:'この電車の先頭車両は、いつも混雑していることで知られている。',romaji:'Kono densha no sentou sharyou wa, itsumo konzatsu shite iru koto de shirarete iru.',en:'This train\'s lead car is known for always being crowded.'}]},
  {id:'金星',word:'金星',reading:'きんせい',altMeanings:[],meaning:'Venus',readingType:`proper noun`,level:6,meaningMnemonic:`Gold (きん) + star (せい).`,examples:[{level:'easy',jp:'金星が見えます。',romaji:'Kinsei ga miemasu.',en:'Venus is visible.'}, {level:'advanced',jp:'金星は、明け方や夕方に非常に明るく輝いて見える。',romaji:'Kinsei wa, akegata ya yuugata ni hijou ni akaruku kagayaite mieru.',en:'Venus appears to shine very brightly at dawn and dusk.'}]},
  {id:'西ヨーロッパ',word:'西ヨーロッパ',reading:'にしよーろっぱ',altMeanings:[],meaning:'Western Europe',readingType:`proper noun`,level:6,meaningMnemonic:`West (にし) + "Europe."`,examples:[{level:'easy',jp:'西ヨーロッパに行きます。',romaji:'Nishi-yooroppa ni ikimasu.',en:'I\'ll go to Western Europe.'}, {level:'advanced',jp:'この地域は、西ヨーロッパの文化を色濃く受け継いでいる。',romaji:'Kono chiiki wa, nishi-yooroppa no bunka o irokoku uketsuide iru.',en:'This region strongly carries on Western European culture.'}]},
  {id:'どの',word:'どの',reading:'どの',altMeanings:[],meaning:'Which',readingType:`question demonstrative`,level:6,meaningMnemonic:`Kun-native demonstrative.`,examples:[{level:'easy',jp:'どの本ですか。',romaji:'Dono hon desu ka.',en:'Which book is it?'}, {level:'advanced',jp:'数ある選択肢の中で、どの案を採用すべきか慎重に検討している。',romaji:'Suu aru sentakushi no naka de, dono an o saiyou subeki ka shinchou ni kentou shite iru.',en:'I\'m carefully considering which of the many options should be adopted.'}]},
  {id:'耳打ち',word:'耳打ち',reading:'みみうち',altMeanings:[],meaning:'Whisper In Ear',readingType:`noun/suru-verb`,level:6,meaningMnemonic:`Ear (みみ) + hit (うち).`,examples:[{level:'easy',jp:'耳打ちします。',romaji:'Mimiuchi shimasu.',en:'I\'ll whisper in your ear.'}, {level:'advanced',jp:'彼女は、こっそりと友人に耳打ちをして何かを伝えた。',romaji:'Kanojo wa, kossori to yuujin ni mimiuchi o shite nanika o tsutaeta.',en:'She secretly whispered something to her friend.'}]},
  {id:'冬休み',word:'冬休み',reading:'ふゆやすみ',altMeanings:[],meaning:'Winter Holiday',readingType:`noun`,level:6,meaningMnemonic:`Winter (ふゆ) + rest (やすみ).`,examples:[{level:'easy',jp:'冬休みです。',romaji:'Fuyuyasumi desu.',en:'It\'s winter vacation.'}, {level:'advanced',jp:'彼らは、厳しい冬休みの間、スキー場で働いていた。',romaji:'Karera wa, kibishii fuyuyasumi no aida, sukiijou de hataraite ita.',en:'They worked at a ski resort during the harsh winter break.'}]},
  {id:'羊毛',word:'羊毛',reading:'ようもう',altMeanings:[],meaning:'Wool',readingType:`noun`,level:6,meaningMnemonic:`Sheep (よう) + fur (もう).`,examples:[{level:'easy',jp:'羊毛のセーターです。',romaji:'Youmou no seetaa desu.',en:'It\'s a wool sweater.'}, {level:'advanced',jp:'このセーターは、上質な羊毛から丁寧に作られている。',romaji:'Kono seetaa wa, joushitsu na youmou kara teinei ni tsukurarete iru.',en:'This sweater is carefully made from high-quality wool.'}]},
  {id:'手首',word:'手首',reading:'てくび',altMeanings:[],meaning:'Wrist',readingType:`noun`,level:6,meaningMnemonic:`Hand (て) + neck (くび).`,examples:[{level:'easy',jp:'手首が痛いです。',romaji:'Tekubi ga itai desu.',en:'My wrist hurts.'}, {level:'advanced',jp:'彼は、転んだ拍子に手首を骨折してしまった。',romaji:'Kare wa, koronda hyoushi ni tekubi o kossetsu shite shimatta.',en:'He fractured his wrist in the fall.'}]},
  {id:'年下',word:'年下',reading:'としした',altMeanings:[],meaning:'Younger',readingType:`noun/na-adjective`,level:6,meaningMnemonic:`Year (とし) + below (した).`,examples:[{level:'easy',jp:'年下です。',romaji:'Toshishita desu.',en:'He/she is younger.'}, {level:'advanced',jp:'彼は、年下の後輩たちからも深く慕われている。',romaji:'Kare wa, toshishita no kouhai-tachi kara mo fukaku shitawarete iru.',en:'He\'s deeply admired even by his younger juniors.'}]},
  {id:'妹',word:'妹',reading:'いもうと',altMeanings:[],meaning:'Younger Sister',readingType:`noun`,level:6,meaningMnemonic:`"**MY** **YOUNGER SISTER**," she says fondly.`,examples:[{level:'easy',jp:'妹がいます。',romaji:'Imouto ga imasu.',en:'I have a younger sister.'}, {level:'advanced',jp:'彼女と妹は、いつも一緒に買い物に出かけている。',romaji:'Kanojo to imouto wa, itsumo issho ni kaimono ni dekakete iru.',en:'She and her younger sister always go shopping together.'}]},

  {id:'西日',word:'西日',reading:'にしび',altMeanings:[],meaning:'Afternoon Sun',readingType:`noun`,level:7,meaningMnemonic:`West (にし) + sun (び).`,examples:[{level:'easy',jp:'西日が眩しいです。',romaji:'Nishibi ga mabushii desu.',en:'The afternoon sun is dazzling.'}, {level:'advanced',jp:'この部屋は、夏になると西日が強く差し込んで暑くなる。',romaji:'Kono heya wa, natsu ni naru to nishibi ga tsuyoku sashikonde atsuku naru.',en:'This room gets hot in summer as the strong afternoon sun pours in.'}]},

  {id:'この辺',word:'この辺',reading:'このへん',altMeanings:[],meaning:'Around Here',readingType:`noun`,level:7,meaningMnemonic:`This (この) + area (へん).`,examples:[{level:'easy',jp:'この辺に住んでいます。',romaji:'Kono hen ni sunde imasu.',en:'I live around this area.'}, {level:'advanced',jp:'彼の家は、この辺りでは知らない人がいないほど有名だ。',romaji:'Kare no ie wa, kono atari dewa shiranai hito ga inai hodo yuumei da.',en:'His house is so famous that there\'s no one around here who doesn\'t know it.'}]},
  {id:'先回り',word:'先回り',reading:'さきまわり',altMeanings:[],meaning:'Arriving Ahead',readingType:`noun/suru-verb`,level:7,meaningMnemonic:`Tip (さき) + revolve (まわり).`,examples:[{level:'easy',jp:'先回りします。',romaji:'Sakimawari shimasu.',en:'I\'ll go on ahead.'}, {level:'advanced',jp:'彼は、いつも相手の考えを先回りして行動している。',romaji:'Kare wa, itsumo aite no kangae o sakimawari shite koudou shite iru.',en:'He always acts by anticipating the other person\'s thinking ahead of time.'}]},
  {id:'風船',word:'風船',reading:'ふうせん',altMeanings:[],meaning:'Balloon',readingType:`noun`,level:7,meaningMnemonic:`Wind (ふう) + boat (せん) — "wind vessel."`,examples:[{level:'easy',jp:'風船を買いました。',romaji:'Fuusen o kaimashita.',en:'I bought a balloon.'}, {level:'advanced',jp:'子供たちは、色とりどりの風船を空へ飛ばして遊んでいた。',romaji:'Kodomotachi wa, iro toridori no fuusen o sora e tobashite asonde ita.',en:'The children were playing by releasing colorful balloons into the sky.'}]},
  {id:'〜札',word:'〜札',reading:'さつ',altMeanings:[],meaning:'Bill',readingType:`counter`,level:7,meaningMnemonic:`On, standalone counter.`,examples:[{level:'easy',jp:'千円札です。',romaji:'Sen\'ensatsu desu.',en:'It\'s a thousand-yen bill.'}, {level:'advanced',jp:'会場の入り口には、番号札を受け取る長い列ができていた。',romaji:'Kaijou no iriguchi ni wa, bangoufuda o uketoru nagai retsu ga dekite ita.',en:'A long line had formed at the venue\'s entrance to receive numbered tags.'}]},
  {id:'鳥',word:'鳥',reading:'とり',altMeanings:[],meaning:'Bird',readingType:`noun`,level:7,meaningMnemonic:`"**CHO**," chirps the **BIRD**.`,examples:[{level:'easy',jp:'鳥がいます。',romaji:'Tori ga imasu.',en:'There is a bird.'}, {level:'advanced',jp:'白鳥が湖の上を優雅に泳いでいた。',romaji:'Hakuchou ga mizuumi no ue o yuuga ni oyoide ita.',en:'Swans were swimming gracefully across the lake.'}]},
  {id:'黒い',word:'黒い',reading:'くろい',altMeanings:[],meaning:'Black',readingType:`い-adjective`,level:7,meaningMnemonic:`"**KOH-KOO**," dressed in **BLACK**.`,examples:[{level:'easy',jp:'黒い服です。',romaji:'Kuroi fuku desu.',en:'It\'s black clothing.'}, {level:'advanced',jp:'その主張が正しいかどうか、白黒はっきりさせる必要がある。',romaji:'Sono shuchou ga tadashii ka dou ka, shirokuro hakkiri saseru hitsuyou ga aru.',en:'We need to make clear, black and white, whether that claim is correct.'}]},
  {id:'黒人',word:'黒人',reading:'こくじん',altMeanings:[],meaning:'Black Person',readingType:`noun`,level:7,meaningMnemonic:`Black (こく) + person (じん).`,examples:[{level:'easy',jp:'黒人の人がいます。',romaji:'Kokujin no hito ga imasu.',en:'There is a Black person.'}, {level:'advanced',jp:'その映画には、様々な人種の俳優が出演している。',romaji:'Sono eiga ni wa, samazama na jinshu no haiyuu ga shutsuen shite iru.',en:'Actors of various ethnicities appear in that movie.'}]},

  {id:'時',word:'時',reading:'とき',altMeanings:[],meaning:'Time',readingType:`noun`,level:7,meaningMnemonic:`"**TOH-KEE**," what **TIME** is it?`,examples:[{level:'easy',jp:'いい時です。',romaji:'Ii toki desu.',en:'It\'s a good time.'}, {level:'advanced',jp:'彼は、時代の変化に素早く対応する能力を持っている。',romaji:'Kare wa, jidai no henka ni subayaku taiou suru nouryoku o motte iru.',en:'He has the ability to quickly adapt to the changes of the times.'}]},
  {id:'付ける',word:'付ける',reading:'つける',altMeanings:[],meaning:'To Attach Something',readingType:`ichidan verb`,level:7,meaningMnemonic:`Attach (つ) + ける.`,examples:[{level:'easy',jp:'名前を付けます。',romaji:'Namae o tsukemasu.',en:'I\'ll give it a name.'}, {level:'advanced',jp:'彼は、この件について助言を求めてきた。',romaji:'Kare wa, kono ken ni tsuite jogen o motomete kita.',en:'He came asking for advice on this matter.'}]},
  {id:'見当たる',word:'見当たる',reading:'みあたる',altMeanings:[],meaning:'To Be Found',readingType:`godan verb`,level:7,meaningMnemonic:`See (み) + hit (あたる).`,examples:[{level:'easy',jp:'鍵が見当たりません。',romaji:'Kagi ga miatarimasen.',en:'I can\'t find my keys.'}, {level:'advanced',jp:'彼の主張を裏付ける証拠は、どこにも見当たらなかった。',romaji:'Kare no shuchou o urazukeru shouko wa, doko ni mo miataranakatta.',en:'No evidence to support his claim could be found anywhere.'}]},
  {id:'切り取る',word:'切り取る',reading:'きりとる',altMeanings:[],meaning:'To Cut Off',readingType:`godan verb`,level:7,meaningMnemonic:`Cut (きり) + take (とる).`,examples:[{level:'easy',jp:'紙を切り取ります。',romaji:'Kami o kiritorimasu.',en:'I\'ll cut off the paper.'}, {level:'advanced',jp:'彼は、その部分だけを慎重に切り取って保存した。',romaji:'Kare wa, sono bubun dake o shinchou ni kiritotte hozon shita.',en:'He carefully cut off just that part and preserved it.'}]},
  {id:'明ける',word:'明ける',reading:'あける',altMeanings:[],meaning:'To Dawn',readingType:`ichidan verb`,level:7,meaningMnemonic:`Bright (あ) + ける.`,examples:[{level:'easy',jp:'夜が明けます。',romaji:'Yoru ga akemasu.',en:'Night gives way to dawn.'}, {level:'advanced',jp:'年が明けて、彼は新たな決意を胸に新年を迎えた。',romaji:'Toshi ga akete, kare wa arata na ketsui o mune ni shinnen o mukaeta.',en:'As the year turned, he welcomed the new year with fresh resolve.'}]},
  {id:'分ける',word:'分ける',reading:'わける',altMeanings:[],meaning:'To Divide Something',readingType:`ichidan verb`,level:7,meaningMnemonic:`Part (わ) + ける.`,examples:[{level:'easy',jp:'半分に分けます。',romaji:'Hanbun ni wakemasu.',en:'I\'ll divide it in half.'}, {level:'advanced',jp:'彼は、その仕事をチームで分けて進めることを提案した。',romaji:'Kare wa, sono shigoto o chiimu de wakete susumeru koto o teian shita.',en:'He suggested dividing that work among the team to move it forward.'}]},
  {id:'失う',word:'失う',reading:'うしなう',altMeanings:[],meaning:'To Lose',readingType:`godan verb`,level:7,meaningMnemonic:`Fault (うしな) + う.`,examples:[{level:'easy',jp:'財布を失いました。',romaji:'Saifu o ushinaimashita.',en:'I lost my wallet.'}, {level:'advanced',jp:'彼は、その事故で大切なものを失ってしまった。',romaji:'Kare wa, sono jiko de taisetsu na mono o ushinatte shimatta.',en:'He lost something precious in that accident.'}]},
  {id:'明日',word:'明日',reading:'あした',altMeanings:[],meaning:'Tomorrow',readingType:`noun, irregular reading`,level:7,meaningMnemonic:`"**AH-SHEE-TAH**" doesn't decompose from 明+日.`,examples:[{level:'easy',jp:'明日会います。',romaji:'Ashita aimasu.',en:'I\'ll meet tomorrow.'}, {level:'advanced',jp:'明日という日を、彼はずっと忘れないだろう。',romaji:'Ashita to iu hi o, kare wa zutto wasurenai darou.',en:'He\'ll never forget that particular tomorrow.'}]},
  {id:'光る',word:'光る',reading:'ひかる',altMeanings:[],meaning:'To Shine',readingType:`godan verb`,level:7,meaningMnemonic:`Light (ひか) + る.`,examples:[{level:'easy',jp:'星が光ります。',romaji:'Hoshi ga hikarimasu.',en:'The stars shine.'}, {level:'advanced',jp:'この製品は、太陽光を利用して光ることができる。',romaji:'Kono seihin wa, taiyoukou o riyou shite hikaru koto ga dekiru.',en:'This product can shine using sunlight.'}]},
  {id:'代わる',word:'代わる',reading:'かわる',altMeanings:[],meaning:'To Substitute For',readingType:`godan verb`,level:7,meaningMnemonic:`Substitute (かわ) + る.`,examples:[{level:'easy',jp:'彼に代わります。',romaji:'Kare ni kawarimasu.',en:'I\'ll substitute for him.'}, {level:'advanced',jp:'彼は、その仕事を代わってくれる人を探していた。',romaji:'Kare wa, sono shigoto o kawatte kureru hito o sagashite ita.',en:'He was looking for someone to take over that job in his place.'}]},
  {id:'取り出す',word:'取り出す',reading:'とりだす',altMeanings:[],meaning:'To Take Out',readingType:`godan verb`,level:7,meaningMnemonic:`Take (とり) + out (だす).`,examples:[{level:'easy',jp:'財布を取り出します。',romaji:'Saifu o toridashimasu.',en:'I\'ll take out my wallet.'}, {level:'advanced',jp:'彼は、財布から千円札を取り出して支払った。',romaji:'Kare wa, saifu kara sen\'ensatsu o toridashite shiharatta.',en:'He took a thousand-yen bill out of his wallet and paid.'}]},
  {id:'教える',word:'教える',reading:'おしえる',altMeanings:[],meaning:'To Teach',readingType:`ichidan verb`,level:7,meaningMnemonic:`Teach (おし) + える.`,examples:[{level:'easy',jp:'教えてください。',romaji:'Oshiete kudasai.',en:'Please teach me.'}, {level:'advanced',jp:'彼女は、教室の中で常に生徒たちに優しく教えている。',romaji:'Kanojo wa, kyoushitsu no naka de tsune ni seito-tachi ni yasashiku oshiete iru.',en:'In the classroom, she always teaches her students kindly.'}]},
  {id:'町民',word:'町民',reading:'ちょうみん',altMeanings:[],meaning:'Townspeople',readingType:`noun`,level:7,meaningMnemonic:`Town (ちょう) + peoples (みん).`,examples:[{level:'easy',jp:'町民がいます。',romaji:'Choumin ga imasu.',en:'There are townspeople.'}, {level:'advanced',jp:'この町民たちは、代々受け継がれてきた祭りを大切にしている。',romaji:'Kono choumin-tachi wa, daidai uketsugarete kita matsuri o taisetsu ni shite iru.',en:'These townspeople cherish the festival passed down through generations.'}]},
  {id:'交通',word:'交通',reading:'こうつう',altMeanings:[],meaning:'Traffic',readingType:`noun`,level:7,meaningMnemonic:`Mix (こう) + pass through (つう).`,examples:[{level:'easy',jp:'交通が多いです。',romaji:'Koutsuu ga ooi desu.',en:'There is a lot of traffic.'}, {level:'advanced',jp:'この道は、朝の通勤時間帯になると交通量が急増する。',romaji:'Kono michi wa, asa no tsuukin jikantai ni naru to koutsuuryou ga kyuuzou suru.',en:'Traffic on this road increases sharply during the morning commute.'}]},
  {id:'三角形',word:'三角形',reading:'さんかくけい',altMeanings:[],meaning:'Triangle',readingType:`noun`,level:7,meaningMnemonic:`Three (さん) + angle (かく) + shape (けい).`,examples:[{level:'easy',jp:'三角形です。',romaji:'Sankakukei desu.',en:'It\'s a triangle.'}, {level:'advanced',jp:'この道の角度は、三角形の原理を使えば正確に計算できる。',romaji:'Kono michi no kakudo wa, sankakukei no genri o tsukaeba seikaku ni keisan dekiru.',en:'This road\'s angle can be calculated precisely using triangle principles.'}]},
  {id:'二斤',word:'二斤',reading:'にきん',altMeanings:[],meaning:'Two Loaves Of Bread',readingType:`counter`,level:7,meaningMnemonic:`Two (に) + loaf counter (きん).`,examples:[{level:'easy',jp:'パンを二斤買いました。',romaji:'Pan o nikin kaimashita.',en:'I bought two loaves of bread.'}, {level:'advanced',jp:'このベーカリーでは、注文すれば二斤単位でも購入できる。',romaji:'Kono beekarii dewa, chuumon sureba nikin tan\'i demo kounyuu dekiru.',en:'At this bakery, you can also purchase in units of two loaves if you order ahead.'}]},
  {id:'二時半',word:'二時半',reading:'にじはん',altMeanings:[],meaning:'Two Thirty',readingType:`noun`,level:7,meaningMnemonic:`Two (に) + o'clock (じ) + half (はん).`,examples:[{level:'easy',jp:'二時半に会います。',romaji:'Nijihan ni aimasu.',en:'I\'ll meet at two thirty.'}, {level:'advanced',jp:'会議は、二時半ちょうどに始まる予定になっている。',romaji:'Kaigi wa, nijihan choudo ni hajimaru yotei ni natte iru.',en:'The meeting is scheduled to start at exactly two thirty.'}]},
  {id:'台風',word:'台風',reading:'たいふう',altMeanings:[],meaning:'Typhoon',readingType:`noun`,level:7,meaningMnemonic:`Machine/platform (たい) + wind (ふう).`,examples:[{level:'easy',jp:'台風が来ます。',romaji:'Taifuu ga kimasu.',en:'A typhoon is coming.'}, {level:'advanced',jp:'この地域は、毎年台風の被害に見舞われることで知られている。',romaji:'Kono chiiki wa, maitoshi taifuu no higai ni mimawareru koto de shirarete iru.',en:'This region is known for suffering typhoon damage every year.'}]},
  {id:'大学生',word:'大学生',reading:'だいがくせい',altMeanings:[],meaning:'University Student',readingType:`noun`,level:7,meaningMnemonic:`Big (だい) + study (がく) + student (せい).`,examples:[{level:'easy',jp:'大学生です。',romaji:'Daigakusei desu.',en:'I\'m a university student.'}, {level:'advanced',jp:'あの大学生は、まだ若いのに驚くほど責任感がある。',romaji:'Ano daigakusei wa, mada wakai noni odoroku hodo sekininkan ga aru.',en:'That university student is surprisingly responsible despite being young.'}]},
  {id:'不人気',word:'不人気',reading:'ふにんき',altMeanings:[],meaning:'Unpopular',readingType:`na-adjective`,level:7,meaningMnemonic:`Not (ふ) + popular (にんき).`,examples:[{level:'easy',jp:'不人気です。',romaji:'Funinki desu.',en:'It\'s unpopular.'}, {level:'advanced',jp:'その政策は、意外にも国民の間で不人気だったことが判明した。',romaji:'Sono seisaku wa, igai ni mo kokumin no aida de funinki datta koto ga hanmei shita.',en:'It turned out that policy was, surprisingly, unpopular among citizens.'}]},
  {id:'言い方',word:'言い方',reading:'いいかた',altMeanings:[],meaning:'Way Of Saying',readingType:`noun`,level:7,meaningMnemonic:`Say (いい) + direction (かた).`,examples:[{level:'easy',jp:'言い方が悪いです。',romaji:'Iikata ga warui desu.',en:'That\'s a poor way of putting it.'}, {level:'advanced',jp:'彼の言い方には、いつも独特の温かみが感じられる。',romaji:'Kare no iikata ni wa, itsumo dokutoku no atatakami ga kanjirareru.',en:'There\'s always a distinctive warmth in his way of speaking.'}]},
  {id:'考え方',word:'考え方',reading:'かんがえかた',altMeanings:[],meaning:'Way Of Thinking',readingType:`noun`,level:7,meaningMnemonic:`Think (かんがえ) + direction (かた).`,examples:[{level:'easy',jp:'考え方が違います。',romaji:'Kangaekata ga chigaimasu.',en:'Our ways of thinking differ.'}, {level:'advanced',jp:'彼の考え方には、深い思慮が感じられる。',romaji:'Kare no kangaekata ni wa, fukai shiryo ga kanjirareru.',en:'A deep thoughtfulness can be felt in his way of thinking.'}]},
  {id:'弱い',word:'弱い',reading:'よわい',altMeanings:[],meaning:'Weak',readingType:`い-adjective`,level:7,meaningMnemonic:`"**YOH-WAH-EE**," so **WEAK**.`,examples:[{level:'easy',jp:'弱いです。',romaji:'Yowai desu.',en:'It\'s weak.'}, {level:'advanced',jp:'彼は、自分の弱点をよく理解し、それを克服しようと努力している。',romaji:'Kare wa, jibun no jakuten o yoku rikai shi, sore o kokufuku shiyou to doryoku shite iru.',en:'He understands his weak points well and is making an effort to overcome them.'}]},
  {id:'弱点',word:'弱点',reading:'じゃくてん',altMeanings:[],meaning:'Weak Point',readingType:`noun`,level:7,meaningMnemonic:`Weak (じゃく) + point (てん).`,examples:[{level:'easy',jp:'弱点があります。',romaji:'Jakuten ga arimasu.',en:'There is a weak point.'}, {level:'advanced',jp:'彼は、自分の弱点をよく理解している。',romaji:'Kare wa, jibun no jakuten o yoku rikai shite iru.',en:'He understands his own weak points well.'}]},
  {id:'週末',word:'週末',reading:'しゅうまつ',altMeanings:[],meaning:'Weekend',readingType:`noun`,level:7,meaningMnemonic:`Week (しゅう) + end (まつ).`,examples:[{level:'easy',jp:'週末です。',romaji:'Shuumatsu desu.',en:'It\'s the weekend.'}, {level:'advanced',jp:'彼は、週末になるといつも山にハイキングに出かける。',romaji:'Kare wa, shuumatsu ni naru to itsumo yama ni haikingu ni dekakeru.',en:'He always goes hiking in the mountains on weekends.'}]},
  {id:'何時',word:'何時',reading:'なんじ',altMeanings:[],meaning:'What Time',readingType:`question phrase`,level:7,meaningMnemonic:`What (なん) + o'clock (じ).`,examples:[{level:'easy',jp:'何時ですか。',romaji:'Nanji desu ka.',en:'What time is it?'}, {level:'advanced',jp:'会議が何時に始まるのか、まだ正確には分かっていない。',romaji:'Kaigi ga nanji ni hajimaru no ka, mada seikaku ni wa wakatte inai.',en:'It isn\'t yet known exactly what time the meeting will start.'}]},
  {id:'風',word:'風',reading:'かぜ',altMeanings:[],meaning:'Wind',readingType:`noun`,level:7,meaningMnemonic:`"**FOO**," blows the **WIND**.`,examples:[{level:'easy',jp:'風が強いです。',romaji:'Kaze ga tsuyoi desu.',en:'The wind is strong.'}, {level:'advanced',jp:'この旅館は、和風の雰囲気を大切にした造りになっている。',romaji:'Kono ryokan wa, wafuu no fun\'iki o taisetsu ni shita tsukuri ni natte iru.',en:'This inn is built to preserve a Japanese-style atmosphere.'}]},
  {id:'年末',word:'年末',reading:'ねんまつ',altMeanings:[],meaning:'Year End',readingType:`noun`,level:7,meaningMnemonic:`Year (ねん) + end (まつ).`,examples:[{level:'easy',jp:'年末です。',romaji:'Nenmatsu desu.',en:'It\'s the end of the year.'}, {level:'advanced',jp:'年末までに、全てのプロジェクトを完了させる必要がある。',romaji:'Nenmatsu made ni, subete no purojekuto o kanryou saseru hitsuyou ga aru.',en:'All projects need to be completed by year end.'}]},
  {id:'黄色',word:'黄色',reading:'きいろ',altMeanings:[],meaning:'Yellow',readingType:`noun`,level:7,meaningMnemonic:`Yellow (き) + color (いろ).`,examples:[{level:'easy',jp:'黄色い花です。',romaji:'Kiiroi hana desu.',en:'It\'s a yellow flower.'}, {level:'advanced',jp:'秋になると、この並木道は黄色い葉で埋め尽くされる。',romaji:'Aki ni naru to, kono namikimichi wa kiiroi ha de umetsukusareru.',en:'When autumn comes, this tree-lined street becomes covered in yellow leaves.'}]},

  {id:'地上',word:'地上',reading:'ちじょう',altMeanings:[],meaning:'Above Ground',readingType:`noun`,level:8,meaningMnemonic:`Earth (ち) + above (じょう).`,examples:[{level:'easy',jp:'地上に出ます。',romaji:'Chijou ni demasu.',en:'I\'ll come up above ground.'}, {level:'advanced',jp:'この建物は、地上三十階を超える高さを誇っている。',romaji:'Kono tatemono wa, chijou sanjukkai o koeru takasa o hokotte iru.',en:'This building boasts a height of more than thirty stories above ground.'}]},
  {id:'住所',word:'住所',reading:'じゅうしょ',altMeanings:[],meaning:'Address',readingType:`noun`,level:8,meaningMnemonic:`Dwell (じゅう) + place (しょ).`,examples:[{level:'easy',jp:'住所を教えてください。',romaji:'Juusho o oshiete kudasai.',en:'Please tell me your address.'}, {level:'advanced',jp:'彼は、新しい住所への転居手続きを終えたばかりだ。',romaji:'Kare wa, atarashii juusho e no tenkyo tetsuzuki o oeta bakari da.',en:'He\'s just finished the procedures for moving to his new address.'}]},

  {id:'全米',word:'全米',reading:'ぜんべい',altMeanings:[],meaning:'All America',readingType:`noun`,level:8,meaningMnemonic:`All (ぜん) + America/rice (べい).`,examples:[{level:'easy',jp:'全米大会です。',romaji:'Zenbei taikai desu.',en:'It\'s the all-America tournament.'}, {level:'advanced',jp:'彼女は、全米オープンで見事な優勝を果たした。',romaji:'Kanojo wa, zenbei oopun de migoto na yuushou o hatashita.',en:'She achieved a splendid victory at the US Open.'}]},
  {id:'思い出',word:'思い出',reading:'おもいで',altMeanings:[],meaning:'A Memory',readingType:`noun`,level:8,meaningMnemonic:`Think (おもい) + exit/come out (で).`,examples:[{level:'easy',jp:'いい思い出です。',romaji:'Ii omoide desu.',en:'It\'s a good memory.'}, {level:'advanced',jp:'彼は、その旅行を人生最高の思い出の一つだと語っていた。',romaji:'Kare wa, sono ryokou o jinsei saikou no omoide no hitotsu da to katatte ita.',en:'He spoke of that trip as one of the best memories of his life.'}]},
  {id:'〜間',word:'〜間',reading:'かん',altMeanings:[],meaning:'Amount Of Time',readingType:`counter`,level:8,meaningMnemonic:`On, standalone counter.`,examples:[{level:'easy',jp:'二時間かかります。',romaji:'Nijikan kakarimasu.',en:'It takes two hours.'}, {level:'advanced',jp:'この件については、時間をかけて慎重に検討する必要がある。',romaji:'Kono ken ni tsuite wa, jikan o kakete shinchou ni kentou suru hitsuyou ga aru.',en:'This matter needs to be carefully examined, taking time.'}]},
  {id:'他所',word:'他所',reading:'よそ',altMeanings:[],meaning:'Another Place',readingType:`noun, irregular reading`,level:8,meaningMnemonic:`Other (よ) + place (そ).`,examples:[{level:'easy',jp:'他所に行きます。',romaji:'Yoso ni ikimasu.',en:'I\'ll go elsewhere.'}, {level:'advanced',jp:'彼は、他所の意見にあまり左右されない性格だ。',romaji:'Kare wa, yoso no iken ni amari sayuu sarenai seikaku da.',en:'He has a personality not easily swayed by others\' opinions.'}]},
  {id:'答え',word:'答え',reading:'こたえ',altMeanings:[],meaning:'Answer',readingType:`noun`,level:8,meaningMnemonic:`Answer (こた) + え.`,examples:[{level:'easy',jp:'答えが分かりません。',romaji:'Kotae ga wakarimasen.',en:'I don\'t know the answer.'}, {level:'advanced',jp:'彼は、その質問に自信を持って答えることができた。',romaji:'Kare wa, sono shitsumon ni jishin o motte kotaeru koto ga dekita.',en:'He was able to answer that question with confidence.'}]},
  {id:'辺り',word:'辺り',reading:'あたり',altMeanings:[],meaning:'Area',readingType:`noun`,level:8,meaningMnemonic:`Area (あた) + り.`,examples:[{level:'easy',jp:'この辺りに住んでいます。',romaji:'Kono atari ni sunde imasu.',en:'I live around here.'}, {level:'advanced',jp:'彼の家は、この辺りでは知らない人がいないほど有名だ。',romaji:'Kare no ie wa, kono atari dewa shiranai hito ga inai hodo yuumei da.',en:'His house is so famous that there\'s no one around here who doesn\'t know it.'}]},
  {id:'電池',word:'電池',reading:'でんち',altMeanings:[],meaning:'Battery',readingType:`noun`,level:8,meaningMnemonic:`Electricity (でん) + pond (ち).`,examples:[{level:'easy',jp:'電池が切れました。',romaji:'Denchi ga kiremashita.',en:'The battery died.'}, {level:'advanced',jp:'この機器は、長時間使用しても電池が持つよう設計されている。',romaji:'Kono kiki wa, choujikan shiyou shitemo denchi ga motsu you sekkei sarete iru.',en:'This device is designed so the battery lasts even with extended use.'}]},
  {id:'身',word:'身',reading:'み',altMeanings:[],meaning:'Body',readingType:`noun`,level:8,meaningMnemonic:`Body (しん→み).`,examples:[{level:'easy',jp:'身が軽いです。',romaji:'Mi ga karui desu.',en:'I feel light (in body).'}, {level:'advanced',jp:'彼は、自分自身の言葉で、正直にその出来事を語った。',romaji:'Kare wa, jibun jishin no kotoba de, shoujiki ni sono dekigoto o katatta.',en:'He described that event honestly, in his own words.'}]},
  {id:'両者',word:'両者',reading:'りょうしゃ',altMeanings:[],meaning:'Both People',readingType:`noun`,level:8,meaningMnemonic:`Both (りょう) + someone (しゃ).`,examples:[{level:'easy',jp:'両者が同意しました。',romaji:'Ryousha ga doui shimashita.',en:'Both parties agreed.'}, {level:'advanced',jp:'交渉は、両者にとって満足のいく結果に終わった。',romaji:'Koushou wa, ryousha ni totte manzoku no iku kekka ni owatta.',en:'The negotiation ended with a result satisfactory to both parties.'}]},

  {id:'朝ごはん',word:'朝ごはん',reading:'あさごはん',altMeanings:[],meaning:'Breakfast',readingType:`noun`,level:8,meaningMnemonic:`Morning (あさ) + rice/meal (ごはん).`,examples:[{level:'easy',jp:'朝ごはんを食べます。',romaji:'Asagohan o tabemasu.',en:'I\'ll eat breakfast.'}, {level:'advanced',jp:'彼は、忙しくても朝ごはんだけは欠かさず食べている。',romaji:'Kare wa, isogashikutemo asagohan dake wa kakasazu tabete iru.',en:'Even when busy, he never skips breakfast.'}]},

  {id:'楽',word:'楽',reading:'らく',altMeanings:[],meaning:'Comfort',readingType:`noun/na-adjective`,level:8,meaningMnemonic:`On, standalone.`,examples:[{level:'easy',jp:'楽です。',romaji:'Raku desu.',en:'It\'s comfortable/easy.'}, {level:'advanced',jp:'彼は、音楽を聴くことで日々の疲れを癒している。',romaji:'Kare wa, ongaku o kiku koto de hibi no tsukare o iyashite iru.',en:'He soothes his daily fatigue by listening to music.'}]},

  {id:'会話',word:'会話',reading:'かいわ',altMeanings:[],meaning:'Conversation',readingType:`noun/suru-verb`,level:8,meaningMnemonic:`Meet (かい) + talk (わ).`,examples:[{level:'easy',jp:'会話をします。',romaji:'Kaiwa o shimasu.',en:'I\'ll have a conversation.'}, {level:'advanced',jp:'彼女は、電話で長い間、旧友と会話を楽しんでいた。',romaji:'Kanojo wa, denwa de nagai aida, kyuuyuu to kaiwa o tanoshinde ita.',en:'She enjoyed a long conversation with an old friend on the phone.'}]},
  {id:'作者',word:'作者',reading:'さくしゃ',altMeanings:[],meaning:'Creator',readingType:`noun`,level:8,meaningMnemonic:`Make (さく) + someone (しゃ).`,examples:[{level:'easy',jp:'作者です。',romaji:'Sakusha desu.',en:'I am the creator/author.'}, {level:'advanced',jp:'この論文の作者は、長年その分野の第一人者として知られている。',romaji:'Kono ronbun no sakusha wa, naganen sono bun\'ya no daiichininsha toshite shirarete iru.',en:'This paper\'s author has long been known as a leading figure in the field.'}]},

  {id:'電気',word:'電気',reading:'でんき',altMeanings:[],meaning:'Electricity',readingType:`noun`,level:8,meaningMnemonic:`Electricity (でん) + energy (き).`,examples:[{level:'easy',jp:'電気をつけます。',romaji:'Denki o tsukemasu.',en:'I\'ll turn on the lights.'}, {level:'advanced',jp:'停電のため、この地域全体が一時的に真っ暗になった。',romaji:'Teiden no tame, kono chiiki zentai ga ichijiteki ni makkura ni natta.',en:'Due to a power outage, this whole area went completely dark for a while.'}]},

  {id:'数学',word:'数学',reading:'すうがく',altMeanings:[],meaning:'Mathematics',readingType:`noun`,level:8,meaningMnemonic:`Count (すう) + study (がく).`,examples:[{level:'easy',jp:'数学が好きです。',romaji:'Suugaku ga suki desu.',en:'I like math.'}, {level:'advanced',jp:'彼女は、数学の分野で数々の賞を受賞してきた。',romaji:'Kanojo wa, suugaku no bun\'ya de kazukazu no shou o jushou shite kita.',en:'She has won numerous awards in the field of mathematics.'}]},
  {id:'医学',word:'医学',reading:'いがく',altMeanings:[],meaning:'Medical Science',readingType:`noun`,level:8,meaningMnemonic:`Medicine (い) + study (がく).`,examples:[{level:'easy',jp:'医学を勉強します。',romaji:'Igaku o benkyou shimasu.',en:'I\'ll study medicine.'}, {level:'advanced',jp:'彼女は、医学の分野で長年、感染症の研究を続けてきた。',romaji:'Kanojo wa, igaku no bun\'ya de naganen, kansenshou no kenkyuu o tsuzukete kita.',en:'She has continued researching infectious diseases in the medical field for many years.'}]},

  {id:'地中海',word:'地中海',reading:'ちちゅうかい',altMeanings:[],meaning:'Mediterranean Sea',readingType:`proper noun`,level:8,meaningMnemonic:`Earth (ち) + middle (ちゅう) + sea (かい).`,examples:[{level:'easy',jp:'地中海が好きです。',romaji:'Chichuukai ga suki desu.',en:'I like the Mediterranean.'}, {level:'advanced',jp:'地中海沿岸の国々は、独自の食文化で知られている。',romaji:'Chichuukai engan no kuniguni wa, dokuji no shoku bunka de shirarete iru.',en:'The countries along the Mediterranean coast are known for their unique food cultures.'}]},
  {id:'〜道',word:'〜道',reading:'どう',altMeanings:[],meaning:'Method Of',readingType:`suffix`,level:8,meaningMnemonic:`On, standalone suffix.`,examples:[{level:'easy',jp:'剣道をします。',romaji:'Kendou o shimasu.',en:'I do kendo.'}, {level:'advanced',jp:'彼女は、独自の道具を使って、その難問を鮮やかに解決した。',romaji:'Kanojo wa, dokuji no dougu o tsukatte, sono nanmon o azayaka ni kaiketsu shita.',en:'She brilliantly solved that difficult problem using her own tools.'}]},
