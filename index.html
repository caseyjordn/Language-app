  {id:'三',char:'三',onyomi:'さん',kunyomi:null,altMeanings:[],otherReadings:['み'],meaning:'Three',level:1,meaningMnemonic:`A father points to **THREE** stripes on his **SON**'s (さん) sleeve.`,examples:[{level:'easy',jp:'三月に行きます。',romaji:'Sangatsu ni ikimasu.',en:'I\'ll go in March.'}, {level:'advanced',jp:'この店では三つ以上買うと割引が受けられます。',romaji:'Kono mise dewa mittsu ijou kau to waribiki ga ukeraremasu.',en:'At this store, you get a discount if you buy three or more.'}]},
  {id:'二',char:'二',onyomi:'に',kunyomi:null,altMeanings:[],otherReadings:['ふた'],meaning:'Two',level:1,meaningMnemonic:`Bend **TWO KNEE**s (に), two flat lines stacked.`,examples:[{level:'easy',jp:'二階にあります。',romaji:'Nikai ni arimasu.',en:'It\'s on the second floor.'}, {level:'advanced',jp:'二人はお互いに一度も会ったことがないのに、長年文通を続けている。',romaji:'Futari wa otagai ni ichido mo atta koto ga nai noni, naganen buntsuu o tsuzukete iru.',en:'The two of them have never met each other, yet have kept up correspondence for years.'}]},
  {id:'女',char:'女',onyomi:'じょ',kunyomi:null,altMeanings:['Female', 'Girl'],otherReadings:['にょ', 'にょう', 'おんな', 'め'],meaning:'Woman',level:1,meaningMnemonic:`The **WOMAN** kneels, turning her **JAW** (じょ) gracefully.`,examples:[{level:'easy',jp:'女子学生が多いです。',romaji:'Joshi gakusei ga ooi desu.',en:'There are many female students.'}, {level:'advanced',jp:'彼女は女性初のその役職に就いた。',romaji:'Kanojo wa josei hatsu no sono yakushoku ni tsuita.',en:'She became the first woman to hold that position.'}]},

  // ---- Level 2 ----
  {id:'玉',char:'玉',onyomi:'たま',kunyomi:null,altMeanings:['Jewel', 'Gem', 'Sphere'],otherReadings:['ぎょく'],meaning:'Ball',level:2,meaningMnemonic:`A round **TOMATO** (たま) looks just like a **BALL**.`,examples:[{level:'easy',jp:'彼にビー玉をあげました。',romaji:'Kare ni biidama o agemashita.',en:'I gave him a marble.'}, {level:'advanced',jp:'この店では、天然石で作られた玉を売っている。',romaji:'Kono mise dewa, tennenseki de tsukurareta tama o utte iru.',en:'This shop sells spheres made from natural stone.'}]},
  {id:'本',char:'本',onyomi:'ほん',kunyomi:null,altMeanings:['Origin', 'Main', 'Real'],otherReadings:[],meaning:'Book',level:2,meaningMnemonic:`Your **PHONE** (ほん) makes a fine bookmark for a **BOOK**.`,examples:[{level:'easy',jp:'本を読みます。',romaji:'Hon o yomimasu.',en:'I\'ll read a book.'}, {level:'advanced',jp:'彼の話は本当かどうか、まだ確認が取れていない。',romaji:'Kare no hanashi wa hontou ka dou ka, mada kakunin ga torete inai.',en:'Whether his story is true hasn\'t been confirmed yet.'}]},
  {id:'子',char:'子',onyomi:'し',kunyomi:null,altMeanings:['Offspring', 'Small thing (in compounds)'],otherReadings:['こ'],meaning:'Child',level:2,meaningMnemonic:`"**CO**-me here" (し), calls the **CHILD**.`,examples:[{level:'easy',jp:'子供が公園で遊んでいます。',romaji:'Kodomo ga kouen de asonde imasu.',en:'The children are playing in the park.'}, {level:'advanced',jp:'彼女は幼い頃から音楽の才能を発揮していた。',romaji:'Kanojo wa osanai koro kara ongaku no sainou o hakki shite ita.',en:'She\'d been showing musical talent since she was a small child.'}]},
  {id:'丸',char:'丸',onyomi:'まる',kunyomi:null,altMeanings:['Round', 'Whole', 'Complete'],otherReadings:['がん'],meaning:'Circle',level:2,meaningMnemonic:`A **MARBLE** (まる) rolls in a perfect **CIRCLE**.`,examples:[{level:'easy',jp:'丸い皿を買いました。',romaji:'Marui sara o kaimashita.',en:'I bought a round plate.'}, {level:'advanced',jp:'彼はその問題を丸ごと無視することに決めた。',romaji:'Kare wa sono mondai o marugoto mushi suru koto ni kimeta.',en:'He decided to ignore the problem entirely.'}]},
  {id:'正',char:'正',onyomi:'せい',kunyomi:null,altMeanings:['Right', 'Justice', 'Main'],otherReadings:['しょう'],meaning:'Correct',level:2,meaningMnemonic:`"**SAY** (せい) the **CORRECT** answer."`,examples:[{level:'easy',jp:'正しい答えを教えてください。',romaji:'Tadashii kotae o oshiete kudasai.',en:'Please tell me the correct answer.'}, {level:'advanced',jp:'彼の主張が正しいかどうかは、専門家の間でも意見が分かれている。',romaji:'Kare no shuchou ga tadashii ka dou ka wa, senmonka no aida demo iken ga wakarete iru.',en:'Whether his claim is correct is disputed even among experts.'}]},
  {id:'土',char:'土',onyomi:'ど',kunyomi:null,altMeanings:['Soil', 'Earth', 'Ground'],otherReadings:['と'],meaning:'Dirt',level:2,meaningMnemonic:`Knead **DOUGH** (ど) shaped like a mound of **DIRT**.`,examples:[{level:'easy',jp:'土がとても柔らかいです。',romaji:'Tsuchi ga totemo yawarakai desu.',en:'The soil is very soft.'}, {level:'advanced',jp:'この地域の土は農業に適していないと言われている。',romaji:'Kono chiiki no tsuchi wa nougyou ni tekishite inai to iwarete iru.',en:'The soil in this area is said to be unsuitable for farming.'}]},
  {id:'犬',char:'犬',onyomi:'いぬ',kunyomi:null,altMeanings:[],otherReadings:['けん'],meaning:'Dog',level:2,meaningMnemonic:`The **DOG** barks "**EW, NO!**" (いぬ) at its own tail.`,examples:[{level:'easy',jp:'犬が公園を走っています。',romaji:'Inu ga kouen o hashitte imasu.',en:'The dog is running in the park.'}, {level:'advanced',jp:'迷子になった犬の飼い主を探しています。',romaji:'Maigo ni natta inu no kainushi o sagashite imasu.',en:'We\'re looking for the owner of a lost dog.'}]},
  {id:'夕',char:'夕',onyomi:'ゆう',kunyomi:null,altMeanings:['Dusk'],otherReadings:['せき'],meaning:'Evening',level:2,meaningMnemonic:`"**YOU** (ゆう) always come out at **EVENING**."`,examples:[{level:'easy',jp:'夕べは早く寝ました。',romaji:'Yuube wa hayaku nemashita.',en:'I went to bed early last night.'}, {level:'advanced',jp:'夕方になると、この通りは屋台で賑わう。',romaji:'Yuugata ni naru to, kono toori wa yatai de nigiwau.',en:'Once evening comes, this street bustles with food stalls.'}]},
  {id:'出',char:'出',onyomi:'しゅつ',kunyomi:null,altMeanings:['Leave', 'Go out', 'Appear'],otherReadings:['で', 'だ'],meaning:'Exit',level:2,meaningMnemonic:`**SHOOT** (しゅつ) straight out the **EXIT**.`,examples:[{level:'easy',jp:'出口はどこですか。',romaji:'Deguchi wa doko desu ka.',en:'Where is the exit?'}, {level:'advanced',jp:'彼は突然の質問に、何も言葉が出てこなかった。',romaji:'Kare wa totsuzen no shitsumon ni, nani mo kotoba ga dete konakatta.',en:'At the sudden question, no words came out of him at all.'}]},
  {id:'目',char:'目',onyomi:'め',kunyomi:null,altMeanings:['Item', 'Category (as in 一番目)'],otherReadings:['もく', 'ぼく'],meaning:'Eye',level:2,meaningMnemonic:`"**MAY** (め) I look at you with my wide-open **EYE**?"`,examples:[{level:'easy',jp:'目が痛いです。',romaji:'Me ga itai desu.',en:'My eyes hurt.'}, {level:'advanced',jp:'彼はいつも物事を冷静な目で見ている。',romaji:'Kare wa itsumo monogoto o reisei na me de mite iru.',en:'He always looks at things with a calm eye.'}]},
  {id:'火',char:'火',onyomi:'か',kunyomi:null,altMeanings:['Flame', 'Tuesday (in compounds)'],otherReadings:['ひ'],meaning:'Fire',level:2,meaningMnemonic:`A **CAR** (か) bursts into **FIRE**.`,examples:[{level:'easy',jp:'火が消えました。',romaji:'Hi ga kiemashita.',en:'The fire went out.'}, {level:'advanced',jp:'キャンプ場では、火の取り扱いに十分注意してください。',romaji:'Kyanpujou dewa, hi no toriatsukai ni juubun chuui shite kudasai.',en:'Please be very careful when handling fire at the campsite.'}]},
  {id:'五',char:'五',onyomi:'ご',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Five',level:2,meaningMnemonic:`"**GO** (ご) get **FIVE** more!"`,examples:[{level:'easy',jp:'五時に会いましょう。',romaji:'Goji ni aimashou.',en:'Let\'s meet at five o\'clock.'}, {level:'advanced',jp:'このチームは、五年連続で優勝している。',romaji:'Kono chiimu wa, gonen renzoku de yuushou shite iru.',en:'This team has won the championship five years in a row.'}]},
  {id:'四',char:'四',onyomi:'し',kunyomi:null,altMeanings:[],otherReadings:['よん', 'よ'],meaning:'Four',level:2,meaningMnemonic:`"**SHE** (し) counts to **FOUR**."`,examples:[{level:'easy',jp:'四月に生まれました。',romaji:'Shigatsu ni umaremashita.',en:'I was born in April.'}, {level:'advanced',jp:'四つの選択肢の中から、最も適切なものを選んでください。',romaji:'Yottsu no sentakushi no naka kara, mottomo tekisetsu na mono o erande kudasai.',en:'Please choose the most appropriate option from among the four.'}]},
  {id:'手',char:'手',onyomi:'て',kunyomi:null,altMeanings:['Method', 'Skill'],otherReadings:['しゅ'],meaning:'Hand',level:2,meaningMnemonic:`"**TAY** (て) raised her **HAND**."`,examples:[{level:'easy',jp:'手を洗ってください。',romaji:'Te o aratte kudasai.',en:'Please wash your hands.'}, {level:'advanced',jp:'この問題を解決するための良い手が思いつかない。',romaji:'Kono mondai o kaiketsu suru tame no yoi te ga omoitsukanai.',en:'I can\'t think of a good way to solve this problem.'}]},
  {id:'天',char:'天',onyomi:'てん',kunyomi:null,altMeanings:['Sky', 'Nature'],otherReadings:[],meaning:'Heaven',level:2,meaningMnemonic:`**TEN** (てん) angels sit in the **HEAVENS**.`,examples:[{level:'easy',jp:'天気がいいですね。',romaji:'Tenki ga ii desu ne.',en:'The weather is nice, isn\'t it.'}, {level:'advanced',jp:'彼は天性の才能で、周りを驚かせ続けている。',romaji:'Kare wa tensei no sainou de, mawari o odorokase tsuzukete iru.',en:'With his natural-born talent, he keeps surprising those around him.'}]},
  {id:'王',char:'王',onyomi:'おう',kunyomi:null,altMeanings:['Monarch', 'Ruler'],otherReadings:[],meaning:'King',level:2,meaningMnemonic:`"**OH!** (おう)" gasps the crowd for the **KING**.`,examples:[{level:'easy',jp:'王子と王女がいます。',romaji:'Ouji to oujo ga imasu.',en:'There is a prince and a princess.'}, {level:'advanced',jp:'その国では、王が絶対的な権力を握っている。',romaji:'Sono kuni dewa, ou ga zettaiteki na kenryoku o nigitte iru.',en:'In that country, the king holds absolute power.'}]},
  {id:'左',char:'左',onyomi:'さ',kunyomi:null,altMeanings:[],otherReadings:['ひだり'],meaning:'Left',level:2,meaningMnemonic:`"**SAH!** (さ)" steadying a tool with her **LEFT** hand.`,examples:[{level:'easy',jp:'左に曲がってください。',romaji:'Hidari ni magatte kudasai.',en:'Please turn left.'}, {level:'advanced',jp:'彼の意見は、党の左派からも右派からも批判されている。',romaji:'Kare no iken wa, tou no sahagai kara mo uhagai kara mo hihan sarete iru.',en:'His opinion is criticized by both the left and right wings of the party.'}]},
  {id:'中',char:'中',onyomi:'ちゅう',kunyomi:null,altMeanings:['Inside', 'Among', 'During'],otherReadings:['なか'],meaning:'Middle',level:2,meaningMnemonic:`**CHEW** (ちゅう) an arrow through the **MIDDLE**.`,examples:[{level:'easy',jp:'中に入ってください。',romaji:'Naka ni haitte kudasai.',en:'Please come inside.'}, {level:'advanced',jp:'会議中は、携帯電話の電源をお切りください。',romaji:'Kaigichuu wa, keitaidenwa no dengen o okiri kudasai.',en:'Please turn off your phone during the meeting.'}]},
  {id:'月',char:'月',onyomi:'げつ',kunyomi:null,altMeanings:['Month', 'Monday (in compounds)'],otherReadings:['がつ', 'つき'],meaning:'Moon',level:2,meaningMnemonic:`"**GET** (げつ) me to the **MOON**."`,examples:[{level:'easy',jp:'月がきれいです。',romaji:'Tsuki ga kirei desu.',en:'The moon is beautiful.'}, {level:'advanced',jp:'来月から、新しいプロジェクトが始まる予定です。',romaji:'Raigetsu kara, atarashii purojekuto ga hajimaru yotei desu.',en:'A new project is scheduled to start next month.'}]},
  {id:'々',char:'々',onyomi:'のま',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Repeater',level:2,meaningMnemonic:`*Not a true kanji — marks that the previous character repeats*`,examples:[{level:'easy',jp:'人々が集まっています。',romaji:'Hitobito ga atsumatte imasu.',en:'People are gathering.'}, {level:'advanced',jp:'時々、昔のことを思い出す。',romaji:'Tokidoki, mukashi no koto o omoidasu.',en:'I sometimes remember things from the past.'}]},
  {id:'田',char:'田',onyomi:'た',kunyomi:null,altMeanings:['Field'],otherReadings:['でん'],meaning:'Rice Paddy',level:2,meaningMnemonic:`"**TAH**-dah!" (た) The **RICE PADDY**.`,examples:[{level:'easy',jp:'田んぼがたくさんあります。',romaji:'Tanbo ga takusan arimasu.',en:'There are many rice paddies.'}, {level:'advanced',jp:'この村は、昔から米作りの田で有名だ。',romaji:'Kono mura wa, mukashi kara komezukuri no ta de yuumei da.',en:'This village has long been famous for its rice-growing paddies.'}]},
  {id:'右',char:'右',onyomi:'ゆう',kunyomi:null,altMeanings:[],otherReadings:['う', 'みぎ'],meaning:'Right',level:2,meaningMnemonic:`"Is that **YOU**? (ゆう)" covering mouth with **RIGHT** hand.`,examples:[{level:'easy',jp:'右に曲がってください。',romaji:'Migi ni magatte kudasai.',en:'Please turn right.'}, {level:'advanced',jp:'彼は会社の中で、社長の右腕として信頼されている。',romaji:'Kare wa kaisha no naka de, shachou no migiude toshite shinrai sarete iru.',en:'Within the company, he\'s trusted as the president\'s right-hand man.'}]},
  {id:'六',char:'六',onyomi:'ろく',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Six',level:2,meaningMnemonic:`**SIX** little **ROCK**s (ろく) stacked up.`,examples:[{level:'easy',jp:'六時に起きます。',romaji:'Rokuji ni okimasu.',en:'I wake up at six o\'clock.'}, {level:'advanced',jp:'このパズルには、六つのピースが足りない。',romaji:'Kono pazuru ni wa, muttsu no piisu ga tarinai.',en:'This puzzle is missing six pieces.'}]},
  {id:'小',char:'小',onyomi:'しょう',kunyomi:null,altMeanings:['Little', 'Minor'],otherReadings:['こ', 'お'],meaning:'Small',level:2,meaningMnemonic:`A tiny magic **SHOW** (しょう) — two **SMALL** beads.`,examples:[{level:'easy',jp:'小さい犬がいます。',romaji:'Chiisai inu ga imasu.',en:'There is a small dog.'}, {level:'advanced',jp:'小さな失敗が、後に大きな問題を引き起こすこともある。',romaji:'Chiisana shippai ga, nochi ni ookina mondai o hikiokosu koto mo aru.',en:'A small mistake can sometimes lead to a bigger problem later.'}]},
  {id:'立',char:'立',onyomi:'りつ',kunyomi:null,altMeanings:['Establish', 'Set up'],otherReadings:['りゅう', 'たつ'],meaning:'Stand',level:2,meaningMnemonic:`Check into the **RITZ** (りつ) — the doorman **STANDS** straight.`,examples:[{level:'easy',jp:'そこに立ってください。',romaji:'Soko ni tatte kudasai.',en:'Please stand there.'}, {level:'advanced',jp:'彼は若くして自分の会社を立てた。',romaji:'Kare wa wakakushite jibun no kaisha o tateta.',en:'He established his own company at a young age.'}]},
  {id:'丁',char:'丁',onyomi:'ちょう',kunyomi:null,altMeanings:['Even number', 'City block'],otherReadings:['てい'],meaning:'Street',level:2,meaningMnemonic:`"**CHO!** (ちょう)" one nail down the **STREET** sign.`,examples:[{level:'easy',jp:'この丁目に住んでいます。',romaji:'Kono choume ni sunde imasu.',en:'I live in this district.'}, {level:'advanced',jp:'ちょうど良いタイミングで彼が現れた。',romaji:'Choudo yoi taimingu de kare ga arawareta.',en:'He showed up at exactly the right moment.'}]},
  {id:'日',char:'日',onyomi:'にち',kunyomi:null,altMeanings:['Day', 'Japan (in compounds)', 'Sunday'],otherReadings:['じつ', 'ひ', 'か'],meaning:'Sun',level:2,meaningMnemonic:`The boxed-in **SUN** glows "**NEE-CHI**" (にち).`,examples:[{level:'easy',jp:'今日はいい天気です。',romaji:'Kyou wa ii tenki desu.',en:'Today the weather is nice.'}, {level:'advanced',jp:'彼女は毎日、日記をつけている。',romaji:'Kanojo wa mainichi, nikki o tsukete iru.',en:'She keeps a diary every day.'}]},
  {id:'刀',char:'刀',onyomi:'とう',kunyomi:null,altMeanings:['Blade'],otherReadings:[],meaning:'Sword',level:2,meaningMnemonic:`Watch your **TOE**! (とう) That curved **SWORD**.`,examples:[{level:'easy',jp:'これは古い刀です。',romaji:'Kore wa furui katana desu.',en:'This is an old sword.'}, {level:'advanced',jp:'博物館には、江戸時代の刀が展示されている。',romaji:'Hakubutsukan ni wa, Edo-jidai no katana ga tenji sarete iru.',en:'Swords from the Edo period are displayed at the museum.'}]},
  {id:'才',char:'才',onyomi:'さい',kunyomi:null,altMeanings:['Years old (counter)', 'Ability'],otherReadings:[],meaning:'Talent',level:2,meaningMnemonic:`A wistful **SIGH** (さい) admiring his **TALENT**.`,examples:[{level:'easy',jp:'彼は十才です。',romaji:'Kare wa jussai desu.',en:'He is ten years old.'}, {level:'advanced',jp:'彼女は幼い頃から、その分野で天才的な才能を見せていた。',romaji:'Kanojo wa osanai koro kara, sono bun\'ya de tensaiteki na sainou o misete ita.',en:'Since she was young, she\'d shown genius-level talent in that field.'}]},
  {id:'千',char:'千',onyomi:'せん',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Thousand',level:2,meaningMnemonic:`A **THOUSAND CENTS** (せん) stacked high.`,examples:[{level:'easy',jp:'千円をください。',romaji:'Sen\'en o kudasai.',en:'Please give me a thousand yen.'}, {level:'advanced',jp:'このイベントには、千人以上の人が集まった。',romaji:'Kono ibento ni wa, sennin ijou no hito ga atsumatta.',en:'More than a thousand people gathered for this event.'}]},
  {id:'木',char:'木',onyomi:'もく',kunyomi:null,altMeanings:['Wood', 'Thursday (in compounds)'],otherReadings:['ぼく', 'き'],meaning:'Tree',level:2,meaningMnemonic:`Roots dig into the **MUCK** (もく) below this **TREE**.`,examples:[{level:'easy',jp:'大きい木があります。',romaji:'Ookii ki ga arimasu.',en:'There is a big tree.'}, {level:'advanced',jp:'この家具は、すべて天然の木で作られている。',romaji:'Kono kagu wa, subete tennen no ki de tsukurarete iru.',en:'This furniture is all made from natural wood.'}]},
  {id:'水',char:'水',onyomi:'すい',kunyomi:null,altMeanings:['Wednesday (in compounds)', 'Liquid'],otherReadings:['みず'],meaning:'Water',level:2,meaningMnemonic:`**SWEET** (すい), cool **WATER** splashes out.`,examples:[{level:'easy',jp:'水を飲みます。',romaji:'Mizu o nomimasu.',en:'I\'ll drink water.'}, {level:'advanced',jp:'この地域は、水不足が深刻な問題になっている。',romaji:'Kono chiiki wa, mizubusoku ga shinkoku na mondai ni natte iru.',en:'In this area, water shortage has become a serious problem.'}]},
  {id:'白',char:'白',onyomi:'はく',kunyomi:null,altMeanings:['Blank', 'Pure', 'Innocent'],otherReadings:['びゃく', 'しろ'],meaning:'White',level:2,meaningMnemonic:`A **WHITE HAWK** (はく) glides past the sun.`,examples:[{level:'easy',jp:'白い服を着ています。',romaji:'Shiroi fuku o kite imasu.',en:'I\'m wearing white clothes.'}, {level:'advanced',jp:'彼は無実を主張し、白黒はっきりさせたいと言った。',romaji:'Kare wa mujitsu o shuchou shi, shirokuro hakkiri sasetai to itta.',en:'He claimed innocence and said he wanted to make things clear, black and white.'}]},
  {id:'文',char:'文',onyomi:'ぶん',kunyomi:null,altMeanings:['Sentence', 'Literature', 'Culture'],otherReadings:['もん'],meaning:'Writing',level:2,meaningMnemonic:`What a **BOON** (ぶん) to learn **WRITING**.`,examples:[{level:'easy',jp:'文を書きます。',romaji:'Bun o kakimasu.',en:'I\'ll write a sentence.'}, {level:'advanced',jp:'彼の文章は、いつも読みやすく整理されている。',romaji:'Kare no bunshou wa, itsumo yomiyasuku seiri sarete iru.',en:'His writing is always organized and easy to read.'}]},
  {id:'円',char:'円',onyomi:'えん',kunyomi:null,altMeanings:['Circle', 'Round'],otherReadings:[],meaning:'Yen',level:2,meaningMnemonic:`Drop a coin worth one **YEN** (えん).`,examples:[{level:'easy',jp:'千円をください。',romaji:'Sen\'en o kudasai.',en:'Please give me a thousand yen.'}, {level:'advanced',jp:'円高の影響で、輸出企業の利益が減少している。',romaji:'Endaka no eikyou de, yushutsu kigyou no rieki ga genshou shite iru.',en:'Due to the strong yen, export companies\' profits are declining.'}]},

  // ---- Level 3 ----
  {id:'矢',char:'矢',onyomi:'や',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Arrow',level:3,meaningMnemonic:`"**YAH!** (や)" the archer shouts, releasing an **ARROW**.`,examples:[{level:'easy',jp:'矢が的に当たりました。',romaji:'Ya ga mato ni atarimashita.',en:'The arrow hit the target.'}, {level:'advanced',jp:'彼の言葉は、まるで矢のように鋭く心に刺さった。',romaji:'Kare no kotoba wa, marude ya no you ni surudoku kokoro ni sasatta.',en:'His words pierced my heart, sharp as an arrow.'}]},
  {id:'明',char:'明',onyomi:'あ',kunyomi:null,altMeanings:['Clear', 'Next (as in 明日)'],otherReadings:['めい', 'みょう'],meaning:'Bright',level:3,meaningMnemonic:`"**AH!** (あ)" she gasps at how **BRIGHT** it is.`,examples:[{level:'easy',jp:'明るい部屋です。',romaji:'Akarui heya desu.',en:'It\'s a bright room.'}, {level:'advanced',jp:'彼は自分の間違いを明らかにし、素直に謝った。',romaji:'Kare wa jibun no machigai o akiraka ni shi, sunao ni ayamatta.',en:'He made his mistake clear and apologized honestly.'}]},
  {id:'市',char:'市',onyomi:'し',kunyomi:null,altMeanings:['Market'],otherReadings:['いち'],meaning:'City',level:3,meaningMnemonic:`"**SHE** (し) runs the busiest stall in the **CITY**."`,examples:[{level:'easy',jp:'この市は大きいです。',romaji:'Kono shi wa ookii desu.',en:'This city is big.'}, {level:'advanced',jp:'市の人口は、この十年で大きく変化した。',romaji:'Shi no jinkou wa, kono juunen de ookiku henka shita.',en:'The city\'s population has changed significantly over the past decade.'}]},
  {id:'牛',char:'牛',onyomi:'ぎゅう',kunyomi:null,altMeanings:['Cattle', 'Beef (in compounds)'],otherReadings:[],meaning:'Cow',level:3,meaningMnemonic:`The **COW** chews sticky **GOO** (ぎゅう).`,examples:[{level:'easy',jp:'牛が草を食べています。',romaji:'Ushi ga kusa o tabete imasu.',en:'The cow is eating grass.'}, {level:'advanced',jp:'この地域は、牛肉の生産で有名だ。',romaji:'Kono chiiki wa, gyuuniku no seisan de yuumei da.',en:'This region is famous for its beef production.'}]},
  {id:'切',char:'切',onyomi:'せつ',kunyomi:null,altMeanings:['Cutting', 'Urgent (in compounds)'],otherReadings:['きる'],meaning:'Cut',level:3,meaningMnemonic:`"**SET** (せつ) the knife down after you **CUT**."`,examples:[{level:'easy',jp:'紙を切ります。',romaji:'Kami o kirimasu.',en:'I\'ll cut the paper.'}, {level:'advanced',jp:'彼女はその提案を、大切な問題として真剣に受け止めた。',romaji:'Kanojo wa sono teian o, taisetsu na mondai to shite shinken ni uketometa.',en:'She took that proposal seriously, as an important matter.'}]},
  {id:'方',char:'方',onyomi:'ほう',kunyomi:null,altMeanings:['Way', 'Side', 'Person (polite)'],otherReadings:[],meaning:'Direction',level:3,meaningMnemonic:`"**HO!** (ほう) That **DIRECTION**!"`,examples:[{level:'easy',jp:'あちらの方に行ってください。',romaji:'Achira no hou ni itte kudasai.',en:'Please go in that direction.'}, {level:'advanced',jp:'この問題の解決方法について、みんなで話し合った。',romaji:'Kono mondai no kaiketsu houhou ni tsuite, minna de hanashiatta.',en:'We all discussed how to solve this problem together.'}]},
  {id:'戸',char:'戸',onyomi:'と',kunyomi:null,altMeanings:['Household (in compounds)'],otherReadings:[],meaning:'Door',level:3,meaningMnemonic:`Stub your **TOE** (と) on this swinging **DOOR**.`,examples:[{level:'easy',jp:'戸を閉めてください。',romaji:'To o shimete kudasai.',en:'Please close the door.'}, {level:'advanced',jp:'昔ながらの木の戸口が、この家の雰囲気を作り出している。',romaji:'Mukashinagara no ki no toguchi ga, kono ie no fun\'iki o tsukuridashite iru.',en:'The traditional wooden doorway creates this house\'s atmosphere.'}]},
  {id:'太',char:'太',onyomi:'ふと',kunyomi:null,altMeanings:['Thick', 'Bold (as in 太字)'],otherReadings:['たい'],meaning:'Fat',level:3,meaningMnemonic:`Take a **PHOTO** (ふと) of the **FAT** man.`,examples:[{level:'easy',jp:'太い線を引いてください。',romaji:'Futoi sen o hiite kudasai.',en:'Please draw a thick line.'}, {level:'advanced',jp:'彼は最近、忙しさのあまり太ってしまったと嘆いていた。',romaji:'Kare wa saikin, isogashisa no amari futotte shimatta to nageite ita.',en:'He lamented that he\'d recently gained weight from being too busy.'}]},
  {id:'父',char:'父',onyomi:'ちち',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Father',level:3,meaningMnemonic:`"**CHI-CHI!** (ちち)" calls the strict **FATHER**.`,examples:[{level:'easy',jp:'父は医者です。',romaji:'Chichi wa isha desu.',en:'My father is a doctor.'}, {level:'advanced',jp:'彼はお父さんの後を継いで、家業を始めることにした。',romaji:'Kare wa otousan no ato o tsuide, kagyou o hajimeru koto ni shita.',en:'He decided to succeed his father and take over the family business.'}]},
  {id:'少',char:'少',onyomi:'しょう',kunyomi:null,altMeanings:['Little', 'Minor', 'Young (in compounds)'],otherReadings:[],meaning:'Few',level:3,meaningMnemonic:`Only a **SHOW** (しょう) of a **FEW** drops remain.`,examples:[{level:'easy',jp:'少し待ってください。',romaji:'Sukoshi matte kudasai.',en:'Please wait a little.'}, {level:'advanced',jp:'この会社では、少ない人数で多くの仕事をこなしている。',romaji:'Kono kaisha dewa, sukunai ninzuu de ooku no shigoto o konashite iru.',en:'At this company, a small number of people handle a large amount of work.'}]},
  {id:'友',char:'友',onyomi:'ゆう',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Friend',level:3,meaningMnemonic:`"It's **YOU**! (ゆう) clasping hands with her best **FRIEND**."`,examples:[{level:'easy',jp:'友人と会います。',romaji:'Yuujin to aimasu.',en:'I\'ll meet my friend.'}, {level:'advanced',jp:'彼女とは、学生時代からの長い友人関係が続いている。',romaji:'Kanojo to wa, gakuseijidai kara no nagai yuujin kankei ga tsuzuite iru.',en:'Our long friendship has continued since our student days.'}]},
  {id:'毛',char:'毛',onyomi:'もう',kunyomi:null,altMeanings:['Hair', 'Wool (in compounds)'],otherReadings:[],meaning:'Fur',level:3,meaningMnemonic:`**MOW** (もう) through this curling **FUR**.`,examples:[{level:'easy',jp:'猫の毛は柔らかいです。',romaji:'Neko no ke wa yawarakai desu.',en:'The cat\'s fur is soft.'}, {level:'advanced',jp:'このセーターは、上質な羊毛で編まれている。',romaji:'Kono seetaa wa, joushitsu na youmou de amarete iru.',en:'This sweater is knitted from high-quality wool.'}]},
  {id:'半',char:'半',onyomi:'はん',kunyomi:null,altMeanings:['Semi-', 'Middle (of a period)'],otherReadings:[],meaning:'Half',level:3,meaningMnemonic:`"**HON** (はん), you only get **HALF**."`,examples:[{level:'easy',jp:'半分食べました。',romaji:'Hanbun tabemashita.',en:'I ate half.'}, {level:'advanced',jp:'会議は二時半に始まる予定です。',romaji:'Kaigi wa nijihan ni hajimaru yotei desu.',en:'The meeting is scheduled to start at two thirty.'}]},
  {id:'心',char:'心',onyomi:'しん',kunyomi:null,altMeanings:['Mind', 'Spirit', 'Center'],otherReadings:[],meaning:'Heart',level:3,meaningMnemonic:`A glossy **SHEEN** (しん) coats this little **HEART**.`,examples:[{level:'easy',jp:'心が痛いです。',romaji:'Kokoro ga itai desu.',en:'My heart aches.'}, {level:'advanced',jp:'彼の心強い言葉に、みんなが勇気づけられた。',romaji:'Kare no kokorozuyoi kotoba ni, minna ga yuukizukerareta.',en:'Everyone was encouraged by his reassuring words.'}]},
  {id:'字',char:'字',onyomi:'じ',kunyomi:null,altMeanings:['Character', 'Handwriting'],otherReadings:[],meaning:'Letter',level:3,meaningMnemonic:`"**Gee**" (じ), tracing his first **LETTER**.`,examples:[{level:'easy',jp:'字が上手ですね。',romaji:'Ji ga jouzu desu ne.',en:'Your handwriting is good, isn\'t it.'}, {level:'advanced',jp:'彼の文字は、まるで印刷したように整っている。',romaji:'Kare no moji wa, marude insatsu shita you ni totonotte iru.',en:'His handwriting is as neat as if it were printed.'}]},
  {id:'生',char:'生',onyomi:'せい',kunyomi:null,altMeanings:['Birth', 'Raw', 'Student (in compounds)'],otherReadings:['しょう', 'なま', 'いきる'],meaning:'Life',level:3,meaningMnemonic:`"**SAY** (せい) hello to new **LIFE**."`,examples:[{level:'easy',jp:'学生です。',romaji:'Gakusei desu.',en:'I am a student.'}, {level:'advanced',jp:'彼女は困難な人生を乗り越え、強く生きてきた。',romaji:'Kanojo wa konnan na jinsei o norikoe, tsuyoku ikite kita.',en:'She\'s overcome a difficult life and lived on strongly.'}]},
  {id:'台',char:'台',onyomi:'だい',kunyomi:null,altMeanings:['Platform', 'Stand', 'Counter for machines'],otherReadings:['たい (as in 舞台 stage)'],meaning:'Machine',level:3,meaningMnemonic:`Roll the **DIE** (だい) on this sturdy **MACHINE**.`,examples:[{level:'easy',jp:'車が一台あります。',romaji:'Kuruma ga ichidai arimasu.',en:'There is one car.'}, {level:'advanced',jp:'舞台の上で、彼女は堂々とスピーチをした。',romaji:'Butai no ue de, kanojo wa doudou to supiichi o shita.',en:'On the stage, she gave a confident speech.'}]},
  {id:'母',char:'母',onyomi:'はは',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Mother',level:3,meaningMnemonic:`"**HAHA**! (はは)" laughs **MOTHER**.`,examples:[{level:'easy',jp:'母は先生です。',romaji:'Haha wa sensei desu.',en:'My mother is a teacher.'}, {level:'advanced',jp:'彼はお母さんに毎週電話をかけている。',romaji:'Kare wa okaasan ni maishuu denwa o kakete iru.',en:'He calls his mother every week.'}]},
  {id:'午',char:'午',onyomi:'ご',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Noon',level:3,meaningMnemonic:`"**GO** (ご) eat, it's **NOON**!"`,examples:[{level:'easy',jp:'午後に会いましょう。',romaji:'Gogo ni aimashou.',en:'Let\'s meet in the afternoon.'}, {level:'advanced',jp:'午前中に、その報告書を提出しなければならない。',romaji:'Gozenchuu ni, sono houkokusho o teishutsu shinakereba naranai.',en:'I have to submit that report by the morning.'}]},
  {id:'北',char:'北',onyomi:'きた',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'North',level:3,meaningMnemonic:`A **CHEETAH** (きた) races **NORTH**.`,examples:[{level:'easy',jp:'北はどこですか。',romaji:'Kita wa doko desu ka.',en:'Where is north?'}, {level:'advanced',jp:'彼らは北国の厳しい冬を乗り越えて暮らしている。',romaji:'Karera wa kitaguni no kibishii fuyu o norikoete kurashite iru.',en:'They live through the harsh winters of the northern country.'}]},
  {id:'今',char:'今',onyomi:'こん',kunyomi:null,altMeanings:['Present', 'This (as in 今月)'],otherReadings:['いま'],meaning:'Now',level:3,meaningMnemonic:`The **CON** (こん) artist ducks under the lid **NOW**.`,examples:[{level:'easy',jp:'今、外にいます。',romaji:'Ima, soto ni imasu.',en:'I\'m outside right now.'}, {level:'advanced',jp:'今回のプロジェクトは、今までで最も難しい挑戦だった。',romaji:'Konkai no purojekuto wa, ima made de mottomo muzukashii chousen datta.',en:'This time\'s project was the most difficult challenge yet.'}]},
  {id:'古',char:'古',onyomi:'こ',kunyomi:null,altMeanings:['Ancient', 'Used'],otherReadings:[],meaning:'Old',level:3,meaningMnemonic:`"**CO**-worker" (こ), that's an **OLD** story.`,examples:[{level:'easy',jp:'古い本があります。',romaji:'Furui hon ga arimasu.',en:'There is an old book.'}, {level:'advanced',jp:'この寺は、古来から地域の人々に大切にされてきた。',romaji:'Kono tera wa, korai kara chiiki no hitobito ni taisetsu ni sarete kita.',en:'This temple has been cherished by the local people since ancient times.'}]},
  {id:'外',char:'外',onyomi:'がい',kunyomi:null,altMeanings:['Foreign', 'Other'],otherReadings:['そと'],meaning:'Outside',level:3,meaningMnemonic:`That **GUY** (がい) stepped **OUTSIDE**.`,examples:[{level:'easy',jp:'外は寒いです。',romaji:'Soto wa samui desu.',en:'It\'s cold outside.'}, {level:'advanced',jp:'彼は海外で長年働いた経験を持っている。',romaji:'Kare wa kaigai de naganen hataraita keiken o motte iru.',en:'He has years of experience working overseas.'}]},
  {id:'分',char:'分',onyomi:'ぶん',kunyomi:null,altMeanings:['Minute', 'Understand (as in 分かる)', 'Portion'],otherReadings:['ふん', 'ぶ'],meaning:'Part',level:3,meaningMnemonic:`What a **BOON** (ぶん) — split into two **PART**s.`,examples:[{level:'easy',jp:'半分あげます。',romaji:'Hanbun agemasu.',en:'I\'ll give you half.'}, {level:'advanced',jp:'彼の気持ちは、なんとなく分かる気がする。',romaji:'Kare no kimochi wa, nantonaku wakaru ki ga suru.',en:'I feel like I somewhat understand how he feels.'}]},
  {id:'引',char:'引',onyomi:'ひ',kunyomi:null,altMeanings:['Draw', 'Subtract (in math)'],otherReadings:[],meaning:'Pull',level:3,meaningMnemonic:`"**HE** (ひ) can really **PULL** that bowstring back."`,examples:[{level:'easy',jp:'ドアを引いてください。',romaji:'Doa o hiite kudasai.',en:'Please pull the door.'}, {level:'advanced',jp:'彼女は、その場の空気を一気に引き締めた。',romaji:'Kanojo wa, sono ba no kuuki o ikki ni hikishimeta.',en:'She instantly tightened the atmosphere of the room.'}]},
  {id:'止',char:'止',onyomi:'し',kunyomi:null,altMeanings:['Halt', 'Prevent'],otherReadings:['とまる'],meaning:'Stop',level:3,meaningMnemonic:`"**SHE** (し) plants her foot and comes to a dead **STOP**."`,examples:[{level:'easy',jp:'ここで止まってください。',romaji:'Koko de tomatte kudasai.',en:'Please stop here.'}, {level:'advanced',jp:'医者は、彼にたばこを止めるよう強く勧めた。',romaji:'Isha wa, kare ni tabako o yameru you tsuyoku susumeta.',en:'The doctor strongly urged him to quit smoking.'}]},
  {id:'用',char:'用',onyomi:'よう',kunyomi:null,altMeanings:['Use', 'Business', 'Errand'],otherReadings:[],meaning:'Task',level:3,meaningMnemonic:`"**YO** (よう), finish this **TASK**."`,examples:[{level:'easy',jp:'用があります。',romaji:'You ga arimasu.',en:'I have some business to attend to.'}, {level:'advanced',jp:'この道具は、様々な場面で用いることができる。',romaji:'Kono dougu wa, samazama na bamen de mochiiru koto ga dekiru.',en:'This tool can be used in a variety of situations.'}]},
  {id:'万',char:'万',onyomi:'まん',kunyomi:null,altMeanings:['Myriad', 'All (in compounds)'],otherReadings:[],meaning:'Ten Thousand',level:3,meaningMnemonic:`**MON**ey (まん) piles up by the **TEN THOUSAND**.`,examples:[{level:'easy',jp:'一万円あります。',romaji:'Ichiman\'en arimasu.',en:'I have ten thousand yen.'}, {level:'advanced',jp:'万が一のために、保険に入っておいた方がいい。',romaji:'Man ga ichi no tame ni, hoken ni haitte oita hou ga ii.',en:'For that one-in-ten-thousand chance, it\'s better to have insurance.'}]},
  {id:'広',char:'広',onyomi:'ひろ',kunyomi:null,altMeanings:['Spacious', 'Broad'],otherReadings:[],meaning:'Wide',level:3,meaningMnemonic:`The **HERO** (ひろ) needed a **WIDE** roof.`,examples:[{level:'easy',jp:'広い部屋です。',romaji:'Hiroi heya desu.',en:'It\'s a spacious room.'}, {level:'advanced',jp:'そのニュースは、あっという間に広がった。',romaji:'Sono nyuusu wa, atto iu ma ni hirogatta.',en:'That news spread in an instant.'}]},
  {id:'冬',char:'冬',onyomi:'ふゆ',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Winter',level:3,meaningMnemonic:`"**PHEW**, (ふゆ) it's cold!" **WINTER**'s here.`,examples:[{level:'easy',jp:'冬は寒いです。',romaji:'Fuyu wa samui desu.',en:'Winter is cold.'}, {level:'advanced',jp:'彼らは厳しい冬休みの間、スキー場で働いていた。',romaji:'Karera wa kibishii fuyuyasumi no aida, sukiijou de hataraite ita.',en:'They worked at a ski resort during the harsh winter break.'}]},

  // ---- Level 4 ----
  {id:'竹',char:'竹',onyomi:'たけ',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Bamboo',level:4,meaningMnemonic:`A **TACO** (たけ) stand shaded by **BAMBOO**.`,examples:[{level:'easy',jp:'竹の子が好きです。',romaji:'Takenoko ga suki desu.',en:'I like bamboo shoots.'}, {level:'advanced',jp:'この庭は、青々とした竹に囲まれている。',romaji:'Kono niwa wa, aoao to shita take ni kakomarete iru.',en:'This garden is surrounded by lush green bamboo.'}]},
  {id:'車',char:'車',onyomi:'しゃ',kunyomi:null,altMeanings:['Vehicle', 'Wheel (in compounds)'],otherReadings:['くるま'],meaning:'Car',level:4,meaningMnemonic:`The **SHAH** (しゃ) rides in style — his **CAR**.`,examples:[{level:'easy',jp:'車で行きます。',romaji:'Kuruma de ikimasu.',en:'I\'ll go by car.'}, {level:'advanced',jp:'電車の中は、通勤時間帯でとても混んでいた。',romaji:'Densha no naka wa, tsuukin jikantai de totemo konde ita.',en:'The inside of the train was very crowded during commuting hours.'}]},
  {id:'央',char:'央',onyomi:'おう',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Center',level:4,meaningMnemonic:`"**OH!** (おう) right in the **CENTER**."`,examples:[{level:'easy',jp:'中央に立ってください。',romaji:'Chuuou ni tatte kudasai.',en:'Please stand in the center.'}, {level:'advanced',jp:'その建物は、街の中央に堂々とそびえている。',romaji:'Sono tatemono wa, machi no chuuou ni doudou to sobiete iru.',en:'That building stands proudly in the center of town.'}]},
  {id:'写',char:'写',onyomi:'しゃ',kunyomi:null,altMeanings:['Copy down', 'Photograph (in compounds)'],otherReadings:[],meaning:'Copy',level:4,meaningMnemonic:`"**SHA**-zam! (しゃ) A perfect **COPY**."`,examples:[{level:'easy',jp:'写真を撮ります。',romaji:'Shashin o torimasu.',en:'I\'ll take a photo.'}, {level:'advanced',jp:'その書類は、原本を正確に写す必要がある。',romaji:'Sono shorui wa, genpon o seikaku ni utsusu hitsuyou ga aru.',en:'That document needs to be copied accurately from the original.'}]},
  {id:'仕',char:'仕',onyomi:'し',kunyomi:null,altMeanings:['Serve', 'Work (in compounds)'],otherReadings:[],meaning:'Doing',level:4,meaningMnemonic:`**SHE** (し) keeps busy **DOING** chores.`,examples:[{level:'easy',jp:'仕事があります。',romaji:'Shigoto ga arimasu.',en:'I have work to do.'}, {level:'advanced',jp:'この問題を解決する仕方が、なかなか見つからない。',romaji:'Kono mondai o kaiketsu suru shikata ga, nakanaka mitsukaranai.',en:'I can\'t seem to find a way to solve this problem.'}]},
  {id:'耳',char:'耳',onyomi:'みみ',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Ear',level:4,meaningMnemonic:`"**MEE-MEE**," (みみ) meows the cat, flicking its **EAR**.`,examples:[{level:'easy',jp:'耳が痛いです。',romaji:'Mimi ga itai desu.',en:'My ear hurts.'}, {level:'advanced',jp:'彼はいつも人の話に真剣に耳を傾けている。',romaji:'Kare wa itsumo hito no hanashi ni shinken ni mimi o katamukete iru.',en:'He always listens seriously to what others have to say.'}]},
  {id:'早',char:'早',onyomi:'そう',kunyomi:null,altMeanings:['Quick', 'Fast (in compounds)'],otherReadings:['はやい'],meaning:'Early',level:4,meaningMnemonic:`"**SO** (そう) **EARLY**," she groans.`,examples:[{level:'easy',jp:'早く起きます。',romaji:'Hayaku okimasu.',en:'I\'ll wake up early.'}, {level:'advanced',jp:'彼は早々に会議を切り上げ、次の予定に向かった。',romaji:'Kare wa sousou ni kaigi o kiriage, tsugi no yotei ni mukatta.',en:'He wrapped up the meeting quickly and headed to his next appointment.'}]},
  {id:'気',char:'気',onyomi:'き',kunyomi:null,altMeanings:['Spirit', 'Mood', 'Air'],otherReadings:[],meaning:'Energy',level:4,meaningMnemonic:`Turn the **KEY** (き) and feel the **ENERGY**.`,examples:[{level:'easy',jp:'元気ですか。',romaji:'Genki desu ka.',en:'Are you doing well?'}, {level:'advanced',jp:'彼女は、その知らせを聞いて一気に元気を取り戻した。',romaji:'Kanojo wa, sono shirase o kiite ikki ni genki o torimodoshita.',en:'She instantly regained her energy upon hearing that news.'}]},
  {id:'平',char:'平',onyomi:'へい',kunyomi:null,altMeanings:['Peaceful', 'Ordinary (in compounds)'],otherReadings:['びょう'],meaning:'Flat',level:4,meaningMnemonic:`"**HEY** (へい), keep it **FLAT**!"`,examples:[{level:'easy',jp:'平らな道です。',romaji:'Taira na michi desu.',en:'It\'s a flat road.'}, {level:'advanced',jp:'二つの国の間に、ようやく平和条約が結ばれた。',romaji:'Futatsu no kuni no aida ni, youyaku heiwa jouyaku ga musubareta.',en:'A peace treaty was finally concluded between the two countries.'}]},
  {id:'花',char:'花',onyomi:'はな',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Flower',level:4,meaningMnemonic:`**HANNAH** (はな) waters her **FLOWER**s.`,examples:[{level:'easy',jp:'花がきれいです。',romaji:'Hana ga kirei desu.',en:'The flowers are beautiful.'}, {level:'advanced',jp:'毎年春になると、この公園は花見の人々で賑わう。',romaji:'Maitoshi haru ni naru to, kono kouen wa hanami no hitobito de nigiwau.',en:'Every spring, this park bustles with people cherry-blossom viewing.'}]},
  {id:'足',char:'足',onyomi:'そく',kunyomi:null,altMeanings:['Leg', 'Sufficient (as in 足りる)'],otherReadings:['あし'],meaning:'Foot',level:4,meaningMnemonic:`Pull a **SOCK** (そく) onto your **FOOT**.`,examples:[{level:'easy',jp:'足が痛いです。',romaji:'Ashi ga itai desu.',en:'My foot hurts.'}, {level:'advanced',jp:'準備の時間が足りないと、彼は心配していた。',romaji:'Junbi no jikan ga tarinai to, kare wa shinpai shite ita.',en:'He was worried that there wasn\'t enough time to prepare.'}]},
  {id:'打',char:'打',onyomi:'だ',kunyomi:null,altMeanings:['Strike', 'Type (as in typing)'],otherReadings:[],meaning:'Hit',level:4,meaningMnemonic:`"**DAH!** (だ)" using her hand to **HIT** the nail.`,examples:[{level:'easy',jp:'釘を打ちます。',romaji:'Kugi o uchimasu.',en:'I\'ll hit the nail.'}, {level:'advanced',jp:'監督は選手たちに、次の試合に向けて気持ちを打ち込むよう伝えた。',romaji:'Kantoku wa senshu-tachi ni, tsugi no shiai ni mukete kimochi o uchikomu you tsutaeta.',en:'The coach told the players to put their full energy into the next match.'}]},
  {id:'穴',char:'穴',onyomi:'あな',kunyomi:null,altMeanings:['Cavity', 'Gap'],otherReadings:[],meaning:'Hole',level:4,meaningMnemonic:`**ANNA** (あな) digs a **HOLE**.`,examples:[{level:'easy',jp:'穴があります。',romaji:'Ana ga arimasu.',en:'There is a hole.'}, {level:'advanced',jp:'その計画には、まだいくつかの穴があるように思う。',romaji:'Sono keikaku ni wa, mada ikutsuka no ana ga aru you ni omou.',en:'I feel that plan still has a few holes in it.'}]},
  {id:'百',char:'百',onyomi:'ひゃく',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Hundred',level:4,meaningMnemonic:`A **HUNDRED** fluffy **YAK**s (ひゃく) graze.`,examples:[{level:'easy',jp:'百円ください。',romaji:'Hyakuen kudasai.',en:'Please give me a hundred yen.'}, {level:'advanced',jp:'このホールには、百万人以上の人が訪れたことがある。',romaji:'Kono hooru ni wa, hyakuman-nin ijou no hito ga otozureta koto ga aru.',en:'More than a million people have visited this hall.'}]},
  {id:'氷',char:'氷',onyomi:'こおり',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Ice',level:4,meaningMnemonic:`**COREY** (こおり) slips on **ICE**.`,examples:[{level:'easy',jp:'氷が冷たいです。',romaji:'Koori ga tsumetai desu.',en:'The ice is cold.'}, {level:'advanced',jp:'かき氷は、夏の暑さをしのぐ定番のデザートだ。',romaji:'Kakigoori wa, natsu no atsusa o shinogu teiban no dezaato da.',en:'Shaved ice is the classic dessert for getting through summer heat.'}]},
  {id:'虫',char:'虫',onyomi:'むし',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Insect',level:4,meaningMnemonic:`That **INSECT** looks **MUSHY** (むし).`,examples:[{level:'easy',jp:'虫がいます。',romaji:'Mushi ga imasu.',en:'There is a bug.'}, {level:'advanced',jp:'子供の頃、夏になると毛虫を捕まえて遊んだものだ。',romaji:'Kodomo no koro, natsu ni naru to kemushi o tsukamaete asonda mono da.',en:'As a child, I used to catch caterpillars and play with them in summer.'}]},
  {id:'内',char:'内',onyomi:'ない',kunyomi:null,altMeanings:['Within', 'Among'],otherReadings:['うち'],meaning:'Inside',level:4,meaningMnemonic:`"Come on **IN**," (ない) tucking the person **INSIDE**.`,examples:[{level:'easy',jp:'車内にいます。',romaji:'Shanai ni imasu.',en:'I\'m inside the car.'}, {level:'advanced',jp:'この件については、社内で慎重に検討する必要がある。',romaji:'Kono ken ni tsuite wa, shanai de shinchou ni kentou suru hitsuyou ga aru.',en:'This matter needs to be carefully discussed within the company.'}]},
  {id:'男',char:'男',onyomi:'だん',kunyomi:null,altMeanings:['Male'],otherReadings:['おとこ'],meaning:'Man',level:4,meaningMnemonic:`**DON** (だん), a strong **MAN**.`,examples:[{level:'easy',jp:'男の人がいます。',romaji:'Otoko no hito ga imasu.',en:'There is a man.'}, {level:'advanced',jp:'その役職には、性別に関係なく、能力のある人が選ばれるべきだ。',romaji:'Sono yakushoku ni wa, seibetsu ni kankei naku, nouryoku no aru hito ga erabareru beki da.',en:'That position should be filled by a capable person, regardless of gender.'}]},
  {id:'主',char:'主',onyomi:'しゅ',kunyomi:null,altMeanings:['Main', 'Owner', 'Lord'],otherReadings:[],meaning:'Master',level:4,meaningMnemonic:`The **MASTER** polishes his **SHOE** (しゅ).`,examples:[{level:'easy',jp:'主人がいます。',romaji:'Shujin ga imasu.',en:'I have a husband. (lit. "master of the house")'}, {level:'advanced',jp:'このプロジェクトの主な目的は、コストを削減することだ。',romaji:'Kono purojekuto no omo na mokuteki wa, kosuto o sakugen suru koto da.',en:'The main purpose of this project is to reduce costs.'}]},
  {id:'名',char:'名',onyomi:'めい',kunyomi:null,altMeanings:['Fame', 'Famous (in compounds)'],otherReadings:['な'],meaning:'Name',level:4,meaningMnemonic:`"**MAY!** (めい)" calling out a **NAME**.`,examples:[{level:'easy',jp:'名前は何ですか。',romaji:'Namae wa nan desu ka.',en:'What is your name?'}, {level:'advanced',jp:'彼は、その分野の名人として広く知られている。',romaji:'Kare wa, sono bun\'ya no meijin toshite hiroku shirarete iru.',en:'He\'s widely known as a master in that field.'}]},
  {id:'不',char:'不',onyomi:'ふ',kunyomi:null,altMeanings:['Un-', 'Negative (prefix)'],otherReadings:[],meaning:'Not',level:4,meaningMnemonic:`"**WHO** (ふ) says birds can **NOT** fly?"`,examples:[{level:'easy',jp:'不正はいけません。',romaji:'Fusei wa ikemasen.',en:'Misconduct is not allowed.'}, {level:'advanced',jp:'その提案には、いくつかの不足している点がある。',romaji:'Sono teian ni wa, ikutsuka no fusoku shite iru ten ga aru.',en:'That proposal has several points that fall short.'}]},
  {id:'号',char:'号',onyomi:'ごう',kunyomi:null,altMeanings:['Issue (of a publication)', 'Signal'],otherReadings:[],meaning:'Number',level:4,meaningMnemonic:`"**GO!** (ごう)" the mouth shouts **NUMBER** one.`,examples:[{level:'easy',jp:'番号を教えてください。',romaji:'Bangou o oshiete kudasai.',en:'Please tell me the number.'}, {level:'advanced',jp:'この雑誌の最新号には、興味深い記事が載っている。',romaji:'Kono zasshi no saishingou ni wa, kyoumibukai kiji ga notte iru.',en:'The latest issue of this magazine has an interesting article in it.'}]},
  {id:'元',char:'元',onyomi:'げん',kunyomi:null,altMeanings:['Former', 'Original'],otherReadings:['もと'],meaning:'Origin',level:4,meaningMnemonic:`Back at the very **GEN**esis (げん) — the **ORIGIN**.`,examples:[{level:'easy',jp:'元気ですか。',romaji:'Genki desu ka.',en:'Are you well?'}, {level:'advanced',jp:'彼は元々、この分野の専門家ではなかった。',romaji:'Kare wa motomoto, kono bun\'ya no senmonka dewa nakatta.',en:'He wasn\'t originally an expert in this field.'}]},
  {id:'他',char:'他',onyomi:'た',kunyomi:null,altMeanings:['Another', 'Else'],otherReadings:[],meaning:'Other',level:4,meaningMnemonic:`"**TAH**-dah! (た) Someone **OTHER** than me!"`,examples:[{level:'easy',jp:'他の人と話します。',romaji:'Hoka no hito to hanashimasu.',en:'I\'ll talk to someone else.'}, {level:'advanced',jp:'その他にも、検討すべき選択肢がいくつかある。',romaji:'Sono hoka ni mo, kentou subeki sentakushi ga ikutsuka aru.',en:'Besides that, there are several other options worth considering.'}]},
  {id:'去',char:'去',onyomi:'きょ',kunyomi:null,altMeanings:['Leave', 'Depart'],otherReadings:['さる'],meaning:'Past',level:4,meaningMnemonic:`"**KYO** (きょ), that's ancient history," buried in the **PAST**.`,examples:[{level:'easy',jp:'去年、日本に行きました。',romaji:'Kyonen, Nihon ni ikimashita.',en:'Last year, I went to Japan.'}, {level:'advanced',jp:'彼は、過ぎ去った日々を懐かしそうに振り返った。',romaji:'Kare wa, sugisatta hibi o natsukashisou ni furikaetta.',en:'He looked back nostalgically on the days that had passed.'}]},
  {id:'皿',char:'皿',onyomi:'さら',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Plate',level:4,meaningMnemonic:`**SARAH** (さら) serves dinner on a **PLATE**.`,examples:[{level:'easy',jp:'皿を洗います。',romaji:'Sara o araimasu.',en:'I\'ll wash the dishes.'}, {level:'advanced',jp:'小皿に取り分けてから、みんなで食べましょう。',romaji:'Kozara ni toriwakete kara, minna de tabemashou.',en:'Let\'s serve it onto small plates first, then eat together.'}]},
  {id:'先',char:'先',onyomi:'せん',kunyomi:null,altMeanings:['Ahead', 'Tip', 'Destination (in compounds)'],otherReadings:['さき'],meaning:'Previous',level:4,meaningMnemonic:`Every **CENT** (せん) came from the **PREVIOUS** generation.`,examples:[{level:'easy',jp:'先生です。',romaji:'Sensei desu.',en:'I am a teacher.'}, {level:'advanced',jp:'先月の売り上げは、先々月より大きく伸びた。',romaji:'Sengetsu no uriage wa, sensengetsu yori ookiku nobita.',en:'Last month\'s sales grew significantly compared to the month before that.'}]},
  {id:'赤',char:'赤',onyomi:'あか',kunyomi:null,altMeanings:['Crimson'],otherReadings:['せき'],meaning:'Red',level:4,meaningMnemonic:`"**AKA** (あか) 'Red Hot,'" the earth glows.`,examples:[{level:'easy',jp:'赤い花です。',romaji:'Akai hana desu.',en:'It\'s a red flower.'}, {level:'advanced',jp:'赤ちゃんは、生まれたばかりで顔が赤かった。',romaji:'Akachan wa, umareta bakari de kao ga akakatta.',en:'The baby, just born, had a red face.'}]},
  {id:'休',char:'休',onyomi:'きゅう',kunyomi:null,altMeanings:['Break', 'Absence'],otherReadings:[],meaning:'Rest',level:4,meaningMnemonic:`That's your **CUE** (きゅう) to **REST**.`,examples:[{level:'easy',jp:'休みます。',romaji:'Yasumimasu.',en:'I\'ll rest.'}, {level:'advanced',jp:'彼は体調を崩し、一週間、会社を休むことになった。',romaji:'Kare wa taichou o kuzushi, isshuukan, kaisha o yasumu koto ni natta.',en:'He fell ill and ended up taking a week off from work.'}]},
  {id:'申',char:'申',onyomi:'もう',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Say Humbly',level:4,meaningMnemonic:`"**MO**-destly speaking," (もう) he says **HUMBLY**.`,examples:[{level:'easy',jp:'そう申します。',romaji:'Sou moushimasu.',en:'That\'s what I (humbly) say.'}, {level:'advanced',jp:'彼は、自分の非礼を丁重に申し上げて謝罪した。',romaji:'Kare wa, jibun no hirei o teichou ni moushiagete shazai shita.',en:'He humbly apologized for his own rudeness.'}]},
  {id:'見',char:'見',onyomi:'み',kunyomi:null,altMeanings:['Look', 'View', 'Opinion (in compounds)'],otherReadings:[],meaning:'See',level:4,meaningMnemonic:`"Look at **ME**! (み)" moving around to **SEE**.`,examples:[{level:'easy',jp:'映画を見ます。',romaji:'Eiga o mimasu.',en:'I\'ll watch a movie.'}, {level:'advanced',jp:'彼の意見に、私も全く同じ見方をしている。',romaji:'Kare no iken ni, watashi mo mattaku onaji mikata o shite iru.',en:'I share exactly the same view as his opinion.'}]},
  {id:'貝',char:'貝',onyomi:'かい',kunyomi:null,altMeanings:['Shell'],otherReadings:[],meaning:'Shellfish',level:4,meaningMnemonic:`Under a clear **SKY** (かい), a little **SHELLFISH**.`,examples:[{level:'easy',jp:'貝を食べます。',romaji:'Kai o tabemasu.',en:'I\'ll eat shellfish.'}, {level:'advanced',jp:'浜辺で、色とりどりの貝殻を集めるのが好きだ。',romaji:'Hamabe de, iro toridori no kaigara o atsumeru no ga suki da.',en:'I like collecting colorful shells at the beach.'}]},
  {id:'石',char:'石',onyomi:'せき',kunyomi:null,altMeanings:['Rock'],otherReadings:[],meaning:'Stone',level:4,meaningMnemonic:`**PSYCHE!** (せき) — just a painted **STONE**.`,examples:[{level:'easy',jp:'石があります。',romaji:'Ishi ga arimasu.',en:'There is a stone.'}, {level:'advanced',jp:'この庭には、大きな石が芸術的に配置されている。',romaji:'Kono niwa ni wa, ookina ishi ga geijutsuteki ni haichi sarete iru.',en:'Large stones are arranged artistically in this garden.'}]},
  {id:'礼',char:'礼',onyomi:'れい',kunyomi:null,altMeanings:['Gratitude', 'Etiquette', 'Bow'],otherReadings:[],meaning:'Thanks',level:4,meaningMnemonic:`A **RAY** (れい) of gratitude — giving **THANKS**.`,examples:[{level:'easy',jp:'お礼を言います。',romaji:'Orei o iimasu.',en:'I\'ll say thank you.'}, {level:'advanced',jp:'彼は、いつも礼儀正しい態度で人と接している。',romaji:'Kare wa, itsumo reigi tadashii taido de hito to sesshite iru.',en:'He always interacts with people in a courteous manner.'}]},
  {id:'糸',char:'糸',onyomi:'いと',kunyomi:null,altMeanings:['String', 'Yarn'],otherReadings:[],meaning:'Thread',level:4,meaningMnemonic:`"**Eat, oh!**" (いと) tangled in **THREAD**.`,examples:[{level:'easy',jp:'糸を買いました。',romaji:'Ito o kaimashita.',en:'I bought thread.'}, {level:'advanced',jp:'この毛糸は、とても柔らかくて肌触りがいい。',romaji:'Kono keito wa, totemo yawarakakute hadazawari ga ii.',en:'This wool yarn is very soft and feels nice against the skin.'}]},
  {id:'町',char:'町',onyomi:'ちょう',kunyomi:null,altMeanings:['Block (of a city)'],otherReadings:[],meaning:'Town',level:4,meaningMnemonic:`"**CHO!** (ちょう)" the **TOWN** crier shouts.`,examples:[{level:'easy',jp:'この町が好きです。',romaji:'Kono machi ga suki desu.',en:'I like this town.'}, {level:'advanced',jp:'下町には、昔ながらの雰囲気が今も残っている。',romaji:'Shitamachi ni wa, mukashinagara no fun\'iki ga ima mo nokotte iru.',en:'The old downtown still retains its traditional atmosphere today.'}]},
  {id:'宝',char:'宝',onyomi:'ほう',kunyomi:null,altMeanings:['Treasured thing', 'Precious'],otherReadings:[],meaning:'Treasure',level:4,meaningMnemonic:`"**HO**- (ほう) what a haul!" true **TREASURE**.`,examples:[{level:'easy',jp:'宝物があります。',romaji:'Takaramono ga arimasu.',en:'I have a treasure.'}, {level:'advanced',jp:'彼にとって、家族との時間こそが何よりの宝だ。',romaji:'Kare ni totte, kazoku to no jikan koso ga nani yori no takara da.',en:'For him, time with his family is his greatest treasure of all.'}]},
  {id:'村',char:'村',onyomi:'むら',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Village',level:4,meaningMnemonic:`Pool the **MOOLAH** (むら) for the **VILLAGE**.`,examples:[{level:'easy',jp:'小さい村です。',romaji:'Chiisai mura desu.',en:'It\'s a small village.'}, {level:'advanced',jp:'この村人たちは、代々農業を営んで暮らしてきた。',romaji:'Kono murabito-tachi wa, daidai nougyou o itonande kurashite kita.',en:'These villagers have lived by farming for generations.'}]},
  {id:'世',char:'世',onyomi:'せい',kunyomi:null,altMeanings:['Generation', 'Era', 'Society'],otherReadings:['よ'],meaning:'World',level:4,meaningMnemonic:`"**SAY** (せい) hello to the **WORLD**."`,examples:[{level:'easy',jp:'世界は広いです。',romaji:'Sekai wa hiroi desu.',en:'The world is wide.'}, {level:'advanced',jp:'彼は、その家系で三世代目の当主となった。',romaji:'Kare wa, sono kakei de sansedaime no toushu to natta.',en:'He became the third-generation head of that family line.'}]},
  {id:'年',char:'年',onyomi:'ねん',kunyomi:null,altMeanings:['Age', 'Grade (in school)'],otherReadings:[],meaning:'Year',level:4,meaningMnemonic:`**NEN** (ねん), the farmer, carries rice for the whole **YEAR**.`,examples:[{level:'easy',jp:'今年は忙しいです。',romaji:'Kotoshi wa isogashii desu.',en:'This year is busy.'}, {level:'advanced',jp:'彼はこの会社で、もう二十年以上働いている。',romaji:'Kare wa kono kaisha de, mou nijuunen ijou hataraite iru.',en:'He\'s been working at this company for more than twenty years now.'}]},

  // ---- Level 5 ----
  {id:'角',char:'角',onyomi:'かく',kunyomi:null,altMeanings:['Corner', 'Square (shape)'],otherReadings:[],meaning:'Angle',level:5,meaningMnemonic:`A **KHAKI**-colored (かく) horn juts out at an **ANGLE**.`,examples:[{level:'easy',jp:'三角の形です。',romaji:'Sankaku no katachi desu.',en:'It\'s a triangular shape.'}, {level:'advanced',jp:'この道の角度は、車の運転には少し急すぎる。',romaji:'Kono michi no kakudo wa, kuruma no unten ni wa sukoshi kyuusugiru.',en:'The angle of this road is a bit too steep for driving.'}]},
  {id:'斤',char:'斤',onyomi:'きん',kunyomi:null,altMeanings:['Loaf counter (for bread)'],otherReadings:[],meaning:'Axe',level:5,meaningMnemonic:`A **KEEN**-edged (きん) **AXE** blade.`,examples:[{level:'easy',jp:'パンを一斤買いました。',romaji:'Pan o ikkin kaimashita.',en:'I bought one loaf of bread.'}, {level:'advanced',jp:'昔は、斤という単位で肉の重さを量っていたそうだ。',romaji:'Mukashi wa, kin to iu tan\'i de niku no omosa o hakatte ita sou da.',en:'I hear that in the old days, meat weight was measured in units called "kin."'}]},
  {id:'青',char:'青',onyomi:'せい',kunyomi:null,altMeanings:['Green (in some traditional uses, e.g. traffic lights)', 'Young/Youth'],otherReadings:[],meaning:'Blue',level:5,meaningMnemonic:`"**SAY** (せい) it's **BLUE**."`,examples:[{level:'easy',jp:'空が青いです。',romaji:'Sora ga aoi desu.',en:'The sky is blue.'}, {level:'advanced',jp:'彼は青年時代を、海外で過ごした経験がある。',romaji:'Kare wa seinen jidai o, kaigai de sugoshita keiken ga aru.',en:'He has the experience of having spent his youth overseas.'}]},
  {id:'体',char:'体',onyomi:'たい',kunyomi:null,altMeanings:['Physical', 'Form', 'Substance'],otherReadings:['てい'],meaning:'Body',level:5,meaningMnemonic:`**TIE** (たい) your **BODY** back to its roots.`,examples:[{level:'easy',jp:'体が痛いです。',romaji:'Karada ga itai desu.',en:'My body hurts.'}, {level:'advanced',jp:'彼女は体力をつけるため、毎朝ジョギングをしている。',romaji:'Kanojo wa tairyoku o tsukeru tame, maiasa jogingu o shite iru.',en:'She jogs every morning to build up her physical strength.'}]},
  {id:'色',char:'色',onyomi:'いろ',kunyomi:null,altMeanings:['Hue', 'Complexion (in compounds)'],otherReadings:['しょく'],meaning:'Color',level:5,meaningMnemonic:`An **ARROW** (いろ) of every **COLOR**.`,examples:[{level:'easy',jp:'色が好きです。',romaji:'Iro ga suki desu.',en:'I like the color.'}, {level:'advanced',jp:'彼女の答えは、状況によって色々変わるように見えた。',romaji:'Kanojo no kotae wa, joukyou ni yotte iroiro kawaru you ni mieta.',en:'Her answer seemed to change in various ways depending on the situation.'}]},
  {id:'来',char:'来',onyomi:'らい',kunyomi:null,altMeanings:['Next (as in 来年)', 'Since (as in 従来)'],otherReadings:['くる'],meaning:'Come',level:5,meaningMnemonic:`A loaf of **RYE** (らい) bread **COME**s fresh.`,examples:[{level:'easy',jp:'来月、日本に行きます。',romaji:'Raigetsu, Nihon ni ikimasu.',en:'I\'ll go to Japan next month.'}, {level:'advanced',jp:'彼は、本来の目的を見失ってしまったようだ。',romaji:'Kare wa, honrai no mokuteki o miushinatte shimatta you da.',en:'It seems he\'s lost sight of his original purpose.'}]},
  {id:'社',char:'社',onyomi:'しゃ',kunyomi:null,altMeanings:['Firm', 'Shrine (in compounds like 神社)'],otherReadings:[],meaning:'Company',level:5,meaningMnemonic:`"**SHA**-reholders meet" (しゃ) at the **COMPANY**'s altar.`,examples:[{level:'easy',jp:'会社に行きます。',romaji:'Kaisha ni ikimasu.',en:'I\'ll go to the company.'}, {level:'advanced',jp:'彼はこの春、新しい会社に入社したばかりだ。',romaji:'Kare wa kono haru, atarashii kaisha ni nyuusha shita bakari da.',en:'He just joined a new company this spring.'}]},
  {id:'当',char:'当',onyomi:'とう',kunyomi:null,altMeanings:['This', 'Guess', 'Hit the mark'],otherReadings:[],meaning:'Correct',level:5,meaningMnemonic:`Step on your **TOE** (とう) at the **CORRECT** spot.`,examples:[{level:'easy',jp:'当たりです。',romaji:'Atari desu.',en:'That\'s correct.'}, {level:'advanced',jp:'彼の予想は、思いがけず的中し、周りを驚かせた。',romaji:'Kare no yosou wa, omoigakezu tekichuu shi, mawari o odorokaseta.',en:'His prediction unexpectedly hit the mark, surprising those around him.'}]},
  {id:'図',char:'図',onyomi:'ず',kunyomi:null,altMeanings:['Chart', 'Illustration', 'Plan'],otherReadings:['と'],meaning:'Diagram',level:5,meaningMnemonic:`The **ZOO** (ず) map is a simple **DIAGRAM**.`,examples:[{level:'easy',jp:'図を見てください。',romaji:'Zu o mite kudasai.',en:'Please look at the diagram.'}, {level:'advanced',jp:'この地図は、細かい道まで正確に描かれている。',romaji:'Kono chizu wa, komakai michi made seikaku ni egakarete iru.',en:'This map accurately depicts even the smallest roads.'}]},
  {id:'毎',char:'毎',onyomi:'まい',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Every',level:5,meaningMnemonic:`"**MY** (まい) mother does this **EVERY** day."`,examples:[{level:'easy',jp:'毎日、勉強します。',romaji:'Mainichi, benkyou shimasu.',en:'I study every day.'}, {level:'advanced',jp:'彼は毎度のことながら、会議に少し遅れて到着した。',romaji:'Kare wa maido no koto nagara, kaigi ni sukoshi okurete touchaku shita.',en:'As usual, he arrived a little late to the meeting.'}]},
  {id:'羽',char:'羽',onyomi:'はね',kunyomi:null,altMeanings:['Wing'],otherReadings:[],meaning:'Feather',level:5,meaningMnemonic:`Soft as **HONEY** (はね), these curved **FEATHER** wings.`,examples:[{level:'easy',jp:'鳥の羽です。',romaji:'Tori no hane desu.',en:'It\'s a bird\'s feather.'}, {level:'advanced',jp:'この毛布は、羽毛のようにふわふわしている。',romaji:'Kono moufu wa, roku no you ni fuwafuwa shite iru.',en:'This blanket is as fluffy as down feathers.'}]},
  {id:'林',char:'林',onyomi:'はやし',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Forest',level:5,meaningMnemonic:`"**HI, YOSHI!**" (はやし) between the trees.`,examples:[{level:'easy',jp:'林があります。',romaji:'Hayashi ga arimasu.',en:'There is a forest.'}, {level:'advanced',jp:'この林道は、地元の人しか知らない静かな散歩コースだ。',romaji:'Kono rindou wa, jimoto no hito shika shiranai shizuka na sanpo koosu da.',en:'This forest path is a quiet walking route known only to locals.'}]},
  {id:'行',char:'行',onyomi:'こう',kunyomi:null,altMeanings:['Line (of text)', 'Row', 'Bank (in compounds)'],otherReadings:['ぎょう', 'いく'],meaning:'Go',level:5,meaningMnemonic:`"**CO**-me on (こう), let's **GO**!"`,examples:[{level:'easy',jp:'学校に行きます。',romaji:'Gakkou ni ikimasu.',en:'I\'ll go to school.'}, {level:'advanced',jp:'彼女の行動は、いつも周りの人を勇気づけている。',romaji:'Kanojo no koudou wa, itsumo mawari no hito o yuukizukete iru.',en:'Her actions always encourage those around her.'}]},
  {id:'金',char:'金',onyomi:'きん',kunyomi:null,altMeanings:['Money', 'Metal', 'Friday (in compounds)'],otherReadings:['かね'],meaning:'Gold',level:5,meaningMnemonic:`A **KEEN** (きん) eye spots two **GOLD** nuggets.`,examples:[{level:'easy',jp:'お金がありません。',romaji:'Okane ga arimasen.',en:'I have no money.'}, {level:'advanced',jp:'このネックレスは、純金で作られている。',romaji:'Kono nekkuresu wa, junkin de tsukurarete iru.',en:'This necklace is made from pure gold.'}]},
  {id:'草',char:'草',onyomi:'くさ',kunyomi:null,altMeanings:['Weed', 'Herb'],otherReadings:[],meaning:'Grass',level:5,meaningMnemonic:`Move the **CURSOR** (くさ) over a patch of **GRASS**.`,examples:[{level:'easy',jp:'草が多いです。',romaji:'Kusa ga ooi desu.',en:'There is a lot of grass.'}, {level:'advanced',jp:'子供の頃、草地を裸足で走り回ったのを覚えている。',romaji:'Kodomo no koro, kusachi o hadashi de hashirimawatta no o oboete iru.',en:'I remember running around barefoot on the grass as a child.'}]},
  {id:'里',char:'里',onyomi:'さと',kunyomi:null,altMeanings:['Village', 'League (old distance unit)'],otherReadings:[],meaning:'Hometown',level:5,meaningMnemonic:`**SATO**'s (さと) family field, his **HOMETOWN**.`,examples:[{level:'easy',jp:'里に帰ります。',romaji:'Sato ni kaerimasu.',en:'I\'ll go back to my hometown.'}, {level:'advanced',jp:'彼は人里離れた場所で、静かに暮らすことを選んだ。',romaji:'Kare wa hitozato hanareta basho de, shizuka ni kurasu koto o eranda.',en:'He chose to live quietly in a place far from human habitation.'}]},
  {id:'光',char:'光',onyomi:'こう',kunyomi:null,altMeanings:['Ray', 'Shine', 'Glory (in compounds)'],otherReadings:[],meaning:'Light',level:5,meaningMnemonic:`"**CO**-me toward the **LIGHT**" (こう).`,examples:[{level:'easy',jp:'光が眩しいです。',romaji:'Hikari ga mabushii desu.',en:'The light is dazzling.'}, {level:'advanced',jp:'この製品は、太陽光を利用して発電することができる。',romaji:'Kono seihin wa, taiyoukou o riyou shite hatsuden suru koto ga dekiru.',en:'This product can generate electricity using sunlight.'}]},
  {id:'作',char:'作',onyomi:'さく',kunyomi:null,altMeanings:['Crop', 'Work (creative)', 'Harvest'],otherReadings:['つくる'],meaning:'Make',level:5,meaningMnemonic:`Knit a **SOCK** (さく) by hand — carefully **MAKE**ing it.`,examples:[{level:'easy',jp:'料理を作ります。',romaji:'Ryouri o tsukurimasu.',en:'I\'ll make a meal.'}, {level:'advanced',jp:'この作品は、彼の代表作と言われている。',romaji:'Kono sakuhin wa, kare no daihyousaku to iwarete iru.',en:'This work is said to be his masterpiece.'}]},
  {id:'多',char:'多',onyomi:'た',kunyomi:null,altMeanings:['Much', 'A lot'],otherReadings:[],meaning:'Many',level:5,meaningMnemonic:`"**TAH**-dah! (た) So **MANY** evenings."`,examples:[{level:'easy',jp:'人が多いです。',romaji:'Hito ga ooi desu.',en:'There are many people.'}, {level:'advanced',jp:'彼は多分、来週までにその報告書を仕上げるだろう。',romaji:'Kare wa tabun, raishuu made ni sono houkokusho o shiageru darou.',en:'He\'ll probably finish that report by next week.'}]},
  {id:'肉',char:'肉',onyomi:'にく',kunyomi:null,altMeanings:['Flesh'],otherReadings:[],meaning:'Meat',level:5,meaningMnemonic:`**NICK** (にく) the butcher cuts into **MEAT**.`,examples:[{level:'easy',jp:'肉が好きです。',romaji:'Niku ga suki desu.',en:'I like meat.'}, {level:'advanced',jp:'この店の牛肉は、とても柔らかくて評判がいい。',romaji:'Kono mise no gyuuniku wa, totemo yawarakakute hyouban ga ii.',en:'This shop\'s beef is very tender and has a good reputation.'}]},
  {id:'会',char:'会',onyomi:'かい',kunyomi:null,altMeanings:['Meeting', 'Association', 'Party'],otherReadings:[],meaning:'Meet',level:5,meaningMnemonic:`Under a clear **SKY** (かい), two friends **MEET**.`,examples:[{level:'easy',jp:'会社に行きます。',romaji:'Kaisha ni ikimasu.',en:'I\'ll go to the company.'}, {level:'advanced',jp:'彼とは、久しぶりに街で偶然会うことができた。',romaji:'Kare to wa, hisashiburi ni machi de guuzen au koto ga dekita.',en:'I was able to meet him by chance in town after a long time.'}]},
  {id:'交',char:'交',onyomi:'こう',kunyomi:null,altMeanings:['Exchange', 'Cross', 'Interact'],otherReadings:[],meaning:'Mix',level:5,meaningMnemonic:`"**CO**-mingle," (こう) the crowd **MIX**es.`,examples:[{level:'easy',jp:'交番はどこですか。',romaji:'Kouban wa doko desu ka.',en:'Where is the police box?'}, {level:'advanced',jp:'この二つの色を交ぜると、きれいな緑になる。',romaji:'Kono futatsu no iro o mazeru to, kirei na midori ni naru.',en:'Mixing these two colors gives a beautiful green.'}]},
  {id:'近',char:'近',onyomi:'きん',kunyomi:null,altMeanings:['Close', 'Recent (in compounds)'],otherReadings:['ちかい'],meaning:'Near',level:5,meaningMnemonic:`**KEEN** (きん) senses pick up footsteps drawing **NEAR**.`,examples:[{level:'easy',jp:'近くにあります。',romaji:'Chikaku ni arimasu.',en:'It\'s nearby.'}, {level:'advanced',jp:'近年、この分野の技術は目覚ましい進歩を遂げている。',romaji:'Kinnen, kono bun\'ya no gijutsu wa mezamashii shinpo o togete iru.',en:'In recent years, technology in this field has made remarkable progress.'}]},
  {id:'夜',char:'夜',onyomi:'よる',kunyomi:null,altMeanings:['Evening'],otherReadings:[],meaning:'Night',level:5,meaningMnemonic:`"Is this **YOUR** (よる) spot for the **NIGHT**?"`,examples:[{level:'easy',jp:'夜になりました。',romaji:'Yoru ni narimashita.',en:'It has become night.'}, {level:'advanced',jp:'彼女は夜明けまで、ずっとその原稿を書き続けていた。',romaji:'Kanojo wa yoake made, zutto sono genkou o kakitsuzukete ita.',en:'She kept writing that manuscript all the way until dawn.'}]},
  {id:'兄',char:'兄',onyomi:'きょう',kunyomi:null,altMeanings:[],otherReadings:['あに'],meaning:'Older Brother',level:5,meaningMnemonic:`"**KYO**- (きょう) you're so bossy!" the **OLDER BROTHER**.`,examples:[{level:'easy',jp:'兄がいます。',romaji:'Ani ga imasu.',en:'I have an older brother.'}, {level:'advanced',jp:'彼のお兄さんは、有名な音楽家として知られている。',romaji:'Kare no oniisan wa, yuumei na ongakuka toshite shirarete iru.',en:'His older brother is known as a famous musician.'}]},
  {id:'豚',char:'豚',onyomi:'ぶた',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Pig',level:5,meaningMnemonic:`This **PIG** loves rolling in **BUTTER** (ぶた).`,examples:[{level:'easy',jp:'豚肉を買いました。',romaji:'Butaniku o kaimashita.',en:'I bought pork.'}, {level:'advanced',jp:'この農場では、豚を自然に近い環境で育てている。',romaji:'Kono noujou dewa, buta o shizen ni chikai kankyou de sodatete iru.',en:'This farm raises pigs in an environment close to nature.'}]},
  {id:'雨',char:'雨',onyomi:'あめ',kunyomi:null,altMeanings:[],otherReadings:[],meaning:'Rain',level:5,meaningMnemonic:`**AMY** (あめ) dances in the **RAIN**.`,examples:[{level:'easy',jp:'雨が降っています。',romaji:'Ame ga futte imasu.',en:'It\'s raining.'}, {level:'advanced',jp:'大雨の影響で、電車のダイヤが大きく乱れている。',romaji:'Ooame no eikyou de, densha no daiya ga ookiku midarete iru.',en:'Due to the heavy rain, the train schedule has been badly disrupted.'}]},
  {id:'米',char:'米',onyomi:'べい',kunyomi:null,altMeanings:['America (abbreviation, as in 米国)'],otherReadings:['こめ'],meaning:'Rice',level:5,meaningMnemonic:`Down by the **BAY** (べい), stalks of **RICE**.`,examples:[{level:'easy',jp:'米を食べます。',romaji:'Kome o tabemasu.',en:'I\'ll eat rice.'}, {level:'advanced',jp:'米国からの観光客が、この地域に増えているようだ。',romaji:'Beikoku kara no kankoukyaku ga, kono chiiki ni fuete iru you da.',en:'It seems tourists from America are increasing in this area.'}]},
  {id:'走',char:'走',onyomi:'そう',kunyomi:null,altMeanings:['Rush', 'Speed (in compounds)'],otherReadings:['はしる'],meaning:'Run',level:5,meaningMnemonic:`"**SO** (そう) fast!" the **RUNNER** sprints.`,examples:[{level:'easy',jp:'走ります。',romaji:'Hashirimasu.',en:'I\'ll run.'}, {level:'advanced',jp:'彼は毎朝、駅まで全力で走行している。',romaji:'Kare wa maiasa, eki made zenryoku de soukou shite iru.',en:'He runs at full speed to the station every morning.'}]},
  {id:'同',char:'同',onyomi:'どう',kunyomi:null,altMeanings:['Identical', 'Together'],otherReadings:[],meaning:'Same',level:5,meaningMnemonic:`Shape the **DOUGH** (どう) into the exact **SAME** box.`,examples:[{level:'easy',jp:'同じです。',romaji:'Onaji desu.',en:'It\'s the same.'}, {level:'advanced',jp:'この二つの事件は、驚くほど同時に発生した。',romaji:'Kono futatsu no jiken wa, odoroku hodo douji ni hassei shita.',en:'These two incidents occurred at surprisingly the same time.'}]},
  {id:'言',char:'言',onyomi:'げん',kunyomi:null,altMeanings:['Word', 'Language'],otherReadings:['いう'],meaning:'Say',level:5,meaningMnemonic:`"**GEN**-uinely (げん), let me **SAY** this."`,examples:[{level:'easy',jp:'何か言います。',romaji:'Nanika iimasu.',en:'I\'ll say something.'}, {level:'advanced',jp:'彼の言葉には、いつも深い意味が込められている。',romaji:'Kare no kotoba ni wa, itsumo fukai imi ga komerarete iru.',en:'His words always carry deep meaning.'}]},
  {id:'自',char:'自',onyomi:'じ',kunyomi:null,altMeanings:['Oneself', 'Naturally (in compounds)'],otherReadings:[],meaning:'Self',level:5,meaningMnemonic:`"**Gee** (じ), that's **MYSELF** you're pointing at."`,examples:[{level:'easy',jp:'自分でやります。',romaji:'Jibun de yarimasu.',en:'I\'ll do it myself.'}, {level:'advanced',jp:'彼は、自立した生活を送ることを何より大切にしている。',romaji:'Kare wa, jiritsu shita seikatsu o okuru koto o nani yori taisetsu ni shite iru.',en:'He values living an independent life above all else.'}]},
  {id:'形',char:'形',onyomi:'けい',kunyomi:null,altMeanings:['Form', 'Figure'],otherReadings:['かたち'],meaning:'Shape',level:5,meaningMnemonic:`"**KAY** (けい), sketch that **SHAPE**."`,examples:[{level:'easy',jp:'形が面白いです。',romaji:'Katachi ga omoshiroi desu.',en:'The shape is interesting.'}, {level:'advanced',jp:'この動詞の活用形を、正確に覚える必要がある。',romaji:'Kono doushi no katsuyoukei o, seikaku ni oboeru hitsuyou ga aru.',en:'You need to memorize this verb\'s conjugated forms accurately.'}]},
  {id:'皮',char:'皮',onyomi:'ひ',kunyomi:null,altMeanings:['Peel', 'Hide (animal)', 'Crust'],otherReadings:[],meaning:'Skin',level:5,meaningMnemonic:`"**HE** (ひ) peels back the **SKIN**."`,examples:[{level:'easy',jp:'皮をむきます。',romaji:'Kawa o mukimasu.',en:'I\'ll peel the skin.'}, {level:'advanced',jp:'彼の発言には、皮肉が込められていたように感じた。',romaji:'Kare no hatsugen ni wa, hiniku ga komerarete ita you ni kanjita.',en:'I felt his remark was laced with irony.'}]},
  {id:'空',char:'空',onyomi:'くう',kunyomi:null,altMeanings:['Empty', 'Vacant', 'Air'],otherReadings:['そら'],meaning:'Sky',level:5,meaningMnemonic:`"**KOO**-ee!" (くう) straight into open **SKY**.`,examples:[{level:'easy',jp:'空がきれいです。',romaji:'Sora ga kirei desu.',en:'The sky is beautiful.'}, {level:'advanced',jp:'彼女は空気を読むのがとても上手だ。',romaji:'Kanojo wa kuuki o yomu no ga totemo jouzu da.',en:'She\'s very good at reading the mood.'}]},
  {id:'音',char:'音',onyomi:'おん',kunyomi:null,altMeanings:['Noise', 'Pronunciation (in compounds)'],otherReadings:['おと'],meaning:'Sound',level:5,meaningMnemonic:`"That's my **OWN** **SOUND**" (おん).`,examples:[{level:'easy',jp:'音楽が好きです。',romaji:'Ongaku ga suki desu.',en:'I like music.'}, {level:'advanced',jp:'この単語の発音には、いくつかの注意点がある。',romaji:'Kono tango no hatsuon ni wa, ikutsuka no chuuiten ga aru.',en:'There are a few things to be careful of with this word\'s pronunciation.'}]},
  {id:'学',char:'学',onyomi:'がく',kunyomi:null,altMeanings:['Learning', 'Science (in compounds)'],otherReadings:['まなぶ'],meaning:'Study',level:5,meaningMnemonic:`"**GAK** (がく), this **STUDY** session is intense."`,examples:[{level:'easy',jp:'学生です。',romaji:'Gakusei desu.',en:'I am a student.'}, {level:'advanced',jp:'彼女は大学で心理学を専攻していた。',romaji:'Kanojo wa daigaku de shinrigaku o senkou shite ita.',en:'She majored in psychology at university.'}]},
  {id:'代',char:'代',onyomi:'だい',kunyomi:null,altMeanings:['Generation', 'Charge/Cost', 'Era'],otherReadings:['たい', 'かわる'],meaning:'Substitute',level:5,meaningMnemonic:`Roll the **DIE** (だい) — the **SUBSTITUTE**.`,examples:[{level:'easy',jp:'代わりに行きます。',romaji:'Kawari ni ikimasu.',en:'I\'ll go in your place.'}, {level:'advanced',jp:'彼は三十代になってから、キャリアを大きく転換させた。',romaji:'Kare wa sanjuudai ni natte kara, kyaria o ookiku tenkan saseta.',en:'After turning into his thirties, he made a major career shift.'}]},
  {id:'考',char:'考',onyomi:'こう',kunyomi:null,altMeanings:['Consider', 'Idea'],otherReadings:['かんがえる'],meaning:'Think',level:5,meaningMnemonic:`"**CO**-me up with something" (こう), bent in **THOUGHT**.`,examples:[{level:'easy',jp:'考えます。',romaji:'Kangaemasu.',en:'I\'ll think about it.'}, {level:'advanced',jp:'彼の考古学に対する情熱は、子供の頃から変わらない。',romaji:'Kare no koukogaku ni taisuru jounetsu wa, kodomo no koro kara kawaranai.',en:'His passion for archaeology hasn\'t changed since he was a child.'}]},
  {id:'回',char:'回',onyomi:'かい',kunyomi:null,altMeanings:['Turn', 'Revolve', 'Occasion'],otherReadings:[],meaning:'Times',level:5,meaningMnemonic:`Round and round — that's how many **TIMES** (かい).`,examples:[{level:'easy',jp:'三回します。',romaji:'Sankai shimasu.',en:'I\'ll do it three times.'}, {level:'advanced',jp:'彼はその話を、もう何回も繰り返し聞かされている。',romaji:'Kare wa sono hanashi o, mou nankai mo kurikaeshi kikasarete iru.',en:'He\'s already been told that story over and over many times.'}]},
  {id:'谷',char:'谷',onyomi:'たに',kunyomi:null,altMeanings:['Ravine'],otherReadings:[],meaning:'Valley',level:5,meaningMnemonic:`A **TAWNY** (たに) deer grazes in the **VALLEY**.`,examples:[{level:'easy',jp:'谷があります。',romaji:'Tani ga arimasu.',en:'There is a valley.'}, {level:'advanced',jp:'この谷は、四季を通じて美しい景色で知られている。',romaji:'Kono tani wa, shiki o tsuujite utsukushii keshiki de shirarete iru.',en:'This valley is known for its beautiful scenery throughout the four seasons.'}]},
  {id:'声',char:'声',onyomi:'こえ',kunyomi:null,altMeanings:['Sound (of a voice)', 'Call'],otherReadings:[],meaning:'Voice',level:5,meaningMnemonic:`"**KWAY!**" (こえ) rings out a loud **VOICE**.`,examples:[{level:'easy',jp:'声が大きいです。',romaji:'Koe ga ookii desu.',en:'Your voice is loud.'}, {level:'advanced',jp:'彼女の心強い声に、みんなが励まされた。',romaji:'Kanojo no kokorozuyoi koe ni, minna ga hagemasareta.',en:'Everyone was encouraged by her reassuring voice.'}]},
  {id:'西',char:'西',onyomi:'にし',kunyomi:null,altMeanings:[],otherReadings:['せい'],meaning:'West',level:5,meaningMnemonic:`"**NEE-SHE** (にし) went **WEST**."`,examples:[{level:'easy',jp:'西口はどこですか。',romaji:'Nishiguchi wa doko desu ka.',en:'Where is the west exit?'}, {level:'advanced',jp:'この地域は、西ヨーロッパの文化を色濃く受け継いでいる。',romaji:'Kono chiiki wa, nishi-yooroppa no bunka o irokoku uketsuide iru.',en:'This region strongly carries on Western European culture.'}]},
  {id:'何',char:'何',onyomi:'なに',kunyomi:null,altMeanings:[],otherReadings:['なん'],meaning:'What',level:5,meaningMnemonic:`"**NANNY** (なに), **WHAT** is that?"`,examples:[{level:'easy',jp:'何ですか。',romaji:'Nan desu ka.',en:'What is it?'}, {level:'advanced',jp:'何度説明しても、彼にはなかなか伝わらなかった。',romaji:'Nando setsumei shitemo, kare ni wa nakanaka tsutawaranakatta.',en:'No matter how many times I explained it, it just didn\'t get through to him.'}]},
  {id:'麦',char:'麦',onyomi:'むぎ',kunyomi:null,altMeanings:['Barley', 'Grain'],otherReadings:[],meaning:'Wheat',level:5,meaningMnemonic:`"**MOO, GEE**" (むぎ), says the cow in the **WHEAT** field.`,examples:[{level:'easy',jp:'麦畑があります。',romaji:'Mugibatake ga arimasu.',en:'There is a wheat field.'}, {level:'advanced',jp:'このパンは、地元で収穫された麦から作られている。',romaji:'Kono pan wa, jimoto de shuukaku sareta mugi kara tsukurarete iru.',en:'This bread is made from wheat harvested locally.'}]},
  {id:'弟',char:'弟',onyomi:'だい',kunyomi:null,altMeanings:[],otherReadings:['おとうと', 'てい'],meaning:'Younger Brother',level:5,meaningMnemonic:`Roll the **DIE** (だい) — the **YOUNGER BROTHER** loses.`,examples:[{level:'easy',jp:'弟がいます。',romaji:'Otouto ga imasu.',en:'I have a younger brother.'}, {level:'advanced',jp:'彼と弟は、性格がまったく正反対だと言われている。',romaji:'Kare to otouto wa, seikaku ga mattaku seihantai da to iwarete iru.',en:'He and his younger brother are said to have completely opposite personalities.'}]},
